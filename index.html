额 = 30000 ×（1－20%）= 24000元；展业成本 = 24000 × 25% = 6000元；应纳税所得额 = 24000－6000－5000 = 13000元。\n应预扣预缴个人所得税 = 13000 × 3% = 390元。故选A。","wrong":1.0,"cat":"税务"},{"id":"2081922246327988225","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某软件生产企业2025年自行核算的会计利润为1800万元。经查发现，成本费用中含实际发生的合理工资总额2100万元、职工教育经费170万元（含职工培训费用50万元）。上年结转职工教育经费支出20万元。无其他纳税调整事项，该企业2025年应缴纳企业所得税（）万元。","opts":[{"k":"A","t":"445"},{"k":"B","t":"450"},{"k":"C","t":"450.5"},{"k":"D","t":"455"}],"ans":"A","exp":"软件生产企业发生的职工教育经费中的职工培训费用，根据规定可以全额在企业所得税前扣除。职工教育经费税前扣除限额=2100×8%=168（万元）＞待扣除金额=170-50+20=140（万元），纳税调减上年结转职工教育经费支出20万元。该企业2025年应缴纳企业所得税=（1800-20）×25%=445（万元）。","wrong":1.0,"cat":"税务"},{"id":"2081922245153583106","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为增值税一般纳税人，适用的增值税税率为13%。2×24年6月1日，甲公司将一批自产产品发放给企业行政管理人员，该批产品的成本为25万元，市场不含税售价为30万元。不考虑其他因素，该项业务对甲公司当月损益的影响金额是（）。","opts":[{"k":"A","t":"5 万元"},{"k":"B","t":"30 万元"},{"k":"C","t":"-28.9 万元"},{"k":"D","t":"33.9 万元"}],"ans":"C","exp":"本题考查非货币性职工福利的计量。企业以其自产的产品作为非货币性福利提供给职工的，应当按照该产品的公允价值和相关税费，计量应计入成本费用的金额，收入的确认、成本的结转和相关税费的处理，与正常销售相同。本题中，影响企业损益的因素包括：（1）确认产品销售收入（主营业务收入）金额为30万元；（2）结转产品销售成本（主营业务成本）25万元；（3）计提管理人员薪酬（管理费用）金额=30+30×13%=33.9（万元）。综上，该业务对甲公司当月损益的影响金额=30-25-33.9=-28.9（万元），选项C当选。选项A不当选，未考虑职工薪酬计入管理费用的金额；选项B不当选，未考虑结转商品成本和职工薪酬确认管理费用的金额；选项D不当选，误将产品公允价值（含增值税）作为影响损益的金额。应编制的会计分录为：借：应付职工薪酬33.9 贷：主营业务收入30  应交税费——应交增值税（销项税额）3.9借：主营业务成本25 贷：库存商品25借：管理费用33.9 贷：应付职工薪酬33.9","wrong":1.0,"cat":"税务"},{"id":"2081922245120028691","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"张某2025年3月31日购入一辆燃油小客车，并于当月取得发票。当地规定每辆小客车车船税为600元/年，其2025年就该小客车应缴纳的车船税为（）。","opts":[{"k":"A","t":"0"},{"k":"B","t":"450 元"},{"k":"C","t":"500 元"},{"k":"D","t":"600 元"}],"ans":"C","exp":"本题考查车船税应纳税额的计算。选项C当选，车船税纳税义务发生时间为取得车船所有权或者管理权的当月。以购买车船的发票或者其他证明文件所载日期的当月为准，即3月产生车船税纳税义务。故应纳税额=（年应纳税额÷12）×应纳税月份数=600÷12×10=500（元）。","wrong":1.0,"cat":"税务"},{"id":"2081922245006782476","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司通过定向增发普通股股票，取得乙公司30%的股权。该项交易中，甲公司定向增发股份的数量为2000万股（每股面值1元，公允价值为2元），发行股份过程中向证券承销机构支付佣金及手续费共计50万元。除发行股份外，甲公司还承担了乙公司原债务500万元（未来现金流量现值）。取得投资时，乙公司股东大会已通过利润分配方案，甲公司可取得200万元。甲公司对乙公司长期股权投资的初始投资成本为（）万元。","opts":[{"k":"A","t":"3 900"},{"k":"B","t":"4 050"},{"k":"C","t":"4 380"},{"k":"D","t":"4 300"}],"ans":"D","exp":"甲公司对乙公司长期股权投资的初始投资成本为2000×2＋500－200＝4300（万元），甲公司取得该长期股权投资付出的对价由两部分组成，即为向乙公司定向增发普通股股票2000万股和承担乙公司原债务500万元，其中，500万元是承担的债务，最终要支付，应视为支付的对价，所以要加上；200万元是包含在买价中的已宣告但尚未发放的现金股利，要单独计入应收股利中，所以减掉。\n借：长期股权投资——投资成本4300\n        应收股利200\n    贷：股本       2000\n           资本公积——股本溢价2000\n           应付账款500\n发行股份过程中向证券承销机构支付佣金及手续费应该冲减发行溢价，\n即为：\n借：资本公积——股本溢价50\n     贷：银行存款50","wrong":1.0,"cat":"财务会计"},{"id":"2081922244990005252","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×22年3月1日，甲公司因发生财务困难，无力偿还所欠乙公司800万元款项。经双方协商同意，甲公司以自有的一栋办公楼和一批存货抵偿所欠债务，当日已办妥资产所有权的划转手续。甲公司用于抵债的办公楼原值为700万元，已计提折旧为200万元，公允价值为600万元；用于抵债的存货成本为90万元，公允价值为120万元。甲公司将上述应付款项分类为以摊余成本计量的金融负债。不考虑其他因素，下列有关甲公司对该项债务重组的会计处理中，正确的是（）。","opts":[{"k":"A","t":"确认其他收益210万元"},{"k":"B","t":"确认商品销售收入120万元"},{"k":"C","t":"确认投资收益80万元"},{"k":"D","t":"确认资产处置损益100万元"}],"ans":"A","exp":"甲公司以非金融资产（固定资产和存货）清偿债务的，应将债务账面价值与抵债资产账面价值的差额计入其他收益，确认其他收益的金额＝应付账款的账面价值800－抵债资产的账面价值（700－200）＋90＝210（万元）。\n甲公司的会计分录：\n借：固定资产清理    500\n       累计折旧           200\n       贷：固定资产   700\n借：应付账款    800\n        贷：固定资产清理    500\n               库存商品        90\n                其他收益——债务重组收益  210","wrong":1.0,"cat":"财务会计"},{"id":"2081922248328671239","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为建造一栋办公楼，于2×18年12月1日借入期限为3年，本金为1 000万元，年利率为6%，按年付息到期一次还本的专门借款。另外，甲公司还有一笔200万元的一般借款，年利率为7%，期限为2年，每年年末计提利息，将于2×20年6月30日到期。工程采用出包方式，2×19年1月1日，工程开始建造并用银行存款支付工程价款300万元；工程因质量纠纷于2×19年3月1日到2×19年6月30日发生非正常中断。2×19年9月1日用银行存款支付工程价款800万元，工程于2×20年1月31日达到预定可使用状态。甲公司借款费用按年资本化。2×19年闲置的专门借款资金用于固定收益的短期债券投资，月收益率为0.2%。则甲公司2×19年应予以资本化的利息金额为（ ）万元。","opts":[{"k":"A","t":"42.33"},{"k":"B","t":"36.73"},{"k":"C","t":"50.73"},{"k":"D","t":"57.2"}],"ans":"B","exp":"该工程开始资本化的时间是2×19年1月1日，2×19年3月1日到6月30日发生非正常中断暂停资本化，所以资本化期间是8个月。2×19年1月1日支付工程款300万元，闲置专门借款的金额＝1 000－300＝700万元，截止2×19年9月1日发生下一笔支出时，闲置期间为8个月，其中闲置期间处于资本化期间的是1月、2月、7月、8月，共4个月。专门借款资本化的利息金额＝专门借款的利息费用－资本化期间闲置的利息收益＝1 000×6%×8/12－700×0.2%×4＝34.4（万元）；一般借款需要考虑是否占用，累计发生支出是300＋800＝1 100万元，其中占用专门借款的金额是1 000万元，剩余支出部分占用一般借款1 100－1 000＝100万元，从9月1日开始占用，至年底占用4个月，一般借款资本化的利息金额＝100×7%×4/12＝2.33（万元）；所以2×19年应予以资本化的利息金额＝专门借款的资本化金额＋一般借款利息资本化金额＝34.4＋2.33＝36.73（万元）。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2081922247724691471","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"为建造某大型设备，甲公司2×18年1月1日从银行借入期限为2年的专门借款2 000万元，年利率为4%（等于实际利率），本题不考虑闲置资金收益利息。2×18年4月1日，甲公司开始建造该大型设备。当日，甲公司按合同约定预付工程款500万元。2×18年7月1日和10月1日，甲公司分别支付工程物资款和工程进度款700万元、400万元。该大型设备2×18年12月31日尚未达到预定可使用状态。不考虑其他因素，甲公司2×18年度为建造该大型设备应予以资本化的借款利息金额是（    ）。","opts":[{"k":"A","t":"33 万元"},{"k":"B","t":"48 万元"},{"k":"C","t":"60 万元"},{"k":"D","t":"80 万元"}],"ans":"C","exp":"2×18年1月1日为借款日，2×18年4月1日为开工日和资产支出日，同时满足借款费用开始资本化条件的日期为2×18年4月1日，因此该笔专门借款在2×18年的资本化期间为2×18年4月1日—2×18年12月31日（9个月）。本题不考虑闲置资金收益利息因素，所以，2×18年为建造该大型设备应予以资本化的借款费用=2 000×4％×9/12=60（万元），选项C当选；选项A不当选，误按一般借款的处理计算专门借款利息支出的资本化金额；选项B不当选，仅将占用1 600万元专门借款利息支出资本化；选项D不当选，未考虑占用专门借款时间权重。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2081922247737274393","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《中华人民共和国会计法》规定，会计账簿包括总账、明细账、日记账和备查账簿。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文表述为：\"会计账簿包括总账、明细账、日记账和其他辅助性账簿。\"原文使用的是\"其他辅助性账簿\"而非\"备查账簿\"，虽然两者在实际工作中含义相近，但作为考试应以原文表述为准。","wrong":1.0,"cat":"财务会计"},{"id":"2081922246424457222","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在直接或间接持有上市公司已发行股份5％以上的股东或者在上市公司前五名股东任职的人员及其配偶、父母、子女和主要社会关系，不得担任该上市公司的独立董事。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"在直接或间接持有上市公司已发行股份5％以上的股东或者在上市公司前5名股东任职的人员及其配偶、父母、子女，不得担任该上市公司的独立董事，注意，其中不包括\"主要社会关系\"。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922247737274390","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"会计报表附注至少应当包括下列（）内容。","opts":[{"k":"A","t":"不符合基本会计假设的说明"},{"k":"B","t":"重要会计政策和会计估计及其变更情况、变更原因及其对财务状况和经营成果的影响"},{"k":"C","t":"或有事项和资产负债表日后事项的说明"},{"k":"D","t":"关联方关系及其交易的说明"}],"ans":"A,B,C,D","exp":"依据《企业财务会计报告条例》第十四条：会计报表附注是为便于会计报表使用者理解会计报表的内容而对会计报表的编制基础、编制依据、编制原则和方法及主要项目等所作的解释。会计报表附注至少应当包括下列内容：\n(一)不符合基本会计假设的说明；\n(二)重要会计政策和会计估计及其变更情况、变更原因及其对财务状况和经营成果的影响；\n(三)或有事项和资产负债表日后事项的说明；\n(四)关联方关系及其交易的说明；\n(五)重要资产转让及其出售情况；\n(六)企业合并、分立；\n(七)重大投资、融资活动；\n(八)会计报表中重要项目的明细资料；\n(九)有助于理解和分析会计报表需要说明的其他事项。","wrong":1.0,"cat":"财务会计"},{"id":"2081922247737274384","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中华人民共和国会计法》规定，下列需要在财务会计报告中予以说明的包括（）。","opts":[{"k":"A","t":"各单位采用的会计处理方法确有必要变更的"},{"k":"B","t":"单位提供的担保"},{"k":"C","t":"单位的未决诉讼"},{"k":"D","t":"单位发生的数额较小的资产盘盈盘亏情况"}],"ans":"A,B,C","exp":"单位发生的数额较小的资产盘盈盘亏情况，通常对单位的整体财务状况和经营成果影响不大，一般按照正常的会计处理程序进行账务处理即可，不需要在财务会计报告中专门予以说明。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922246420262939","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据公司法律制度的规定，下列各项中，受公司章程约束的有（）。","opts":[{"k":"A","t":"公司的经理"},{"k":"B","t":"公司的副经理"},{"k":"C","t":"公司的普通员工"},{"k":"D","t":"公司的财务负责人"}],"ans":"A,B,D","exp":"公司章程对公司、股东、董事、监事、高级管理人员具有约束力。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922246420262932","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列关于公司公积金用途的表述中，符合公司法律制度规定的有（）。","opts":[{"k":"A","t":"资本公积金可以用于弥补公司亏损"},{"k":"B","t":"法定公积金不得转增公司资本"},{"k":"C","t":"任意公积金可以转增公司资本"},{"k":"D","t":"盈余公积金可以用于扩大公司生产经营"}],"ans":"A,C,D","exp":"选项A、C、D正确，公司的公积金用于弥补公司的亏损、扩大公司生产经营或者转增公司资本。公积金弥补公司亏损，应当先使用任意公积金和法定公积金；仍不能弥补的，可以按照规定使用资本公积金。选项B错误，法定公积金可以转增公司资本，用法定公积金转增资本时，所留存的该项公积金不得少于转增前公司注册资本的25%。","wrong":1.0,"cat":"财务会计"},{"id":"2081922246416068625","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在职工提供服务从而增加了其未来享有的带薪缺勤权利时，企业应确认与累积带薪缺勤相关的职工薪酬。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"企业应当在职工提供了服务从而增加了其未来享有的带薪缺勤权利时，确认与累积带薪缺勤相关的职工薪酬，并以累积未行使权利而增加的预期支付金额计量。比如企业某职工在今年努力工作，获得了累积带薪休假4天，职工在今年没有休这些假，企业预计他会在明年休这几天假，那么企业应该在今年年末预先计提这4天的工资，而不是等到明年实际休假时再计提。","wrong":1.0,"cat":"财务会计"},{"id":"2081922248727130115","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，属于设定受益计划中计划资产回报的有（ ）。","opts":[{"k":"A","t":"计划资产产生的股利"},{"k":"B","t":"计划资产产生的利息"},{"k":"C","t":"计划资产已实现的利得"},{"k":"D","t":"计划资产未实现的损失"}],"ans":"A,B,C,D","exp":"计划资产回报，指计划资产产生的利息、股利和其他收入，以及计划资产已实现和未实现的利得或损失。【点评】本题考查设定受益计划的相关内容，难度不大，属于教材原文，可以在考前进行简单的记忆。","wrong":1.0,"cat":"财务会计"},{"id":"2081922247347204097","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"债券存续期信息披露包括（）。","opts":[{"k":"A","t":"债券兑付兑息安排"},{"k":"B","t":"发行人或投资者选择权条款触发和执行情况"},{"k":"C","t":"投资者保护条款触发和执行情况"},{"k":"D","t":"法律意见书"},{"k":"E","t":"募集说明书"}],"ans":"A,B,C","exp":"根据细则第十一条 根据监管机构要求，应披露的信息主要包括以下几类：\n（一）债券发行阶段信息披露，主要包括：发行公告、募集说明书、信用评级报告（如有）、法律意见书、财务报告（或报表）以及监管机构要求的其他文件；\n（二）债券存续期信息披露，主要包括：债券兑付兑息安排，发行人或投资者选择权条款、投资者保护条款等特殊条款触发和执行情况等；\n（三）定期信息披露，主要包括：债券（半）年度报告、年度审计报告、中期财务报表和专项披露报告；\n（四）临时（重大事项）信息披露，主要包括：公司名称、控股股东、董事与高级管理人员、重要中介机构发生变动或变化情况，公司发生重大损失、放弃重要资产、承担额外债务、涉及重大诉讼仲裁情况，以及其他能对公司资信状况或偿债能力、公司债券交易价格、债券投资者权益产生重大影响的事项（事项清单详见附件1）；\n（五）监管机构规定的其他债券信息披露文件","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922247343009818","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"信息披露应遵循以下原则（）。","opts":[{"k":"A","t":"真实"},{"k":"B","t":"准确"},{"k":"C","t":"完整"},{"k":"D","t":"及时"},{"k":"E","t":"公平"}],"ans":"A,B,C,D,E","exp":"根据细则第五条 信息披露应当遵循真实、准确、完整、及时、公平的原则，不得有虚假记载、误导性陈述或重大遗漏。信息披露语言应简洁、平实和明确，不得有祝贺性、广告性、恭维性或诋毁性的词句。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922247343009817","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"集团公司总部和子企业在开展债券融资时，应积极利用（）等资本市场重大改革举措，通过发行科技创新债券、碳中和债券、乡村振兴债券等创新品种，有效服务集团公司主责主业。","opts":[{"k":"A","t":"债券市场注册制改革"},{"k":"B","t":"债券基础设施互联互通"},{"k":"C","t":"债券品种创新"},{"k":"D","t":"可转换债券"}],"ans":"A,B,C","exp":"根据办法第二十条 集团公司总部和子企业在开展债券融资时，应积极利用债券市场注册制改革、债券基础设施互联互通、债券品种创新等资本市场重大改革举措，通过发行科技创新债券、碳中和债券、乡村振兴债券等创新品种，有效服务集团公司主责主业。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2081922247343009804","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"各单位委托贷款和融资担保业务开展前，跟踪管理责任单位应履行的职责包括（ ）。","opts":[{"k":"A","t":"对拟开展业务进行尽职调查"},{"k":"B","t":"按照《董事会授权决策方案》相关规定进行审批"},{"k":"C","t":"建立业务台账"},{"k":"D","t":"定期跟踪借款人经营状况和债务风险情况"}],"ans":"A,B","exp":"根据《司库管理办法》第二十四条规定：“各单位委托贷款和融资担保业务开展前，跟踪管理责任单位应履行以下职责：（一）对拟开展业务进行尽职调查；（二）按照《董事会授权决策方案》相关规定进行审批。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922247343009803","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于融资担保管理，以下说法正确的有（ ）。","opts":[{"k":"A","t":"集团公司总融资担保规模原则上不超过集团合并净资产的40%"},{"k":"B","t":"集团公司总部、单户子公司融资担保规模原则上不超过本公司净资产的50%"},{"k":"C","t":"严禁对参股公司提供超股比担保"},{"k":"D","t":"严禁对集团外无股权关系公司提供任何形式的融资担保"}],"ans":"A,B,C,D","exp":"根据《司库管理办法》第二十三条规定：\n集团公司总融资担保规模原则上不超过集团合并净资产的40%（A正确）；\n集团公司总部、单户子公司融资担保规模原则上不超过本公司净资产的50%（B正确）；\n严禁对参股公司提供超股比担保（C正确）；\n严禁对集团外无股权关系公司提供任何形式的融资担保（D正确）。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922247343009800","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"集团公司资金风险管理策略遵循的基本原则包括（ ）。","opts":[{"k":"A","t":"自然对冲"},{"k":"B","t":"平衡匹配"},{"k":"C","t":"统筹分级"},{"k":"D","t":"套期保值"}],"ans":"A,B,C,D","exp":"根据《司库管理办法》第二十条规定：“集团公司资金风险管理策略遵循自然对冲、平衡匹配、统筹分级、套期保值的基本原则。”","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2081922247343009796","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列哪些账户的开立、变更、撤销需纳入集团公司统一管控并报送审批？（ ）","opts":[{"k":"A","t":"证券账户"},{"k":"B","t":"支付宝和微信等第三方收支账户"},{"k":"C","t":"工会经费账户"},{"k":"D","t":"党费账户"}],"ans":"A,B","exp":"根据《司库管理办法》第十三条规定：“各单位开立证券账户、支付宝和微信等第三方收支账户按照银行账户管理执行，纳入集团公司统一管控，并按规定报送审批。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922247338815511","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于财务机构与人员管理，以下哪些说法符合集团公司《财务管理制度》规定？","opts":[{"k":"A","t":"各级子公司具有一级实质管理层级功能的，应设置独立的财务机构，大中型企业必须设置总会计师岗位。"},{"k":"B","t":"财务人员须具备从业能力，坚守职业操守和道德底线"},{"k":"C","t":"各单位财务机构在业务上接受审计部指导和考核"},{"k":"D","t":"财务机构按照不相容职务分离与内部控制等原则设置专业岗位"},{"k":"E","t":"集团公司建立健全多层次财务人才培养培训体系"}],"ans":"A,B,D,E","exp":"《财务管理制度》第十二条、第十三条支持A、B、D、E选项；C错误，应为“接受财务与资产管理部指导和考核”。","wrong":1.0,"cat":"审计"},{"id":"2081922247338815510","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据集团公司《财务管理制度》规定，集团公司对以下哪些重大财务事项进行统一决策？","opts":[{"k":"A","t":"子公司利润分配方案"},{"k":"B","t":"各子公司年度预算与财务决算批复"},{"k":"C","t":"各单位财务机构内部岗位设置"},{"k":"D","t":"集团公司决算审计、评估等中介机构的统一管理"}],"ans":"A,B,D","exp":"《财务管理制度》第六条明确所列统一决策事项中包含A、B、D；C属于各单位内部管理事务，不在此列。","wrong":1.0,"cat":"审计"},{"id":"2081922247271706636","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"存在以下情形的中央企业，不得新设产业基金：（）","opts":[{"k":"A","t":"资产负债率超过行业管控线"},{"k":"B","t":"管控能力弱，基金业务出现重大风险或损失"},{"k":"C","t":"基金管理队伍能力不足"},{"k":"D","t":"未开展过基金业务"}],"ans":"A,B,C","exp":"制度第十四条规定“若集团公司存在下列情形，原则上不得发起设立产业基金。（一）资产负债率超过国务院国资委规定的集团公司所在行业管控线。（二）管控能力弱，基金业务发生重大风险或损失。（三）截至上年度末经审计的基金业务整体累计亏损金额超过基金实缴金额20%。（四）基金管理队伍能力不足。（五）已设立基金投资效率低，募集资金大量结余。（六）国务院国资委认定的其他情形。” 注意：国资委2026年新办法未继续要求以下三点：“（三）截至上年度末经审计的基金业务整体累计亏损金额超过基金实缴金额20%。（四）基金管理队伍能力不足。（五）已设立基金投资效率低，募集资金大量结余。”","wrong":1.0,"cat":"财务管理"},{"id":"2081922247271706635","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"实施主体应根据集团公司发展战略和规划，按照国务院国资委确认的集团公司主业、非主业投资比例及新兴产业投资方向，选择、确定基金业务，对开展基金业务的必要性、可行性及实施方案等进行初步论证，编制基金立项材料。实施主体依照内部管理规定自主审批立项后，报财务与资产管理部备案，备案文件须包含以下哪些内容：（）。","opts":[{"k":"A","t":"发起设立或参与基金承诺书"},{"k":"B","t":"基金基本信息"},{"k":"C","t":"内部立项情况"},{"k":"D","t":"基金立项预可研报告"}],"ans":"B,C,D","exp":"根据办法附件1“立项备案申请表”，须包括基本信息、内部立项情况、基金立项预可研报告。“发起设立或参与基金承诺书”为基金业务申报决策阶段的必要文件。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2081922247271706634","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"对于集团公司发起设立或出资参与产业基金的出资情形（非创业投资基金），符合规定的是（）。","opts":[{"k":"A","t":"集团公司发起设立产业基金，内部单位合计认缴比例60%，外部单位（均非中央企业）合计认缴比例40%"},{"k":"B","t":"集团公司发起设立产业基金，内部单位合计认缴比例30%，外部单位（均非中央企业）合计认缴比例70%"},{"k":"C","t":"集团公司出资参与产业基金，内部单位合计认缴比例20%，外部单位合计认缴比例80%（其中：其他中央企业出资参与40%）"},{"k":"D","t":"集团公司出资参与产业基金，内部单位合计认缴比例30%，外部单位合计认缴比例70%（其中：其他中央企业出资参与40%）"}],"ans":"B,C","exp":"根据办法第二十二条，基金应当充分发挥资本放大作用，原则上基金认缴出资不得超过以下比例限制。（一）新设产业基金集团公司内部合计认缴出资不得高于30%，全部中央企业合计认缴出资不得高于60%。（二）参与基金集团公司内部合计认缴出资原则上不得高于全部认缴出资的20%，参与其他中央企业基金可适当提高比例。计算上述比例时，中央企业管理基金的出资全额计算在内，中央企业作为基金的管理人或普通合伙人对基金的少量出资不计算在内。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2081922247271706631","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"集团公司直接融资是指在证券市场中的股权融资和直接债务融资。其中，股权融资是指通过股东增资方式募集资金，包括但不限于（）。","opts":[{"k":"A","t":"发行可在交易所场内交易的股票"},{"k":"B","t":"认股权证"},{"k":"C","t":"可转换公司债券"},{"k":"D","t":"公募REITs"}],"ans":"A,B,C,D","exp":"根据办法第二条 直接融资管理办法所称直接融资是指在证券市场中的股权融资和直接债务融资。其中，股权融资是指通过股东增资方式募集资金，包括但不限于发行可在交易所场内交易的股票、认股权证、可转换公司债券、公募REITs等。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2081922247271706626","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"开展直接融资业务的单位在方案实施过程中应加强市场研究，适时根据市场行情优化调整方案并履行审批程序，防范市场波动风险。对于境外融资，应结合境外业务发展资金需求，（）","opts":[{"k":"A","t":"积极维护投资者关系和良好国际信用评级"},{"k":"B","t":"探索多市场、多币种发行，拓展融资渠道"},{"k":"C","t":"注意防范汇率风险"},{"k":"D","t":"不得使用利率互换等衍生工具"}],"ans":"A,B,C","exp":"根据办法第二十条 集团公司总部和子企业在直接融资方案实施过程中应加强市场研究，适时根据市场行情优化调整方案并履行审批程序，防范市场波动风险。对于境外融资，应结合境外业务发展资金需求，积极维护投资者关系和良好国际信用评级，探索多市场、多币种发行，拓展融资渠道，注意防范汇率风险。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2081922246470594568","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"子企业向集团申请金融衍生业务资质时，需要明确以下核准事项（）。","opts":[{"k":"A","t":"交易规模"},{"k":"B","t":"交易品种"},{"k":"C","t":"交易场所"},{"k":"D","t":"交易工具"}],"ans":"B,C,D","exp":"根据集团公司《金融衍生业务管理办法》，操作主体资质审核应明确交易场所、品种、工具等内容，交易规模不属于资质审批事项。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2081922246470594564","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"同时存在（）情况的企业不得开展金融衍生业务。","opts":[{"k":"A","t":"资金紧张"},{"k":"B","t":"资产负债率高于国务院国资委管控线"},{"k":"C","t":"连续3年经营亏损"},{"k":"D","t":"连续3年净利润下降"}],"ans":"A,B,C","exp":"根据集团公司《金融衍生业务管理办法》，资产负债率高于国务院国资委管控线、连续3年经营亏损且资金紧张的主体，不得开展金融衍生业务。","wrong":1.0,"cat":"财务管理"},{"id":"2081922246445428739","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》回顾了三峡工程从孙中山设想到全面运行的完整历程。根据该文件，下列表述正确的有（ ）。","opts":[{"k":"A","t":"1949年底长江水利委员会开始筹建"},{"k":"B","t":"1958年长江流域规划办公室成立"},{"k":"C","t":"1958年研究明确了三峡水利枢纽正常高水位为175米"},{"k":"D","t":"1970年葛洲坝工程开工"}],"ans":"A,B,D","exp":"《传承弘扬三峡精神和优良作风》中明确记载：（1）\"1949年底，治理开发长江的专门机构——长江水利委员会开始筹建\"；（2）\"1958年，中国政府成立了长江流域规划办公室\"；（3）同年\"研究明确了三峡水利枢纽正常高水位为200米\"，而非175米（175米为重新论证后推荐方案），选项C数据错误；（4）\"1970年，葛洲坝工程开工\"。","wrong":1.0,"cat":"综合实务"},{"id":"2081922246441234456","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》在\"世纪工程 百年梦圆\"部分中，以时间线的方式展示了从1918年到2020年三峡工程的关键节点。下列关于各时间节点对应事件的表述中，符合该文件记载的有（ ）。","opts":[{"k":"A","t":"1918年，孙中山在《建国方略》里首次提出开发三峡工程的设想"},{"k":"B","t":"1982年11月，邓小平说\"一定要把三峡工程建成世界一流工程\""},{"k":"C","t":"2020年，三峡水库成功应对五次编号洪水"},{"k":"D","t":"2020年5号洪水最大洪峰达7.5万立方米每秒，为建库以来最大入库流量"}],"ans":"A,C,D","exp":"《传承弘扬三峡精神和优良作风》中明确记载：（1）1918年，孙中山在《建国方略》里首次提出开发三峡工程的设想；A正确（2）1982年11月邓小平说的是\"看准了就下决心，不要动摇\"，而非\"一定要把三峡工程建成世界一流工程\"，选项B内容无文件依据；（3）\"三峡水库成功应对五次编号洪水，其中5号洪水最大洪峰达7.5万立方米每秒，为建库以来最大入库流量\"。故CD正确","wrong":1.0,"cat":"综合实务"},{"id":"2081922246441234455","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》在\"描绘蓝图 积极准备\"部分记载了多个为三峡工程奠定基础的重要节点。下列事件属于该部分内容的有（ ）。","opts":[{"k":"A","t":"1949年底长江水利委员会开始筹建"},{"k":"B","t":"1958年长江流域规划办公室成立"},{"k":"C","t":"1970年葛洲坝工程开工"},{"k":"D","t":"1986年三峡工程重新论证启动"}],"ans":"A,B,C","exp":"《传承弘扬三峡精神和优良作风》中:\"描绘蓝图 积极准备\"部分涵盖长江水利委员会筹建成立、长江流域规划办公室成立及葛洲坝工程等内容。选项D\"1986年三峡工程重新论证启动\"属于后续\"科学论证 民主决策\"及\"民生工程 筑坝安澜\"部分的内容。","wrong":1.0,"cat":"综合实务"},{"id":"2081922245048725511","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》记载了1980年至1985年间三峡工程筹备工作的推进过程。下列事件与其发生时间的对应关系中，符合该文件记载的有（ ）。","opts":[{"k":"A","t":"1980年7月，邓小平视察三峡坝址和葛洲坝工程"},{"k":"B","t":"1980年8月，国务院常务会议研究三峡工程问题"},{"k":"C","t":"1984年4月，国务院三峡工程筹备领导小组成立"},{"k":"D","t":"1985年3月，中共中央、国务院发出通知，成立三峡省筹备组"}],"ans":"A,B,C,D","exp":"《传承弘扬三峡精神和优良作风》中明确记载：（1）\"1980年7月，邓小平视察三峡坝址和葛洲坝工程\"；（2）\"1980年8月，国务院常务会议研究三峡工程问题，决定由国家科委、建委负责\"；（3）\"1984年4月，国务院三峡工程筹备领导小组成立\"并成立三峡开发总公司筹备组；（4）\"1985年3月，中共中央、国务院发出通知，成立三峡省筹备组\"。","wrong":1.0,"cat":"综合实务"},{"id":"2081922245048725509","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》梳理了三峡工程从设想到运行的完整历程。根据该文件，下列表述正确的有（ ）。","opts":[{"k":"A","t":"三峡工程勘测设计决策阶段的时间起点为1918年"},{"k":"B","t":"三峡工程实施阶段的大致时间跨度为1992年至2009年"},{"k":"C","t":"三峡工程于2009年进入运行阶段"},{"k":"D","t":"葛洲坝工程于1989年8月全部建成，为三峡工程积累了宝贵经验"}],"ans":"A,B,C,D","exp":"《传承弘扬三峡精神和优良作风》中以时间轴标注\"1918—1949—1992—2009\"，将三峡工程百年历程划分为勘测设计决策阶段（1918—1992）、实施阶段（1992—2009）和运行阶段（2009—）。同时明确指出：\"1970年，葛洲坝工程开工，1989年8月全部建成，在工程技术和科学研究方面取得了许多成就，同时培养锻炼了水利水电工程专业队伍，为建设三峡工程积累了宝贵经验。\"四个选项均与文件记载一致。","wrong":1.0,"cat":"综合实务"},{"id":"2081922245048725508","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》记载，1918年孙中山在《建国方略》里首次提出开发三峡工程的设想，1980年7月邓小平视察三峡坝址和葛洲坝工程。下列关于这两位人物与三峡工程关系的表述中，符合该文件记载的有（ ）。","opts":[{"k":"A","t":"孙中山胸怀振兴中华、实业救国的豪情壮志，首次提出开发三峡工程的设想"},{"k":"B","t":"邓小平在视察时指出\"洪水淹到哪里，哪里要倒霉，人民要遭殃\""},{"k":"C","t":"孙中山在《建国方略》中明确提出了三峡工程的具体施工方案"},{"k":"D","t":"邓小平指出\"修建三峡工程，对防洪所起的作用很大，发电效益很大。因此，轻易否定三峡不好\""}],"ans":"A,B,D","exp":"《传承弘扬三峡精神和优良作风》中明确记载：\"1918年，孙中山胸怀振兴中华、实业救国的豪情壮志，在《建国方略》里首次提出开发三峡工程的设想。\"\"1980年7月，邓小平视察三峡坝址和葛洲坝工程时指出：洪水淹到哪里，哪里要倒霉，人民要遭殃......修建三峡工程，对防洪所起的作用很大，发电效益很大。因此，轻易否定三峡不好。\"孙中山仅提出\"设想\"，未涉及具体施工方案，选项C超出文件记载范围。","wrong":1.0,"cat":"综合实务"},{"id":"2081922245048725507","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》从多个维度阐述了三峡工程的性质与定位，包含\"世纪工程 百年梦圆\"\"民生工程 筑坝安澜\"\"科技工程 克难攻坚\"\"民族工程 全民共建\"\"复兴工程 历史丰碑\"五种工程定位。下列说法正确的有（ ）。","opts":[{"k":"A","t":"\"世纪工程 百年梦圆\"主要回顾了三峡工程从孙中山设想到建成的百年追梦历程"},{"k":"B","t":"\"科技工程 克难攻坚\"主要阐述了三峡工程的监理体系和移民安置工作"},{"k":"C","t":"\"民族工程 全民共建\"体现了全国支援和移民安置等内容"},{"k":"D","t":"\"民生工程 筑坝安澜\"主要论述了三峡工程的重新论证过程和防洪、发电等民生功能"}],"ans":"A,C,D","exp":"《传承弘扬三峡精神和优良作风》的章节结构为：\"世纪工程 百年梦圆\"回顾百年追梦历程；\"民生工程 筑坝安澜\"论述重新论证过程和防洪、发电等民生功能；\"科技工程 克难攻坚\"论述监理体系、水电装备跨越等科技成就；\"民族工程 全民共建\"论述全国支援、移民安置等；\"复兴工程 历史丰碑\"论述对中华民族伟大复兴的意义。选项B将移民安置工作误置于\"科技工程\"之下，移民安置属于\"民族工程 全民共建\"的内容。","wrong":1.0,"cat":"综合实务"},{"id":"2081922246445428741","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《传承弘扬三峡精神和优良作风》，长江水利委员会于1950年8月正式成立。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《传承弘扬三峡精神和优良作风》记载：\"1949年底，治理开发长江的专门机构——长江水利委员会开始筹建，1950年2月正式成立。\"题干将\"1950年2月\"误写为\"1950年8月\"，与原文不符。","wrong":1.0,"cat":"综合实务"},{"id":"2081922247619833873","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中央企业绩效评价规定（试行）》，绩效评价指标中，盈利回报指标包括以下哪些？","opts":[{"k":"A","t":"净资产收益率"},{"k":"B","t":"营业收入利润率"},{"k":"C","t":"总资产报酬率"},{"k":"D","t":"盈余现金保障倍数"},{"k":"E","t":"经济增加值率"}],"ans":"A,B,C,D","exp":"盈利回报指标包括净资产收益率、营业收入利润率、总资产报酬率、盈余现金保障倍数；经济增加值率属于持续发展指标。","wrong":1.0,"cat":"财务管理"},{"id":"2081922247619833869","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《关于中央企业加快建设世界一流财务管理体系的指导意见》（国资发财评规〔2022〕23号），建设全面有效的合规风控体系应加强以下哪些管控？","opts":[{"k":"A","t":"严合规"},{"k":"B","t":"控风险"},{"k":"C","t":"强化境外风险管控"},{"k":"D","t":"加快供应链融资创新"},{"k":"E","t":"推进业财融合"}],"ans":"A,B,C","exp":"《指导意见》明确“加强‘严合规、控风险’以及强化境外风险管控”，供应链融资和业财融合属于其他体系内容。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2081922247619833859","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据2025年12月发布的《中央企业违规经营投资责任追究实施办法》（国资委令第46号），关于资产损失认定，以下说法正确的是？","opts":[{"k":"A","t":"500万元以下为一般资产损失"},{"k":"B","t":"500万元以上5000万元以下为较大资产损失"},{"k":"C","t":"5000万元以上为重大资产损失"},{"k":"D","t":"已退休人员不追究责任"},{"k":"E","t":"可减轻或免除处理"}],"ans":"A,B,C,E","exp":"《办法》明确：500万以下一般、500万-5000万较大、5000万以上重大；规定从轻减轻免除情形；已退休仍可追责","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2081922247615639566","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《中央企业违规经营投资责任追究实施办法》提出，对违规经营投资相关责任人的处理方式包括以下哪些？","opts":[{"k":"A","t":"批评或诫勉"},{"k":"B","t":"组织处理"},{"k":"C","t":"扣减薪酬"},{"k":"D","t":"禁入限制"},{"k":"E","t":"处分"}],"ans":"A,B,C,D,E","exp":"对相关责任人的处理方式包括批评或诫勉、组织处理、扣减薪酬、禁入限制、处分、移送纪检监察机构或司法机关处理等，可以单独使用，也可以合并使用。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2081922246441234438","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《关于进一步加强财会监督工作的意见》要求，有关单位要依照法定职责实施部门监督，具体包括（）。","opts":[{"k":"A","t":"加强对所属单位预算执行的监督"},{"k":"B","t":"按照职责分工加强对政府采购活动的监督"},{"k":"C","t":"按照会计法赋予的职权对有关单位的会计资料实施监督"},{"k":"D","t":"直接任命所监管企业的财务总监"}],"ans":"A,B,C","exp":"原文：“有关部门要依法依规强化对主管、监管行业系统和单位财会监督工作的督促指导。加强对所属单位预算执行的监督按照职责分工加强对政府采购活动、资产评估行业的监督按照会计法赋予的职权对有关单位的会计资料实施监督”出自《关于进一步加强财会监督工作的意见》“依照法定职责实施部门监督”。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2081922245052919811","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《国有企业管理人员处分条例》规定，国有企业管理人员的处分决定被变更，需要调整该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照规定予以调整。国有企业管理人员的处分决定被撤销，需要恢复该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照原职务和岗位等级安排相应的职务和岗位，并在原处分决定公布范围内为其（    ）。国有企业管理人员因有本条例第四十二条、第四十三条规定情形被撤销处分或者减轻处分的，应当结合其实际履职、业绩贡献等情况对其（    ）受到的损失予以适当补偿。","opts":[{"k":"A","t":"恢复名誉"},{"k":"B","t":"赔偿损失"},{"k":"C","t":"薪酬待遇"},{"k":"D","t":"职务待遇"}],"ans":"A,C","exp":"解析：《国有企业管理人员处分条例》规定：“国有企业管理人员的处分决定被变更，需要调整该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照规定予以调整。国有企业管理人员的处分决定被撤销，需要恢复该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照原职务和岗位等级安排相应的职务和岗位，并在原处分决定公布范围内为其恢复名誉。国有企业管理人员因有本条例第四十二条、第四十三条规定情形被撤销处分或者减轻处分的，应当结合其实际履职、业绩贡献等情况对其薪酬待遇受到的损失予以适当补偿。维持、变更、撤销处分的决定应当在作出后1个月内按照本条例第二十七条第一款第六项规定予以送达、宣布，并存入被处分人本人档案。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922245027753985","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《企业国有资产交易监督管理办法》，信息预披露应当包括以下哪些内容？","opts":[{"k":"A","t":"转让标的基本情况"},{"k":"B","t":"转让标的企业的股东结构"},{"k":"C","t":"转让标的企业的主要财务指标数据"},{"k":"D","t":"转让底价"}],"ans":"A,B,C,D","exp":"解析：《企业国有资产交易监督管理办法》规定：第十五条 转让方披露信息包括但不限于以下内容：  （一）转让标的基本情况；  （二）转让标的企业的股东结构；  （三）产权转让行为的决策及批准情况；  （四）转让标的企业最近一个年度审计报告和最近一期财务报表中的主要财务指标数据，包括但不限于资产总额、负债总额、所有者权益、营业收入、净利润等（转让参股权的，披露最近一个年度审计报告中的相应数据）；  （五）受让方资格条件（适用于对受让方有特殊要求的情形）；  （六）交易条件、转让底价；  （七）企业管理层是否参与受让，有限责任公司原股东是否放弃优先受让权；  （八）竞价方式，受让方选择的相关评判标准；  （九）其他需要披露的事项。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2081922248785850377","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"党员受到开除党籍处分，终生不得重新入党。另有规定不准重新入党的，依照规定。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"对应条款：第十三条 党员受到开除党籍处分，五年内不得重新入党，也不得推荐担任与其原任职务相当或者高于其原任职务的党外职务。另有规定不准重新入党的，依照规定。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2081922248781656072","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"党员受到撤销党内职务处分，一年内不得在党内担任和向党外组织推荐担任与其原任职务相当或者高于其原任职务的职务。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"第十一条：党员受到撤销党内职务处分，二年内不得担任或被推荐担任与其原任职务相当或者高于原任职务的职务。题干称“一年”，因此错误。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2085294560759300104","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"为企业提供内部控制审计服务的会计师事务所，也可以同时为同一企业提供内部控制评价服务。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业可以委托中介机构实施内部控制评价。为企业提供内部控制审计服务的会计师事务所，不得同时为同一企业提供内部控制评价服务。","wrong":1.0,"cat":"审计"},{"id":"2085294560759300101","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业实施内部控制评价时应当遵循重要性原则，即评价工作应当准确地揭示经营管理的风险状况，如实反映内部控制设计与运行的有效性。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"重要性原则是指评价工作应当在全面评价的基础上，关注重要业务单位、重大业务事项和高风险领域。","wrong":1.0,"cat":"审计"},{"id":"2085294560755105810","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业研究项目提出立项申请并编制可行性研究报告后，必须组织独立于申请及立项审批之外的专业机构和人员进行评估论证。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《企业内部控制应用指引第10号——研究与开发》第五条规定，企业可以组织独立于申请及立项审批之外的专业机构和人员进行评估论证，并非必须，所以该说法错误。","wrong":1.0,"cat":"综合实务"},{"id":"2085294560755105808","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"对于被担保人出现财务状况恶化、资不抵债、破产清算等情形的，基于谨慎性原则企业应当在损失实际发生时合理确认相应的负债。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"对于被担保人出现财务状况恶化、资不抵债、破产清算等情形的，企业应当根据国家统一的会计准则制度规定，合理确认预计负债和损失。","wrong":1.0,"cat":"财务会计"},{"id":"2085294560755105807","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《企业内部控制应用指引第12号——担保业务》规定的担保，是指企业作为担保人按照公平、自愿、互利的原则与债务人约定，当债务人不履行债务时，依照法律规定和合同协议承担相应法律责任的行为。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"担保，是指企业作为担保人按照公平、自愿、互利的原则与债权人约定，当债务人不履行债务时，依照法律规定和合同协议承担相应法律责任的行为。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2085294560750911499","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《企业内部控制应用指引第7号——采购业务》的规定，企业应当加强物资采购供应过程的管理，依据采购合同中确定的主要条款跟踪合同履行情况，对有可能影响生产或工程进度的异常情况，应及时进行汇报。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业应当加强物资采购供应过程的管理，依据采购合同中确定的主要条款跟踪合同履行情况，对有可能影响生产或工程进度的异常情况，应出具书面报告并及时提出解决方案。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2085294560750911498","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业应当重视采购付款的过程控制和跟踪管理，发现异常情况的，应当拒绝付款，避免出现资金损失和信用受损。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"企业应当重视采购付款的过程控制和跟踪管理，发现异常情况的，应当拒绝付款，避免出现资金损失和信用受损。","wrong":1.0,"cat":"财务会计"},{"id":"2085294560750911497","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《企业内部控制应用指引第6号——资金活动》，企业选择投资项目应当突出主业，不得从事股票投资或衍生金融产品等高风险投资。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业选择投资项目应当突出主业，谨慎从事股票投资或衍生金融产品等高风险投资。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2085294560750911496","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《企业内部控制应用指引第6号——资金活动》，企业应当妥善保管筹资合同或协议、收款凭证、入库凭证等资料，不定期与资金提供方进行账务核对。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业应当妥善保管筹资合同或协议、收款凭证、入库凭证等资料，定期与资金提供方进行账务核对，确保筹资活动符合筹资方案的要求。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2085294560750911493","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《企业内部控制应用指引第5号——企业文化》，企业应当重视企业文化的评估结果，巩固和发扬文化建设成果，针对评估过程中发现的问题，直接予以改正。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业应当重视企业文化的评估结果，巩固和发扬文化建设成果，针对评估过程中发现的问题，研究影响企业文化建设的不利因素，分析深层次的原因，及时采取措施加以改进。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2085294560423755787","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"合同生效后，企业就质量、价款、履行地点等内容与合同对方没有约定或者约定不明确的，可以协议补充；不能达成补充协议的，按照规定权限和程序办理合同变更或解除事宜。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"合同生效后，企业就质量、价款、履行地点等内容与合同对方没有约定或者约定不明确的，可以协议补充；不能达成补充协议的，按照国家相关法律法规、合同有关条款或者交易习惯确定。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2085294560423755786","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《企业内部控制应用指引第16号——合同管理》所称合同，是指企业与自然人、法人及其他组织等平等主体之间设立、变更、终止民事权利义务关系的协议，包括与职工签订的劳动合同。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业与职工签订的劳动合同，不适用《企业内部控制应用指引第16号——合同管理》。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2085294560419561491","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业预算管理委员会应当对预算管理工作机构提交的预算方案进行研究论证并形成全面预算草案提交企业负责人审核。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业预算管理委员会应当对预算管理工作机构在综合平衡基础上提交的预算方案进行研究论证，从企业发展全局角度提出建议，形成全面预算草案，并提交董事会。","wrong":1.0,"cat":"管理会计"},{"id":"2085294560419561474","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业选拔高级管理人员和聘用中层及以下员工，应当切实做到因事设岗、以岗选人，适当时机也可因人设事或设岗，确保选聘人员能够胜任岗位职责要求。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业选拔高级管理人员和聘用中层及以下员工，应当切实做到因事设岗、以岗选人，避免因人设事或设岗，确保选聘人员能够胜任岗位职责要求。","wrong":1.0,"cat":"综合实务"},{"id":"2085294560415367192","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业对试用期满考核不合格者，应当协商调岗；调岗依旧考核不合格时，应当及时解除劳动关系。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业应当建立选聘人员试用期和岗前培训制度，对试用人员进行严格考察，促进选聘员工全面了解岗位职责，掌握岗位基本技能，适应工作要求。试用期满考核合格后，方可正式上岗；试用期满考核不合格者，应当及时解除劳动关系。","wrong":1.0,"cat":"综合实务"},{"id":"2085294560411172886","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"零基预算适用于企业各项预算的编制，特别是经常发生的预算项目或预算编制基础变化较大的预算项目。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《管理会计应用指引第202号——零基预算》第二条规定，“零基预算适用于企业各项预算的编制，特别是不经常发生的预算项目或预算编制基础变化较大的预算项目。”题目将法条中的\"不经常发生\"改为\"经常发生\"，与法条原文不符，因此该说法错误，故选B。","wrong":1.0,"cat":"管理会计"},{"id":"2085294560415367173","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"单位可以根据管理需要和管理会计活动性质设定报告期间。一般应以公历期间作为报告期间，不可以根据特定需要设定报告期间。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《管理会计基本指引》第二十七条规定，“单位可以根据管理需要和管理会计活动性质设定报告期间。一般应以公历期间作为报告期间，也可以根据特定需要设定报告期间”。题目将法条中的\"也可以根据特定需要设定报告期间\"改为\"不可以根据特定需要设定报告期间\"，与法条原文不符，因此该说法错误，故选B。","wrong":1.0,"cat":"财务会计"},{"id":"2085294560360841222","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"影响重大或法律关系复杂的合同文本经相关部门审核提出不同意见的，企业应当慎重对待，不应使用该合同文本。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业对影响重大或法律关系复杂的合同文本，应当组织内部相关部门进行审核。相关部门提出不同意见的，应当认真分析研究，慎重对待，并准确无误地加以记录；必要时应对合同条款作出修改。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287369641986","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2024年7月，党的二十届三中全会在京召开。全会提出，中国式现代化是走和平发展道路的现代化。必须坚定奉行独立自主的和平外交政策，推动构建人类命运共同体，践行全人类共同价值，落实（）。","opts":[{"k":"A","t":"全球发展倡议"},{"k":"B","t":"全球合作倡议"},{"k":"C","t":"全球安全倡议"},{"k":"D","t":"全球文明倡议"}],"ans":"A,C,D","exp":"全会提出，中国式现代化是走和平发展道路的现代化。必须坚定奉行独立自主的和平外交政策，推动构建人类命运共同体，践行全人类共同价值，落实全球发展倡议、全球安全倡议、全球文明倡议。","wrong":2.0,"cat":"党建修养与合规基础"},{"id":"2069069287369641985","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2024年7月，党的二十届三中全会在京召开。全会提出，必须全面贯彻实施宪法，维护宪法权威，协同推进（）各环节改革，健全法律面前人人平等保障机制。","opts":[{"k":"A","t":"立法"},{"k":"B","t":"执法"},{"k":"C","t":"司法"},{"k":"D","t":"守法"}],"ans":"A,B,C,D","exp":"全会提出，必须全面贯彻实施宪法，维护宪法权威，协同推进立法、执法、司法、守法各环节改革，健全法律面前人人平等保障机制。","wrong":2.0,"cat":"党建修养与合规基础"},{"id":"2064317463811330063","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"国资委及集团公司企业绩效评价的维度不包含下面哪项（）。","opts":[{"k":"A","t":"经营效益"},{"k":"B","t":"安全管理"},{"k":"C","t":"风险管控"},{"k":"D","t":"持续发展"}],"ans":"B","exp":"集团公司绩效评价设定经营效益、创现能力、资产运营、风险管控、持续发展五个评价维度、","wrong":1.0,"cat":"管理会计"},{"id":"2064317463811330062","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某电力企业在2025年迎峰度夏期间，按照《2025年电力安全监管重点任务》要求做好保电和网络安全保障工作。下列任务中，属于文件明确规定的有（ ）。","opts":[{"k":"A","t":"做好迎峰度夏（冬）电力保供工作"},{"k":"B","t":"组织开展电力行业网络安全演习"},{"k":"C","t":"做好全运会等重大活动保电工作"},{"k":"D","t":"推动行业漏洞库等基础设施建设"}],"ans":"A,C","exp":"《2025年电力安全监管重点任务》：“做好迎峰度夏（冬）电力保供工作，做好全国两会、全运会、抗战胜利80周年等重大活动、节假日保电和网络安全保障工作。”B项和D项属于第10点“完善网络安全风险管控体系”的内容。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463811330060","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"国有资产转让应当以依法评估的、经履行出资人职责的机构认可或者由履行出资人职责的机构报经本级人民政府核准的价格为依据，合理确定（）转让价格。","opts":[{"k":"A","t":"最高"},{"k":"B","t":"最低"},{"k":"C","t":"市场"},  贷：固定资产\n借：营业外支出\n  贷：固定资产清理\n    应交税费——应交增值税（销项税额）\n【提示】固定资产的出售、转让、报废或毁损、对外投资、对外捐赠等，都需要通过\"固定资产清理\"科目核算。","wrong":1.0,"cat":"财务会计"},{"id":"2057262356531859457","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项关于企业固定资产的表述中，正确的有（ ）。","opts":[{"k":"A","t":"在建工程的试运行中产生的产品进行销售，其产品的销售收入和成本应计入当期损益"},{"k":"B","t":"企业以一笔款项购入多项没有单独标价的固定资产，应将该款项按各项固定资产账面价值所占比例进行分配，分别确定各项固定资产的成本"},{"k":"C","t":"企业以自营方式建造办公楼时，通过出让方式取得土地使用权时支付的土地出让金应计入办公楼的成本"},{"k":"D","t":"固定资产达到预定可使用状态前发生满足资本化条件的工程物资成本，应计入固定资产的入账价值"}],"ans":"A,D","exp":"本题综合考查固定资产的会计处理。企业将固定资产达到预定可使用状态前或者研发过程中产出的产品或副产品对外销售的，应当按照规定，对试运行销售相关的收入和成本分别进行会计处理，计入当期损益，不应将试运行销售相关收入抵销相关成本后的净额冲减固定资产成本或者研发支出，选项A当选；企业以一笔款项购入多项没有单独标价的固定资产，应将该款项按各项固定资产公允价值占公允价值总额的比例进行分配，分别确定各项固定资产的成本，选项B不当选；通过出让方式取得土地使用权时支付的土地出让金应作为无形资产核算，不计入固定资产成本，选项C不当选；固定资产入账价值的构成应包含的是固定资产达到预定可使用状态前的各项合理、必要支出，因此达到预定可使用状态前发生满足资本化条件的工程物资成本，应计入固定资产的入账价值，选项D当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262356259229698","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业采用自营方式建造固定资产的情况下，下列项目中应计入固定资产取得成本的有（ ）。","opts":[{"k":"A","t":"工程人员的工资"},{"k":"B","t":"生产车间为工程提供的水、电等费用"},{"k":"C","t":"工程完工后发生的工程物资盘亏损失"},{"k":"D","t":"建造固定资产通过出让方式取得土地使用权支付的土地出让金"}],"ans":"A,B","exp":"本题考核自营方式建造固定资产。选项C，计入当期损益；选项D，计入无形资产。相关分录：选项A，借：在建工程  贷：应付职工薪酬  选项B，借：在建工程  贷：生产成本   选项C，\n借：待处理财产损溢   贷：工程物资（批准前先将工程物资转入待处理财产损溢）\n①在筹建期间，经过批准后将净损失计入管理费用\n借：管理费用    其他应收款    贷：待处理财产损溢\n②非筹建期间，经过批准后将净损失计入营业外支出(批准前记入\"待处理财产损溢\")\n借：营业外支出    其他应收款   贷：待处理财产损溢\n选项D，借：无形资产  贷：银行存款等","wrong":1.0,"cat":"财务会计"},{"id":"2057262356095651841","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"存在弃置费用的固定资产，如果履行弃置义务导致预计负债减少，则减少部分应确认为当期损益。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"对于预计负债的减少，首先应以固定资产的账面价值为限扣减固定资产的成本，预计负债的减少额超出固定资产账面价值的，超出部分才确认为当期损益。","wrong":1.0,"cat":"财务会计"},{"id":"2057262355986599937","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"固定资产的各组成部分以不同方式为企业提供经济利益，应当分别将各组成部分确认为单项固定资产。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"本题考查固定资产的确认。固定资产的各组成部分具有不同使用寿命或者以不同方式为企业提供经济利益，适用不同折旧率或折旧方法的，应当分别将各组成部分确认为单项固定资产，例如飞机引擎。本题表述正确。","wrong":1.0,"cat":"财务会计"},{"id":"2057262355932073985","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"年限平均法，是指将固定资产初始价值均衡地分摊到固定资产使用寿命内的一种方法。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"年限平均法，是指将固定资产的应计折旧额均衡地分摊到固定资产预计使用寿命内的一种方法。","wrong":1.0,"cat":"财务会计"},{"id":"2057262355604918274","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业确认与核发电设备弃置费用有关的预计负债时，其金额应按照未来应支付金额减去该设备预期处置利得后的现值确定。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业确认与核发电设备弃置费用有关的预计负债时，其金额应按照弃置费用的现值确定。","wrong":1.0,"cat":"财务会计"},{"id":"2057262355495866370","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某设备的账面原价为800万元，预计使用年限为5年，预计净残值为20万元，采用双倍余额递减法计提折旧。该设备在第2年应计提的折旧额为（  ）万元。","opts":[{"k":"A","t":"195.2"},{"k":"B","t":"192"},{"k":"C","t":"187.2"},{"k":"D","t":"124.8"}],"ans":"B","exp":"该设备在第1年应计提的折旧额=800×2/5=320万元\n该设备在第2年应计提的折旧额=（800-320）×2/5=192万元\n双倍余额递减法最后两年才考虑残值","wrong":1.0,"cat":"财务会计"},{"id":"2057262355328094210","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲企业2×08年6月20日开始自行建造的一条生产线，2×09年6月1日达到预定可使用状态，2×09年7月1日办理竣工决算，2×09年8月1日投入使用。该生产线建造成本为740万元，预计使用年限为5年，预计净残值为20万元。在采用年数总和法计提折旧的情况下，2×10年该设备应计提的折旧额为（ ）万元。","opts":[{"k":"A","t":"192"},{"k":"B","t":"216"},{"k":"C","t":"197.33"},{"k":"D","t":"222"}],"ans":"B","exp":"（1）固定资产开始计提折旧的时间：从达到预定可使用状态的下月开始计提折旧，2×09年6月1日达到预定可使用状态，故从7月开始计提折旧。（2）会计年度与折旧年度不一致的处理：年数总和法下，每年的折旧额应分段计算：第1个折旧年度是2×09年7月－2×10年6月，第1个折旧年度的折旧额＝（740－20）×5/15，第2个折旧年度是2×10年7月－2×11年6月，第2个折旧年度的折旧额＝（740－20）×4/15。2×10年的折旧＝第一个折旧年度的1月至6月＋第二个折旧年度的7月至12月＝（740－20）×5/15×6/12＋（740－20）×4/15×6/12＝216（万元）。","wrong":1.0,"cat":"财务会计"},{"id":"2057262355269373954","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列关于固定资产会计处理的表述中，正确的有（    ）。","opts":[{"k":"A","t":"未投入使用的固定资产不应计提折旧"},{"k":"B","t":"特定固定资产弃置费用应计入该资产的成本"},{"k":"C","t":"管理部门购入固定资产发生的费用化后续支出应计入当期损益"},{"k":"D","t":"预期通过使用或处置不能产生经济利益的固定资产应终止确认"}],"ans":"C,D","exp":"本题综合考查固定资产的会计处理。企业应当对未投入使用的固定资产计提折旧，折旧金额计入当期损益（管理费用），选项 A 不当选；特定固定资产弃置费用的现值应计入该资产的成本，选项 B 不当选；管理部门购入固定资产发生的费用化后续支出应计入当期损益，选项 C 当选；预期通过使用或处置不能产生经济利益的固定资产应终止确认，选项 D 当选。陷阱提示 企业不使用、未投入使用等固定资产仍需计提折旧。","wrong":1.0,"cat":"财务会计"},{"id":"2057262355214848002","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于固定资产的处理，下列说法中正确的有（ ）。","opts":[{"k":"A","t":"固定资产后续支出不符合固定资产确认条件的，应当计入当期损益或相关资产成本"},{"k":"B","t":"固定资产盘亏造成的净损失，应当计入当期损益"},{"k":"C","t":"固定资产后续支出完工达到预定可使用状态时，应还按原来的使用寿命计提折旧"},{"k":"D","t":"与固定资产有关的后续支出，符合准则规定固定资产的确认条件的，应当计入固定资产成本"}],"ans":"A,B,D","exp":"选项B，固定资产盘亏造成的净损失待批准后计入营业外支出科目；选项C，固定资产后续支出完工达到预定可使用状态时，应按重新确定的使用寿命、预计净残值和折旧方法计提折旧。","wrong":1.0,"cat":"财务会计"},{"id":"2057262354942218241","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业委托加工一批非金银首饰的应税消费品，收回后直接用于销售。不考虑其他因素，下列各项中，应当计入收回的已加工产品成本的有（   ）。","opts":[{"k":"A","t":"委托加工耗用原材料的实际成本"},{"k":"B","t":"支付的加工费"},{"k":"C","t":"收回委托加工产品时支付的运杂费"},{"k":"D","t":"支付给受托方的由其代收代缴的消费税"}],"ans":"A,B,C,D","exp":"委托外单位加工完成的存货，收回后直接用于销售的，以实际耗用的原材料或半成品、加工费、运输费、装卸费等费用以及按规定应计入代收代缴的消费税，作为实际成本。选项A、B、C和D均符合题意。","wrong":1.0,"cat":"税务"},{"id":"2057262354887692289","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，应计入存货实际成本的有（ ）。","opts":[{"k":"A","t":"用于继续加工应税消费品的委托加工原材料收回时支付的消费税"},{"k":"B","t":"小规模纳税企业委托加工物资收回时所支付的增值税"},{"k":"C","t":"发出委托加工物资在运输途中发生的合理损耗"},{"k":"D","t":"商品流通企业外购商品时所发生的合理损耗"}],"ans":"B,C,D","exp":"本题考核存货的初始计量。选项A，应记入“应交税费——应交消费税”科目借方，不计入存货成本；选项B，一律不得抵扣，计入存货成本；选项C，应作为委托加工物资成本的一部分；选项D，应计入存货的成本。","wrong":1.0,"cat":"税务"},{"id":"2057262354778640386","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2017 年12月1日，甲公司与乙公司签订一份不可撤销的销售合同，合同约定甲公司以205元/件的价格向乙公司销售1000件M产品，交货日期为2018年1月10日。2017年12月31日，甲公司库存M产品1500件，成本为200元/件，市场销售价格为191元/件。预计M产品的销售费用均为1元/件。不考虑其他因素，2017年12月31日甲公司应对M产品计提的存货跌价准备金额为（   ）元。","opts":[{"k":"A","t":"0"},{"k":"B","t":"1 000"},{"k":"C","t":"5 000"},{"k":"D","t":"15 000"}],"ans":"C","exp":"签订不可撤销的销售合同的可变现净值=（205-1）*1000=204000元，大于成本200000元；未签订销售合同的可变现净值=（191-1）*500=95000元，成本=200*500=100000元，发生减值5000元。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2057262354669588481","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于存货的各项业务中，会计处理不正确的是（   ）。","opts":[{"k":"A","t":"由于管理不善造成的存货净损失计入管理费用"},{"k":"B","t":"非正常原因造成的存货净损失计入营业外支出"},{"k":"C","t":"存货的合理损耗计入营业外支出"},{"k":"D","t":"为特定客户设计产品发生的可直接确定的设计费用计入相关产品成本"}],"ans":"C","exp":"存货的合理损耗计入存货入账成本。","wrong":1.0,"cat":"财务会计"},{"id":"2057262354560536577","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×19年11月15日，甲公司与乙公司签订了一份不可撤销的商品购销合同，约定甲公司于2×20年1月15日按每件2万元向乙公司销售W产品100件。2×19年12月31日，甲公司库存该产品100件，每件实际成本和市场价格分别为1.8万元和1.86万元。甲公司预计向乙公司销售该批产品将发生相关税费10万元。假定不考虑其他因素，甲公司该批产品在2×19年12月31日资产负债表中应列示的金额为（ ）万元。","opts":[{"k":"A","t":"176"},{"k":"B","t":"180"},{"k":"C","t":"186"},{"k":"D","t":"190"}],"ans":"B","exp":"该批产品的可变现净值＝2×100－10＝190（万元），成本＝1.8×100＝180（万元），存货按照成本与可变现净值孰低计量，存货没有发生减值。所以该批产品在2×19年12月31日资产负债表中应列示的金额为180万元。","wrong":1.0,"cat":"财务会计"},{"id":"2057262354317266945","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项关于存货成本的相关表述中，正确的有（    ）。","opts":[{"k":"A","t":"商品流通企业外购存货发生的采购费用金额较小的可以在发生时计入销售费用"},{"k":"B","t":"企业发生的仓储费用应计入存货成本中"},{"k":"C","t":"投资者投入的存货应按合同或协议约定的价值确定（不公允的除外）"},{"k":"D","t":"通过提供劳务取得的存货，其成本按从事劳务提供人员的直接人工和其他直接费用确定"}],"ans":"A,C","exp":"本题考查不同方式下取得存货时有关存货成本的相关结论。商品流通企业在采购过程中发生的运输费、装卸费、保险费以及其他可归属于存货采购成本的费用等可以先进行归集，期末再根据所购商品的存销情况分别进行分摊，但上述采购费用金额较小的，也可以在发生时直接计入当期损益（销售费用），选项 A 当选；存货采购过程中发生的仓储费应计入存货成本，入库后的仓储费不计入存货成本，而是直接计入当期损益，选项 B 不当选；投资者投入存货的成本，按投资协议约定的价值入账，但约定价值不公允的除外，选项 C 当选；通过提供劳务取得的存货，其成本按从事劳务提供人员的直接人工和其他直接费用以及可归属于该存货的间接费用确定，该选项表述遗漏了“可归属于该存货的间接费用”，选项 D 不当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262354208215042","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项交易或事项中，将导致存货跌价准备余额减少的有（    ）。","opts":[{"k":"A","t":"计提存货跌价准备"},{"k":"B","t":"转回存货跌价准备"},{"k":"C","t":"出售已计提存货跌价准备的存货"},{"k":"D","t":"生产领用已计提存货跌价准备的原材料"}],"ans":"B,C,D","exp":"本题考查存货减值的账务处理。存货跌价准备属于存货的备抵类账户，增加记贷方，减少记借方。选项A，计提存货跌价准备时：借：资产减值损失   贷：存货跌价准备将导致“存货跌价准备”余额增加，选项A不当选。选项B，转回存货跌价准备时：借：存货跌价准备   贷：资产减值损失将导致“存货跌价准备”余额减少，选项B当选。选项C，已计提存货跌价准备的存货出售时：存货出售结转成本：借：主营业务成本等   贷：库存商品等同时，结转之前计提的存货跌价准备：借：存货跌价准备   贷：主营业务成本等或合写为：借：主营业务成本等       存货跌价准备   贷：库存商品等将导致“存货跌价准备”余额减少，选项C当选。选项D，生产领用已计提存货跌价准备的原材料时：借：生产成本等       存货跌价准备   贷：原材料将导致“存货跌价准备”余额减少，选项D当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262354040442882","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，关于存货跌价准备计提与转回的表述不正确的有（    ）。","opts":[{"k":"A","t":"资产负债表日存货应按成本与可变现净值孰低计量"},{"k":"B","t":"可变现净值低于存货账面余额的差额应计提存货跌价准备"},{"k":"C","t":"以前期间减记存货价值的影响因素已消失，可将原计提的存货跌价准备转回"},{"k":"D","t":"如果本期导致存货可变现净值高于其成本的因素并不是以前期间减记该项存货价值的因素，则也应当将存货跌价准备转回"}],"ans":"B,D","exp":"本题考查的是存货的期末计量。资产负债表日，存货应当按照成本与可变现净值孰低计量，选项A不当选；可变现净值低于存货账面余额的金额是存货跌价准备的期末余额，确定当期应计提或转回的存货跌价准备时，还需要结合存货跌价准备的期初余额分析，选项B当选；企业以前减记存货价值的影响因素已经消失，减记的金额应当予以恢复，并在原已计提的存货跌价准备金额内转回，转回的金额计入当期损益（资产减值损失），选项C不当选，选项D当选。应试攻略:存货可变现净值低于其账面余额的差额是当期存货跌价准备的余额，需要同学们关注题干的表述方式。如果存货账面价值（已扣除期初存货跌价准备账面余额）高于其可变现净值，差额即为当期应计提的存货跌价准备；但如果是存货的账面余额高于其可变现净值，此时的差额为期末余额，而非当期应确认的金额。此外，存货跌价准备的转回一定基于原减记该项存货价值的因素，但从应试角度出发，计算类题目如果没有特殊说明则无须考虑此因素，一般均可转回。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353931390977","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，属于资产负债表中“存货”项目的有（    ）。","opts":[{"k":"A","t":"委托代销商品"},{"k":"B","t":"受托代销商品"},{"k":"C","t":"生产成本"},{"k":"D","t":"委托加工物资"}],"ans":"A,C,D","exp":"本题考查资产负债表“存货”项目的内容。企业存货包括但不限于原材料、在产品（通过“生产成本”科目核算，选项C当选）、半成品、产成品、周转材料、委托加工物资（选项D当选）等；委托代销商品，由于其所有权并未转移至受托方，因而应当确认为委托方存货的一部分，属于“存货”项目，选项A当选；受托代销商品不由企业拥有或控制，是代替委托方销售的商品，不符合资产定义，不属于企业的资产，也不属于企业的存货，选项B不当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353876865025","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"若材料用于生产产品，当生产的产品没有减值，但材料可变现净值低于其成本时，则期末材料应按照可变现净值计量。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"若材料用于生产产品，当所生产的产品没有减值时，则材料期末按照成本计量；若有证据表明产品发生减值，材料应按照材料的可变现净值与成本孰低计量，此时材料的可变现净值＝产品的售价－产品的销售税费以及相关税费－进一步加工成本。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353600040961","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司从外部数据供应商处购入一批数据资源作为存货核算。该批数据资源购买价款为80万元，支付数据整理及清洗费用5万元，数据传输费3万元，为购买该数据资源发生的差旅费1.2万元。另外因数据资源存在特殊格式，甲公司聘请第三方进行格式转换，支付费用2万元。不考虑其他因素，甲公司购入该数据资源作为存货的初始入账成本为（  ）万元。","opts":[{"k":"A","t":"88"},{"k":"B","t":"90"},{"k":"C","t":"91.2"},{"k":"D","t":"92.2"}],"ans":"B","exp":"企业外购数据资源作为存货核算时，其初始成本包括购买价款、相关税费以及直接归属于使该项资产达到预定可使用状态所发生的其他支出。差旅费1.2万元不属于直接相关支出，不计入成本。因此，初始入账成本=80 + 5 + 3 + 2 = 90（万元），答案选B。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353549709313","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"存货入库后发生的仓库保管人员的工资应当计入存货成本。 （    ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题考查存货入账成本。存货入库后发生的仓库保管人员的工资应当计入当期损益。本题表述错误。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353331605505","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"依据企业会计准则的规定，下列有关收入和利得的表述中，正确的是（ ）。","opts":[{"k":"A","t":"收入源于日常活动，利得也可能源于日常活动"},{"k":"B","t":"收入会影响利润，利得也一定会影响利润"},{"k":"C","t":"不会导致所有者权益增加的经济利益的流入不应确认为收入"},{"k":"D","t":"收入会导致所有者权益的增加，利得不一定会导致所有者权益的增加"}],"ans":"C","exp":"选项A不正确，利得源于非日常活动；选项B不正确，利得不一定会影响利润，利得分为直接计入当期损益的利得和直接计入所有者权益的利得，直接计入所有者权益的利得不影响当期利润；选项C正确，收入是指企业在日常活动中形成的、会导致所有者权益增加的、与所有者投入资本无关的经济利益的总流入；选项D不正确，利得是指由企业非日常活动形成的、会导致所有者权益增加的、与所有者投入资本无关的经济利益的流入，所以不管是直接计入当期损益的利得还是直接计入所有者权益的利得，最终都会导致所有者权益增加。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353277079553","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，属于企业负债的是（ ）。","opts":[{"k":"A","t":"合同负债"},{"k":"B","t":"预付款项"},{"k":"C","t":"交易性金融资产"},{"k":"D","t":"应收款项"}],"ans":"A","exp":"选项B、C、D，属于企业的资产。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353222553601","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"利润包括收入减去费用后的净额以及所有的利得和损失。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"利润包括收入减去费用后的净额以及直接计入当期利润的利得和损失。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353168027649","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列关于所有者权益的表述中正确的有（ ）。","opts":[{"k":"A","t":"所有者权益是指企业资产扣除负债后由所有者享有的剩余权益"},{"k":"B","t":"企业的利得和损失可能引起所有者权益增减变动"},{"k":"C","t":"所有者权益金额应单独计量，不取决于资产和负债的计量"},{"k":"D","t":"所有者权益项目应当列入利润表"}],"ans":"A,B","exp":"选项C，所有者权益金额的确定主要取决于资产和负债的计量；选项D，所有者权益项目列入资产负债表，不在利润表中反映。","wrong":1.0,"cat":"财务会计"},{"id":"2057262353058975746","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，体现实质重于形式要求的是（    ）。","opts":[{"k":"A","t":"计提存货跌价准备"},{"k":"B","t":"对应收款项按预期信用损失模型计提坏账准备"},{"k":"C","t":"资产负债表提供上年数据"},{"k":"D","t":"合同中存在重大融资成分的，按现销价格确认收入"}],"ans":"D","exp":"本题考查会计信息质量要求的应用。实质重于形式要求企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据。计提存货跌价准备（选项 A）、对应收款项按预期信用损失模型计提坏账准备（选项 B）均属于不高估资产的体现，是谨慎性要求的应用，选项 AB 不当选；资产负债表提供上年数据，可以提供同一企业对于不同时期发生的相同或者相似的交易或者事项的相关信息，体现可比性要求，是纵向可比的体现，选项 C 不当选；合同中存在重大融资成分的，仅按合同的形式不能反映经济实质，按现销价格才能予以反映，因此按现销价格确认收入，体现了实质重于形式要求，选项 D 当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262352832483330","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，关于企业财务报告目标和会计基本假设的表述正确的有（    ）。","opts":[{"k":"A","t":"企业会计的确认、计量和报告应当以权责发生制为基础"},{"k":"B","t":"财务报告主要是提供与企业财务状况、经营成果和现金流量等相关的会计信息"},{"k":"C","t":"财务报告所提供的信息应有助于外部投资者作出经济决策，反映企业管理层受托责任履行情况"},{"k":"D","t":"一般来说，法律主体必然是一个会计主体"}],"ans":"A,B,C,D","exp":"本题考查财务报告目标、会计基础和会计基本假设。企业会计的确认、计量和报告应当以权责发生制为基础，选项A当选；财务报告的目标是向财务报告使用者提供与企业财务状况、经营成果和现金流量等有关的会计信息，反映企业管理层受托责任履行情况，有助于财务报告使用者作出经济决策，选项BC当选；一般来说，法律主体必然是会计主体，但是会计主体不一定是法律主体，选项D当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262352777957378","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项关于会计要素的表述中，正确的有（    ）。","opts":[{"k":"A","t":"股东追加的投资是企业的收入"},{"k":"B","t":"费用可能表现为企业负债的减少"},{"k":"C","t":"收入会导致所有者权益增加"},{"k":"D","t":"企业缴纳的税收滞纳金不属于费用"}],"ans":"C,D","exp":"本题考查会计要素的辨析。收入是指企业在日常活动中形成的、会导致所有者权益增加的、与所有者投入资本无关的经济利益的总流入，选项 A 不当选，选项 C 当选；费用会导致所有者权益减少，一般体现为资产的减少或负债的增加，选项 B 不当选；企业缴纳的税收滞纳金不属于企业日常活动中发生的交易或事项，应确认为“营业外支出”，属于损失不属于费用，选项 D 当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262352559853569","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在财务报告中的会计信息应当是客观中立的、无偏的，体现了可靠性会计信息质量要求。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"可靠性是会计信息质量要求之一，要求企业应当以实际发生的交易或事项为依据进行确认、计量和报告，如实反映各项会计要素及其他相关信息，保证会计信息真实可靠、内容完整。会计信息客观中立、无偏，正是可靠性要求的具体体现。因此，题干表述正确。","wrong":1.0,"cat":"财务会计"},{"id":"2057262352501133313","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"相关性要求企业提供的会计信息应当与投资者等财务报告使用者的经济决策需要相关，有助于投资者等财务报告使用者对企业现在或未来的情况作出评价或者预测。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"相关性要求企业提供的会计信息应当与投资者等财务报告使用者的经济决策需要相关，有助于投资者等财务报告使用者对企业过去、现在或未来的情况作出评价或者预测。【提示】题目中仅提到\"现在或未来\"，遗漏了\"过去\"这一关键内容，导致描述不完整，因此该说法错误。","wrong":1.0,"cat":"财务会计"},{"id":"2064317463807135767","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某中央企业主要负责人未有效管控集团内控体系，导致所属三家子企业连续发生重大违规经营问题，累计造成1.2亿元资产损失，危及集团生存发展。根据《中央企业违规经营投资责任追究实施办法》，该主要负责人应承担的责任类型是（）","opts":[{"k":"A","t":"直接责任"},{"k":"B","t":"主管责任"},{"k":"C","t":"领导责任"},{"k":"D","t":"上级连带领导责任"}],"ans":"D","exp":"根据《中央企业违规经营投资责任追究实施办法》规定：企业主要负责人对重大违规经营投资问题承担领导责任；对所属企业发生的重大违规经营投资问题，未履行或未正确履行监管职责的，承担上级连带领导责任。该主要负责人未有效管控内控体系，导致子企业连续发生重大违规问题，承担上级连带领导责任。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463807135764","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号），财政部门在特许经营中的职责包括（）","opts":[{"k":"A","t":"执行预算管理制度"},{"k":"B","t":"监管政府资金"},{"k":"C","t":"管理地方政府债务"},{"k":"D","t":"审批项目建设方案"}],"ans":"A,B,C","exp":"依据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号）：各级财政部门应当严格执行预算管理制度，依法加强政府资金监管和地方政府债务管理，加大财会监督力度，严肃财经纪律。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463807135757","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在正常使用条件下，屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏，建设工程的最低保修期限为3年。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《建设工程质量管理条例》：在正常使用条件下，屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏，为5年。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463807135756","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在水电建设过程中，三峡集团首次探索构建工程环境监理与流域环境监理体系；在城市水环境治理中，通过高标准建设、高水平运营、高效率管理，六安污水处理能力提升124%，污水集中收集率和处理量均提升50%以上。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：“在水电建设过程中，首次探索构建工程环境监理与流域环境监理体系”“通过高标准建设、高水平运营、高效率管理，六安供排水提质增效明显，污水处理能力提升124%，污水集中收集率和处理量均提升40%以上”《共抓大保护、不搞大开发——习近平总书记在重庆召开推动长江经济带发展座谈会并发表重要讲话》。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463807135747","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"外部管理机构具有5年以上基础设施项目运营经验的专业人员不少于3名。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《公开募集基础设施证券投资基金指引（试行）》 外部管理机构应当持续符合下列要求：（二）具备丰富的基础设施项目运营管理经验，配备充足的具有基础设施项目运营经验的专业人员，其中具有5年以上基础设施项目运营经验的专业人员不少于2名。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463802941469","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"履行出资人职责的机构代表本级人民政府对国家出资企业依法享有资产收益、参与重大决策和选择管理者等出资人权利。履行出资人职责的机构依照法律、行政法规的规定，制定或者参与制定国家出资企业的章程。履行出资人职责的机构对法律、行政法规和本级人民政府规定须经本级人民政府批准的履行出资人职责的重大事项，应当报请本级人民政府备案。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《中华人民共和国企业国有资产法》规定：“履行出资人职责的机构代表本级人民政府对国家出资企业依法享有资产收益、参与重大决策和选择管理者等出资人权利。履行出资人职责的机构依照法律、行政法规的规定，制定或者参与制定国家出资企业的章程。履行出资人职责的机构对法律、行政法规和本级人民政府规定须经本级人民政府批准的履行出资人职责的重大事项，应当报请本级人民政府批准。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463802941468","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"列入中央企业境外投资项目负面清单特别监管类的境外投资项目，中央企业可以在向国家有关部门首次报送文件的同时报国资委履行出资人审核把关程序。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文第十二条：\"列入中央企业境外投资项目负面清单特别监管类的境外投资项目，中央企业应当在履行企业内部决策程序后、在向国家有关部门首次报送文件前报国资委履行出资人审核把关程序。\" 要求\"首次报送文件前\"报送，而非\"同时\"报送。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463802941463","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"基础设施和公用事业特许经营期限应当根据行业特点、所提供公共产品或服务需求、项目生命周期、项目建设投资和运营成本、投资回收期等综合因素确定，充分保障特许经营者合法权益，特许经营期限原则上不超过30年。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《基础设施和公用事业特许经营管理办法》（正确规定：特许经营期限原则上不超过40年）","wrong":1.0,"cat":"财务管理"},{"id":"2064317463802941447","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《长江流域控制性水工程联合调度管理办法（试行）》，长江流域防洪调度应当坚持蓄泄兼筹、以蓄为主。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《长江流域控制性水工程联合调度管理办法（试行）》，长江流域防洪调度应当坚持蓄泄兼筹、以泄为主，在确保水工程安全前提下，通过河道湖泊泄水、水库群拦蓄、蓄滞洪区运用、泵站和水闸控制运用等措施，实现流域防洪目标，提高整体防洪效益，兼顾水资源综合利用要求。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463802941446","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《长江流域控制性水工程联合调度管理办法（试行）》，控制性水工程联合调度实行统一调度、统一管理、统一负责。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《长江流域控制性水工程联合调度管理办法（试行）》，控制性水工程联合调度实行统一调度、分级管理、分级负责。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463802941445","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《长江流域控制性水工程联合调度管理办法（试行）》，本办法自2023年5月1日起施行。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《长江流域控制性水工程联合调度管理办法（试行）》，本办法自2023年3月1日起施行。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463798747168","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《国务院办公厅转发国资委关于推进国有资本调整和国有企业重组指导意见的通知》，要简化企业组织机构，对层级过多的下属企业进行清理、整合，通过关闭、破产、撤销、合并、取消企业法人资格等措施，原则上将管理层次控制在三级以内。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"原文表述为：\"要简化企业组织机构，对层级过多的下属企业进行清理、整合，通过关闭、破产、撤销、合并、取消企业法人资格等措施，原则上将管理层次控制在三级以内。\"题干与原文完全一致，表述正确。出处：《关于推进国有资本调整和国有企业重组的指导意见》。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463798747164","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"对企业国有资产损失负有责任受到撤职以上纪律处分的国有及国有控股企业的企业负责人，5年内不得担任任何国有及国有控股企业的企业负责人；造成企业国有资产重大损失或者被判处刑罚的，10年内不得担任任何国有及国有控股企业的企业负责人。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：《企业国有资产监督管理暂行条例》规定，对企业国有资产损失负有责任受到撤职以上纪律处分的国有及国有控股企业的企业负责人，5年内不得担任任何国有及国有控股企业的企业负责人；造成企业国有资产重大损失或者被判处刑罚的，终身不得担任任何国有及国有控股企业的企业负责人。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2064317463798747155","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《温室气体自愿减排交易管理办法（试行）》规定，项目业主在申请温室气体自愿减排项目或者减排量登记时提供虚假材料的，由省级以上生态环境主管部门责令改正，处五万元以上十万元以下的罚款；存在篡改、伪造数据等故意弄虚作假行为的，省级以上生态环境主管部门还应当通知注册登记机构撤销项目登记，五年内不再受理该项目业主提交的温室气体自愿减排项目和减排量登记申请。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《温室气体自愿减排交易管理办法（试行）》：“第四十三条 项目业主在申请温室气体自愿减排项目或者减排量登记时提供虚假材料的，由省级以上生态环境主管部门责令改正，处一万元以上十万元以下的罚款；存在篡改、伪造数据等故意弄虚作假行为的，省级以上生态环境主管部门还应当通知注册登记机构撤销项目登记，三年内不再受理该项目业主提交的温室气体自愿减排项目和减排量登记申请。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463798747154","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《能源电力系统安全生产治本攻坚三年行动方案（2024—2026年）》在强化风电工程安全管理要求中明确，重点针对超期服役或服役年限超过20年设备、100米以上的钢管塔筒设备、2019年以后至中央财政补贴取消前投产设备，加强安全风险评估和隐患排查治理。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文规定：\"重点针对超期服役或服役年限超过15年设备、100米以上的钢管塔筒设备、2019年以后至中央财政补贴取消前投产设备，加强安全风险评估和隐患排查治理。\"题干将重点排查设备的服役年限门槛由\"超过15年\"改为\"超过20年\"，与原文不符。此题列举了三类重点设备的并列条件，需学员完整识记各项限定条件，不得遗漏或混淆其中任一数值。出处：《能源电力系统安全生产治本攻坚三年行动方案（2024—2026年）》。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463798747152","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《国家发展改革委、国家能源局关于完善发电侧容量电价机制的通知》规定，可靠容量补偿机制的补偿范围，可包括自主参与当地市场的煤电、气电和符合条件的电网侧独立新型储能，以及抽水蓄能等具备可靠容量的机组，但对获得其他保障的容量不重复补偿，政府定价的机组不予补偿。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：：\"可靠容量补偿机制的补偿范围，可包括自主参与当地市场的煤电、气电和符合条件的电网侧独立新型储能等，并结合电力市场建设和电价市场化改革等情况逐步扩展至抽水蓄能等其他具备可靠容量的机组；对获得其他保障的容量不重复补偿。政府定价的机组，不予补偿。\"抽水蓄能等机组并非初始补偿范围，须\"结合电力市场建设和电价市场化改革等情况逐步扩展\"方可纳入，题干将其与煤电、气电、电网侧独立新型储能并列为初始补偿范围，表述有误。出处：《国家发展改革委、国家能源局关于完善发电侧容量电价机制的通知》。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463798747149","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《2025年电力安全监管重点任务》要求，组织开展第二批以可靠性为中心的电力检修（RCM）试点，指导建立行业RCM工作平台。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《2025年电力安全监管重点任务》原文为：\"组织开展第三批以可靠性为中心的电力检修(RCM)试点，指导建立行业RCM工作平台。\"题干将\"第三批\"误写为\"第二批\"，批次不符，故本题错误。出处：《2025年电力安全监管重点任务》。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463798747143","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号），实施机构选择特许经营者可采用的公开竞争方式有（）","opts":[{"k":"A","t":"招标"},{"k":"B","t":"谈判"},{"k":"C","t":"直接指定"},{"k":"D","t":"邀请招标"}],"ans":"A,B","exp":"依据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号）：实施机构根据经审定的特许经营方案，应当通过招标、谈判等公开竞争方式选择特许经营者。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463794552864","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《招标人主体责任履行指引》，招标人可以以什么为周期发布招标计划？","opts":[{"k":"A","t":"月度"},{"k":"B","t":"季度"},{"k":"C","t":"年度"},{"k":"D","t":"半年度"}],"ans":"A,B,C","exp":"招标人要结合项目特点和需求，以月度、季度或者年度为周期发布招标计划，载明招标项目概况、投标人主要资格条件等信息，供潜在投标人知悉和进行投标准备。——《招标人主体责任履行指引》","wrong":2.0,"cat":"综合实务"},{"id":"2064317463794552863","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《招标人主体责任履行指引》，招标人要积极应用哪些技术以减少评标环节的人为干预？","opts":[{"k":"A","t":"远程异地评标"},{"k":"B","t":"智能辅助评标"},{"k":"C","t":"人工复核评标"},{"k":"D","t":"现场集中评标"}],"ans":"A,B","exp":"招标人要积极应用远程异地评标、智能辅助评标，减少评标环节的人为干预。——《招标人主体责任履行指引》","wrong":1.0,"cat":"综合实务"},{"id":"2064317463794552862","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某水库经批准报废。根据《水库降等与报废管理办法》，在报废组织实施过程中，下列措施属于必须执行的有（ ）。","opts":[{"k":"A","t":"原则上拆除大坝"},{"k":"B","t":"重新确定生态流量目标"},{"k":"C","t":"落实安全行洪和度汛措施"},{"k":"D","t":"按照机构编制规定开展水库管理机构撤销"}],"ans":"A,C,D","exp":"根据《水库降等与报废管理办法》：水库报废的组织实施包括以下措施：（一）工程处置措施；（二）安全行洪和度汛措施；（三）必要的生态修复措施；（四）按照机构编制有关规定开展水库管理机构变更或者撤销；（五）水库管理人员安置；（六）相关资料整编、归档和移交；（七）批复意见确定的其他措施。工程处置措施涉及大坝拆除的，应当按照国家有关规定实施。该条明确“原则上应当拆除大坝”，故A正确。C对应第（二）项，D对应第（四）项。B选项“重新确定生态流量目标”属于降等措施（第十二条第（四）项），报废措施中无此项，故不选。","wrong":2.0,"cat":"经济法与财经法规"},{"id":"2064317463794552861","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某中央企业在报送境外投资季度报告时，多次出现数据不实且故意隐瞒部分投资项目的情况。根据相关规定，国资委对该企业的处理措施可以包括下列哪些？","opts":[{"k":"A","t":"予以通报批评"},{"k":"B","t":"直接免去该企业主要负责人职务"},{"k":"C","t":"依照有关法律追究违规经营投资责任"},{"k":"D","t":"暂停该企业所有境外投资活动"}],"ans":"A,C","exp":"中央企业违反本办法规定，未履行或未正确履行投资管理职责造成国有资产损失以及其他严重不良后果的，依照《中华人民共和国企业国有资产法》《国务院办公厅关于建立国有企业违规经营投资责任追究制度的意见》（国办发〔2016〕63号）等有关规定，由有关部门追究中央企业经营管理人员的责任。对瞒报、谎报、不及时报送投资信息的中央企业，国资委予以通报批评。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463794552859","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某省电网公司计划开展在运输电通道新能源电量占比提升工作。根据《加快构建新型电力系统行动方案（2024-2027年）》，应采取的措施有（ ）。","opts":[{"k":"A","t":"有序安排各类电源投产"},{"k":"B","t":"同步加强送受端网架"},{"k":"C","t":"提升送端功率调节能力"},{"k":"D","t":"降低送端常规电源出力至零"}],"ans":"A,B,C","exp":"《加快构建新型电力系统行动方案（2024-2027年）》：\"通过有序安排各类电源投产，同步加强送受端网架，提升送端功率调节能力，有效提高在运输电通道新能源电量占比。\"","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463794552858","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《建设工程质量管理条例》，关于建设工程发生质量事故的报告制度，说法正确的有？","opts":[{"k":"A","t":"有关单位应当在24小时内向当地建设行政主管部门报告"},{"k":"B","t":"有关单位应当在48小时内向当地建设行政主管部门报告"},{"k":"C","t":"对重大质量事故，应当按照事故类别和等级向当地人民政府报告"},{"k":"D","t":"对重大质量事故，应当按照事故类别和等级向上级建设行政主管部门报告"}],"ans":"A,C,D","exp":"建设工程发生质量事故，有关单位应当在24小时内向当地建设行政主管部门和其他有关部门报告。对重大质量事故，事故发生地的建设行政主管部门和其他有关部门应当按照事故类别和等级向当地人民政府和上级建设行政主管部门和其他有关部门报告。——《建设工程质量管理条例》","wrong":1.0,"cat":"综合实务"},{"id":"2064317463794552855","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《温室气体自愿减排交易管理办法（试行）》，关于交易主体操纵或扰乱交易市场的法律责任，下列说法正确的有哪些？","opts":[{"k":"A","t":"由生态环境部给予通报批评"},{"k":"B","t":"由生态环境部处一万元以上十万元以下的罚款"},{"k":"C","t":"由生态环境部吊销其交易资格"},{"k":"D","t":"由市场监管部门处五万元以上二十万元以下的罚款"}],"ans":"A,B","exp":"《温室气体自愿减排交易管理办法（试行）》 交易主体违反本办法规定，操纵或者扰乱全国温室气体自愿减排交易市场的，由生态环境部给予通报批评，并处一万元以上十万元以下的罚款。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463794552853","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"省级价格主管部门要会同能源主管部门建立用户______评估制度，将评估结果作为确定可靠容量补偿标准等工作的重要依据。","opts":[{"k":"A","t":"用电需求"},{"k":"B","t":"经济承受能力"},{"k":"C","t":"供电可靠性"},{"k":"D","t":"能效水平"}],"ans":"B","exp":"解析：《国家发展改革委、国家能源局关于完善发电侧容量电价机制的通知》五、做好组织实施（二）建立电价承受能力评估制度：省级价格主管部门要会同能源主管部门建立用户经济承受能力评估制度，将评估结果作为确定可靠容量补偿标准，制定电力系统调节能力及新能源和新型储能发展规划、方案等，核准抽水蓄能等项目的重要依据。","wrong":2.0,"cat":"综合实务"},{"id":"2064317463794552852","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某省级能源主管部门需推进服务电力系统抽水蓄能项目布局，根据《抽水蓄能电站开发建设管理暂行办法》，布局项目不得涉及（），应合理避让敏感性因素，落实用地、用林、用水、电网接入等外部建设条件。","opts":[{"k":"A","t":"永久基本农田"},{"k":"B","t":"生态保护红线"},{"k":"C","t":"林地保护区"},{"k":"D","t":"水资源保护区"}],"ans":"B","exp":"依据《抽水蓄能电站开发建设管理暂行办法》正文：服务电力系统项目布局应符合国土空间规划，不得涉及生态保护红线，合理避让永久基本农田、林地保护区、水资源保护区等敏感性因素，落实用地、用林、用水、电网接入等外部建设条件。生态保护红线为“不得涉及”的硬性禁止区域，其他为“合理避让”范畴，故正确答案为生态保护红线。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463794552851","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"交易主体注册绿证账户时，需提交的材料包括（）","opts":[{"k":"A","t":"营业执照（法人）"},{"k":"B","t":"国家认可的身份证明（自然人）"},{"k":"C","t":"项目发电许可证"},{"k":"D","t":"财务审计报告"}],"ans":"A,B","exp":"《可再生能源绿色电力证书核发和交易规则》：交易主体注册绿证账户时应按要求提交营业执照或国家认可的身份证明等材料，并保证账户注册申请资料真实完整、准确有效。其中卖方还须承诺仅申领中国绿证、不重复申领其他同属性凭证。","wrong":2.0,"cat":"审计"},{"id":"2064317463794552849","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《基础设施和公用事业特许经营管理办法》，特许经营协议应当明确（ ），以及成本承担方式。","opts":[{"k":"A","t":"因法律法规、标准规范、国家政策等管理要求调整变化对特许经营者提出的相应要求"},{"k":"B","t":"因技术革新对特许经营者提出的相应要求"},{"k":"C","t":"因市场价格波动对特许经营者提出的相应要求"},{"k":"D","t":"因用户需求变化对特许经营者提出的相应要求"}],"ans":"A","exp":"《基础设施和公用事业特许经营管理办法》规定：“特许经营协议应当主要包括以下内容：（十一）因法律法规、标准规范、国家政策等管理要求调整变化对特许经营者提出的相应要求，以及成本承担方式；”","wrong":1.0,"cat":"综合实务"},{"id":"2064317463794552847","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中央企业负责人经营业绩考核办法》，下列关于主业处于充分竞争行业和领域的商业类企业考核导向的表述中，正确的有（ ）。","opts":[{"k":"A","t":"以增强国有经济活力、放大国有资本功能、实现国有资本保值增值为导向"},{"k":"B","t":"以支持企业可持续发展和服务国家战略为导向"},{"k":"C","t":"重点考核企业经济效益、资本回报水平和市场竞争能力"},{"k":"D","t":"在保证合理回报和国有资本保值增值的基础上，加强对服务国家战略情况的考核"}],"ans":"A,C","exp":"《中央企业负责人经营业绩考核办法》：对主业处于充分竞争行业和领域的商业类企业，以增强国有经济活力、放大国有资本功能、实现国有资本保值增值为导向，重点考核企业经济效益、资本回报水平和市场竞争能力，引导企业优化资本布局，提高资本运营效率，提升价值创造能力。选项B和D是对主业处于关系国家安全、国民经济命脉的重要行业和关键领域、主要承担重大专项任务的商业类企业的考核导向。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463794552846","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《国有企业管理人员处分条例》规定，减轻给予处分，是指在本条例规定的违法行为应当受到的处分幅度（ ），减轻一档给予处分。","opts":[{"k":"A","t":"以内"},{"k":"B","t":"以上"},{"k":"C","t":"以下"},{"k":"D","t":"以外"}],"ans":"D","exp":"解析：《国有企业管理人员处分条例》规定：“减轻给予处分，是指在本条例规定的违法行为应当受到的处分幅度以外，减轻一档给予处分。”","wrong":1.0,"cat":"综合实务"},{"id":"2064317463794552845","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号），特许经营项目融资严禁的 订《电力建设工程施工安全管理导则》"},{"k":"C","t":"动态开展电力行业关键信息基础设施认定"},{"k":"D","t":"有序推进“智慧工地”建设"}],"ans":"B,D","exp":"《2025年电力安全监管重点任务》完善电力安全监管体系”：“修订《电力建设工程施工安全管理导则》《海上风力发电建设工程质量监督检查大纲（试行）》开展电力工程安全生产经验教训常态化分析总结,动态更新事故反措。跟踪分析“新技术、新材料、新工艺、新设备”安全风险,研究建立风险隐患库。加强先进技术装备应用，有序推进‘智慧工地’建设。”A项属于“完善涉网安全管理体系”；C项：“完善网络安全风险管控体系”。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463794552834","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"电力调度机构在系统安全中的职责包括（）","opts":[{"k":"A","t":"严格执行调度规则，合理安排运行方式"},{"k":"B","t":"负责电力市场交易安全校核"},{"k":"C","t":"统筹安排电力设备检修计划"},{"k":"D","t":"制定输配电价标准"}],"ans":"A,B,C","exp":"《电力市场运行基本规则》：电力调度机构应当严格执行电力调度规则，合理安排系统运行方式，及时预报或者通报影响电力系统安全运行的信息，防止电网事故，保障电网运行安全。负责电力市场交易的安全校核，并公布校核方法、参数。根据电力供需形势、设备运行状况、安全约束条件和系统运行状况，统筹安排电力设备检修计划。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358559","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"假设长江流域某中型水库，其防洪影响范围和承担的防洪任务均不跨省级行政区域。根据《长江流域控制性水工程联合调度管理办法（试行）》，关于该水库的防洪调度权限，下列说法正确的有？","opts":[{"k":"A","t":"汛期水位不高于防洪限制水位、不需实施防洪调度时，由水库运行管理单位负责调度"},{"k":"B","t":"需要实施防洪调度时，由所在省级人民政府水行政主管部门按照调度管理权限负责组织调度"},{"k":"C","t":"需要实施防洪调度时，调度方案必须报长江水利委员会批准后执行"},{"k":"D","t":"该省级水行政主管部门组织调度后，应当报长江水利委员会备案"}],"ans":"A,B,D","exp":"水库防洪影响范围和承担的防洪任务不跨省级行政区域的，由所在省级人民政府水行政主管部门按照调度管理权限负责组织调度并报长江水利委员会备案。汛期水库水位不高于防洪限制水位、不需要实施防洪调度的，由水库运行管理单位负责调度。——《长江流域控制性水工程联合调度管理办法（试行）》","wrong":2.0,"cat":"综合实务"},{"id":"2064317463790358558","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某中央企业需采购技术复杂、无法准确提出需求的专用设备，且符合资格条件的供应商仅有2家，同时该设备不属于必须招标范围，根据《关于规范中央企业采购管理工作的指导意见》，该企业应选择的采购方式是（）","opts":[{"k":"A","t":"询比采购"},{"k":"B","t":"竞价采购"},{"k":"C","t":"谈判采购"},{"k":"D","t":"直接采购"}],"ans":"C","exp":"《关于规范中央企业采购管理工作的指导意见》合理选择采购方式，谈判采购适用条件为满足以下情形之一：一是采购标的物技术复杂或性质特殊，采购方不能准确提出采购需求；三是市场供应资源缺乏，符合资格条件供应商只有2家。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358557","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某中央企业为保障重点战略物资稳定供应，拟与一家特定供应商签订长期协议进行定向采购。根据《关于规范中央企业采购管理工作的指导意见》，此种情形适用哪一种采购方式？","opts":[{"k":"A","t":"询比采购"},{"k":"B","t":"竞价采购"},{"k":"C","t":"谈判采购"},{"k":"D","t":"直接采购"}],"ans":"D","exp":"直接采购适用条件为满足以下情形之一：六是为保障重点战略物资稳定供应，需签订长期协议定向采购。——《关于规范中央企业采购管理工作的指导意见》","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358556","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某中央企业拟进行一项工程建设项目采购。该项目不属于必须招标的工程项目，且未达到《必须招标的工程项目规定》的规模标准。经分析，该项目采购需求清晰、准确、完整，技术和质量标准化程度高，市场资源丰富，竞争充分，潜在供应商有5家。然而，该企业最终选择了“谈判采购”方式。根据《关于规范中央企业采购管理工作的指导意见》，该企业的做法最可能违反了哪项核心要求？假如该企业因抢险救灾需要紧急采购物资，此时有效供应商仅有1家，按照文件规定，应适用“直接采购”，其适用条件中关于供应商数量的描述是“有且仅有1家”，这一表述与下面哪一项的法律条文用语保持一致，以体现对例外情形的严格限定？","opts":[{"k":"A","t":"选择采购方式应当与适用条件匹配；有效供应商有且仅有1家"},{"k":"B","t":"应优先采用招标方式；唯一供应商"},{"k":"C","t":"不得以不合理条件限制潜在供应商；供应商只有一家"},{"k":"D","t":"应当选择竞争性更强的询比或竞价方式；供应商数量不满足竞争要求"}],"ans":"A","exp":"1. 询比采购适用条件为同时满足以下三种情形：一是采购人能够清晰、准确、完整地提出采购需求；二是采购标的物的技术和质量标准化程度较高；三是市场资源较丰富、竞争充分，潜在供应商不少于3家。竞价采购适用条件为同时满足以下四种情形：一是采购人能够清晰、准确、完整地提出采购需求；二是采购标的物的技术和质量标准化程度较高；三是采购标的物以价格竞争为主；四是市场资源较丰富、竞争充分，潜在供应商不少于3家。——《关于规范中央企业采购管理工作的指导意见》第二条第二款；2. 直接采购适用条件为满足以下情形之一：是有效供应商有且仅有1家。——《关于规范中央企业采购管理工作的指导意见》第二条第四款","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358555","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《企业国有资产监督管理暂行条例（2019修订）》规定，国务院国有资产监督管理机构是代表国务院履行出资人职责、负责监督管理企业国有资产的（）。","opts":[{"k":"A","t":"行政机构"},{"k":"B","t":"直属特设机构"},{"k":"C","t":"事业单位"},{"k":"D","t":"派出机构"}],"ans":"B","exp":"解析：《企业国有资产监督管理暂行条例（2019修订）》规定，国务院国有资产监督管理机构是代表国务院履行出资人职责、负责监督管理企业国有资产的直属特设机构。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463790358553","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号），可被依法授权作为特许经营项目实施机构的有（）","opts":[{"k":"A","t":"行业主管部门"},{"k":"B","t":"事业单位"},{"k":"C","t":"民营企业"},{"k":"D","t":"国有企业"}],"ans":"A,B","exp":"依据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号）：地方各级人民政府应当规范推进本级政府事权范围内的特许经营项目，依法依规授权有关行业主管部门、事业单位等作为项目实施机构。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463790358548","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号），特许经营可采取的合法方式有（）","opts":[{"k":"A","t":"在一定期限内，政府授予特许经营者投资新建或者改扩建、运营基础设施和公用事业，期限届满移交政府"},{"k":"B","t":"在一定期限内，政府授予特许经营者投资新建或者改扩建、拥有并运营基础设施和公用事业，期限届满移交政府"},{"k":"C","t":"在一定期限内，政府将已经建成的基础设施和公用事业项目转让特许经营者运营，期限届满移交政府"},{"k":"D","t":"建设工程完成后直接移交政府，特许经营者不承担运营义务"}],"ans":"A,B,C","exp":"根据《基础设施和公用事业特许经营管理办法》第七条规定，基础设施和公用事业特许经营可以采取以下方式：一是在一定期限内，政府授予特许经营者投资新建或者改扩建、运营基础设施和公用事业，期限届满移交政府；二是在一定期限内，政府授予特许经营者投资新建或者改扩建、拥有并运营基础设施和公用事业，期限届满移交政府；三是在一定期限内，政府将已经建成的基础设施和公用事业项目转让特许经营者运营，期限届满移交政府；以及国家规定的其他方式。同时，办法明确禁止在建设工程完成后直接将项目移交政府，或者通过提前终止协议等方式变相逃避运营义务。因此，A、B、C正确，D错误。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463790358547","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"为深入贯彻习近平总书记关于网络强国的重要思想，认真落实《数字中国建设整体布局规划》，全面提升水利工程运行管理数字化、网络化、智能化水平，水利部印发《关于推进水库、水闸、蓄滞洪区运行管理数字孪生的指导意见》，该意见明确构建现代化水库运行管理矩阵，保障水利工程高水平安全运行、______。","opts":[{"k":"A","t":"效益充分发挥"},{"k":"B","t":"功能全面落地"},{"k":"C","t":"效率持续提升"},{"k":"D","t":"成果广泛共享"}],"ans":"A","exp":"为深入贯彻习近平新时代中国特色社会主义思想为指导，贯彻落实党的二十届三中全会精神，深入贯彻习近平总书记“节水优先、空间均衡、系统治理、两手发力”治水思路和关于治水的重要论述精神，按照“需求牵引、应用至上、数字赋能、提升能力”要求，强化数字孪生水利建设，推动已建水利工程运行管理数字赋能和转型升级，构建现代化水库运行管理矩阵，保障水利工程高水平安全运行、效益充分发挥。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358546","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某省级能源主管部门已完成本地区抽水蓄能发展需求论证，确认需求存在缺口，根据《国家能源局综合司关于进一步做好抽水蓄能规划建设工作有关事项的通知》，该省份应统筹已建、在建和已纳规项目，区分电站不同功能定位，组织开展站址比选、布局优化和（）工作，布局项目落实到计划核准年度。","opts":[{"k":"A","t":"项目招标"},{"k":"B","t":"项目纳规"},{"k":"C","t":"项目建设"},{"k":"D","t":"项目运营"}],"ans":"B","exp":"依据《国家能源局综合司关于进一步做好抽水蓄能规划建设工作有关事项的通知》正文：经深入论证存在需求缺口的省份，要统筹已建、在建和已纳规项目，区分电站不同功能定位，组织开展站址比选、布局优化和项目纳规工作，布局项目落实到计划核准年度。该省份已确认需求缺口，需按“站址比选→布局优化→项目纳规”流程推进，故正确答案为项目纳规。","wrong":2.0,"cat":"综合实务"},{"id":"2064317463790358545","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《水库大坝安全监测管理办法》，大坝安全监测设施建设实行的责任制度是（）","opts":[{"k":"A","t":"项目经理负责制"},{"k":"B","t":"项目法人负责制"},{"k":"C","t":"监理负责制"},{"k":"D","t":"施工单位负责制"}],"ans":"B","exp":"《水库大坝安全监测管理办法》，大坝安全监测设施建设实行项目法人负责制。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463790358542","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号），特许经营者取得收益的合法方式有（）","opts":[{"k":"A","t":"向用户收费"},{"k":"B","t":"取得相关开发经营权益"},{"k":"C","t":"政府固定投资回报"},{"k":"D","t":"政府兜底付费"}],"ans":"A,B","exp":"依据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号）：特许经营者通过向用户收费、获得与特许经营项目相关的其他开发经营权益等方式取得收益；严禁政府固定回报、兜底付费。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463790358541","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《中央企业违规经营投资责任追究实施办法》规定，中央企业经营管理有关人员任职期间违反规定，未履行或未正确履行职责造成国有资产损失或其他不良后果的，应当追究其（）。","opts":[{"k":"A","t":"相应责任"},{"k":"B","t":"全部责任"},{"k":"C","t":"次要责任"},{"k":"D","t":"主要责任"}],"ans":"A","exp":"根据《中央企业违规经营投资责任追究实施办法》规定：中央企业经营管理有关人员任职期间违反规定，未履行或未正确履行职责造成国有资产损失或其他不良后果的，应当追究其相应责任。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358540","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"中央企业应当完善违规行为追责问责机制，明确责任范围，细化问责标准，针对问题和线索及时开展调查，按照有关规定严肃追究（）责任。","opts":[{"k":"A","t":"相关领导"},{"k":"B","t":"违规人员"},{"k":"C","t":"部门负责人"},{"k":"D","t":"直接责任人"}],"ans":"B","exp":"解析：中央企业应当完善违规行为追责问责机制，明确责任范围，细化问责标准，针对问题和线索及时开展调查，按照有关规定严肃追究违规人员责任。《中央企业合规管理办法》","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358538","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某山区水库原设计总库容为1500万立方米，因上游来水减少及淤积，现状有效库容仅900万立方米。经勘察，恢复原库容需新建引水工程，投资估算超过2亿元，且技术可行性低。同时，该水库原有的灌溉功能已被下游新建的灌区工程完全替代。水库管理单位拟申请降等。根据《水库降等与报废管理办法》，该水库可以予以降等的条件包括（ ）。","opts":[{"k":"A","t":"现有库容低于原设计规模，且按原设计规模恢复库容技术上不可行、经济上不合理"},{"k":"B","t":"原设计灌溉功能已被其他工程替代"},{"k":"C","t":"库容基本淤满，无合理有效措施恢复"},{"k":"D","t":"工程病险严重，除险加固后仍不能保证安全运行"}],"ans":"A,B","exp":"根据《水库降等与报废管理办法》：符合下列条件之一的水库，可以予以降等：（一）现有库容低于原设计规模，或者不能按照原设计规模正常蓄水，且按原设计规模恢复库容或者正常蓄水不具备条件，或者技术上不可行、经济上不合理的；（二）原设计功能大部分已被其他工程替代或者水库功能萎缩已达不到原设计的。题干中“现有库容900万立方米低于原设计1500万立方米”满足第（一）项；“灌溉功能被下游新建灌区工程完全替代”满足第（二）项。C选项属于报废条件（第六条第二项），D选项属于报废条件（第六条第三项），故不选。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2064317463790358532","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中央企业违规经营投资责任追究实施办法》本办法所称「未正确履行职责」的情形包括（）","opts":[{"k":"A","t":"未按程序行使职权"},{"k":"B","t":"超越职权"},{"k":"C","t":"滥用职权"},{"k":"D","t":"正当合理期限内未履职"}],"ans":"A,B,C","exp":"根据《中央企业违规经营投资责任追究实施办法》，本办法所称未正确履行职责，是指企业经营管理有关人员在经营投资活动中，未按规定程序、方式行使职权，或者超越职权、滥用职权，致使国有资产损失或者造成其他不良后果的行为。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358536","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"依据《中央企业境外投资监督管理办法》，中央企业在年度境外投资完成后，应当编制年度境外投资完成情况报告，并于下一年（ ）前报送国资委。","opts":[{"k":"A","t":"下一年1月1日"},{"k":"B","t":"下一年12月31日"},{"k":"C","t":"下一年1月31日"},{"k":"D","t":"下一年7月31日"}],"ans":"C","exp":"中央企业在年度境外投资完成后，应当编制年度境外投资完成情况报告，并于下一年1月31日前报送国资委。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463790358534","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"中央企业固定资产投资方面，属于违规追责情形的有（）","opts":[{"k":"A","t":"未按规定开展可行性研究擅自投资"},{"k":"B","t":"违反规定干预、操纵项目招标"},{"k":"C","t":"及时调整止损投资方案"},{"k":"D","t":"项目烂尾成本严重偏高"}],"ans":"A,B,D","exp":"根据《中央企业违规经营投资责任追究实施办法》，固定资产投资方面的责任追究情形包括：（一）未按规定开展可行性研究、尽职调查，擅自立项、擅自投资，造成国有资产损失；（二）违反规定干预、操纵项目招标采购，造成国有资产损失；（三）投资项目管理混乱，造成项目烂尾、成本严重超支、长期未能投产达效，造成国有资产损失。","wrong":1.0,"cat":"财务管理"},{"id":"2064317463790358531","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《2024-2025年节能降碳行动方案》要求加大节能监察力度，到2025年底要实现的目标和手段包括以下哪些？","opts":[{"k":"A","t":"完成60%以上重点用能单位节能监察"},{"k":"B","t":"实现重点用能单位节能监察全覆盖"},{"k":"C","t":"加快健全省、市、县三级节能监察体系"},{"k":"D","t":"取消省级节能监察机构，统一由国家管理"}],"ans":"B,C","exp":"《2024-2025年节能降碳行动方案》：“（四）加大节能监察力度。加快健全省、市、县三级节能监察体系，统筹运用综合行政执法、市场监管执法、特种设备监察、信用管理等手段，加强节能法律法规政策标准执行情况监督检查。到2024年底，各地区完成60%以上重点用能单位节能监察；到2025年底，实现重点用能单位节能监察全覆盖。”","wrong":2.0,"cat":"综合实务"},{"id":"2064317463790358530","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某电力企业安全部门在落实《2025年电力安全监管重点任务》中“加强电力安全风险隐患常态化整治”要求时，拟采取以下措施。其中符合文件规定的有（ ）。","opts":[{"k":"A","t":"推动建立“吹哨人”企业事故隐患内部报告奖励机制"},{"k":"B","t":"深入推进电力安全风险管控“季会周报”工作"},{"k":"C","t":"强化重大电力安全隐患整改挂牌督办"},{"k":"D","t":"持续开展反“三违”行动"}],"ans":"B,C,D","exp":"《2025年电力安全监管重点任务》落实电力安全监管各项工作措施”第19点：“深入推进电力安全风险管控‘季会周报’工作，强化重大电力安全隐患整改挂牌督办,确保重点风险隐患排查整治清单化、动态化、精准化。持续开展反‘三违’行动。”A项属于第20点“加强电力安全监管执法”中的内容。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463786164251","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业气候相关信息披露的核心目标是向哪些主体提供重要气候相关信息以支持决策（）","opts":[{"k":"A","t":"投资者、债权人"},{"k":"B","t":"政府及其有关部门"},{"k":"C","t":"其他利益相关方"},{"k":"D","t":"行业协会"}],"ans":"A,B,C","exp":"《企业可持续披露准则第1号——气候（试行）》：企业气候相关信息披露的目标，是向投资者、债权人、政府及其有关部门和其他利益相关方提供重要的气候相关信息，以便其作出经济决策、资源配置或者其他决策。","wrong":2.0,"cat":"经济法与财经法规"},{"id":"2064317463786164249","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《招标人主体责任履行指引》，开标时，招标人可以安排哪些主体检查投标文件的密封或者保密情况？","opts":[{"k":"A","t":"投标人"},{"k":"B","t":"投标人推选的代表"},{"k":"C","t":"招标人委托的公证机构"},{"k":"D","t":"评标委员会"}],"ans":"A,B,C","exp":"开标时，招标人要安排投标人或者其推选的代表检查投标文件的密封或者保密情况，也可以由招标人委托的公证机构检查并公证；经确认无误后，由工作人员拆封或者解密，公布投标人名称、投标价格和投标文件的其他主要内容。——《招标人主体责任履行指引》","wrong":2.0,"cat":"企业文化与战略管理"},{"id":"2064317463786164247","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《第十四届全国人民代表大会第四次会议关于政府工作报告的决议》，下列属于决议中关于\"统筹\"表述的有（ ）。","opts":[{"k":"A","t":"统筹国内国际两个大局"},{"k":"B","t":"更好统筹发展和安全"},{"k":"C","t":"更好统筹国内国际两个大局"},{"k":"D","t":"统筹发展和安全"}],"ans":"A,B","exp":"根据《第十四届全国人民代表大会第四次会议关于政府工作报告的决议》原文：\"统筹国内国际两个大局，更好统筹发展和安全\"。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2064317463786164246","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《第十四届全国人民代表大会第四次会议关于政府工作报告的决议》，国务院和地方各级人民政府坚持（ ）工作总基调。","opts":[{"k":"A","t":"稳中求进"},{"k":"B","t":"进中求稳"},{"k":"C","t":"稳中求快"},{"k":"D","t":"又好又快"}],"ans":"A","exp":"根据《第十四届全国人民代表大会第四次会议关于政府工作报告的决议》原文：\"坚持稳中求进工作总基调\"。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463786164243","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"电网企业在绿证管理中的职责包括（）","opts":[{"k":"A","t":"提供绿证核发所需电量信息"},{"k":"B","t":"做好补贴项目绿证收益的补贴扣减"},{"k":"C","t":"负责绿证统一核发"},{"k":"D","t":"核对发电企业申报数据"}],"ans":"A,B,D","exp":"《可再生能源绿色电力证书核发和交易规则》：电网企业、电力交易机构、发电企业或项目业主，以及交易主体委托的代理机构，应按要求及时提供或核对绿证核发所需信息，并对信息的真实性、准确性负责。电网企业还应按相关规定，做好参与电力市场交易补贴项目绿证收益的补贴扣减。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463786164240","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"可用于认定中央企业资产损失金额的依据包括（）","opts":[{"k":"A","t":"司法机关出具的书面文件"},{"k":"B","t":"会计师事务所专项审计报告"},{"k":"C","t":"企业内部证明材料"},{"k":"D","t":"个人主观估算数据"}],"ans":"A,B,C","exp":"根据《中央企业违规经营投资责任追究实施办法》，资产损失金额应当依据有关会计账簿记录，结合下列情形认定：（一）司法机关、行政机关、专业技术鉴定部门等依法出具的与资产损失相关的书面文件；（二）会计师事务所、资产评估机构等中介机构出具的专项审计、评估报告；（三）企业内部的合法合规证明材料。","wrong":1.0,"cat":"审计"},{"id":"2064317463786164239","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某省水利厅直接管理的一座大型水库，经评估认为需要报废。根据《水库降等与报废管理办法》，该水库的报废应当由哪个机关审批？","opts":[{"k":"A","t":"水利部"},{"k":"B","t":"流域管理机构"},{"k":"C","t":"省级人民政府水行政主管部门"},{"k":"D","t":"市级人民政府水行政主管部门"}],"ans":"B","exp":"原文：“地方人民政府水行政主管部门管理的水库中，省级人民政府水行政主管部门管理的，由流域管理机构审批；” 该水库由省级水行政主管部门管理，因此应由流域管理机构审批。注意区分：省级水行政主管部门管理的水库（不论大小）由流域管理机构审批；而“其他大型水库和市级人民政府水行政主管部门管理的”才由省级审批。","wrong":2.0,"cat":"综合实务"},{"id":"2064317463786164238","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《水库大坝安全监测管理办法》，需要封存、报废监测仪器设备的，应报批准的部门是（）","opts":[{"k":"A","t":"水利部"},{"k":"B","t":"大坝主管部门"},{"k":"C","t":"水库管理单位"},{"k":"D","t":"省级水行政主管部门"}],"ans":"B","exp":"《水库大坝安全监测管理办法》，需要封存、报废监测仪器设备的，应报大坝主管部门批准。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2064317463786164237","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《水库大坝安全监测管理办法》，水库大坝安全监测工作的责任主体包括（）","opts":[{"k":"A","t":"水利部"},{"k":"B","t":"大坝主管部门"},{"k":"C","t":"水库管理单位"},{"k":"D","t":"工程监理单位"}],"ans":"A,B,C","exp":"《水库大坝安全监测管理办法》：水利部负责指导全国水库大坝安全监测工作。大坝主管部门负责所管辖的水库大坝安全监测工作的监督指导，组织开展设施建设。水库管理单位负责运行维护及监测信息分析应用。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2064317463786164234","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某数据中心拟参与算力与电力协同项目，根据《加快构建新型电力系统行动方案（2024—2027年）》，需统筹新能源资源、整合源荷储、探索绿电聚合供应，同时回收利用哪类资源满足周边用热需求（）","opts":[{"k":"A","t":"数据中心余热"},{"k":"B","t":"煤电余热"},{"k":"C","t":"核电余热"},{"k":"D","t":"气电余热"}],"ans":"A","exp":"《加快构建新型电力系统行动方案（2024—2027年）》新能源系统友好性能提升行动部分明确，算力与电力协同项目需回收利用数据中心余热，满足周边用热需求。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463786164233","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《国有企业管理人员处分条例》，任免机关、单位按照（ ）对有公职人员政务处分法和本条例规定违法行为的国有企业管理人员依法给予处分，保障国有企业管理人员以及相关人员的合法权益。","opts":[{"k":"A","t":"属地管理原则"},{"k":"B","t":"行业管理权限"},{"k":"C","t":"干部管理权限"},{"k":"D","t":"级别管理权限"}],"ans":"C","exp":"解析：《国有企业管理人员处分条例》规定：“任免机关、单位按照干部管理权限对有公职人员政务处分法和本条例规定违法行为的国有企业管理人员依法给予处分，保障国有企业管理人员以及相关人员的合法权益。”","wrong":1.0,"cat":"综合实务"},{"id":"2064317463786164230","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《企业国有资产交易操作规则》，不属于产权转让项目重新履行审计、资产评估程序的情形有（）","opts":[{"k":"A","t":"首次正式披露公告之日起超过12个月未征集到合格意向受让方"},{"k":"B","t":"转让底价变更超过两次"},{"k":"C","t":"标的企业主营业务发生变化"},{"k":"D","t":"转让方管理层发生重大变动"}],"ans":"B,C,D","exp":"《企业国有资产交易操作规则》规定，产权转让项目首次正式披露公告之日起超过12个月未征集到合格意向受让方的，转让方应当重新履行审计、资产评估等工作程序后，再发布正式披露公告。BCD不当选。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463786164229","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"国家出资企业应当依照法律、行政法规以及企业章程的规定，向出资人提供（ ）、（ ）的财务、会计信息。","opts":[{"k":"A","t":"真实"},{"k":"B","t":"完整"},{"k":"C","t":"及时"},{"k":"D","t":"准确"}],"ans":"A,B","exp":"《中华人民共和国企业国有资产法》规定：“国家出资企业应当依照法律、行政法规和国务院财政部门的规定，建立健全财务、会计制度，设置会计账簿，进行会计核算，依照法律、行政法规以及企业章程的规定向出资人提供真实、完整的财务、会计信息。”","wrong":2.0,"cat":"经济法与财经法规"},{"id":"2064317463786164228","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某省电力现货市场尚未连续运行。2025年8月，某存量风电项目当月上网电量500万千瓦时，纳入机制的电量分解额度为600万千瓦时，机制电价为0.38元/千瓦时，该省交易活跃周期内发电侧中长期交易同类项目加权平均价格为0.35元/千瓦时。根据《关于深化新能源上网电价市场化改革，促进新能源高质量发展的通知》，下列说法正确的有（ ）","opts":[{"k":"A","t":"市场交易均价应按0.35元/千瓦时确定"},{"k":"B","t":"电网企业应按500万千瓦时结算差价"},{"k":"C","t":"差价结算金额为15万元"},{"k":"D","t":"差价结算金额为18万元"}],"ans":"A,B,C","exp":"《关于深化新能源上网电价市场化改革，促进新能源高质量发展的通知》：\"电力现货市场未连续运行地区，市场交易均价原则上按照交易活跃周期的发电侧中长期交易同类项目加权平均价格确定。\" A正确。\"各月实际上网电量低于当月分解电量的，按实际上网电量结算。\" 实际500万 < 分解600万，按500万结算。B正确。差价 = (0.38 - 0.35) × 500万 = 0.03 × 500万 = 15万元。C正确（15万元）。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463786164227","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"中央企业应当针对反垄断、反商业贿赂、生态环保、安全生产、劳动用工、税务管理、数据保护等重点领域，以及合规风险较高的业务，制定合规管理具体制度或者（）。","opts":[{"k":"A","t":"实施细则"},{"k":"B","t":"专项指南"},{"k":"C","t":"操作流程"},{"k":"D","t":"管理办法"}],"ans":"B","exp":"解析：中央企业应当针对反垄断、反商业贿赂、生态环保、安全生产、劳动用工、税务管理、数据保护等重点领域，以及合规风险较高的业务，制定合规管理具体制度或者专项指南。《中央企业合规管理办法》","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2064317463786164226","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《长江流域控制性水工程联合调度管理办法（试行）》，关于控制性水工程联合调度运用计划，下列说法正确的有？","opts":[{"k":"A","t":"实施联合调度，应当制定联合调度运用计划"},{"k":"B","t":"联合调度运用计划由长江水利委员会批准"},{"k":"C","t":"联合调度运用计划是开展联合调度的基本依据"},{"k":"D","t":"联合调度运用计划一经批准，在任何情况下都不得调整"}],"ans":"A,C","exp":"实施控制性水工程联合调度，应当制定联合调度运用计划。联合调度运用计划由长江水利委员会组织长江流域有关省级人民政府水行政主管部门编制，征求相关部门、单位以及控制性水工程运行管理单位意见后，报水利部批准。经批准的联合调度运用计划是开展控制性水工程联合调度的基本依据，长江水利委员会、长江流域有关县级以上地方人民政府水行政主管部门、控制性水工程运行管理单位必须严格执行。——《长江流域控制性水工程联合调度管理办法（试行）》第八条、第十一条","wrong":2.0,"cat":"综合实务"},{"id":"2064317463781969949","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某企业按照《企业可持续披露准则第1号——气候（试行）》披露气候相关信息，可使用报告日合理且有依据信息的情形包括（）","opts":[{"k":"A","t":"识别影响企业前景的气候相关风险、机遇与影响"},{"k":"B","t":"编制气候风险或机遇预期财务影响信息"},{"k":"C","t":"确定气候情景分析方法与输入值"},{"k":"D","t":"自主设定温室气体排放核算因子"}],"ans":"A,B,C","exp":"《企业可持续披露准则第1号——气候（试行）》：企业在披露气候相关信息时，下列情况中，应当使用报告日合理且有依据的信息（该信息无须付出过度成本或者努力即可获得）：（一）识别可合理预期会影响企业发展前景的气候相关风险、机遇，以及识别气候相关影响；（二）编制气候相关风险或者机遇预期财务影响以及气候相关影响的信息；（三）确定用于气候相关情景分析的适当方法、选择气候相关情景分析的输入值，以及就如何进行气候相关情景分析作出分析性选择；（四）选择用于核算范围三温室气体排放的方法、输入值和假设；（五）披露易受气候相关物理风险、转型风险影响的资产或者业务活动的金额和百分比，以及与气候相关机遇有关的资产或者业务活动的金额和百分比。","wrong":1.0,"cat":"财务会计"},{"id":"2064317463781969948","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《建设工程质量管理条例》，下列关于施工单位质量责任的说法，正确的有？","opts":[{"k":"A","t":"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计"},{"k":"B","t":"施工单位在施工过程中发现设计文件和图纸有差错，应当停止施工，等待建设单位指示"},{"k":"C","t":"施工单位不得偷工减料"},{"k":"D","t":"施工单位对施工中出现质量问题的建设工程，应当负责返修"}],"ans":"A,C,D","exp":"施工单位必须按照工程设计图纸和施工技术标准施工，不得擅自修改工程设计，不得偷工减料。施工单位在施工过程中发现设计文件和图纸有差错的，应当及
