致向客户转让商品。该知识产权许可应当作为在某一时段内履行的履约义务确认相关收入，每年确认收入=4000/4=1000（万元），选项C当选，选项ABD不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922246424457233","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不构成全面预算体系内容的是（）。","opts":[{"k":"A","t":"专门决策预算"},{"k":"B","t":"经营预算"},{"k":"C","t":"经济指标预算"},{"k":"D","t":"财务预算"}],"ans":"C","exp":"各种预算是一个有机联系的整体，一般由经营预算、专门决策预算和财务预算组成预算体系，称为全面预算体系。","wrong":1,"cat":"管理会计"},{"id":"2081922246424457231","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为增值税一般纳税人，适用的增值税税率为13%。2×24年，甲公司发生的有关交易或事项如下：（1）甲公司以外购的商品作为奖品，奖励给20名研发人员。该商品的购买价款为50万元，增值税进项税额为6.5万元；（2）甲公司根据利润分享计划，以当年度实现的利润总额为基础，计算应支付给销售人员的利润分享金额为200万元；（3）甲公司实施非累积带薪缺勤制度，每位职工每年可享受5个工作日的带薪休假，未使用的年休假作废。当年，甲公司有100名职工每人未使用带薪年休假为1天；（4）甲公司购买10套全新公寓向高管人员出售，该公寓每套购买价为180万元，向高管人员出售的价格为130万元。售房协议中规定，上述职工在取得住房后必须在公司服务10年，若职工提前离开应退回部分差价。不考虑其他因素，下列各项关于甲公司对上述职工薪酬会计处理的表述中，正确的是（）。","opts":[{"k":"A","t":"甲公司以外购商品奖励给研发人员，应确认职工薪酬的金额为 50 万元"},{"k":"B","t":"甲公司基于利润分享计划计算支付给销售人员的 200 万元款项，应作为利润分配处理"},{"k":"C","t":"甲公司对于 100 名职工当年度未使用的带薪年休假需要确认相应的职工薪酬"},{"k":"D","t":"甲公司向高管人员出售住房公允价值与内部售价的差额应当作为长期待摊费用处理"}],"ans":"D","exp":"企业以外购商品作为职工福利提供给职工的，应当按照商品的公允价值和相关税费计入职工薪酬，因此，应确认的职工薪酬金额为56.5万元，选项A不当选；企业向职工提供的利润分享计划，应当按照职工薪酬准则进行处理，即支付给销售人员的200万元款项应确认应付职工薪酬，并计入当期损益（销售费用），选项B不当选；在非累积带薪缺勤制度下，职工提供服务本身不能增加其享受的福利金额，企业在职工未缺勤时无须计提相关费用和负债，选项C不当选；企业向员工提供含有补贴的商品或服务，若协议中约定职工取得商品或服务后的最低服务年限，且若职工提前离开应退回部分差价，此时企业应将该差额作为长期待摊费用处理，选项D当选。","wrong":1,"cat":"税务"},{"id":"2081922246420262927","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《公司法》的规定，下列各项中，不属于有限责任公司监事会职权的是（）。","opts":[{"k":"A","t":"检查公司财务"},{"k":"B","t":"向董事会会议提出提案"},{"k":"C","t":"提议召开临时股东会会议"},{"k":"D","t":"建议解任违反公司章程的财务负责人"}],"ans":"B","exp":"监事会职权：检查公司财务；对董事、高级管理人员执行公司职务的行为进行监督，对违反法律、行政法规、公司章程或者股东会决议的董事、高级管理人员提出解任的建议；当董事、高级管理人员的行为损害公司的利益时，要求董事、高级管理人员予以纠正；提议召开临时股东会会议，在董事会不履行规定的召集和主持股东会会议职责时召集和主持股东会会议；向股东会会议提出提案；对董事、高级管理人员提起诉讼；公司章程规定的其他职权。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246420262925","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据公司法律制度的相关规定，下列表述错误的是（）。","opts":[{"k":"A","t":"股东请求确认股东会、董事会决议不成立、无效或者撤销决议的案件，应当列公司为被告"},{"k":"B","t":"股东请求公司分配利润案件，应当列公司为被告"},{"k":"C","t":"一审法庭辩论终结前，其他股东基于同一分配方案请求分配利润并申请参加诉讼的，应当列为第三人"},{"k":"D","t":"股东请求确认股东会、董事会决议不成立、无效或者撤销决议的案件，对决议涉及的其他利害关系人，可以依法列为第三人"}],"ans":"C","exp":"一审法庭辩论终结前，其他股东基于同一分配方案请求分配利润并申请参加诉讼的，应当列为共同原告。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246420262922","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"胡某是某股份有限公司的监事，在执行公司职务时违反公司章程的规定，给公司造成了损失。该公司的甲、乙、丙三位股东分别连续180日以上持有公司1.1%、0.7%、0.5%的股份。根据《公司法》规定，该公司股东对胡某提起诉讼的方式正确的是（）。","opts":[{"k":"A","t":"甲股东可以通过监事会提起诉讼"},{"k":"B","t":"乙股东可以通过董事会提起诉讼"},{"k":"C","t":"丙股东可以直接提起诉讼"},{"k":"D","t":"甲、乙、丙三人可以联合书面请求董事会提起诉讼"}],"ans":"D","exp":"选项A错误，监事违反规定，股份有限公司连续180日以上单独或合计持有公司1%以上股份的股东，可以书面请求董事会向人民法院提起诉讼，不能通过监事会向人民法院提起诉讼。选项BC错误，由于乙、丙均不符合连续180日以上单独或合计持有公司1%以上股份的规定。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246416068634","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"募集设立方式设立股份有限公司的，除另有规定外，发起人认购的股份不得少于公司章程规定的公司设立时应发行股份总数的（）。","opts":[{"k":"A","t":"20%"},{"k":"B","t":"25%"},{"k":"C","t":"30%"},{"k":"D","t":"35%"}],"ans":"D","exp":"以募集设立方式设立股份有限公司的，发起人认购的股份不得少于公司章程规定的公司设立时应发行股份总数的35%；但法律、行政法规另有规定的，从其规定。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246416068631","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列属于要约的是（）。","opts":[{"k":"A","t":"某股份公司的招股说明书"},{"k":"B","t":"某公司在电视台上播放的售房广告，但称“价格面议”"},{"k":"C","t":"某工厂在报纸上发出的拍卖公告"},{"k":"D","t":"某已处于运营中的自动售货机，投入一元硬币，则自动送出一杯可乐"}],"ans":"D","exp":"拍卖公告、招标公告、招股说明书、债券募集办法、基金招募说明书、商业广告和宣传、寄送的价目表等为要约邀请。商业广告和宣传的内容符合要约条件的，构成要约。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246416068630","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列有关代位权的说法中，符合法律规定的是（）。","opts":[{"k":"A","t":"债权人应当以债务人的名义行使代位权"},{"k":"B","t":"债权人可以对债务人的所有债权行使代位权"},{"k":"C","t":"代位权行使的费用由债权人承担"},{"k":"D","t":"代位权行使的范围以债权人享有的到期债权为限"}],"ans":"D","exp":"债权人应以自己的名义代位行使债务人的债权，所以选项A错误；专属于债务人自身的权利不能行使代位权，所以选项B错误；\n债权人行使代位权的必要费用，由债务人负担，所以选项C错误。","wrong":1,"cat":"财务会计"},{"id":"2081922246416068629","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"一般保证的债权人在保证期间届满前对债务人提起诉讼或者申请仲裁的，从（）起，开始计算保证合同的诉讼时效。","opts":[{"k":"A","t":"保证人拒绝承担保证责任的权利消灭之日"},{"k":"B","t":"提起诉讼或者仲裁之日"},{"k":"C","t":"保证期间届满时"},{"k":"D","t":"主债权的诉讼时效结束时"}],"ans":"A","exp":"一般保证的债权人在保证期间届满前对债务人提起诉讼或者申请仲裁的，从保证人拒绝承担保证责任的权利消灭之日起，开始计算保证债务的诉讼时效。","wrong":2,"cat":"经济法与财经法规"},{"id":"2081922246407680026","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各事项的会计处理表述中，不正确的是（）。","opts":[{"k":"A","t":"对于附有销售退回条款的销售，企业的销售收入，应当在客户取得相关商品控制权时，按照因向客户转让商品而预期有权收取的对价金额（即不包含预期因销售退回将退还的金额）确认"},{"k":"B","t":"对于附有销售退回条款的销售，企业的销售成本，应当按照所转让商品的账面价值结转"},{"k":"C","t":"对于附有质量保证条款的销售，企业该质量保证如果在向客户保证所销售商品符合既定标准之外提供了一项单独的服务的，则应当作为单项履约义务进行会计处理"},{"k":"D","t":"对于附有客户额外购买选择权的销售，企业该选择权如果向客户提供了一项重大权利，则应当作为单项履约义务进行会计处理"}],"ans":"B","exp":"选项B，企业应按照预期将退回商品转让时的账面价值，扣除收回该商品预计发生的成本（包括退回商品的价值减损）后的余额，确认为一项资产，按照所转让商品转让时的账面价值，扣除上述资产成本的净额结转成本。","wrong":2,"cat":"财务会计"},{"id":"2081922246407680022","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不属于企业金融资产的是（）。","opts":[{"k":"A","t":"银行存款"},{"k":"B","t":"预付账款"},{"k":"C","t":"发放的贷款"},{"k":"D","t":"购入的看涨期权"}],"ans":"B","exp":"选项B，预付账款，因其产生的未来经济利益是商品或服务，不是收取现金或其他金融资产的权利，所以不是金融资产；选项D，企业购入的看涨期权属于衍生金融资产，企业发行的看涨期权属于金融负债。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922246407680014","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于财务报告的说法中，正确的是（）。","opts":[{"k":"A","t":"向投资者提供有关会计信息，帮助投资者作出经济决策"},{"k":"B","t":"反映企业管理层受托责任履行情况"},{"k":"C","t":"财务报告使用者主要包括投资者、债权人、政府及其有关部门等，不包括社会公众"},{"k":"D","t":"我国企业财务报告的目标是向债权人提供与企业财务状况、经营成果和现金流量等有关的会计信息，有助于债权人作出经济决策"}],"ans":"B","exp":"选项A，是向财务报告使用者提供有关会计信息，帮助使用者作出经济决策；选项C，财务报告使用者主要包括投资者、债权人、政府及其有关部门和社会公众等；选项D，我国企业财务报告的目标是向财务报告使用者提供与企业财务状况、经营成果和现金流量等有关的会计信息，反映企业管理层受托责任履行情况，有助于财务报告使用者作出经济决策。","wrong":1,"cat":"财务会计"},{"id":"2081922246407680013","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于非货币性资产交换的确认原则，表述不正确的是（）。","opts":[{"k":"A","t":"对于换入资产，应当在其符合资产定义并满足资产确认条件时予以确认"},{"k":"B","t":"账面价值计量下，换出资产终止确认时应当确认处置损益"},{"k":"C","t":"对于换出资产，应当在其满足资产终止确认条件时终止确认"},{"k":"D","t":"公允价值计量下，通常应当以换出资产的公允价值为基础确定换入资产的成本"}],"ans":"B","exp":"选项B，账面价值计量下，换出资产终止确认时不确认处置损益。","wrong":1,"cat":"财务会计"},{"id":"2081922246407680012","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于固定资产折旧范围的表述中，不正确的是（）。","opts":[{"k":"A","t":"单独计价入账的土地不需要计提折旧"},{"k":"B","t":"季节性停用的固定资产应当计提折旧"},{"k":"C","t":"正在改扩建的固定资产不应计提折旧"},{"k":"D","t":"经营租出的生产设备不应当再计提折旧"}],"ans":"D","exp":"选项A，企业应对所有的固定资产计提折旧；但是，已提足折旧仍继续使用的固定资产和单独计价入账的土地除外。选项D，经营租出的设备，仍属于出租方的资产，应当计提折旧。","wrong":1,"cat":"财务会计"},{"id":"2081922246407680011","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于合营安排的分类的表述中，不正确的是（）。","opts":[{"k":"A","t":"当合营安排未通过单独主体达成时，该合营安排为共同经营"},{"k":"B","t":"当合营安排通过单独主体达成时，该合营安排为合营企业"},{"k":"C","t":"合营安排最常见的形式包括有限责任公司、合伙企业、合作企业等"},{"k":"D","t":"信托基金等也可被视为单独主体"}],"ans":"B","exp":"选项B，当合营安排通过单独主体达成时，该合营安排并不一定是合营企业，在判断该合营安排是共同经营还是合营企业时，通常首先分析单独主体的法律形式，法律形式不足以判断时，将法律形式与合同安排结合进行分析，法律形式和合同安排均不足以判断时，进一步考虑其他事实和情况。比如：通过单独主体达成，但是合营安排的合同条款约定，参与方对该合营安排中的相关资产和负债分别享有权利和承担义务，这时应划分为共同经营。","wrong":2,"cat":"经济法与财经法规"},{"id":"2081922246407680010","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于合营企业参与方会计处理的说法中，正确的是（）。","opts":[{"k":"A","t":"对合营企业具有重大影响的，应当作为长期股权投资核算并采用成本法进行后续计量"},{"k":"B","t":"对合营企业不具有重大影响的，应当按照金融工具确认和计量准则的相关规定处理"},{"k":"C","t":"对合营企业具有重大影响的，应按其享有的份额确认对合营企业的资产、负债及损益"},{"k":"D","t":"对合营企业不具有重大影响的，应按其享有的份额确认对合营企业的资产、负债及损益"}],"ans":"B","exp":"选项A、C，对合营企业具有重大影响的，应当作为长期股权投资核算并采用权益法进行后续计量；选项D，对合营企业不具有重大影响的，应当按照金融工具确认和计量准则的相关规定处理。","wrong":2,"cat":"财务会计"},{"id":"2081922246407680009","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于划分为持有待售的处置组的说法中，不正确的是（）。","opts":[{"k":"A","t":"对于持有待售的处置组确认的资产减值损失金额，如果该处置组包含商誉，应当先抵减商誉的账面价值"},{"k":"B","t":"后续资产负债表日后如果持有待售的处置组公允价值减去出售费用后的净额增加，在划分为持有待售类别后确认的资产减值损失金额内转回以前减记的金额"},{"k":"C","t":"后续资产负债表日后如果持有待售的处置组公允价值减去出售费用后的净额增加，应当首先恢复商誉的减值金额"},{"k":"D","t":"后续资产负债表日后如果持有待售的处置组公允价值减去出售费用后的净额增加，划分为持有待售类别前确认的资产减值损失不得转回"}],"ans":"C","exp":"后续资产负债表日后如果持有待售的处置组公允价值减去出售费用后的净额增加，以前减记的金额应当予以恢复，并在划分为持有待售类别后相关非流动资产确认的资产减值损失金额内转回，转回金额计入当期损益，但已抵减的商誉账面价值和划分为持有待售类别前确认的减值损失不得转回。","wrong":1,"cat":"财务会计"},{"id":"2081922246407680008","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于企业合同中存在重大融资成分时的会计处理表述中，不正确的是（）。","opts":[{"k":"A","t":"企业应按假定客户在取得商品控制权时即以现金支付的应付金额确定交易价格"},{"k":"B","t":"企业确定该重大融资成分的金额时，应使用将合同对价的名义金额折现为商品现销价格的折现率"},{"k":"C","t":"折现率一经确定，不得因后续市场利率或客户信用风险等情况的变化而变更"},{"k":"D","t":"对于企业确定的交易价格与合同承诺的对价金额之间的差额，应当在合同期间内采用直线法摊销"}],"ans":"D","exp":"选项D，企业确定的交易价格是＂现销价格＂，“合同承诺的对价金额”是合同中载明的对价。对于企业确定的交易价格与合同承诺的对价金额之间的差额，计入未确认融资费用，应当在合同期间内采用实际利率法摊销。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922246407680005","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于在组合方式下进行的债务重组的表述中，不正确的是（）。","opts":[{"k":"A","t":"债务人所清偿债务的账面价值与转让资产的账面价值以及权益工具和重组债务的确认金额之和的差额，记入“投资收益”科目"},{"k":"B","t":"对于权益工具，债务人应当在初始确认时按照权益工具的公允价值计量，权益工具的公允价值不能可靠计量的，应当按照所清偿债务的公允价值计量"},{"k":"C","t":"债务重组采用组合方式进行的，债权人一般可以认为全部债权的合同条款作出了实质性修改"},{"k":"D","t":"对于债务人，组合中以资产清偿债务或者将债务转为权益工具方式进行的债务重组，如果债务人清偿该部分债务的现时义务已经解除，应当终止确认该部分债务"}],"ans":"A","exp":"选项A，所清偿债务的账面价值与转让资产的账面价值以及权益工具和重组债务的确认金额之和的差额，记入\"其他收益——债务重组收益\"科目或记入\"投资收益\"（仅涉及金融工具）科目。","wrong":2,"cat":"财务会计"},{"id":"2081922246407680002","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于资产的公允价值减去处置费用后的净额的表述中，不正确的是（）。","opts":[{"k":"A","t":"资产的公允价值减去处置费用后的净额，通常反映的是资产如果被出售或者处置时可以收回的净现金流入"},{"k":"B","t":"资产的公允价值，是指市场参与者在计量日发生的有序交易中，出售一项资产所能收到的价格"},{"k":"C","t":"清算等被迫交易不属于有序交易"},{"k":"D","t":"与资产处置有关的法律费用、相关税费、搬运费以及财务费用和所得税费用，均属于处置费用"}],"ans":"D","exp":"处置费用，是指可以直接归属于资产处置的增量成本，包括与资产处置有关的法律费用、相关税费、搬运费以及为使资产达到可销售状态所发生的直接费用等，但是财务费用和所得税费用等不包括在内。","wrong":1,"cat":"财务会计"},{"id":"2081922246403485721","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于租赁中承租人的会计处理相关表述中，正确的是（）。","opts":[{"k":"A","t":"在租赁期开始日，承租人应当按照成本对使用权资产进行初始计量"},{"k":"B","t":"发生的初始直接费用计入当期损益"},{"k":"C","t":"租赁期开始日或之前支付的租赁付款额计入使用权资产的成本，存在租赁激励的，不应扣除已享有的租赁激励相关金额"},{"k":"D","t":"租赁期间预期将要发生的恢复成本不能计入使用权资产的成本"}],"ans":"A","exp":"选项B，承租人发生的初始直接费用计入使用权资产成本；选项C，存在租赁激励的，承租人计量使用权资产成本时，应扣除已享有的租赁激励相关金额；选项D，承租人为拆卸及移除租赁资产、复原租赁资产所在场地或将租赁资产恢复至租赁条款约定状态预计将发生的成本，应计入使用权资产成本，但在特定期间内将使用权资产用于生产存货而发生的成本除外。","wrong":1,"cat":"财务会计"},{"id":"2081922246403485718","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在非货币性资产交换中，换入资产满足资产确认条件、但换出资产尚未满足终止确认条件，应当（）。","opts":[{"k":"A","t":"确认换入资产，换出资产不进行处理"},{"k":"B","t":"确认换入资产，同时做换出资产终止确认的处理"},{"k":"C","t":"在确认换入资产的同时将交付换出资产的义务确认为一项负债"},{"k":"D","t":"将取得换入资产的权利确认为一项资产同时将交付换出资产的义务确认为一项负债"}],"ans":"C","exp":"换入资产满足资产确认条件，换出资产尚未满足终止确认条件的，在确认换入资产的同时将交付换出资产的义务确认为一项负债。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246403485716","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"债务人以非金融资产清偿债务的方式下，债权人收到资产的入账价值为（）。","opts":[{"k":"A","t":"资产的原账面价值"},{"k":"B","t":"放弃债权的公允价值加上应支付的相关税费"},{"k":"C","t":"放弃债权的账面价值加上应支付的相关税费"},{"k":"D","t":"资产的原账面价值加上应支付的相关税费"}],"ans":"B","exp":"债权人受让金融资产的，应以债权终止日的公允价值为基础确定入账价值；债权人受让非金融资产的，应按照放弃债权的公允价值与相关税费之和确定入账价值。","wrong":1,"cat":"财务会计"},{"id":"2081922246395097109","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司董事会召开公司战略发展讨论会，拟将企业价值最大化作为财务管理目标，下列理由中，难以成立的是（）。","opts":[{"k":"A","t":"有利于规避企业短期行为"},{"k":"B","t":"有利于量化考核和评价"},{"k":"C","t":"有利于持续提升企业获利能力"},{"k":"D","t":"有利于均衡风险与收益的关系"}],"ans":"B","exp":"企业价值最大化目标的优点：（1）考虑了取得收益的时间，并用时间价值的原理进行了计量；（2）考虑了风险与收益的关系；（3）将企业长期、稳定的发展和持续的获利能力放在首位，能克服企业在追求利润上的短期行为；（4）用价值代替价格，避免了过多外界市场因素的干扰，有效地规避了企业的短期行为。局限性：（1）企业价值过于理论化，不易操作；（2）对于非上市公司，只有进行专门的评估才能确定其价值，受评估标准和评估方法的影响，很难做到客观和准确。","wrong":2,"cat":"经济法与财经法规"},{"id":"2081922246395097100","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不属于私募股权投资基金特点的是（）。","opts":[{"k":"A","t":"较长的投资周期"},{"k":"B","t":"较大的投资收益波动性"},{"k":"C","t":"投资决策与管理的专业性要求较高"},{"k":"D","t":"投资后需要进行财务资源注入"}],"ans":"D","exp":"私募股权投资基金的特点包括：（1）具有较长的投资周期；（2）较大的投资收益波动性；（3）对投资决策与管理的专业要求较高，投资后需进行非财务资源的注入。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922246395097099","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，考虑了生产过程中不可避免的损失、故障和偏差，具有客观性、现实性和激励性等特点的是（）。","opts":[{"k":"A","t":"现行标准成本"},{"k":"B","t":"历史平均成本"},{"k":"C","t":"正常标准成本"},{"k":"D","t":"理想标准成本"}],"ans":"C","exp":"正常标准成本，是指在正常情况下企业经过努力可以达到的成本标准，这一标准考虑了生产过程中不可避免的损失、故障和偏差。具有客观性、现实性和激励性等特点。","wrong":1,"cat":"管理会计"},{"id":"2081922246395097098","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，属于分权型财务管理体制优点的是（）。","opts":[{"k":"A","t":"有利于在整个企业内部优化配置资源"},{"k":"B","t":"有利于针对本单位存在的问题及时作出有效决策"},{"k":"C","t":"有利于实行内部调拨价格"},{"k":"D","t":"有利于内部采取避税措施"}],"ans":"B","exp":"分权型财务管理体制优点：由于各所属单位负责人有权对影响经营成果的因素进行控制，加之身在基层，了解情况，有利于针对本单位存在的问题及时做出有效决策，因地制宜地搞好各项业务，也有利于分散经营风险，促进所属单位管理人员及财务人员的成长。所以，正确答案为B。选项ACD是集权型财务管理体制的优点。","wrong":1,"cat":"综合实务"},{"id":"2081922246395097095","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，在销售预算中不涉及的是（）。","opts":[{"k":"A","t":"预计销售量"},{"k":"B","t":"销售单价"},{"k":"C","t":"销售收入"},{"k":"D","t":"期末产成品存货库存量"}],"ans":"D","exp":"销售预算的主要内容是销量、单价和销售收入，期末产成品存货库存量包含在生产预算中。","wrong":2,"cat":"财务会计"},{"id":"2081922246395097094","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中不属于成本管理原则的是（）。","opts":[{"k":"A","t":"及时性原则"},{"k":"B","t":"成本效益原则"},{"k":"C","t":"重要性原则"},{"k":"D","t":"融合性原则"}],"ans":"A","exp":"成本管理的原则包括：融合性原则、适应性原则、成本效益原则、重要性原则。其中不包括\"及时性原则\"，选项A是一个纯干扰选项。","wrong":2,"cat":"管理会计"},{"id":"2081922246395097093","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列公式中不正确的是（）。","opts":[{"k":"A","t":"经营净收益＝净利润－非经营净收益"},{"k":"B","t":"经营所得现金＝经营净收益＋非付现费用"},{"k":"C","t":"净收益营运指数＝经营净收益÷净利润"},{"k":"D","t":"营业现金比率＝经营活动现金流量净额÷经营所得现金"}],"ans":"D","exp":"营业现金比率＝经营活动现金流量净额÷营业收入","wrong":2,"cat":"财务会计"},{"id":"2081922246395097092","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于财务管理体制的说法中，不正确的是（）。","opts":[{"k":"A","t":"集权型财务管理体制下，企业内部可充分展现其一体化管理的优势"},{"k":"B","t":"采用集权型财务管理体制，有利于实行内部调拨价格"},{"k":"C","t":"采用分权型财务管理体制，有利于分散系统风险"},{"k":"D","t":"集权与分权相结合型财务管理体制，吸收了集权型和分权型财务管理体制各自的优点，避免了二者各自的缺点"}],"ans":"C","exp":"采用分权型财务管理体制的优点之一是“有利于分散经营风险”，系统风险不能被分散。","wrong":2,"cat":"综合实务"},{"id":"2081922246395097090","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于股利政策的说法中，不正确的是（）。","opts":[{"k":"A","t":"剩余股利政策的理论依据是股利无关论"},{"k":"B","t":"剩余股利政策有助于实现企业价值最大化"},{"k":"C","t":"固定或稳定增长的股利政策很难被长期采用"},{"k":"D","t":"从企业的支付能力的角度看，固定股利支付率政策是一种不稳定的股利政策"}],"ans":"D","exp":"剩余股利政策下，在净利润确定的情况下，决定股利数额大小的唯一因素是需要增加的权益资本数额，所以，没有考虑股利对股价的影响，即剩余股利政策的理论依据是股利无关论。剩余股利政策下，按照目标资本结构筹资，因此，有助于保持最佳的资本结构，实现企业价值的长期最大化。固定或稳定增长股利政策下，不论公司盈利多少，均要支付固定的或按固定比率增长的股利，股利的支付与企业的盈利相脱节，可能会导致企业资金紧缺，财务状况恶化。此外，在企业无利可分的情况下，若依然实施固定或稳定增长的股利政策，也是违反《公司法》的行为。因此，固定或稳定增长的股利政策很难被长期采用。采用固定股利支付率政策，公司每年按固定的比例从税后利润中支付现金股利，因此，从企业的支付能力的角度看，这是一种稳定的股利政策。","wrong":1,"cat":"财务管理"},{"id":"2081922246390902796","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于集团企业现金统收统支模式的说法中错误的是（）。","opts":[{"k":"A","t":"企业的一切现金收入都集中在集团总部的财务部门"},{"k":"B","t":"现金收支的批准权高度集中"},{"k":"C","t":"有利于企业集团的全面收支平衡"},{"k":"D","t":"有利于调动成员企业开源节流的积极性"}],"ans":"D","exp":"统收统支模式下，企业的一切现金收入都集中在集团总部的财务部门，各分支机构或子企业不单独设立账号，一切现金支出都通过集团总部财务部门付出，现金收支的批准权高度集中，有利于企业集团实现全面收支平衡，但是该模式不利于调动成员企业开源节流的积极性。","wrong":1,"cat":"财务会计"},{"id":"2081922246344765444","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"公司董事、监事、高级管理人员存在禁止任职情形之一的，公司应当依法及时解除其职务，自知道或者应当知道之日起原则上不得超过（），并应当自解除其职务之日起（）内依法向登记机关办理备案。","opts":[{"k":"A","t":"15日、15日"},{"k":"B","t":"15日、30日"},{"k":"C","t":"30日、15日"},{"k":"D","t":"30日、30日"}],"ans":"D","exp":"公司董事、监事、高级管理人员存在禁止任职情形之一的，公司应当依法及时解除其职务，自知道或者应当知道之日起原则上不得超过三十日，并应当自解除其职务之日起三十日内依法向登记机关办理备案。","wrong":2,"cat":"综合实务"},{"id":"2081922246344765441","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于纳税人专项附加扣除享受扣除时间及办理时间的表述中，符合税法规定的是（）。","opts":[{"k":"A","t":"仅取得劳务报酬所得的，应当在办理汇算清缴申报时扣除"},{"k":"B","t":"享受大病医疗专项附加扣除的，可以选择在预扣预缴时扣除"},{"k":"C","t":"学历教育期间不包含因病或其他非主观原因休学但学籍继续保留的休学期间"},{"k":"D","t":"3岁以下婴幼儿照护专项附加扣除，只能在办理汇算清缴申报时扣除"}],"ans":"A","exp":"（1）选项B：享受大病医疗专项附加扣除的，只能在办理汇算清缴申报时扣除。（2）选项C：学历教育和学历（学位）继续教育的期间，包含因病或其他非主观原因休学但学籍继续保留的休学期间，以及施教机构按规定组织实施的寒暑假等假期。（3）选项D：3岁以下婴幼儿照护专项附加扣除可以选择在工资薪金所得预扣预缴税款时办理扣除，也可以在办理汇算清缴申报时扣除。","wrong":1,"cat":"税务"},{"id":"2081922246327988226","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在作业成本法下，划分增值作业与非增值作业的主要依据是（）。","opts":[{"k":"A","t":"是否有助于提高产品质量"},{"k":"B","t":"是否有助于增加产品功能"},{"k":"C","t":"是否有助于提升企业技能"},{"k":"D","t":"是否有助于增加顾客价值"}],"ans":"D","exp":"按照对顾客价值的贡献，作业可以分为增值作业和非增值作业。","wrong":2,"cat":"管理会计"},{"id":"2081922246281850884","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"长城公司2×18年10月份与大海公司签订一项供销合同，由于长城公司未按合同发货，致使大海公司发生重大经济损失。长城公司被大海公司提起诉讼，至2×18年12月31日法院尚未判决。长城公司2×18年12月31日在资产负债表中的“预计负债”项目反映了100万元的赔偿款。2×19年3月5日经法院判决，长城公司需偿付大海公司经济损失120万元。长城公司不再上诉，假定赔偿款已经支付。长城公司2×18年度财务会计报告批准报出日为2×19年4月28日，下列报告年度资产负债表中有关项目调整处理方法中正确是（）。","opts":[{"k":"A","t":"“预计负债”项目调增20万元；“其他应付款”项目0万元"},{"k":"B","t":"“预计负债”项目调减100万元；“其他应付款”项目调增120万元"},{"k":"C","t":"“预计负债”项目调增20万元；“其他应付款”项目调增120万元"},{"k":"D","t":"“预计负债”项目调减120万元；“其他应付款”项目调增20万元"}],"ans":"B","exp":"日后期间法院判决的赔偿为120万元，且长城公司不再上诉，所以要将长城公司在报告年度末确认的100万元的预计负债冲销，同时调整增加120万元的其他应付款。\n资产负债表日分录：\n借：营业外支出 100\n  贷：预计负债 100\n日后调整相关分录：\n借：预计负债  100\n       以前年度损益调整——营业外支出20\n   贷：其他应付款  120\n借：其他应付款  120\n   贷：银行存款120（此分录作为2×19年的会计事项处理）","wrong":1,"cat":"财务会计"},{"id":"2081922246235713547","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司实行累积带薪休假制度，当年未享受的休假只可结转至下一年度。2×23年末，甲公司因当年度管理人员未享受带薪休假权利而预计了将于2×24年支付的职工薪酬20万元。2×24年末，该累积带薪休假尚有40%未使用。不考虑其他因素，下列各项关于甲公司对尚未使用的40%带薪休假权利于2×24年会计处理的表述中，正确的是（）。","opts":[{"k":"A","t":"不作账务处理"},{"k":"B","t":"从应付职工薪酬转出计入资本公积"},{"k":"C","t":"冲减当期管理费用"},{"k":"D","t":"作为会计差错追溯重述上年财务报表相关项目的金额"}],"ans":"C","exp":"本题考查累积带薪缺勤的会计处理。甲公司规定未使用的年休假只能结转下一年度，属于累积带薪缺勤。对于职工未享受的带薪休假权利，甲公司应冲减上年度已确认的损益（管理费用）8万元，选项C当选，选项AB不当选；企业于2×23年末对当年度管理人员享受带薪休假权利所进行的预计属于会计估计，而非会计差错，无须追溯重述上年财务报表相关项目，选项D不当选。应编制的会计分录为：借：应付职工薪酬    80000       贷：管理费用    80000","wrong":1,"cat":"财务会计"},{"id":"2081922246235713546","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司2×24年度财务报告经批准于2×25年4月15日对外报出。2×24年10月1日，甲公司与交易对手方签订股权出售协议，协议约定甲公司出售其全资子公司（乙公司）80%的股权。2×25年3月15日，双方办理完成股权过户登记手续、董事会改选、支付股权转让款等事项。乙公司的经营地区在华南，是甲公司一个单独的主要经营地区。处置乙公司股权后，甲公司将退出华南地区。下列各项关于甲公司2×24年度财务报表处理的表述中，正确的是（）。","opts":[{"k":"A","t":"比较合并财务报表中，将乙公司 2×23 年度的经营损益列报为终止经营损益"},{"k":"B","t":"合并财务报表中，终止经营损益为乙公司 2×24 年 10 月至 12 月的经营损益"},{"k":"C","t":"个别财务报表中，将持有的乙公司长期股权投资的 80% 重分类为持有待售资产"},{"k":"D","t":"合并财务报表中，不再将乙公司纳入 2×24 年度报表合并范围"}],"ans":"A","exp":"本题考查持有待售的长期股权投资和终止经营的会计处理。终止经营，是指企业满足下列条件之一的、能够单独区分的组成部分，且该组成部分已经处置或划分为持有待售类别：（1）该组成部分代表一项独立的主要业务或一个单独的主要经营地区；（2）该组成部分是拟对一项独立的主要业务或一个单独的主要经营地区进行处置的一项相关联计划的一部分；（3）该组成部分是专为转售而取得的子公司。甲公司拟出售乙公司的80%股权，符合终止经营的确认条件（1）当期列报终止经营，企业应当在当期财务报表中，将原来作为持续经营损益列报的信息重新作为可比会计期间的终止经营损益列报，选项A当选；企业出售对子公司的投资而丧失对子公司控制权，且该子公司符合终止经营定义的，应当在合并利润表中列报相关终止经营损益，列报的终止经营损益应当包含整个报告期间，而不只是包含认定为终止经营后的报告期间，选项B不当选；企业因出售对子公司的投资而丧失对子公司的控制权，应当在拟出售的对子公司投资满足持有待售类别划分条件时，在母公司个别财务报表中将对子公司投资整体划分为持有待售类别，而不是仅将拟处置的投资划分为持有待售类别，因乙公司是甲公司的全资子公司，因此在个别财务报表中，应将100%（而非80%）股权投资划分为持有待售类别，选项C不当选；企业因出售对子公司的投资而丧失对子公司的控制权，无论对子公司的投资是否划分为持有待售类别，企业始终应当按照《企业会计准则第33号——合并财务报表》的规定确定合并范围，编制合并财务报表，选项D不当选。","wrong":2,"cat":"财务会计"},{"id":"2081922245220691974","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于企业合并的说法不正确的是（）。","opts":[{"k":"A","t":"同一控制下的企业合并，合并方取得被合并方的资产、负债仅限于被合并方账面上原已确认的资产和负债，合并中不产生新的资产和负债"},{"k":"B","t":"同一控制下的企业合并，投资单位应该将取得的长期股权投资以被投资方可辨认净资产的公允价值的份额入账"},{"k":"C","t":"同一控制下的企业合并，对于被合并方在企业合并前实现的留存收益中归属于合并方的部分，需要自合并方的资本公积转入留存收益"},{"k":"D","t":"非同一控制下的控股合并中，可能会产生商誉"}],"ans":"B","exp":"选项B，同一控制下的企业合并，投资单位应该将取得的长期股权投资以应享有被投资方相对于最终控制方而言的所有者权益账面价值的份额入账。\n选项C的分录为：\n借：资本公积\n       贷：盈余公积\n              未分配利润\n在同一控制下企业合并的情况下，由于母子公司是一体化存续下来的，因此需要恢复被抵销的留存收益。","wrong":2,"cat":"财务会计"},{"id":"2081922245124222987","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列企业发生的广告费和业务宣传费支出，以不超过当年销售（营业）收入30%作为税前扣除限额的是（）。","opts":[{"k":"A","t":"啤酒制造企业"},{"k":"B","t":"卷烟生产企业"},{"k":"C","t":"化妆品制造企业"},{"k":"D","t":"医药零售企业"}],"ans":"C","exp":"（1）选项ACD：对化妆品制造或销售、医药制造和饮料制造（不含酒类制造）企业发生的广告费和业务宣传费支出，不超过当年销售（营业）收入30%的部分，准予扣除；超过部分，准予在以后纳税年度结转扣除。（2）选项B：烟草企业的烟草广告费和业务宣传费支出，一律不得在计算应纳税所得额时扣除。","wrong":1,"cat":"财务会计"},{"id":"2081922245124222984","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列行为中，需要计算缴纳增值税的是（）。","opts":[{"k":"A","t":"取得贷款利息"},{"k":"B","t":"收取行政事业性收费"},{"k":"C","t":"员工为受雇单位提供取得工资的服务"},{"k":"D","t":"依照法律规定被征收而取得补偿"}],"ans":"A","exp":"有下列情形之一的，不属于应税交易，不征收增值税：（1）员工为受雇单位或者雇主提供取得工资、薪金的服务。（2）收取行政事业性收费、政府性基金。（3）依照法律规定被征收、征用而取得补偿。（4）取得存款利息收入。","wrong":1,"cat":"税务"},{"id":"2081922245124222983","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列行为中，应当缴纳契税的是（ ）。","opts":[{"k":"A","t":"城镇职工已购公有住房经补缴土地出让价款成为完全产权住房"},{"k":"B","t":"经济适用住房经营管理单位回购经济适用住房继续作为经济适用住房房源"},{"k":"C","t":"企业承受荒山土地使用权，并用于林业生产"},{"k":"D","t":"企业接受另一家企业的自有房产投资"}],"ans":"D","exp":"本题考查契税的征税范围及税收优惠的判定。选项D当选，企业接受另一家企业以自有房产进行投资，发生权属变更，应当由取得房产的企业缴纳契税。选项A不当选，城镇职工按规定第一次购买公有住房的，免征契税。已购公有住房经补缴土地出让价款成为完全产权住房的，免征契税。选项B不当选，经济适用住房经营管理单位回购经济适用住房继续作为经济适用住房房源，免征契税。选项C不当选，纳税人承受荒山、荒地、荒滩土地使用权，并用于农、林、牧、渔业生产的，免征契税。","wrong":1,"cat":"税务"},{"id":"2081922245124222980","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列支出在计算企业所得税应纳税所得额时，准予按规定扣除的是（）。","opts":[{"k":"A","t":"企业之间发生的管理费支出"},{"k":"B","t":"企业筹建期间发生的广告费支出"},{"k":"C","t":"企业内营业机构之间发生的特许权使用费支出"},{"k":"D","t":"企业内营业机构之间发生的租金支出"}],"ans":"B","exp":"选项B当选，企业在筹建期间，发生的广告费和业务宣传费，可按实际发生额计入企业筹办费，并按规定在税前扣除；在筹建期间，企业发生的与筹办活动有关的业务招待费支出，可按实际发生额的60%计入企业筹办费，并按有关规定在税前扣除。选项ACD不当选，企业之间支付的管理费、企业内营业机构之间支付的租金和特许权使用费，以及非银行企业内营业机构之间支付的利息，在计算应纳税所得额时不得扣除。","wrong":1,"cat":"税务"},{"id":"2081922245120028698","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"依据企业所得税法相关规定，下列各项中可以计提折旧的生物资产是（）。","opts":[{"k":"A","t":"水源涵养林"},{"k":"B","t":"薪炭林"},{"k":"C","t":"用材林"},{"k":"D","t":"生长中的农田作物"}],"ans":"B","exp":"生物资产分为消耗性生物资产（选项CD）、生产性生物资产（选项B）和公益性生物资产（选项A），其中生产性生物资产可以计提折旧并在税前扣除。","wrong":1,"cat":"税务"},{"id":"2081922245120028696","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下项目中，按照“交通运输服务”缴纳增值税的是（）。","opts":[{"k":"A","t":"停车场管理公司提供车辆停放服务"},{"k":"B","t":"高速公路管理公司收取的过路费"},{"k":"C","t":"纳税人已售票但客户逾期未消费取得的运输逾期票证收入"},{"k":"D","t":"航空运输的干租业务"}],"ans":"C","exp":"选项AB：车辆停放服务、道路通行服务（包括过路费、过桥费、过闸费等）等按照“不动产经营租赁服务”缴纳增值税。选项D：按照“有形动产租赁服务”缴纳增值税。","wrong":1,"cat":"税务"},{"id":"2081922245120028694","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在确定融资租赁业务的销售额时，下列项目的金额不能从销售额中扣除的是（）。","opts":[{"k":"A","t":"本金"},{"k":"B","t":"借款利息"},{"k":"C","t":"发行债券利息"},{"k":"D","t":"车辆购置税"}],"ans":"A","exp":"本题考查融资租赁业务销售额的确定。选项A当选，融资租赁服务，以含税销售额，扣除支付的借款利息（包含外汇借款和人民币借款利息）、发行债券利息和车辆购置税后的余额为销售额。提示：融资租赁业务属于“租赁服务”，以取得的含税销售额，扣除支付的借款利息（包括外汇借款和人民币借款利息）、发行债券利息和车辆购置税，适用13%或9%的税率；融资性售后回租业务属于“贷款服务”，以含税销售额，扣除支付的借款利息（包括外汇借款和人民币借款利息）、发行债券利息和本金，适用6%的税率。","wrong":1,"cat":"财务管理"},{"id":"2081922245120028692","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"增值税一般纳税人发生的下列应税行为中，可以选择简易计税方法的是（）。","opts":[{"k":"A","t":"提供学历教育服务"},{"k":"B","t":"销售自产的自来水"},{"k":"C","t":"提供广播影视制作服务"},{"k":"D","t":"销售2016年5月1日后取得的不动产"}],"ans":"B","exp":"选项ACD：一般纳税人提供“非学历”教育服务、电影放映服务、销售2016年4月30日前取得的不动产，可以选择简易计税方法。","wrong":1,"cat":"税务"},{"id":"2081922245120028688","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×20年9月10日，甲公司董事会会议决议：（1）拟出售其子公司（乙公司）60%的股权，剩余20%股权仍对乙公司具有重大影响；（2）因甲公司经营战略发生变化，甲公司拟出售其原作为主要经营业务的资产组（包括固定资产和无形资产）。2×20年10月10日，甲公司与丙公司、丁公司分别签订的转让资产协议约定，甲公司应于2×21年5月1日前办理完成转让乙公司60%股权的过户登记手续，以及出售主要经营业务的资产组所涉及资产的所有权转让手续。不考虑其他因素，下列各项关于上述交易或事项在甲公司2×20年度财务报表列报的表述中，正确的是（）。","opts":[{"k":"A","t":"乙公司的资产总额和负债总额在合并资产负债表中分别在“持有待售资产”和“持有待售负债”项目列示"},{"k":"B","t":"拟转让业务所涉及的所有资产在个别资产负债表中应按资产性质在“固定资产”和“无形资产”项目分别列示"},{"k":"C","t":"拟转让业务所涉及的资产组的公允价值高于账面价值的差额在合并利润表的“公允价值变动收益”项目列示"},{"k":"D","t":"在个别资产负债表中将拟出售乙公司60%股权在“持有待售资产”项目列示，剩余20%股权在“长期股权投资”项目列示"}],"ans":"A","exp":"甲公司出售其子公司股权，对子公司丧失控制权，在甲公司个别报表中应将对子公司投资整体划分为持有待售类别，在合并报表中将子公司所有资产和负债划分为持有待售类别，选项A当选，选项D不当选；转让业务所涉及的资产组满足划分为持有待售条件，甲公司应将该资产组中所涉及的固定资产和无形资产在个别报表中列示为“持有待售资产”项目，选项B不当选；拟转让业务所涉及的资产组的公允价值高于账面价值的差额不作会计处理，选项C不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245120028687","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×20年9月30日，甲公司授予员工股票期权，期权的公允价值为每份10元，员工须在甲公司服务至2×23年9月30日，且甲公司盈利目标达标，方可按规定价格行权。2×21年12月31日，期权的公允价值为每份10.5元；同日，甲公司批准通过了对该股权激励计划的修改方案，降低了行权价格，期权的公允价值变为每份11元。对于甲公司实施的上述股权激励计划，下列各项会计处理的表述中，正确的是（）。","opts":[{"k":"A","t":"确定该股权激励计划授予的期权的公允价值时，应考虑甲公司盈利目标达标的可能性"},{"k":"B","t":"股权激励方案修改日，应根据权益工具公允价值的增加额（即每份0.5元），计算增加的股权激励费用"},{"k":"C","t":"该股权激励属于权益结算的股份支付，应以等待期内的每个资产负债表日期权的公允价值重新计算股权激励费用"},{"k":"D","t":"该股权激励属于权益结算的股份支付，应以授予日期权的公允价值计算股权激励费用，不考虑方案修改产生的公允价值变化"}],"ans":"B","exp":"甲公司授予员工股票期权，属于权益结算的股份支付，在等待期内的每个资产负债表日，按照权益工具在授予日的公允价值计算换取职工服务的股份支付金额，选项C不当选；股份支付中权益工具公允价值的确定，应当以市场价格为基础，不考虑甲公司未来盈利是否达标，选项A不当选；后续因可行权条件发生有利修改（降低员工行权价格，期权公允价值上升），企业应确认导致股份支付公允价值总额升高以及其他对职工有利的修改的影响（11元-10.5元），选项B当选，选项D不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245120028685","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×22年2月1日，甲公司正式动工兴建一栋厂房，2×22年5月1日，支付工程进度款1000万元。为解决厂房建设需要的资金，2×22年6月1日，甲公司从乙银行取得专门借款4000万元，期限为2年，2×24年3月31日，厂房建造完成；2×24年4月30日，厂房经验收达到预定可使用状态；2×24年5月31日，甲公司偿还乙银行上述借款；2×24年7月20日，厂房投入使用。不考虑其他因素。下列说法符合企业会计准则的是（）。","opts":[{"k":"A","t":"2×22 年 5 月 1 日，借款费用开始资本化"},{"k":"B","t":"2×22 年 6 月 1 日，借款费用开始资本化"},{"k":"C","t":"2×24 年 3 月 31 日，借款费用停止资本化"},{"k":"D","t":"2×24 年 7 月 20 日，借款费用停止资本化"}],"ans":"B","exp":"本题考查借款费用开始和停止资本化的条件。资产支出已经发生、借款费用已经发生和为使资产达到预定可使用或者可销售状态所必要的购建或者生产活动已经开始，以上三个条件同时满足，借款费用开始资本化。本题中，达到以上三个条件的时点为2×22年6月1日，即2×22年6月1日，借款费用开始资本化，选项B当选，选项A不当选；购建或者生产符合资本化条件的资产达到预定可使用或可销售状态时，借款费用停止资本化，即2×24年4月30日，选项CD不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245120028677","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为房地产开发企业，于2×23年1月10日与某客户签订商品房买卖合同，将其尚未开发完成的某小区的一套商品房预售给该客户，客户于合同签订日一次性全额支付合同价款。合同条款中明确约定预售商品房的房号（唯一）。该商品房应于2×24年12月31日前交付给客户，且商品房在建期间客户不拥有该商品房的法定所有权，不能将在建商品房用于出售或抵押，双方如果单方解除合同，须向对方支付合同价款的30%作为违约金。不考虑其他因素，下列甲公司会计处理正确的是（）。","opts":[{"k":"A","t":"甲公司应将预收款作为预收账款核算"},{"k":"B","t":"甲公司应按收款日与合同约定房产交付日分期确认收入"},{"k":"C","t":"甲公司预售商品房控制权尚未转移，应将收取预售款作为合同负债核算"},{"k":"D","t":"甲公司应将预售款中不含增值税的部分作为合同负债核算，增值税部分作为应交税费核算"}],"ans":"D","exp":"本题考查收入的确认。首先判断商品控制权是否转移给客户，再进行相关会计处理。甲公司商品房尚未完成建设，客户尚未取得商品房控制权，因此，甲公司不能确认收入，选项B不当选；甲公司应将收取的预售款项作为负债核算，其中增值税部分记入“应交税费——待转销项税额”科目，不含增值税部分记入“合同负债”科目，选项D当选，选项AC不当选。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922245120028676","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为了拓展业务，取得客户订单发生的下列各项支出中，属于为取得合同而发生的增量成本的是（）。","opts":[{"k":"A","t":"投标过程中聘请外部律师发生的支出"},{"k":"B","t":"为参与客户招标而准备投标资料发生的支出"},{"k":"C","t":"根据订立合同金额的5%向代理商支付的代理费"},{"k":"D","t":"根据年度订单数量及个人综合表现考评确定的销售人员年度奖金"}],"ans":"C","exp":"合同取得成本，是指企业为取得合同而发生的增量成本。增量成本，是指企业不取得合同就不会发生的成本，例如销售佣金，选项C当选；无论是否取得合同均会发生的投标费、为准备投标资料发生的相关费用等，应当在发生时计入当期损益，除非这些支出明确由客户承担，选项AB不当选；根据年度订单数量及个人综合表现考评确定的销售人员年度奖金不属于为取得合同而发生的增量成本，选项D不当选。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922245120028675","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为啤酒生产企业，为答谢长年经销其产品的代理商，经董事会批准，2×24年为过去3年达到一定销量的代理商每家免费配备一台冰箱。按照甲公司与代理商的约定，冰箱的所有权归甲公司，在预计使用寿命内免费提供给代理商使用。甲公司不会收回，亦不会转作他用。甲公司共向代理商提供冰箱500台，每台价值1万元，冰箱的预计使用寿命为5年，预计净残值为零。甲公司对本公司使用的同类固定资产采用年限平均法计提折旧。不考虑其他因素，下列各项关于甲公司免费提供给代理商使用冰箱会计处理的表述中，正确的是（）。","opts":[{"k":"A","t":"将冰箱的购置成本作为 2×24 年销售费用计入当期利润表"},{"k":"B","t":"因无法控制冰箱的实物及其使用，将冰箱的购置成本确认为无形资产并分 5 年摊销"},{"k":"C","t":"将冰箱的购置成本作为过去 3 年的销售费用，追溯调整以前年度损益"},{"k":"D","t":"作为本公司固定资产，按照年限平均法在预计使用年限内分期计提折旧"}],"ans":"A","exp":"本题考查期间费用的确认。甲公司将冰箱在预计使用寿命内免费提供给代理商使用，且不改变用途，虽然该冰箱所有权归甲公司所有，但实质上属于为过去销售提供的商家奖励，并不能为企业带来未来的经济利益流入，不符合资产确认条件，而是在发生当期计入损益，因与销售相关，应计入销售费用，选项A当选，选项BCD不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245115834391","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于被划分为持有待售类别后计量的表述中，正确的是（）。","opts":[{"k":"A","t":"划分为持有待售类别后的处置组，其中包括其他权益工具投资的，应按账面价值计量"},{"k":"B","t":"划分为持有待售的非流动资产，后续期间公允价值减去出售费用后的净额增加，以前确认的减值准备应当予以恢复"},{"k":"C","t":"划分为持有待售类别后的处置组，其中包括非流动负债需要计提利息的，应按规定继续计提利息"},{"k":"D","t":"划分为持有待售类别后的处置组，如果发生减值，应当计提减值准备，并按处置组中各项资产的账面价值比例进行分配"}],"ans":"C","exp":"本题考查划分持有待售类别后的计量。企业在资产负债表日重新计量持有待售的处置组时，应当首先按照相关会计准则规定计量处置组中的流动资产、适用其他准则计量规定的非流动资产和负债的账面价值，其中，其他权益工具投资根据《企业会计准则第22号——金融工具确认和计量》准则，应按公允价值计量，选项A不当选；非流动负债需要计提利息的，继续计提利息，选项C当选；划分为持有待售的非流动资产，后续期间公允价值减去出售费用后的净额增加，以前减记的金额应当予以恢复，并在划分为持有待售类别后确认的资产减值损失金额内转回（划分为持有待售类别前确认的资产减值损失不得转回），选项B不当选；划分为持有待售类别后的处置组，如果发生减值，应当计提减值准备，首先抵减商誉的账面价值，再根据处置组中的各项非流动资产（非金融资产）账面价值所占比重，按比例抵减其账面价值，选项D不当选。","wrong":2,"cat":"财务会计"},{"id":"2081922245115834389","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于或有事项会计处理具体应用的表述中，正确的是（）。","opts":[{"k":"A","t":"与未决诉讼相关的支出应于实际支付赔偿款时确认"},{"k":"B","t":"待执行合同属于或有事项"},{"k":"C","t":"与保证类产品质量保证相关的负债，在符合确认条件时，于销售成立时确认"},{"k":"D","t":"企业承担重组义务时，即应确认相关预计负债"}],"ans":"C","exp":"本题考查或有事项会计处理的具体应用。未决诉讼的相关支出应在企业很可能承担赔偿义务且其金额能够可靠计量时确认，选项A不当选；待执行合同不属于或有事项，但是待执行合同变为亏损合同的，应当作为或有事项，选项B不当选；与保证类产品质量保证相关的负债，在符合确认条件时，于销售成立时确认，选项C当选；企业承担重组义务，且相关义务同时满足预计负债的三个确认条件，企业才能将重组义务确认为预计负债，选项D不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245115834386","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于设定受益计划会计处理的表述中，正确的是（）。","opts":[{"k":"A","t":"与设定受益计划相关的当期服务成本应计入当期损益"},{"k":"B","t":"与设定受益计划负债相关的利息费用应计入其他综合收益"},{"k":"C","t":"与设定受益计划相关的过去服务成本应计入期初留存收益"},{"k":"D","t":"因重新计量设定受益计划净负债产生的精算损失应计入当期损益"}],"ans":"A","exp":"本题考查设定受益计划的会计处理。报告期末，企业应当在损益中确认的设定受益计划产生的职工薪酬成本包括服务成本和设定受益计划净负债或净资产的利息净额。其中，服务成本包括当期服务成本、过去服务成本和结算利得或损失，选项A当选，选项BC不当选；因重新计量设定受益计划净负债产生的精算损失应计入其他综合收益，选项D不当选。","wrong":2,"cat":"财务会计"},{"id":"2081922245115834384","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项所有者权益相关项目中，以后期间能够转入当期净利润的是（）。","opts":[{"k":"A","t":"股本溢价"},{"k":"B","t":"现金流量套期工具产生的利得或损失中属于有效套期的部分"},{"k":"C","t":"直接指定的非交易性权益工具投资公允价值变动额"},{"k":"D","t":"重新计量设定受益计划变动额"}],"ans":"B","exp":"本题考查所有者权益项目的重分类。股本溢价系企业收到投资者出资超过其在股本中份额的部分，股本溢价未来可以转增资本，但不能转入损益，选项A不当选；现金流量套期工具产生的利得或损失中，属于有效套期的部分计入其他综合收益，套期终止时将其转入当期损益，选项B当选；直接指定的非交易性权益工具投资公允价值变动额计入其他综合收益，该项金融工具终止确认时，持有期间累计确认的其他综合收益转入留存收益，选项C不当选；重新计量设定受益计划变动额计入其他综合收益，以后期间不得转入损益，选项D不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245115834383","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不应分类为“以公允价值计量且其变动计入当期损益的金融资产”的是（）。","opts":[{"k":"A","t":"属于权益工具投资，但企业未将其指定为“以公允价值计量且其变动计入其他综合收益的金融资产”的金融资产"},{"k":"B","t":"属于债务工具投资，但无法通过“合同现金流量测试”的金融资产"},{"k":"C","t":"属于债务工具投资，可以通过“合同现金流量测试”的金融资产，但企业运用公允价值选择权将其特殊指定"},{"k":"D","t":"对被投资单位具有重大影响的股权投资"}],"ans":"D","exp":"本题考查分类为以公允价值计量且其变动计入当期损益的金融资产的范围。权益工具投资无法通过合同现金流量测试，如未行使指定权利的，应将其分类为“以公允价值计量且其变动计入当期损益的金融资产”，选项A不当选；债务工具投资无法通过合同现金流量测试的，应将其分类为“以公允价值计量且其变动计入当期损益的金融资产”，选项B不当选；债务工具投资通过合同现金流量测试后，企业运用公允价值计量选择权减少会计错配的，应将其分类为“以公允价值计量且其变动计入当期损益的金融资产”，选项C不当选；对被投资单位具有重大影响的权益性投资，应作为长期股权投资核算，选项D当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245115834382","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，可以无须在每年年末进行减值测试的是（）。","opts":[{"k":"A","t":"超期使用的固定资产"},{"k":"B","t":"使用寿命不确定的无形资产"},{"k":"C","t":"非同一控制下控股合并产生的商誉"},{"k":"D","t":"尚未达到预定用途的无形资产"}],"ans":"A","exp":"本题考查至少于每年年末进行减值测试的资产的范围。无论是否有确凿证据表明资产存在减值迹象，均应至少于每年年末进行减值测试的资产包括：（1）使用寿命不确定的无形资产，选项B不当选；（2）非同一控制下企业合并产生的商誉，选项C不当选；（3）尚未达到预定可使用状态的无形资产，选项D不当选；超期使用的固定资产账面价值为预计净残值或零，无须每年年末进行减值测试，选项A当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245115834378","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"因技术进步、市场需求变化等原因，甲公司生产的某类卷烟销量锐减，经甲公司管理层决议，2×24年11月10日暂停生产该类卷烟。生产该类卷烟的生产线也暂停使用，拟对外出售。不考虑其他因素，2×24年度甲公司对该生产线会计处理正确的是（）。","opts":[{"k":"A","t":"将该生产线划分为持有待售类别"},{"k":"B","t":"暂停使用该生产线时停止计提折旧"},{"k":"C","t":"对该生产线进行减值测试，如发生减值应计提减值准备"},{"k":"D","t":"该生产线在资产负债表年末数中按公允价值列报"}],"ans":"C","exp":"本题考查划分为持有待售类别的条件。甲公司管理层已做出拟出售生产线的决议，但尚未获得确定的购买承诺，因此不满足划分为持有待售类别的条件，不应将该生产线划分为持有待售类别，选项A不当选；闲置固定资产照提折旧，并且计入管理费用，选项B不当选；该生产线生产的产品销量锐减，存在减值迹象，甲公司应进行减值测试，若固定资产发生减值的应当计提减值准备，选项C当选；固定资产期末应以账面价值列报，选项D不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922245107445785","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲为红光有限责任公司的债权人，现红光有限责任公司股东会作出公司合并决议，并依法向债权人发出了通知、进行了公告。根据公司法律制度的规定，甲在法定期间内有权要求红光有限责任公司清偿债务或者提供相应的担保。该法定期间为（）。","opts":[{"k":"A","t":"自接到通知书之日起15日内，未接到通知书的自公告之日起30日内"},{"k":"B","t":"自接到通知书之日起30日内，未接到通知书的自公告之日起45日内"},{"k":"C","t":"自接到通知书之日起30日内，未接到通知书的自公告之日起90日内"},{"k":"D","t":"自接到通知书之日起90日内，未接到通知书的自公告之日起90日内"}],"ans":"B","exp":"根据公司法律制度的规定，公司应当自作出合并决议之日起10日内通知债权人，并于30日内在报纸上或者国家企业信用信息公示系统公告。债权人自接到通知书之日起30日内，未接到通知书的自公告之日起45日内，可以要求公司清偿债务或者提供相应的担保。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922245107445772","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列主体中，有权提议召开有限责任公司临时股东会的是（）。","opts":[{"k":"A","t":"代表1/10以上表决权的股东"},{"k":"B","t":"董事长"},{"k":"C","t":"监事会主席"},{"k":"D","t":"1/3以上的监事"}],"ans":"A","exp":"下列主体提议召开有限责任公司股东会临时会议的，应当召开：（1）代表1/10以上表决权的股东；（2）1/3以上的董事；（3）监事会。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922245107445768","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"周某向吴某借用一头耕牛，约定借期3个月。1周后，周某因彩票中奖获得了大额资金，自己买了一头耕牛，遂向吴某提出提前还牛。根据合同法律制度的规定，有关本案的下列说法中，不正确的是（）。","opts":[{"k":"A","t":"如果提前还牛不损害吴某的利益，吴某应当接受周某的提前归还"},{"k":"B","t":"如果提前还牛损害吴某的利益，吴某有权拒绝周某的提前归还"},{"k":"C","t":"如果提前还牛给吴某增加了费用，吴某有权请求周某支付"},{"k":"D","t":"本来就是借用，不论什么时候归还，吴某均应无条件接受"}],"ans":"D","exp":"债权人可以拒绝债务人提前履行债务，但提前履行不损害债权人利益的除外；债务人提前履行给债权人增加的费用，由债务人负担。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922245090668560","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"本量利分析的基本假设不包括（）。","opts":[{"k":"A","t":"总成本由变动成本和固定成本两部分组成"},{"k":"B","t":"销售收入与业务量呈正相关关系"},{"k":"C","t":"产销平衡"},{"k":"D","t":"产品产销结构稳定"}],"ans":"B","exp":"本量利分析的基本假设包括：总成本由变动成本和固定成本两部分组成、销售收入与业务量呈完全线性关系、产销平衡、产品产销结构稳定。所以B选项不正确。 说明：两个变量之间存在一次方函数关系，就称它们之间存在线性关系。更通俗一点讲，如果把这两个变量分别作为点的横坐标与纵坐标，其图像是平面上的一条直线（用方程表示为：y=a+bx），则这两个变量之间的关系就是线性关系。正相关是指自变量增长，因变量也跟着增长。两个变量变动方向相同，一个变量由大到小或由小到大变化时，另一个变量亦由大到小或由小到大变化。但二者之间变化的数值并不一定成比例。正比例是指两种相关联的量，一种量变化，另一种量也随着变化。如果这两种量中相对应的两个数比值一定，这两种量就叫做成正比例的量，它们的关系叫做正比例关系（用方程表示为：y=bx）。","wrong":1,"cat":"管理会计"},{"id":"2081922245090668558","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"成本管理原则不包括（）。","opts":[{"k":"A","t":"融合性原则"},{"k":"B","t":"适应性原则"},{"k":"C","t":"成本最低原则"},{"k":"D","t":"重要性原则"}],"ans":"C","exp":"企业进行成本管理时，一般应遵循下列原则：融合性原则、适应性原则、成本效益原则（并不是\"成本最低\"）、重要性原则。","wrong":1,"cat":"管理会计"},{"id":"2081922245090668557","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"法律对收益分配超额累积利润限制的主要原因是（）。","opts":[{"k":"A","t":"避免损害少数股东权益"},{"k":"B","t":"避免资本结构失调"},{"k":"C","t":"避免股东避税"},{"k":"D","t":"避免经营者从中牟利"}],"ans":"C","exp":"由于资本利得与股利收入的税率不一致，如果公司为了避税而使得盈余的保留大大超过了公司目前及未来的投资需要时，将被加征额外的税款。","wrong":1,"cat":"财务管理"},{"id":"2081922245090668556","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据我国目前的《企业所得税法》规定，法人股东希望公司（）。","opts":[{"k":"A","t":"多分配股利"},{"k":"B","t":"少分配股利"},{"k":"C","t":"在其持有期限超过1年分配股利"},{"k":"D","t":"在其持有期限超过3年分配股利"}],"ans":"A","exp":"根据我国《企业所得税法》规定，投资企业从居民企业取得的股息等权益性收益所得只要符合相关规定都可享受免税收入待遇，而不论该投资企业是否为居民企业。因此，基于法人股东考虑，公司进行股利分配可以帮助股东减少纳税负担，增加股东收益，为了维持与股东的良好关系，保障股东利益，在企业财务状况允许的情况下，公司应该多进行股利分配。","wrong":1,"cat":"税务"},{"id":"2081922245090668555","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于本量利分析，下列公式中错误的是（）。","opts":[{"k":"A","t":"利润＝销售量×（单价－单位变动成本）－固定成本"},{"k":"B","t":"单位边际贡献＝单价×边际贡献率"},{"k":"C","t":"利润＝销售收入×单位边际贡献－固定成本"},{"k":"D","t":"变动成本率＝单位变动成本/单价"}],"ans":"C","exp":"利润＝边际贡献－固定成本＝销售量×单位边际贡献－固定成本＝销售收入×边际贡献率－固定成本，选项C不正确。","wrong":1,"cat":"管理会计"},{"id":"2081922245090668551","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于利润分配顺序，下列说法中不正确的是（）。","opts":[{"k":"A","t":"企业在提取法定公积金之前，应先用当年利润弥补以前年度亏损"},{"k":"B","t":"根据《公司法》的规定，当年法定公积金的累积额已达注册资本的50%时，可以不再提取"},{"k":"C","t":"税后利润弥补亏损只能使用当年实现的净利润"},{"k":"D","t":"提取法定公积金的主要目的是为了增加企业内部积累，以利于企业扩大再生产"}],"ans":"C","exp":"税后利润弥补亏损可以用当年实现的净利润，也可以用盈余公积。所以，选项C的说法不正确。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922245090668548","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业运用零基预算法编制预算时，首先应进行的工作是（）。","opts":[{"k":"A","t":"制订业务计划"},{"k":"B","t":"明确预算编制标准"},{"k":"C","t":"编制预算草案"},{"k":"D","t":"审定预算方案"}],"ans":"B","exp":"零基预算法的应用程序为：（1）明确预算编制标准；（2）制订业务计划；（3）编制预算草案；（4）审定预算方案。","wrong":1,"cat":"管理会计"},{"id":"2081922245086474244","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列措施中，可以降低现金回归线的是（）。","opts":[{"k":"A","t":"提高以日为基础计算的现金机会成本"},{"k":"B","t":"提高每日现金流量变动的标准差"},{"k":"C","t":"提高证券转换为现金的成本"},{"k":"D","t":"提高最低控制线"}],"ans":"A","exp":"现金回归线R与日现金机会成本呈反向变动，与证券的每次固定转换成本、每日现金流量变动的标准差、最低控制线L呈同向变动。","wrong":1,"cat":"管理会计"},{"id":"2081922245086474242","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项股权激励模式，适合业绩稳定型上市公司的是（）。","opts":[{"k":"A","t":"业绩股票激励模式"},{"k":"B","t":"股票增值权模式"},{"k":"C","t":"限制性股票模式"},{"k":"D","t":"股票期权模式"}],"ans":"A","exp":"股权激励模式适用情况如下：（1）股票期权模式比较适合那些初始资本投入较少、资本增值较快、处于成长初期或扩张期的企业，如互联网、高科技等风险较高的企业。（2）对于处于成熟期的企业，由于其股价的上涨空间有限，因此采用限制性股票模式较为合适。（3）股票增值权模式较适合现金流量比较充裕且比较稳定的上市公司和现金流量比较充裕的非上市公司。（4）业绩股票激励模式只对公司的业绩目标进行考核，不要求股价的上涨，因此比较适合业绩稳定型的上市公司及其集团公司、子公司。","wrong":2,"cat":"金融与投资理财"},{"id":"2081922245078085635","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项内部转移价格中，有可能导致公司高层干预的是（）。","opts":[{"k":"A","t":"市场价格"},{"k":"B","t":"协商价格"},{"k":"C","t":"价格型内部转移价格"},{"k":"D","t":"成本转移价格"}],"ans":"B","exp":"采用协商价格，当双方协商陷入僵持时，会导致公司高层的干预。","wrong":1,"cat":"管理会计"},{"id":"2081922245048725514","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《关于进一步加强财会监督工作的意见》明确，构建财政部门、有关部门、各单位、中介机构、行业协会等监督主体（）工作机制。","opts":[{"k":"A","t":"纵向联动"},{"k":"B","t":"横向协同"},{"k":"C","t":"内外贯通"},{"k":"D","t":"垂直管理"}],"ans":"B","exp":"原文：“构建财政部门、有关部门、各单位、中介机构、行业协会等监督主体横向协同工作机制。”出自《关于进一步加强财会监督工作的意见》“加强财会监督主体横向协同”。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922245040336900","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《传承弘扬三峡精神和优良作风》将三峡工程划分为一期、二期、三期三个阶段，每个阶段均有明确的建设内容与完成标志。下列关于三峡工程三个阶段的表述中，完全符合该文件记载的是（ ）。","opts":[{"k":"A","t":"一期工程修建泄洪坝段、左岸大坝和左岸电站，以1997年大江截流为完成标志"},{"k":"B","t":"二期工程修建导流明渠和临时船闸，以2003年实现水库135米蓄水为完成标志"},{"k":"C","t":"三期工程修建右岸大坝、右岸电站厂房，以左右岸电站机组全部投产发电为完成标志"},{"k":"D","t":"二期工程的时间范围为1998年至2004年，三期工程为2004年至2009年"}],"ans":"C","exp":"《传承弘扬三峡精神和优良作风》中明确记载：（1）一期工程（1993—1997）\"修建导流明渠和临时船闸，永久船闸开挖\"，以\"大江截流\"为标志，选项A将二期建设内容（泄洪坝段、左岸大坝、左岸电站）误置于一期；（2）二期工程（1998—2003）\"修建泄洪坝段、左岸大坝、左岸电站和双线五级船闸\"，选项B将一期建设内容（导流明渠和临时船闸）误置于二期；（3）三期工程（2004—2009）\"修建右岸大坝、右岸电站厂房，以左右岸电站机组全部投产发电为完成标志\"，选项C正确；（4）二期时间范围为1998—2003，选项D二期结束年份错误。","wrong":1,"cat":"综合实务"},{"id":"2081922245027753994","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司因未决诉讼而确认预计负债500万元，根据合同约定，甲公司基本确定可以从第三方获得赔偿550万元。不考虑其他因素，下列说法中正确的是（）。","opts":[{"k":"A","t":"在财务报表中确认其他应收款 50 万元"},{"k":"B","t":"在财务报表中确认或有资产 500 万元"},{"k":"C","t":"在财务报表中确认其他应收款 500 万元"},{"k":"D","t":"在财务报表中确认或有资产 50 万元"}],"ans":"C","exp":"本题考查预计负债获得第三方补偿的会计处理。因或有事项满足预计负债确认条件确认预计负债的，基本确定能够从第三方获得补偿的，应在满足条件时确认为其他应收款，但确认的金额不得超过已确认预计负债的金额。本题中，基本确定能够从第三方取得的赔偿为550万元，但确认的预计负债金额为500万元，所以应确认其他应收款500万元，选项C当选，选项A不当选；或有资产不符合资产定义，不能在财务报表中确认，选项BD不当选。甲公司应编制的会计分录为：（1）确认因未决诉讼产生的预计负债和其他应收款：借：营业外支出     500       贷：预计负债     500借：其他应收款    500        贷：营业外支出   500（2）待判决生效获得550万元赔偿时：借：银行存款    550      贷：其他应收款   500        营业外收入   50","wrong":2,"cat":"财务会计"},{"id":"2081922244990005254","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于合同取得成本和合同履约成本的摊销和减值的会计处理中，不正确的是（）。","opts":[{"k":"A","t":"对于确认为资产的合同履约成本和合同取得成本，企业应当采用与该资产相关的商品收入确认相同的基础进行摊销，计入当期损益"},{"k":"B","t":"合同履约成本和合同取得成本的账面价值，高于企业因转让与该资产相关的商品预期能够取得的剩余对价与为转让该相关商品估计将要发生的成本之间的差额，应当将超出部分计提减值准备"},{"k":"C","t":"合同履约成本和合同取得成本的账面价值，高于为转让该相关商品估计将要发生的成本之间的差额，应当将超出部分计提减值准备"},{"k":"D","t":"合同成本计提减值后，以前期间减值的因素发生变化，使得企业因转让与该资产相关的商品预期能够取得的剩余对价与为转让该相关商品估计将要发生的成本之间的差额高于合同成本的账面价值的，应当转回原已计提的减值准备，但转回后的资产账面价值不应超过假定不计提减值准备情况下该资产在转回日的账面价值"}],"ans":"C","exp":"选项A，合同履约成本和合同取得成本属于资产，在按照履约进度确认收入时，要同时按照履约进度结转合同履约成本和合同取得成本，即借记主营业务成本等，贷记合同履约成本等；\n选项C，合同履约成本和合同取得成本的账面价值，高于企业因转让与该资产相关的商品预期能够取得的剩余对价与为转让该相关商品估计将要发生的成本之间的差额，应当将超出部分计提减值准备。\n【提示】合同履约成本和合同取得成本计提减值准备的会计分录为：\n借：资产减值损失\n    贷：合同履约成本减值准备/合同取得成本减值准备\n转回减值准备的会计分录为：\n借：合同履约成本减值准备/合同取得成本减值准备\n   贷：资产减值损失","wrong":1,"cat":"财务会计"},{"id":"2081922244948062223","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项资产中，不适用资产减值准则进行减值会计处理的是（）。","opts":[{"k":"A","t":"商誉"},{"k":"B","t":"生产性生物资产"},{"k":"C","t":"长期股权投资"},{"k":"D","t":"递延所得税资产"}],"ans":"D","exp":"本题考查资产减值准则核算的范围。在《企业会计准则第8号——资产减值》所规范的资产（含单项资产和资产组）包括：（1）长期股权投资；（2）采用成本模式进行后续计量的投资性房地产；（3）固定资产；（4）生产性生物资产；（5）无形资产；（6）商誉；（7）探明石油天然气矿区权益和井及相关设施；（8）使用权资产。选项ABC不当选；递延所得税资产不在范围内，选项D当选。","wrong":1,"cat":"财务会计"},{"id":"2081922244948062221","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于以现金结算的股份支付的概念，下列说法中正确的是（）。","opts":[{"k":"A","t":"是指企业为获取服务交付的现金的交易"},{"k":"B","t":"是指企业为获取服务交付现金或其他资产义务的交易"},{"k":"C","t":"是指企业为获取服务而以股份或其他权益工具作为对价进行结算的交易"},{"k":"D","t":"是指企业为获取服务承担以股份或其他权益工具为基础计算确定的交付现金或其他资产义务的交易"}],"ans":"D","exp":"以现金结算的股份支付，是指企业为获取服务而承担的以股份或其他权益工具为基础计算的交付现金或其他资产的义务的交易。以现金结算的股份支付最常用的工具有两类:模拟股票和现金股票增值权。AB表述不完整。选项C，属于权益结算的股份支付的概念。","wrong":1,"cat":"综合实务"},{"id":"2081922244948062210","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某股份有限公司共有甲、乙、丙、丁、戊、己、庚七位董事。某次董事会会议，董事甲、乙、丙、丁、戊、己参加，庚因故未能出席，也未书面委托其他董事代为出席。该次会议通过一项违反法律规定的决议，给公司造成严重损失。该次会议的会议记录记载，董事戊在该项决议表决时表明了异议。根据公司法律制度的规定，应对公司负赔偿责任的是（）。","opts":[{"k":"A","t":"董事甲、乙、丙、丁、戊、己、庚"},{"k":"B","t":"董事甲、乙、丙、丁、戊、己"},{"k":"C","t":"董事甲、乙、丙、丁、己、庚"},{"k":"D","t":"董事甲、乙、丙、丁、己"}],"ans":"D","exp":"根据公司法律制度的规定，董事应当对董事会的决议承担责任。董事会的决议违反法律、行政法规或者公司章程、股东会决议，致使公司遭受严重损失的，参与决议的董事对公司负赔偿责任。但经证明在表决时曾表明异议并记载于会议记录的，该董事可以免除责任。故戊与庚不承担责任。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922244927090696","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×22年8月20日，甲公司与乙公司签订转让合同，计划将整套的W产品生产厂房和设备出售给乙公司。该厂区的污水排放系统存在缺陷，对周边环境造成污染，甲公司知晓污染情况，在转让合同中附带条款，承诺将自2×22年9月1日起开展污染清除工作，清除工作预计将持续9个月。双方不存在关联关系。不考虑其他因素，下列关于甲公司2×22年8月20日对该处置组的会计处理表述中，正确的是（）。","opts":[{"k":"A","t":"继续作为固定资产进行核算"},{"k":"B","t":"划分为持有待售类别"},{"k":"C","t":"转为投资性房地产"},{"k":"D","t":"转入固定资产清理"}],"ans":"A","exp":"虽然买卖双方已经签订协议，但在污染得到整治前，该处置组在当前状态下不可立即出售，不符合划分为持有待售类别的条件，应继续作为固定资产等进行核算。","wrong":1,"cat":"财务会计"},{"id":"2081922244910313475","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于资产的公允价值减去处置费用后的净额的估计，下列说法中不正确的是（）。","opts":[{"k":"A","t":"应优先根据公平交易中资产的销售协议价格减去可直接归属于该资产处置费用后的金额来确定"},{"k":"B","t":"不存在销售协议但存在资产活跃市场的，应当按照该资产的市场价格减去处置费用后的金额来估计，资产的市场价格通常应当根据资产的买方出价确定"},{"k":"C","t":"在不存在销售协议和资产活跃市场的情况下，应当以可获取的最佳信息为基础，根据在资产负债表日如果处置资产的话，熟悉情况的交易双方自愿进行公平交易愿意提供的交易价格减去资产处置费用后的金额来估计"},{"k":"D","t":"不存在销售协议和资产活跃市场的，表明无法可靠估计该资产的公允价值减去处置费用后的净额，这种情况下应当以该资产预计未来现金流量的现值作为其可收回金额"}],"ans":"D","exp":"根据《企业会计准则第8号——资产减值》，资产公允价值减去处置费用后的净额应当按照以下顺序估计：（1）存在公平交易销售协议的，应当以销售协议价格减去可直接归属于该资产的处置费用确定，因此A正确。（2）不存在销售协议但存在资产活跃市场的，应当以市场价格减去处置费用确定，市场价格通常按照买方出价确定，因此B正确。（3）既不存在销售协议，也不存在资产活跃市场的，仍应当以可获取的最佳信息为基础进行估计，可以参考同行业类似资产最近的公平交易价格或者交易结果，因此C正确。（4）只有在按照上述方法仍然无法可靠估计公允价值减去处置费用后的净额时，才以资产预计未来现金流量的现值作为其可收回金额。D项错误在于：不存在销售协议和活跃市场，并不当然表明公允价值减去处置费用后的净额无法可靠估计，企业还应先利用可获取的最佳信息进行估计。因此，本题应选择D。","wrong":1,"cat":"财务会计"},{"id":"2081922244876759042","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"李某向张某借款，合同约定：借款本金10万元，借款期限为2023年5月5日至2024年5月5日，年利率为3%。合同未约定逾期利率。合同到期后，李某拒绝向张某还款，张某提出诉讼，要求李某归还本金、借期内利息及逾期利息。根据合同法律制度的规定，有关本案的下列说法中，正确的是（）。","opts":[{"k":"A","t":"因借款合同未约定逾期利率，张某无权主张逾期利息"},{"k":"B","t":"张某主张以2024年5月的1年期贷款市场报价利率计算逾期利息的，人民法院应予支持"},{"k":"C","t":"张某主张以2023年5月的1年期贷款市场报价利率计算逾期利息的，人民法院应予支持"},{"k":"D","t":"张某主张以年利率3%计算逾期利息的，人民法院应予支持"}],"ans":"D","exp":"借贷双方约定了借期内利率（年利率3%）但是未约定逾期利率，出借人主张借款人自逾期还款之日起按照借期内利率支付资金占用期间利息的，人民法院应予支持。","wrong":1,"cat":"经济法与财经法规"},{"id":"2085294560373424131","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列属于我国企业所得税非居民企业的是（ ）。","opts":[{"k":"A","t":"设在广州市的某国有独资企业"},{"k":"B","t":"依照百慕大法律设立但实际管理机构在上海的某公司"},{"k":"C","t":"依照中国法律成立，但主要控股方在外国的某上市公司"},{"k":"D","t":"依照美国法律成立，未在中国境内设立机构、场所，但有来源于中国境内所得的某公司"}],"ans":"D","exp":"居民企业，是指依法在中国境内成立（选项A、C），或者依照外国（地区）法律成立但实际管理机构在中国境内的企业（选项B）。我国非居民企业是指依照外国（地区）法律成立且实际管理机构不在中国境内，但在中国境内设立机构、场所的，或者在中国境内未设立机构、场所，但有来源于中国境内所得的企业。选项D，属于我国的非居民企业，适用企业所得税税率为10%。","wrong":1,"cat":"税务"},{"id":"2085294560369229840","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于白酒最低计税价格核定的表述，错误的是（ ）。","opts":[{"k":"A","t":"白酒生产企业销售给销售单位的白酒，生产企业消费税计税价格低于销售单位对外销售价格（不含增值税）70%以下的，税务机关应核定消费税最低计税价格"},{"k":"B","t":"纳税人将委托加工收回的白酒销售给销售单位，消费税计税价格低于销售单位对外销售价格（不含增值税）70%以下的，也应核定消费税最低计税价格"},{"k":"C","t":"白酒消费税最低计税价格由白酒生产企业自行申报，税务机关核定"},{"k":"D","t":"白酒生产企业销售给销售单位的白酒，生产企业消费税计税价格高于销售单位对外销售价格60%以上的，税务机关暂不核定消费税最低计税价格"}],"ans":"D","exp":"白酒生产企业销售给销售单位的白酒，生产企业消费税计税价格高于销售单位对外销售价格70%（含70%）以上的，税务机关暂不核定消费税最低计税价格。","wrong":1,"cat":"税务"},{"id":"2085294560373424133","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"对于企业所得税中收入金额的确认，下列表述不正确的是（ ）。","opts":[{"k":"A","t":"股权转让中应按扣除被投资企业股东留存收益中按该项股权所可能分配的金额后确认转让所得"},{"k":"B","t":"现金折扣应当按折扣前的金额确定商品销售收入"},{"k":"C","t":"商业折扣应当按照扣除商业折扣后的金额确定销售商品收入金额"},{"k":"D","t":"销售商品采取预收款方式的，在发出商品时确认收入"}],"ans":"A","exp":"企业在计算股权转让所得时，不得扣除被投资企业未分配利润等股东留存收益中按该股权所可能分配的金额。注意股权转让与收回投资所得税处理的差别：投资企业从被投资企业撤回或减少投资，其取得的资产中，相当于初始出资的部分，应确认为投资收回——不属于应税收入；相当于被投资企业累计未分配利润和累计盈余公积按减少实收资本比例计算的部分，应确认为股息所得——符合规定的，免税；其余部分确认为投资资产转让所得——应税。","wrong":1,"cat":"税务"},{"id":"2085294560373424135","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于企业所得税扣除项目说法正确的是（ ）。","opts":[{"k":"A","t":"以融资租赁方式租入固定资产发生的租赁费支出，按照租赁期限均匀扣除"},{"k":"B","t":"保险企业按当年全部保费收入扣除退保金等后余额的10%计算手续费及佣金支出限额"},{"k":"C","t":"企业支付的手续费及佣金应直接冲减服务协议或合同金额"},{"k":"D","t":"企业因存货盘亏、毁损、报废等原因不得从销项税金中抵扣的进项税金，可以税前扣除"}],"ans":"D","exp":"选项A，以融资租赁方式租入固定资产发生的租赁费支出，按照规定构成融资租入固定资产价值的部分应当提取折旧费用，分期扣除，以经营租赁方式租入的固定资产发生的租赁费支出，按照租赁期限均匀扣除；选项B，保险企业按当年全部保费收入扣除退保金等后余额的18%（含本数）计算手续费及佣金支出限额；选项C，企业支付的手续费及佣金不得直接冲减服务协议或合同金额，并如实入账。","wrong":1,"cat":"财务会计"},{"id":"2085294560373424145","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于企业所得税税前扣除损失的说法错误的是（ ）。","opts":[{"k":"A","t":"资产损失是指企业在生产经营活动中实际发生的固定资产和存货的盘亏、毁损、报废、被盗损失，自然灾害等不可抗力造成的损失以及其他损失"},{"k":"B","t":"企业向税务机关申报扣除资产损失，仅需填报企业所得税年度纳税申报表《资产损失税前扣除及纳税调整明细表》，不再报送资产损失相关资料，相关资料由企业留存备查"},{"k":"C","t":"企业以前年度发生的资产损失未能在当年税前扣除的，向税务机关说明并进行专项申报扣除"},{"k":"D","t":"企业已经作为损失处理的资产，在以后纳税年度又全部收回或者部分收回时，应当冲减前期损失"}],"ans":"D","exp":"企业已经作为损失处理的资产，在以后纳税年度又全部收回或者部分收回时，应当计入当期收入，不应冲减前期损失。","wrong":1,"cat":"财务会计"},{"id":"2085294560373424149","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在2023年1月1日至2027年12月31日期间，集成电路企业和工业母机企业开展研发活动中实际发生的研发费用，未形成无形资产计入当期损益的，加计扣除的比例是（    ）。","opts":[{"k":"A","t":"75%"},{"k":"B","t":"100%"},{"k":"C","t":"120%"},{"k":"D","t":"150%"}],"ans":"C","exp":"集成电路企业和工业母机企业开展研发活动中实际发生的研发费用，未形成无形资产计入当期损益的，在按规定据实扣除的基础上，在2023年1月1日至2027年12月31日期间，再按照实际发生额的120%在税前扣除；形成无形资产的，在上述期间按照无形资产成本的220%在税前摊销。","wrong":1,"cat":"财务会计"},{"id":"2085294560373424150","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业所得税税收优惠中，企业购置并实际使用符合规定的环境保护、节能节水、安全生产等专用设备，可以采用的税收优惠政策是（ ）。","opts":[{"k":"A","t":"按专用设备投资额的10%抵免应纳税额"},{"k":"B","t":"按专用设备投资额的15%抵减收入"},{"k":"C","t":"按专用设备投资额的70%享受加速折旧优惠"},{"k":"D","t":"按专用设备投资额的90%享受加计扣除优惠"}],"ans":"A","exp":"企业购置并实际使用《环境保护专用设备企业所得税优惠目录》、《节能节水专用设备企业所得税优惠目录》和《安全生产专用设备企业所得税优惠目录》规定的环境保护、节能节水和安全生产等专用设备的，该专用设备投资额的10%可以从企业当年的应纳税额中抵免；当年不足抵免的，可以在以后5个纳税年度结转抵免。","wrong":1,"cat":"税务"},{"id":"2085294560377618457","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据个人所得税相关规定，兼职律师应于次月一定期限内自行向主管税务机关申报两处或两处以上取得的工资、薪金所得，合并计算缴纳个人所得税。该期限为（  ）日。","opts":[{"k":"A","t":"3"},{"k":"B","t":"5"},{"k":"C","t":"7"},{"k":"D","t":"15"}],"ans":"C","exp":"兼职律师应于次月7日内自行向主管税务机关申报两处或两处以上取得的工资、薪金所得，合并计算缴纳个人所得税。","wrong":1,"cat":"税务"},{"id":"2085294560381812740","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于因移居境外注销中国户籍的个人所得税纳税申报，表述不正确的是（ ）。","opts":[{"k":"A","t":"纳税人在注销户籍年度取得综合所得的，应当在注销户籍后，办理当年综合所得的汇算清缴"},{"k":"B","t":"纳税人在注销户籍年度取得经营所得的，应当在注销户籍前，办理当年经营所得的汇算清缴"},{"k":"C","t":"纳税人有未缴或者少缴税款的，应当在注销户籍前，结清欠缴或未缴的税款"},{"k":"D","t":"纳税人存在分期缴税且未缴纳完毕的，应当在注销户籍前，结清尚未缴纳的税款"}],"ans":"A","exp":"纳税人在注销户籍年度取得综合所得的，应当在注销户籍前，办理当年综合所得的汇算清缴，并报送《个人所得税年度自行纳税申报表》。尚未办理上一年度综合所得汇算清缴的，应当在办理注销户籍纳税申报时一并办理。","wrong":1,"cat":"税务"},{"id":"2085294560381812748","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列不属于关税纳税人的是（ ）。","opts":[{"k":"A","t":"进口货物的收货人"},{"k":"B","t":"出口货物的发货人"},{"k":"C","t":"进境物品的携带人"},{"k":"D","t":"从事跨境电子商务零售进口的物流企业"}],"ans":"D","exp":"从事跨境电子商务零售进口的电子商务平台经营者、物流企业和报关企业，以及法律、行政法规规定负有代扣代缴、代收代缴关税税款义务的单位和个人，是关税的扣缴义务人。","wrong":1,"cat":"税务"},{"id":"2085294560381812749","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"原产于我国给予特殊关税优惠安排的国家或者地区且符合国家原产地管理规定的进口货物，适用的税率是（ ）。","opts":[{"k":"A","t":"最惠国税率"},{"k":"B","t":"协定税率"},{"k":"C","t":"特惠税率"},{"k":"D","t":"普通税率"}],"ans":"C","exp":"原产于我国给予特殊关税优惠安排的国家或者地区且符合国家原产地管理规定的进口货物，适用特惠税率。","wrong":1,"cat":"税务"},{"id":"2085294560381812750","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"采用成交价格估价方法时，下列未包含在进口货物价格中的项目应计入关税计税价格的是（ ）。","opts":[{"k":"A","t":"由买方负担的购货佣金"},{"k":"B","t":"进口关税及其他国内税"},{"k":"C","t":"符合条件的利息费用"},{"k":"D","t":"卖方直接或间接从买方获得该货物境内销售、处置所得的利益"}],"ans":"D","exp":"选项A，如果是除购货佣金外的佣金和经纪费，要计入关税的计税价格；选项B，设备进口后的安装调试费用和进口关税不得计入计税价格；选项C，进口货物的价款中单独列明的同时符合下列条件的利息费用不计入该货物的计税价格：利息费用是买方为购买进口货物而融资所产生的，有书面的融资协议的；利息费用单独列明的；纳税人可以证明有关利率不高于在融资当时当地此类交易通常应当具有的利率水平，且没有融资安排的相同或者类似进口货物的价格与进口货物的实付、应付价格非常接近的。","wrong":1,"cat":"税务"},{"id":"2085294560381812752","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于关税征收管理的表述，正确的是（ ）。","opts":[{"k":"A","t":"纳税人应当自完成申报之日起15日内缴纳税款"},{"k":"B","t":"关税纳税义务人因不可抗力的情形，不能按期缴纳税款的，经向海关申请并提供税款担保，可以延期缴纳税款，但最长不得超过3个月"},{"k":"C","t":"选择汇总征税模式的，纳税人可以自完成申报之日起15日内或者次月第15个工作日结束前汇总缴纳税款"},{"k":"D","t":"因纳税义务人违反规定而造成的少征或者漏征的税款，海关应当自缴纳税款或货物放行之日起1年以内追征税款"}],"ans":"A","exp":"选项B，因不可抗力或者国家税收政策调整，纳税人、扣缴义务人不能按期缴纳税款的，经海关申请并提供税款担保，可以延期缴纳税款，但最长不得超过6个月；选项C，选择汇总征税模式的，纳税人可以自完成申报之日起15日内或者次月第5个工作日结束前汇总缴纳税款；选项D，因纳税义务人违反规定而造成的少征或者漏征的税款，海关应当自缴纳税款或货物放行之日起3年以内追征税款，还应当自缴纳税款或者货物放行之日起至海关发现违反规定行为之日止，按日加收少征或者漏征税款万分之五的滞纳金。","wrong":1,"cat":"税务"},{"id":"2085294560381812757","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某钢铁企业进口一批铁矿石，下列关于该业务涉及的相关税费表述中正确的是（ ）。","opts":[{"k":"A","t":"该企业进口铁矿石需要缴纳资源税"},{"k":"B","t":"该企业进口铁矿石需要缴纳增值税"},{"k":"C","t":"该企业进口铁矿石需要缴纳城市维护建设税"},{"k":"D","t":"该企业进口铁矿石需要缴纳消费税"}],"ans":"B","exp":"资源税和城市维护建设税进口不征，出口不退；所以，该企业进口铁矿石不需要缴纳资源税、城市维护建设税；铁矿石不属于消费税的征税范围，不征收消费税。","wrong":1,"cat":"税务"},{"id":"2085294560381812758","bank":"决赛题 ],"ans":"B","exp":"《管理会计应用指引第202号——零基预算》第十一条零基预算的主要优点：一是以零为起点编制预算，不受历史期经济活动中的不合理因素影响，能够灵活应对内外环境的变化，预算编制更贴近预算期企业经济活动需要；二是有助于增加预算编制透明度，有利于进行预算控制。第十二条零基预算的主要缺点：一是预算编制工作量较大、成本较高；二是预算编制的准确性受企业管理水平和相关数据标准准确性影响较大。","wrong":1,"cat":"管理会计"},{"id":"2085294560406978571","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下不属于经营层管理会计报告的是（）","opts":[{"k":"A","t":"成本管理报告"},{"k":"B","t":"项目可行性报告"},{"k":"C","t":"盈利分析报告"},{"k":"D","t":"采购业务报告"}],"ans":"D","exp":"《管理会计应用指引第801号——企业管理会计报告》第二十三条经营层管理会计报告主要包括全面预算管理报告、投资分析报告、项目可行性报告、融资分析报告、盈利分析报告、资金管理报告、成本管理报告、业绩评价报告等。根据第三十四条，采购业务报告属于业务层管理会计报告","wrong":1,"cat":"管理会计"},{"id":"2085294560406978578","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"成本性态分析，是指企业基于成本与业务量之间的关系，运用技术方法，将业务范围内发生的成本分解为（）的过程。","opts":[{"k":"A","t":"直接成本和间接成本"},{"k":"B","t":"材料成本和人工成本"},{"k":"C","t":"固定成本和变动成本"},{"k":"D","t":"标准成本和成本差异"}],"ans":"C","exp":"《管理会计应用指引第303号——变动成本法》第十条规定，“成本性态分析，是指企业基于成本与业务量之间的关系，运用技术方法，将业务范围内发生的成本分解为固定成本和变动成本的过程。”","wrong":1,"cat":"管理会计"},{"id":"2085294560406978583","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业应遵循重要性原则和（）原则，结合业务性质和管理要求，确定滚动预算的编制内容。","opts":[{"k":"A","t":"相关性"},{"k":"B","t":"成本效益"},{"k":"C","t":"可靠性"},{"k":"D","t":"可理解"}],"ans":"B","exp":"《管理会计应用指引第201号——滚动预算》第九条规定，“企业应遵循重要性原则和成本效益原则，结合业务性质和管理要求，确定滚动预算的编制内容。”","wrong":1,"cat":"管理会计"},{"id":"2085294560411172865","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"风险矩阵，是指按照风险发生的可能性和风险发生后果的严重程度，将风险绘制在矩阵图中，展示风险及其（）的风险管理工具方法。","opts":[{"k":"A","t":"危险程度"},{"k":"B","t":"重要性等级"},{"k":"C","t":"不确定性"},{"k":"D","t":"对目标影响"}],"ans":"B","exp":"《管理会计应用指引第701号——风险矩阵》第一条规定，“风险矩阵，是指按照风险发生的可能性和风险发生后果的严重程度，将风险绘制在矩阵图中，展示风险及其重要性等级的风险管理工具方法。”","wrong":1,"cat":"企业文化与战略管理"},{"id":"2085294560411172866","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下不属于企业应用预算管理工具方法一般程序的是（）。","opts":[{"k":"A","t":"预算目标确定"},{"k":"B","t":"预算编制"},{"k":"C","t":"预算控制"},{"k":"D","t":"预算考核"}],"ans":"A","exp":"《管理会计应用指引第200号——预算管理》第七条企业应用预算管理工具方法，一般按照预算编制、预算控制、预算调整、预算考核等程序进行。","wrong":1,"cat":"综合实务"},{"id":"2085294560411172867","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"经济增加值是指（）扣除全部投入资本的成本后的剩余收益。","opts":[{"k":"A","t":"税后净营业利润"},{"k":"B","t":"税前利润"},{"k":"C","t":"经营利润"},{"k":"D","t":"毛利"}],"ans":"A","exp":"《管理会计应用指引第602号——经济增加值法》第一条规定，“经济增加值，是指税后净营业利润扣除全部投入资本的成本后的剩余收益。”","wrong":1,"cat":"综合实务"},{"id":"2085294560411172869","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下选项不属于企业构建绩效棱柱模型指标体系时主要评价维度的是（）。","opts":[{"k":"A","t":"利益相关者满意评价指标"},{"k":"B","t":"供应链能力评价指标"},{"k":"C","t":"业务流程评价指标"},{"k":"D","t":"利益相关者贡献评价指标"}],"ans":"B","exp":"《管理会计应用指引第604号——绩效棱柱模型》第十五条，绩效棱柱模型指标体系通常包括以下内容：（一）利益相关者满意评价指标；（二）企业战略评价指标；（三）业务流程评价指标；（四）组织能力评价指标；（五）利益相关者贡献评价指标。","wrong":1,"cat":"企业文化与战略管理"},{"id":"2085294560776077334","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在出售或深加工决策时，下列各种情况中，应该选择深加工的是（ ）。","opts":[{"k":"A","t":"加工后出售的收入大于直接出售的收入和进一步深加工前的半成品所发生的成本之差"},{"k":"B","t":"加工后出售的收入小于直接出售的收入和进一步深加工前的半成品所发生的成本之差"},{"k":"C","t":"加工后出售和直接出售的收入之差大于进一步深加工所需的追加成本"},{"k":"D","t":"加工后出售和直接出售的收入之差小于进一步深加工所需的追加成本"}],"ans":"C","exp":"在出售或深加工决策中，进一步深加工前的半成品所发生的成本，都是无关的沉没成本。因为无论是否深加工，这些成本都已经发生而不能改变。相关成本只应该包括进一步深加工所需的追加成本，相关收入则是加工后出售和直接出售的收入之差。加工后出售和直接出售的收入之差大于进一步深加工所需的追加成本，则深加工会增加企业的利润，应该选择深加工。","wrong":1,"cat":"财务会计"},{"id":"2085294560776077333","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"如果追加订货不影响正常销售的完成，即利用剩余生产能力就可以完成追加订货，又不需要追加专属成本，而且剩余生产能力无法转移。此时是否接受追加订单的决策分析的基本思路是（ ）。","opts":[{"k":"A","t":"只要追加订单的单价大于该产品的单位变动成本，就可以接受该追加订货"},{"k":"B","t":"只要追加订单的边际贡献大于追加的变动成本，就可以接受该追加订货"},{"k":"C","t":"当追加订货创造的边际贡献大于转移剩余生产能力的可能收益时，则可以接受该追加订货"},{"k":"D","t":"当追加订货的边际贡献足以补偿减少的正常边际贡献时，则可以接受该追加订货"}],"ans":"A","exp":"如果追加订货不影响正常销售的完成，即利用剩余生产能力就可以完成追加订货，又不需要追加专属成本，而且剩余生产能力无法转移。这时，只要特殊订单的单价大于该产品的单位变动成本，就可以接受该追加订货。","wrong":1,"cat":"管理会计"},{"id":"2085294560771883020","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司对于普通销售人员工资的规定是：每月底薪2000元，销售量超过1000件的部分，每件提成为2元，则该公司销售人员工资属于（ ）。","opts":[{"k":"A","t":"半变动成本"},{"k":"B","t":"阶梯式成本"},{"k":"C","t":"延期变动成本"},{"k":"D","t":"非线性成本"}],"ans":"C","exp":"延期变动成本和半变动成本的区别是：半变动成本是从业务量为0开始，成本总额就随着业务量的变化而变化；而延期变动成本是业务量超过一定数额后，成本总额才随着业务量的增加而增加。","wrong":1,"cat":"管理会计"},{"id":"2085294560763494408","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"使用资本资产定价模型计算权益资本成本时，关于贝塔值的确定，下列说法不正确的是（ ）。","opts":[{"k":"A","t":"公司风险特征无重大变化时，可以采用5年或更长的历史期长度"},{"k":"B","t":"实务中广泛使用年度报酬率计算贝塔值"},{"k":"C","t":"计算股权资本成本使用的β值是历史的，因为未来的贝塔值无法确定"},{"k":"D","t":"β值的驱动因素包括经营风险和财务风险"}],"ans":"B","exp":"实务中广泛使用每周或每月的报酬率计算贝塔值。年度报酬率较少采用，回归分析需要使用很多年的数据，在此期间资本市场和企业都发生了很大变化。","wrong":1,"cat":"财务管理"},{"id":"2085294560759300113","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在传统杜邦分析体系中，对于一般盈利企业，假设其他情况相同，下列说法中错误的是（ ）。","opts":[{"k":"A","t":"权益乘数大则财务风险大"},{"k":"B","t":"权益乘数小则权益净利率小"},{"k":"C","t":"权益乘数小则资产负债率小"},{"k":"D","t":"权益乘数大则总资产净利率大"}],"ans":"D","exp":"一般说来，总资产净利率较高的企业，财务杠杆较低，所以选项D的说法是错误的。补充解释：为了降低风险，债权人更倾向于为预期未来经营活动现金流量比较稳定的企业提供贷款，为了稳定现金流量，公司的一种选择是降低价格以减少竞争，另一种选择是增加营运资本以防止现金流中断，这都会导致总资产净利率下降。所以，一般说来，权益乘数较高（即负债比例较高）的企业，总资产净利率较低。反之，总资产净利率较高的企业，财务杠杆较低。","wrong":1,"cat":"财务管理"},{"id":"2085294560759300108","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"如果投资基金经理根据公开信息选择股票，投资基金的平均业绩与市场整体收益大体一致，说明该资本市场至少是（ ）。","opts":[{"k":"A","t":"弱式有效"},{"k":"B","t":"半强式有效"},{"k":"C","t":"完全无效"},{"k":"D","t":"强式有效"}],"ans":"B","exp":"根据公开信息选择股票，投资基金的平均业绩与市场整体收益大体一致，说明投资者不能通过分析公开信息获取超额收益，即该资本市场的股票价格中反映了公开信息，而半强式有效资本市场和强式有效资本市场的股票价格中均反映了公开信息，弱式有效资本市场和完全无效资本市场上，股票价格没有反映公开信息，所以选项B是答案。","wrong":1,"cat":"金融与投资理财"},{"id":"2085294560755105814","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《企业内部控制审计指引》规定，在实施审计工作的基础上对内部控制的有效性发表审计意见，是（  ）的责任。","opts":[{"k":"A","t":"注册会计师"},{"k":"B","t":"董事会"},{"k":"C","t":"内部审计部门"},{"k":"D","t":"监事会"}],"ans":"A","exp":"在实施审计工作的基础上对内部控制的有效性发表审计意见，是注册会计师的责任。","wrong":1,"cat":"审计"},{"id":"2085294560755105812","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"内部控制评价工作组依据现场测试证据，对内部控制缺陷进行初步认定，并按缺陷的影响程度将其划分为不同等级，下列选项中不属于该划分等级的是（  ）。","opts":[{"k":"A","t":"重大缺陷"},{"k":"B","t":"重要缺陷"},{"k":"C","t":"轻微缺陷"},{"k":"D","t":"一般缺陷"}],"ans":"C","exp":"内部控制评价工作组应当根据现场测试获取的证据，对内部控制缺陷进行初步认定，并按其影响程度分为重大缺陷、重要缺陷和一般缺陷。","wrong":1,"cat":"审计"},{"id":"2085294560750911510","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列不属于企业与其他单位合作进行研究，签订书面研究合同时需要明确的内容的是（  ）。","opts":[{"k":"A","t":"双方投资"},{"k":"B","t":"双方的分工"},{"k":"C","t":"研究成果产权归属"},{"k":"D","t":"参与研究人员的学历"}],"ans":"D","exp":"企业与其他单位合作进行研究的，应当对合作单位进行尽职调查，签订书面合作研究合同，明确双方投资、分工、权利义务、研究成果产权归属等。","wrong":1,"cat":"经济法与财经法规"},{"id":"2085294560427950089","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业应当严格执行固定资产日常维修和大修理计划，定期对固定资产进行（  ），切实消除安全隐患。","opts":[{"k":"A","t":"评估测算"},{"k":"B","t":"盘点清查"},{"k":"C","t":"维护保养"},{"k":"D","t":"检查更新"}],"ans":"C","exp":"企业应当严格执行固定资产日常维修和大修理计划，定期对固定资产进行维护保养，切实消除安全隐患。","wrong":1,"cat":"财务会计"},{"id":"2085294560427950086","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业大宗采购应当采用的采购方式是（  ）。","opts":[{"k":"A","t":"直接购买"},{"k":"B","t":"询价采购"},{"k":"C","t":"招标方式"},{"k":"D","t":"定向采购"}],"ans":"C","exp":"企业应当根据市场情况和采购计划合理选择采购方式。大宗采购应当采用招标方式，合理确定招投标的范围、标准、实施程序和评标规则。","wrong":1,"cat":"综合实务"},{"id":"2085294560427950084","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《企业内部控制应用指引第6号——资金活动》，下列关于资金的收支条件、程序和审批权限的说法错误的是（  ）。","opts":[{"k":"A","t":"企业在生产经营及其他业务活动中取得的资金收入应当及时入账，不得账外设账，严禁收款不入账、设立“小金库”"},{"k":"B","t":"为提高业务效率，企业可授权单一人员全程办理货币资金收付业务，但需加强事后监督"},{"k":"C","t":"企业办理资金支付时，相关印章与票据必须分人保管，严禁由同一人员集中持有"},{"k":"D","t":"资金支付前需明确用途、金额、预算等核心要素，并附完整原始单据，经严格授权审批后方可执行"}],"ans":"B","exp":"企业办理资金收付业务，应当遵守现金和银行存款管理的有关规定，不得由一人办理货币资金全过程业务，严禁将办理资金支付业务的相关印章和票据集中一人保管。","wrong":1,"cat":"财务会计"},{"id":"2085294560423755797","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为扩大生产规模，选择了高利率的短期借款，导致每年需支付高额利息。两年后，公司因无法按时偿债被迫变卖核心资产，最终陷入债务危机。根据《企业内部控制应用指引第6号——资金活动》，甲公司面临 opts":[{"k":"A","t":"33 万元"},{"k":"B","t":"48 万元"},{"k":"C","t":"60 万元"},{"k":"D","t":"80 万元"}],"ans":"C","exp":"2×18年1月1日为借款日，2×18年4月1日为开工日和资产支出日，同时满足借款费用开始资本化条件的日期为2×18年4月1日，因此该笔专门借款在2×18年的资本化期间为2×18年4月1日—2×18年12月31日（9个月）。本题不考虑闲置资金收益利息因素，所以，2×18年为建造该大型设备应予以资本化的借款费用=2 000×4％×9/12=60（万元），选项C当选；选项A不当选，误按一般借款的处理计算专门借款利息支出的资本化金额；选项B不当选，仅将占用1 600万元专门借款利息支出资本化；选项D不当选，未考虑占用专门借款时间权重。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922247737274393","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《中华人民共和国会计法》规定，会计账簿包括总账、明细账、日记账和备查账簿。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文表述为：\"会计账簿包括总账、明细账、日记账和其他辅助性账簿。\"原文使用的是\"其他辅助性账簿\"而非\"备查账簿\"，虽然两者在实际工作中含义相近，但作为考试应以原文表述为准。","wrong":1,"cat":"财务会计"},{"id":"2081922246424457222","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在直接或间接持有上市公司已发行股份5％以上的股东或者在上市公司前五名股东任职的人员及其配偶、父母、子女和主要社会关系，不得担任该上市公司的独立董事。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"在直接或间接持有上市公司已发行股份5％以上的股东或者在上市公司前5名股东任职的人员及其配偶、父母、子女，不得担任该上市公司的独立董事，注意，其中不包括\"主要社会关系\"。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247737274390","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"会计报表附注至少应当包括下列（）内容。","opts":[{"k":"A","t":"不符合基本会计假设的说明"},{"k":"B","t":"重要会计政策和会计估计及其变更情况、变更原因及其对财务状况和经营成果的影响"},{"k":"C","t":"或有事项和资产负债表日后事项的说明"},{"k":"D","t":"关联方关系及其交易的说明"}],"ans":"A,B,C,D","exp":"依据《企业财务会计报告条例》第十四条：会计报表附注是为便于会计报表使用者理解会计报表的内容而对会计报表的编制基础、编制依据、编制原则和方法及主要项目等所作的解释。会计报表附注至少应当包括下列内容：\n(一)不符合基本会计假设的说明；\n(二)重要会计政策和会计估计及其变更情况、变更原因及其对财务状况和经营成果的影响；\n(三)或有事项和资产负债表日后事项的说明；\n(四)关联方关系及其交易的说明；\n(五)重要资产转让及其出售情况；\n(六)企业合并、分立；\n(七)重大投资、融资活动；\n(八)会计报表中重要项目的明细资料；\n(九)有助于理解和分析会计报表需要说明的其他事项。","wrong":1,"cat":"财务会计"},{"id":"2081922247737274384","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中华人民共和国会计法》规定，下列需要在财务会计报告中予以说明的包括（）。","opts":[{"k":"A","t":"各单位采用的会计处理方法确有必要变更的"},{"k":"B","t":"单位提供的担保"},{"k":"C","t":"单位的未决诉讼"},{"k":"D","t":"单位发生的数额较小的资产盘盈盘亏情况"}],"ans":"A,B,C","exp":"单位发生的数额较小的资产盘盈盘亏情况，通常对单位的整体财务状况和经营成果影响不大，一般按照正常的会计处理程序进行账务处理即可，不需要在财务会计报告中专门予以说明。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246420262939","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据公司法律制度的规定，下列各项中，受公司章程约束的有（）。","opts":[{"k":"A","t":"公司的经理"},{"k":"B","t":"公司的副经理"},{"k":"C","t":"公司的普通员工"},{"k":"D","t":"公司的财务负责人"}],"ans":"A,B,D","exp":"公司章程对公司、股东、董事、监事、高级管理人员具有约束力。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922246420262932","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列关于公司公积金用途的表述中，符合公司法律制度规定的有（）。","opts":[{"k":"A","t":"资本公积金可以用于弥补公司亏损"},{"k":"B","t":"法定公积金不得转增公司资本"},{"k":"C","t":"任意公积金可以转增公司资本"},{"k":"D","t":"盈余公积金可以用于扩大公司生产经营"}],"ans":"A,C,D","exp":"选项A、C、D正确，公司的公积金用于弥补公司的亏损、扩大公司生产经营或者转增公司资本。公积金弥补公司亏损，应当先使用任意公积金和法定公积金；仍不能弥补的，可以按照规定使用资本公积金。选项B错误，法定公积金可以转增公司资本，用法定公积金转增资本时，所留存的该项公积金不得少于转增前公司注册资本的25%。","wrong":1,"cat":"财务会计"},{"id":"2081922246416068625","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在职工提供服务从而增加了其未来享有的带薪缺勤权利时，企业应确认与累积带薪缺勤相关的职工薪酬。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"企业应当在职工提供了服务从而增加了其未来享有的带薪缺勤权利时，确认与累积带薪缺勤相关的职工薪酬，并以累积未行使权利而增加的预期支付金额计量。比如企业某职工在今年努力工作，获得了累积带薪休假4天，职工在今年没有休这些假，企业预计他会在明年休这几天假，那么企业应该在今年年末预先计提这4天的工资，而不是等到明年实际休假时再计提。","wrong":1,"cat":"财务会计"},{"id":"2081922248727130115","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，属于设定受益计划中计划资产回报的有（ ）。","opts":[{"k":"A","t":"计划资产产生的股利"},{"k":"B","t":"计划资产产生的利息"},{"k":"C","t":"计划资产已实现的利得"},{"k":"D","t":"计划资产未实现的损失"}],"ans":"A,B,C,D","exp":"计划资产回报，指计划资产产生的利息、股利和其他收入，以及计划资产已实现和未实现的利得或损失。【点评】本题考查设定受益计划的相关内容，难度不大，属于教材原文，可以在考前进行简单的记忆。","wrong":1,"cat":"财务会计"},{"id":"2081922247347204097","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"债券存续期信息披露包括（）。","opts":[{"k":"A","t":"债券兑付兑息安排"},{"k":"B","t":"发行人或投资者选择权条款触发和执行情况"},{"k":"C","t":"投资者保护条款触发和执行情况"},{"k":"D","t":"法律意见书"},{"k":"E","t":"募集说明书"}],"ans":"A,B,C","exp":"根据细则第十一条 根据监管机构要求，应披露的信息主要包括以下几类：\n（一）债券发行阶段信息披露，主要包括：发行公告、募集说明书、信用评级报告（如有）、法律意见书、财务报告（或报表）以及监管机构要求的其他文件；\n（二）债券存续期信息披露，主要包括：债券兑付兑息安排，发行人或投资者选择权条款、投资者保护条款等特殊条款触发和执行情况等；\n（三）定期信息披露，主要包括：债券（半）年度报告、年度审计报告、中期财务报表和专项披露报告；\n（四）临时（重大事项）信息披露，主要包括：公司名称、控股股东、董事与高级管理人员、重要中介机构发生变动或变化情况，公司发生重大损失、放弃重要资产、承担额外债务、涉及重大诉讼仲裁情况，以及其他能对公司资信状况或偿债能力、公司债券交易价格、债券投资者权益产生重大影响的事项（事项清单详见附件1）；\n（五）监管机构规定的其他债券信息披露文件","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247343009818","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"信息披露应遵循以下原则（）。","opts":[{"k":"A","t":"真实"},{"k":"B","t":"准确"},{"k":"C","t":"完整"},{"k":"D","t":"及时"},{"k":"E","t":"公平"}],"ans":"A,B,C,D,E","exp":"根据细则第五条 信息披露应当遵循真实、准确、完整、及时、公平的原则，不得有虚假记载、误导性陈述或重大遗漏。信息披露语言应简洁、平实和明确，不得有祝贺性、广告性、恭维性或诋毁性的词句。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247343009817","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"集团公司总部和子企业在开展债券融资时，应积极利用（）等资本市场重大改革举措，通过发行科技创新债券、碳中和债券、乡村振兴债券等创新品种，有效服务集团公司主责主业。","opts":[{"k":"A","t":"债券市场注册制改革"},{"k":"B","t":"债券基础设施互联互通"},{"k":"C","t":"债券品种创新"},{"k":"D","t":"可转换债券"}],"ans":"A,B,C","exp":"根据办法第二十条 集团公司总部和子企业在开展债券融资时，应积极利用债券市场注册制改革、债券基础设施互联互通、债券品种创新等资本市场重大改革举措，通过发行科技创新债券、碳中和债券、乡村振兴债券等创新品种，有效服务集团公司主责主业。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247343009804","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"各单位委托贷款和融资担保业务开展前，跟踪管理责任单位应履行的职责包括（ ）。","opts":[{"k":"A","t":"对拟开展业务进行尽职调查"},{"k":"B","t":"按照《董事会授权决策方案》相关规定进行审批"},{"k":"C","t":"建立业务台账"},{"k":"D","t":"定期跟踪借款人经营状况和债务风险情况"}],"ans":"A,B","exp":"根据《司库管理办法》第二十四条规定：“各单位委托贷款和融资担保业务开展前，跟踪管理责任单位应履行以下职责：（一）对拟开展业务进行尽职调查；（二）按照《董事会授权决策方案》相关规定进行审批。”","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247343009803","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于融资担保管理，以下说法正确的有（ ）。","opts":[{"k":"A","t":"集团公司总融资担保规模原则上不超过集团合并净资产的40%"},{"k":"B","t":"集团公司总部、单户子公司融资担保规模原则上不超过本公司净资产的50%"},{"k":"C","t":"严禁对参股公司提供超股比担保"},{"k":"D","t":"严禁对集团外无股权关系公司提供任何形式的融资担保"}],"ans":"A,B,C,D","exp":"根据《司库管理办法》第二十三条规定：\n集团公司总融资担保规模原则上不超过集团合并净资产的40%（A正确）；\n集团公司总部、单户子公司融资担保规模原则上不超过本公司净资产的50%（B正确）；\n严禁对参股公司提供超股比担保（C正确）；\n严禁对集团外无股权关系公司提供任何形式的融资担保（D正确）。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247343009800","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"集团公司资金风险管理策略遵循的基本原则包括（ ）。","opts":[{"k":"A","t":"自然对冲"},{"k":"B","t":"平衡匹配"},{"k":"C","t":"统筹分级"},{"k":"D","t":"套期保值"}],"ans":"A,B,C,D","exp":"根据《司库管理办法》第二十条规定：“集团公司资金风险管理策略遵循自然对冲、平衡匹配、统筹分级、套期保值的基本原则。”","wrong":1,"cat":"企业文化与战略管理"},{"id":"2081922247343009796","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列哪些账户的开立、变更、撤销需纳入集团公司统一管控并报送审批？（ ）","opts":[{"k":"A","t":"证券账户"},{"k":"B","t":"支付宝和微信等第三方收支账户"},{"k":"C","t":"工会经费账户"},{"k":"D","t":"党费账户"}],"ans":"A,B","exp":"根据《司库管理办法》第十三条规定：“各单位开立证券账户、支付宝和微信等第三方收支账户按照银行账户管理执行，纳入集团公司统一管控，并按规定报送审批。”","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247338815511","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于财务机构与人员管理，以下哪些说法符合集团公司《财务管理制度》规定？","opts":[{"k":"A","t":"各级子公司具有一级实质管理层级功能的，应设置独立的财务机构，大中型企业必须设置总会计师岗位。"},{"k":"B","t":"财务人员须具备从业能力，坚守职业操守和道德底线"},{"k":"C","t":"各单位财务机构在业务上接受审计部指导和考核"},{"k":"D","t":"财务机构按照不相容职务分离与内部控制等原则设置专业岗位"},{"k":"E","t":"集团公司建立健全多层次财务人才培养培训体系"}],"ans":"A,B,D,E","exp":"《财务管理制度》第十二条、第十三条支持A、B、D、E选项；C错误，应为“接受财务与资产管理部指导和考核”。","wrong":1,"cat":"审计"},{"id":"2081922247338815510","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据集团公司《财务管理制度》规定，集团公司对以下哪些重大财务事项进行统一决策？","opts":[{"k":"A","t":"子公司利润分配方案"},{"k":"B","t":"各子公司年度预算与财务决算批复"},{"k":"C","t":"各单位财务机构内部岗位设置"},{"k":"D","t":"集团公司决算审计、评估等中介机构的统一管理"}],"ans":"A,B,D","exp":"《财务管理制度》第六条明确所列统一决策事项中包含A、B、D；C属于各单位内部管理事务，不在此列。","wrong":1,"cat":"审计"},{"id":"2081922247271706636","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"存在以下情形的中央企业，不得新设产业基金：（）","opts":[{"k":"A","t":"资产负债率超过行业管控线"},{"k":"B","t":"管控能力弱，基金业务出现重大风险或损失"},{"k":"C","t":"基金管理队伍能力不足"},{"k":"D","t":"未开展过基金业务"}],"ans":"A,B,C","exp":"制度第十四条规定“若集团公司存在下列情形，原则上不得发起设立产业基金。（一）资产负债率超过国务院国资委规定的集团公司所在行业管控线。（二）管控能力弱，基金业务发生重大风险或损失。（三）截至上年度末经审计的基金业务整体累计亏损金额超过基金实缴金额20%。（四）基金管理队伍能力不足。（五）已设立基金投资效率低，募集资金大量结余。（六）国务院国资委认定的其他情形。” 注意：国资委2026年新办法未继续要求以下三点：“（三）截至上年度末经审计的基金业务整体累计亏损金额超过基金实缴金额20%。（四）基金管理队伍能力不足。（五）已设立基金投资效率低，募集资金大量结余。”","wrong":1,"cat":"财务管理"},{"id":"2081922247271706635","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"实施主体应根据集团公司发展战略和规划，按照国务院国资委确认的集团公司主业、非主业投资比例及新兴产业投资方向，选择、确定基金业务，对开展基金业务的必要性、可行性及实施方案等进行初步论证，编制基金立项材料。实施主体依照内部管理规定自主审批立项后，报财务与资产管理部备案，备案文件须包含以下哪些内容：（）。","opts":[{"k":"A","t":"发起设立或参与基金承诺书"},{"k":"B","t":"基金基本信息"},{"k":"C","t":"内部立项情况"},{"k":"D","t":"基金立项预可研报告"}],"ans":"B,C,D","exp":"根据办法附件1“立项备案申请表”，须包括基本信息、内部立项情况、基金立项预可研报告。“发起设立或参与基金承诺书”为基金业务申报决策阶段的必要文件。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247271706634","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"对于集团公司发起设立或出资参与产业基金的出资情形（非创业投资基金），符合规定的是（）。","opts":[{"k":"A","t":"集团公司发起设立产业基金，内部单位合计认缴比例60%，外部单位（均非中央企业）合计认缴比例40%"},{"k":"B","t":"集团公司发起设立产业基金，内部单位合计认缴比例30%，外部单位（均非中央企业）合计认缴比例70%"},{"k":"C","t":"集团公司出资参与产业基金，内部单位合计认缴比例20%，外部单位合计认缴比例80%（其中：其他中央企业出资参与40%）"},{"k":"D","t":"集团公司出资参与产业基金，内部单位合计认缴比例30%，外部单位合计认缴比例70%（其中：其他中央企业出资参与40%）"}],"ans":"B,C","exp":"根据办法第二十二条，基金应当充分发挥资本放大作用，原则上基金认缴出资不得超过以下比例限制。（一）新设产业基金集团公司内部合计认缴出资不得高于30%，全部中央企业合计认缴出资不得高于60%。（二）参与基金集团公司内部合计认缴出资原则上不得高于全部认缴出资的20%，参与其他中央企业基金可适当提高比例。计算上述比例时，中央企业管理基金的出资全额计算在内，中央企业作为基金的管理人或普通合伙人对基金的少量出资不计算在内。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247271706631","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"集团公司直接融资是指在证券市场中的股权融资和直接债务融资。其中，股权融资是指通过股东增资方式募集资金，包括但不限于（）。","opts":[{"k":"A","t":"发行可在交易所场内交易的股票"},{"k":"B","t":"认股权证"},{"k":"C","t":"可转换公司债券"},{"k":"D","t":"公募REITs"}],"ans":"A,B,C,D","exp":"根据办法第二条 直接融资管理办法所称直接融资是指在证券市场中的股权融资和直接债务融资。其中，股权融资是指通过股东增资方式募集资金，包括但不限于发行可在交易所场内交易的股票、认股权证、可转换公司债券、公募REITs等。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922247271706626","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"开展直接融资业务的单位在方案实施过程中应加强市场研究，适时根据市场行情优化调整方案并履行审批程序，防范市场波动风险。对于境外融资，应结合境外业务发展资金需求，（）","opts":[{"k":"A","t":"积极维护投资者关系和良好国际信用评级"},{"k":"B","t":"探索多市场、多币种发行，拓展融资渠道"},{"k":"C","t":"注意防范汇率风险"},{"k":"D"," :"D","t":"邓小平指出\"修建三峡工程，对防洪所起的作用很大，发电效益很大。因此，轻易否定三峡不好\""}],"ans":"A,B,D","exp":"《传承弘扬三峡精神和优良作风》中明确记载：\"1918年，孙中山胸怀振兴中华、实业救国的豪情壮志，在《建国方略》里首次提出开发三峡工程的设想。\"\"1980年7月，邓小平视察三峡坝址和葛洲坝工程时指出：洪水淹到哪里，哪里要倒霉，人民要遭殃......修建三峡工程，对防洪所起的作用很大，发电效益很大。因此，轻易否定三峡不好。\"孙中山仅提出\"设想\"，未涉及具体施工方案，选项C超出文件记载范围。","wrong":1,"cat":"综合实务"},{"id":"2081922245048725507","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《传承弘扬三峡精神和优良作风》从多个维度阐述了三峡工程的性质与定位，包含\"世纪工程 百年梦圆\"\"民生工程 筑坝安澜\"\"科技工程 克难攻坚\"\"民族工程 全民共建\"\"复兴工程 历史丰碑\"五种工程定位。下列说法正确的有（ ）。","opts":[{"k":"A","t":"\"世纪工程 百年梦圆\"主要回顾了三峡工程从孙中山设想到建成的百年追梦历程"},{"k":"B","t":"\"科技工程 克难攻坚\"主要阐述了三峡工程的监理体系和移民安置工作"},{"k":"C","t":"\"民族工程 全民共建\"体现了全国支援和移民安置等内容"},{"k":"D","t":"\"民生工程 筑坝安澜\"主要论述了三峡工程的重新论证过程和防洪、发电等民生功能"}],"ans":"A,C,D","exp":"《传承弘扬三峡精神和优良作风》的章节结构为：\"世纪工程 百年梦圆\"回顾百年追梦历程；\"民生工程 筑坝安澜\"论述重新论证过程和防洪、发电等民生功能；\"科技工程 克难攻坚\"论述监理体系、水电装备跨越等科技成就；\"民族工程 全民共建\"论述全国支援、移民安置等；\"复兴工程 历史丰碑\"论述对中华民族伟大复兴的意义。选项B将移民安置工作误置于\"科技工程\"之下，移民安置属于\"民族工程 全民共建\"的内容。","wrong":1,"cat":"综合实务"},{"id":"2081922246445428741","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《传承弘扬三峡精神和优良作风》，长江水利委员会于1950年8月正式成立。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《传承弘扬三峡精神和优良作风》记载：\"1949年底，治理开发长江的专门机构——长江水利委员会开始筹建，1950年2月正式成立。\"题干将\"1950年2月\"误写为\"1950年8月\"，与原文不符。","wrong":1,"cat":"综合实务"},{"id":"2081922247619833873","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中央企业绩效评价规定（试行）》，绩效评价指标中，盈利回报指标包括以下哪些？","opts":[{"k":"A","t":"净资产收益率"},{"k":"B","t":"营业收入利润率"},{"k":"C","t":"总资产报酬率"},{"k":"D","t":"盈余现金保障倍数"},{"k":"E","t":"经济增加值率"}],"ans":"A,B,C,D","exp":"盈利回报指标包括净资产收益率、营业收入利润率、总资产报酬率、盈余现金保障倍数；经济增加值率属于持续发展指标。","wrong":1,"cat":"财务管理"},{"id":"2081922247619833869","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《关于中央企业加快建设世界一流财务管理体系的指导意见》（国资发财评规〔2022〕23号），建设全面有效的合规风控体系应加强以下哪些管控？","opts":[{"k":"A","t":"严合规"},{"k":"B","t":"控风险"},{"k":"C","t":"强化境外风险管控"},{"k":"D","t":"加快供应链融资创新"},{"k":"E","t":"推进业财融合"}],"ans":"A,B,C","exp":"《指导意见》明确“加强‘严合规、控风险’以及强化境外风险管控”，供应链融资和业财融合属于其他体系内容。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247619833859","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据2025年12月发布的《中央企业违规经营投资责任追究实施办法》（国资委令第46号），关于资产损失认定，以下说法正确的是？","opts":[{"k":"A","t":"500万元以下为一般资产损失"},{"k":"B","t":"500万元以上5000万元以下为较大资产损失"},{"k":"C","t":"5000万元以上为重大资产损失"},{"k":"D","t":"已退休人员不追究责任"},{"k":"E","t":"可减轻或免除处理"}],"ans":"A,B,C,E","exp":"《办法》明确：500万以下一般、500万-5000万较大、5000万以上重大；规定从轻减轻免除情形；已退休仍可追责","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247615639566","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《中央企业违规经营投资责任追究实施办法》提出，对违规经营投资相关责任人的处理方式包括以下哪些？","opts":[{"k":"A","t":"批评或诫勉"},{"k":"B","t":"组织处理"},{"k":"C","t":"扣减薪酬"},{"k":"D","t":"禁入限制"},{"k":"E","t":"处分"}],"ans":"A,B,C,D,E","exp":"对相关责任人的处理方式包括批评或诫勉、组织处理、扣减薪酬、禁入限制、处分、移送纪检监察机构或司法机关处理等，可以单独使用，也可以合并使用。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922246441234438","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《关于进一步加强财会监督工作的意见》要求，有关单位要依照法定职责实施部门监督，具体包括（）。","opts":[{"k":"A","t":"加强对所属单位预算执行的监督"},{"k":"B","t":"按照职责分工加强对政府采购活动的监督"},{"k":"C","t":"按照会计法赋予的职权对有关单位的会计资料实施监督"},{"k":"D","t":"直接任命所监管企业的财务总监"}],"ans":"A,B,C","exp":"原文：“有关部门要依法依规强化对主管、监管行业系统和单位财会监督工作的督促指导。加强对所属单位预算执行的监督按照职责分工加强对政府采购活动、资产评估行业的监督按照会计法赋予的职权对有关单位的会计资料实施监督”出自《关于进一步加强财会监督工作的意见》“依照法定职责实施部门监督”。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922245052919811","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《国有企业管理人员处分条例》规定，国有企业管理人员的处分决定被变更，需要调整该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照规定予以调整。国有企业管理人员的处分决定被撤销，需要恢复该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照原职务和岗位等级安排相应的职务和岗位，并在原处分决定公布范围内为其（    ）。国有企业管理人员因有本条例第四十二条、第四十三条规定情形被撤销处分或者减轻处分的，应当结合其实际履职、业绩贡献等情况对其（    ）受到的损失予以适当补偿。","opts":[{"k":"A","t":"恢复名誉"},{"k":"B","t":"赔偿损失"},{"k":"C","t":"薪酬待遇"},{"k":"D","t":"职务待遇"}],"ans":"A,C","exp":"解析：《国有企业管理人员处分条例》规定：“国有企业管理人员的处分决定被变更，需要调整该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照规定予以调整。国有企业管理人员的处分决定被撤销，需要恢复该国有企业管理人员的职务、岗位等级、薪酬待遇等级等的，应当按照原职务和岗位等级安排相应的职务和岗位，并在原处分决定公布范围内为其恢复名誉。国有企业管理人员因有本条例第四十二条、第四十三条规定情形被撤销处分或者减轻处分的，应当结合其实际履职、业绩贡献等情况对其薪酬待遇受到的损失予以适当补偿。维持、变更、撤销处分的决定应当在作出后1个月内按照本条例第二十七条第一款第六项规定予以送达、宣布，并存入被处分人本人档案。”","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922245027753985","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《企业国有资产交易监督管理办法》，信息预披露应当包括以下哪些内容？","opts":[{"k":"A","t":"转让标的基本情况"},{"k":"B","t":"转让标的企业的股东结构"},{"k":"C","t":"转让标的企业的主要财务指标数据"},{"k":"D","t":"转让底价"}],"ans":"A,B,C,D","exp":"解析：《企业国有资产交易监督管理办法》规定：第十五条 转让方披露信息包括但不限于以下内容：  （一）转让标的基本情况；  （二）转让标的企业的股东结构；  （三）产权转让行为的决策及批准情况；  （四）转让标的企业最近一个年度审计报告和最近一期财务报表中的主要财务指标数据，包括但不限于资产总额、负债总额、所有者权益、营业收入、净利润等（转让参股权的，披露最近一个年度审计报告中的相应数据）；  （五）受让方资格条件（适用于对受让方有特殊要求的情形）；  （六）交易条件、转让底价；  （七）企业管理层是否参与受让，有限责任公司原股东是否放弃优先受让权；  （八）竞价方式，受让方选择的相关评判标准；  （九）其他需要披露的事项。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248785850377","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"党员受到开除党籍处分，终生不得重新入党。另有规定不准重新入党的，依照规定。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"对应条款：第十三条 党员受到开除党籍处分，五年内不得重新入党，也不得推荐担任与其原任职务相当或者高于其原任职务的党外职务。另有规定不准重新入党的，依照规定。","wrong":1,"cat":"党建修养与合规基础"},{"id":"2081922248781656072","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"党员受到撤销党内职务处分，一年内不得在党内担任和向党外组织推荐担任与其原任职务相当或者高于其原任职务的职务。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"第十一条：党员受到撤销党内职务处分，二年内不得担任或被推荐担任与其原任职务相当或者高于原任职务的职务。题干称“一年”，因此错误。","wrong":1,"cat":"党建修养与合规基础"},{"id":"2085294560759300104","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"为企业提供内部控制审计服务的会计师事务所，也可以同时为同一企业提供内部控制评价服务。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业可以委托中介机构实施内部控制评价。为企业提供内部控制审计服务的会计师事务所，不得同时为同一企业提供内部控制评价服务。","wrong":1,"cat":"审计"},{"id":"2085294560759300101","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业实施内部控制评价时应当遵循重要性原则，即评价工作应当准确地揭示经营管理的风险状况，如实反映内部控制设计与运行的有效性。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"重要性原则是指评价工作应当在全面评价的基础上，关注重要业务单位、重大业务事项和高风险领域。","wrong":1,"cat":"审计"},{"id":"2085294560755105810","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业研究项目提出立项申请并编制可行性研究报告后，必须组织独立于申请及立项审批之外的专业机构和人员进行评估论证。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《企业内部控制应用指引第10号——研究与开发》第五条规定，企业可以组织独立于申请及立项审批之外的专业机构和人员进行评估论证，并非必须，所以该说法错误。","wrong":1,"cat":"综合实务"},{"id":"2085294560755105808","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"对于被担保人出现财务状况恶化、资不抵债、破产清算等情形的，基于谨慎性原则企业应当在损失实际发生时合理确认相应的负债。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"对于被担保人出现财务状况恶化、资不抵债、破产清算等情形的，企业应当根据国家统一的会计准则制度规定，合理确认预计负债和损失。","wrong":1,"cat":"财务会计"},{"id":"2085294560755105807","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《企业内部控制应用指引第12号——担保业务》规定的担保，是指企业作为担保人按照公平、自愿、互利的原则与债务人约定，当债务人不履行债务时，依照法律规定和合同协议承担相应法律责任的行为。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"担保，是指企业作为担保人按照公平、自愿、互利的原则与债权人约定，当债务人不履行债务时，依照法律规定和合同协议承担相应法律责任的行为。","wrong":1,"cat":"经济法与财经法规"},{"id":"2085294560750911499","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《企业内部控制应用指引第7号——采购业务》的规定，企业应当加强物资采购供应过程的管理，依据采购合同中确定的主要条款跟踪合同履行情况，对有可能影响生产或工程进度的异常情况，应及时进行汇报。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业应当加强物资采购供应过程的管理，依据采购合同中确定的主要条款跟踪合同履行情况，对有可能影响生产或工程进度的异常情况，应出具书面报告并及时提出解决方案。","wrong":1,"cat":"企业文化与战略管理"},{"id":"2085294560750911498","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业应当重视采购付款的过程控制和跟踪管理，发现异常情况的，应当拒绝付款，避免出现资金损失和信用受损。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"企业应当重视采购付款的过程控制和跟踪管理，发现异常情况的，应当拒绝付款，避免出现资金损失和信用受损。","wrong":1,"cat":"财务会计"},{"id":"2085294560750911497","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《企业内部控制应用指引第6号——资金活动》，企业选择投资项目应当突出主业，不得从事股票投资或衍生金融产品等高风险投资。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业选择投资项目应当突出主业，谨慎从事股票投资或衍生金融产品等高风险投资。","wrong":1,"cat":"企业文化与战略管理"},{"id":"2085294560750911496","bank":"决赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","st
