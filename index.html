<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>错题训练系统</title>
<style>
:root{
  --bg:#eef1f7;--card:#ffffff;--pri:#2f6fed;--pri2:#1d54c9;--pri-l:#eaf1ff;
  --txt:#1b2436;--sub:#69748a;--line:#e6eaf2;--muted:#f5f7fb;
  --ok:#12a150;--okbg:#e8f8ee;--okline:#b8e7cb;
  --bad:#e0453f;--badbg:#fdeceb;--badline:#f6c3c0;
  --warn:#e8890c;--shadow:0 4px 16px rgba(28,45,90,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--txt);font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;padding:14px 13px calc(30px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.tt{font-size:20px;font-weight:700;letter-spacing:.3px}
.ts{font-size:12.5px;color:var(--sub);margin-top:3px}
/* 顶部 */
.topbar{padding:6px 4px 14px}
/* 统计 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}
.sbox{background:var(--card);border-radius:13px;padding:11px 6px;text-align:center;box-shadow:var(--shadow)}
.sbox b{display:block;font-size:20px;font-weight:700;line-height:1.25}
.sbox span{font-size:11.5px;color:var(--sub)}
.sbox.g b{color:var(--ok)}.sbox.r b{color:var(--bad)}.sbox.p b{color:var(--pri)}
/* 总进度 */
.pwrap{background:var(--card);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);margin-bottom:13px}
.pwrap .pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:8px}
.bar{height:8px;border-radius:6px;background:var(--muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#4f8bff,#2f6fed);transition:width .35s}
/* 按钮 */
.btn{border-radius:11px;padding:12px 14px;font-size:14.5px;font-weight:600;text-align:center}
.btn-pri{background:var(--pri);color:#fff}
.btn-pri:active{background:var(--pri2)}
.btn-warn{background:#fff4e5;color:var(--warn);border:1px solid #f6d9ab}
.btn-ghost{background:var(--card);color:var(--sub);border:1px solid var(--line)}
.btn-block{display:block;width:100%}
.act-row{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-bottom:18px}
.act-row .btn{padding:13px}
/* 模块卡片 */
.section-title{font-size:13px;font-weight:700;color:var(--sub);margin:4px 4px 9px;letter-spacing:.4px}
.cat{background:var(--card);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:transform .12s}
.cat:active{transform:scale(.985)}
.cat .ico{width:38px;height:38px;border-radius:11px;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex:0 0 auto}
.cat .mid{flex:1;min-width:0}
.cat .nm{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
.cat .nm em{font-style:normal;font-size:11px;color:var(--warn);background:#fff4e5;border-radius:6px;padding:1px 6px;font-weight:600}
.cat .mini{display:flex;align-items:center;gap:8px;margin-top:7px}
.cat .mini .bar{flex:1;height:6px}
.cat .mini small{font-size:11px;color:var(--sub);white-space:nowrap}
.cat .arw{color:#c2cadb;font-size:18px;flex:0 0 auto}
/* 答题页 */
.qhead{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.qhead .bk{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--sub);flex:0 0 auto}
.qhead .qt{flex:1;min-width:0}
.qhead .qt .t1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qhead .qt .t2{font-size:11.5px;color:var(--sub);margin-top:2px}
.qhead .pg{font-size:12.5px;color:var(--pri);font-weight:700;background:var(--pri-l);border-radius:8px;padding:5px 9px;flex:0 0 auto}
.cardq{background:var(--card);border-radius:15px;padding:16px 15px;box-shadow:var(--shadow)}
.badge{display:inline-block;font-size:11px;font-weight:600;color:var(--pri);background:var(--pri-l);border-radius:7px;padding:2px 8px;margin-bottom:9px}
.stem{font-size:16px;line-height:1.68;font-weight:500;word-break:break-word}
.opts{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:#fcfdff;border-radius:12px;padding:12px 13px;font-size:15px;line-height:1.55;transition:.15s;word-break:break-word}
.opt .key{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--muted);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:1px}
.opt .otext{flex:1}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.sel .key{background:var(--pri);color:#fff}
.opt.correct{border-color:var(--okline);background:var(--okbg)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--badline);background:var(--badbg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.disabled{opacity:1}
.fb{margin-top:15px;border-radius:13px;padding:13px 14px;font-size:14px;line-height:1.62}
.fb.ok{background:var(--okbg);border:1px solid var(--okline)}
.fb.bad{background:var(--badbg);border:1px solid var(--badline)}
.fb .ttl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.fb.ok .ttl{color:var(--ok)}.fb.bad .ttl{color:var(--bad)}
.fb .ansline{margin-top:7px;font-size:13.5px;color:var(--txt)}
.fb .ansline b{color:var(--pri)}
.fb .exp{margin-top:9px;padding-top:9px;border-top:1px dashed rgba(0,0,0,.1);color:#2a3550;font-size:13.5px;line-height:1.7;word-break:break-word}
.fb .exp .lbl{color:var(--sub);font-weight:600}
.qfoot{margin-top:16px}
.hint{text-align:center;color:var(--sub);font-size:12.5px;margin-top:12px}
/* 结果页 */
.result{background:var(--card);border-radius:16px;padding:26px 18px;box-shadow:var(--shadow);text-align:center}
.result .big{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.result .rk{font-size:14px;color:var(--sub);margin-top:6px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.rgrid .rb{background:var(--muted);border-radius:12px;padding:12px 4px}
.rgrid .rb b{display:block;font-size:22px;font-weight:700}
.rgrid .rb span{font-size:11.5px;color:var(--sub)}
.rgrid .rb.g b{color:var(--ok)}.rgrid .rb.r b{color:var(--bad)}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(20,30,55,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.dlg{background:#fff;border-radius:15px;padding:20px;max-width:340px;width:100%;text-align:center}
.dlg .dt{font-weight:700;font-size:16px}
.dlg .dc{font-size:13.5px;color:var(--sub);margin:10px 0 18px}
.dlg .dr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}
.cont{font-style:normal;font-size:11px;color:var(--pri);background:var(--pri-l);border-radius:6px;padding:1px 6px;font-weight:600}
</style>
</head>

中央关于坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化若干重大问题的决定》"},{"k":"B","t":"《中共中央关于深化党和国家机构改革的决定》"},{"k":"C","t":"《中共中央关于进一步全面深化改革、推进中国式现代化的决定》"},{"k":"D","t":"《中共中央关于制定国民经济和社会发展第十四个五年规划和二〇三五年远景目标的建议》"}],"ans":"C","exp":"全会听取和讨论了习近平受中央政治局委托所作的工作报告，审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》。","wrong":1,"cat":"党建修养与合规基础"},{"id":"2081922248777461786","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"主动交代本人应当受到党纪处分的问题的党员，可以（）处分。","opts":[{"k":"A","t":"从轻"},{"k":"B","t":"减轻"},{"k":"C","t":"从轻或者减轻"},{"k":"D","t":"免于"}],"ans":"C","exp":"第十七条：有下列情形之一的，可以从轻或者减轻处分：（一）主动交代本人应当受到党纪处分的问题；（二）在组织谈话函询、初步核实、立案审查过程中，能够配合核实审查工作，如实说明本人违纪违法事实；（三）检举同案人或者其他人应当受到党纪处分或者法律追究的问题，经查证属实，或者有其他立功表现；（四）主动挽回损失、消除不良影响或者有效阻止危害结果发生；（五）主动上交或者退赔违纪所得；（六）党内法规规定的其他从轻或者减轻处分情形。","wrong":1,"cat":"党建修养与合规基础"},{"id":"2081922248777461785","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某部门党员（无党内职务）存在违反组织纪律的行为，应给予其警告处分；还存在违反廉洁纪律的行为，应给予其严重警告处分。最终应给予其（）处分。","opts":[{"k":"A","t":"留党察看"},{"k":"B","t":"严重警告，如果其在党外组织担任职务的，应当建议党外组织撤销党外职务"},{"k":"C","t":"警告"},{"k":"D","t":"开除党籍"}],"ans":"B","exp":"第十一条：撤销党内职务处分，是指撤销受处分党员由党内选举或者组织任命的党内职务。对于在党内担任两个以上职务的，党组织在作处分决定时，应当明确是撤销其一切职务还是一个或者几个职务。如果决定撤销其一个职务，必须撤销其担任的最高职务。如果决定撤销其两个以上职务，则必须从其担任的最高职务开始依次撤销。对于在党外组织担任职务的，应当建议党外组织撤销其党外职务。 对于在立案审查中因涉嫌违反党纪被免职的党员，审查后依照本条例规定应当给予撤销党内职务处分的，应当按照其原任职务给予撤销党内职务处分。对于应当受到撤销党内职务处分，但是本人没有担任党内职务的，应当给予其严重警告处分。同时，在党外组织担任职务的，应当建议党外组织撤销其党外职务。 党员受到撤销党内职务处分，或者依照前款规定受到严重警告处分的，二年内不得在党内担任和向党外组织推荐担任与其原任职务相当或者高于其原任职务的职务。\n第二十四条：一人有本条例规定的两种以上应当受到党纪处分的违纪行为，应当合并处理，按其数种违纪行为中应当受到的最高处分加重一档给予处分；其中一种违纪行为应当受到开除党籍处分的，应当给予开除党籍处分。","wrong":1,"cat":"党建修养与合规基础"},{"id":"2081922248777461781","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列选项中，不能直接为预计利润表项目提供数据来源的是（    ）。","opts":[{"k":"A","t":"现金预算"},{"k":"B","t":"产品成本预算"},{"k":"C","t":"销售和管理费用预算"},{"k":"D","t":"直接人工预算"}],"ans":"D","exp":"资金预算可以为预计利润表中的利息费用直接提供数据，选项 A 不当选。产品成本预算可以为预计利润表中的销售成本直接提供数据，选项 B 不当选。销售和管理费用预算可以为预计利润表中的销售和管理费用直接提供数据，选项 C 不当选。直接人工预算不能直接为预计利润表项目提供数据，选项 D 当选。","wrong":1,"cat":"财务会计"},{"id":"2081922248777461779","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"制造业企业在编制预计利润表时，“销售成本”项目数据来源是（）。","opts":[{"k":"A","t":"销售预算"},{"k":"B","t":"生产预算"},{"k":"C","t":"直接材料预算"},{"k":"D","t":"产品成本预算"}],"ans":"D","exp":"本题考查预计利润表的编制。预计利润表中的“销售成本”项目，数据来自于产品成本预算，因为产品成本预算的内容包括单位成本、生产成本、期末存货成本和销货成本，选项D当选。","wrong":1,"cat":"财务会计"},{"id":"2081922248777461772","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"M 国某地区位于地震频发地带，那里的居民具有较强的防震意识，住房普遍采用木质结构，抗震性能优越。不少家庭加装了地震时会自动关闭煤气的仪器，以防范地震带来的相关灾害。根据上述信息，该地区居民采取的风险管理策略工具是（    ）。","opts":[{"k":"A","t":"风险控制"},{"k":"B","t":"风险转移"},{"k":"C","t":"风险规避"},{"k":"D","t":"风险转换"}],"ans":"A","exp":"本题考查风险管理策略。“住房普遍采用木质结构，抗震性能优越”“加装了地震时会自动关闭煤气的仪器”属于控制风险事件发生的动因、环境、条件等，来达到减轻风险事件发生时的损失或降低风险事件发生的概率的目的，体现的是风险控制，选项 A 当选。","wrong":1,"cat":"企业文化与战略管理"},{"id":"2081922248773267477","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在某投资项目的敏感性分析中，以下四个因素的变动对项目利润的影响分别为：销售量变动的敏感系数为0.6，销售单价变动的敏感系数为2.0，单位变动成本变动的敏感系数为-1.5，固定成本变动的敏感系数为-0.8。下列因素中，对利润敏感程度最低的是（  ）。","opts":[{"k":"A","t":"销售量"},{"k":"B","t":"销售单价"},{"k":"C","t":"单位变动成本"},{"k":"D","t":"固定成本"}],"ans":"A","exp":"本题考查利润敏感性分析。利润变动对各因素变动敏感程度的高低要通过敏感系数的绝对值大小来衡量，若绝对值＞1，利润变动幅度大于某因素变动幅度，则为敏感因素；若绝对值＜1，利润变动幅度小于某因素变动幅度，则为不敏感因素。绝对值越大，表明该因素对利润的影响程度越高。本题中，各因素对利润敏感程度排序为单价＞单位变动成本＞固定成本＞销售量，选项A当选。","wrong":1,"cat":"管理会计"},{"id":"2081922248773267474","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在企业的日常经营管理工作中，成本管理工作的起点是（    ）。","opts":[{"k":"A","t":"成本预测"},{"k":"B","t":"成本核算"},{"k":"C","t":"成本控制"},{"k":"D","t":"成本分析"}],"ans":"A","exp":"本题考查成本管理的内容。成本预测是进行成本管理的第一步，即成本管理工作的起点是成本预测，选项A当选。","wrong":1,"cat":"管理会计"},{"id":"2081922248773267469","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"对于生产多种产品的企业而言，如果能够将固定成本在各种产品之间进行合理分配，则比较适用的综合保本分析方法是（    ）。","opts":[{"k":"A","t":"联合单位法"},{"k":"B","t":"主要产品法"},{"k":"C","t":"加权平均法"},{"k":"D","t":"分算法"}],"ans":"D","exp":"本题考查多品种盈亏平衡分析。联合单位法是指在事先确定各种产品间产销实物量比例的基础上，将各种产品产销实物量的最小比例作为一个联合单位，确定每一联合单位的单价、单位变动成本，进行本量利分析的一种分析方法，选项A不当选。主要产品法是指在企业产品品种较多的情况下，如果存在一种产品是主要产品，它提供的边际贡献占企业边际贡献总额的比重较大，代表了企业产品的主导方向，则可以按该主要品种的有关资料进行本量利分析，视同于单一品种，选项B不当选。加权平均法是指在掌握每种单一产品的边际贡献率的基础上，按各种产品销售额的比重进行加权平均，据以计算综合边际贡献率，从而确定多产品组合的盈亏平衡点，选项C不当选。分算法是在一定条件下，将全部固定成本按一定标准在各种产品之间进行合理分配，确定每种产品应补偿的固定成本数额，然后再对每一种产品按单一品种条件下的情况分别进行本量利分析的方法，选项D当选。","wrong":1,"cat":"管理会计"},{"id":"2081922248769073179","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司向银行借款2 000万元，期限为1年，年利率为6.5%，银行要求的补偿性余额比例为12%，则该借款的实际利率为（   ）。","opts":[{"k":"A","t":"7.28%"},{"k":"B","t":"6.5%"},{"k":"C","t":"7.39%"},{"k":"D","t":"12%"}],"ans":"C","exp":"本题考查的是短期借款实际利率的计算。借款的实际利率=6.5%/（1-12%）=7.39%，选项C当选。提示：计算“实际利率”时，不需要扣除所得税。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922248769073175","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司资产总额为10 000万元，其中永久性流动资产为2 800万元，临时性流动资产为1 600万元，该公司长期资金来源金额为8 100万元，不考虑其他情形，可以判断该公司的融资策略属于（    ）。","opts":[{"k":"A","t":"匹配融资策略"},{"k":"B","t":"保守融资策略"},{"k":"C","t":"激进融资策略"},{"k":"D","t":"宽松融资策略"}],"ans":"C","exp":"本题考查流动资产的融资策略。长期需求=永久性流动资产+非流动资产=2 800+（10 000-2 800-1 600）=8 400（万元），长期供给=长期资金来源=8 100（万元），因为长期供给＜长期需求，故属于激进融资策略，选项C当选。","wrong":1,"cat":"财务管理"},{"id":"2081922248769073168","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司拟进行一项固定资产投资决策，项目资本成本为10%，有四个方案可供选择。其中甲方案的现值指数为0.86；乙方案的内含收益率为9%；丙方案的寿命期为10年，净现值为960万元，（P/A，10%，10）=6.1446；丁方案的寿命期为11年，年金净流量为136.23万元。最优的投资方案是（  ）。","opts":[{"k":"A","t":"甲方案"},{"k":"B","t":"乙方案"},{"k":"C","t":"丙方案"},{"k":"D","t":"丁方案"}],"ans":"C","exp":"甲方案现值指数小于1，乙方案的内含收益率小于资本成本，两个方案均不可行；丙方案的年金净流量=960/（P/A，10%，10）=960/6.1446=156.23（万元），高于丁方案的年金净流量136.23万元，应该选择丙方案。","wrong":1,"cat":"财务管理"},{"id":"2081922248764878864","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在全面预算体系中，以下不属于总预算的是（  ）。","opts":[{"k":"A","t":"生产预算"},{"k":"B","t":"资金预算"},{"k":"C","t":"预计资产负债表"},{"k":"D","t":"预计利润表"}],"ans":"A","exp":"本题考查全面预算体系。总预算又称为财务预算，具体包括资金预算、预计利润表和预计资产负债表，选项BCD不当选。分预算包括经营预算和专门决策预算，生产预算属于经营预算，选项A当选。","wrong":1,"cat":"财务会计"},{"id":"2081922248760684564","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业取得的金融资产，如果能够消除或显著减少会计错配，企业可以在初始确认时，将其直接指定为（ ）。","opts":[{"k":"A","t":"以摊余成本计量的金融资产"},{"k":"B","t":"以公允价值计量且其变动计入其他综合收益的金融资产"},{"k":"C","t":"以公允价值计量且其变动计入当期损益的金融负债"},{"k":"D","t":"以公允价值计量且其变动计入当期损益的金融资产"}],"ans":"D","exp":"如果能够消除或显著减少会计错配，企业可以在初始确认金融资产时，将其直接指定为以公允价值计量且其变动计入当期损益的金融资产。\n会计错配，是指当企业以不同的会计确认方法和计量属性对在经济上相关的资产或负债进行确认或计量由此产生的利得或损失时，可能导致的会计确认和计量上的不一致。","wrong":1,"cat":"财务会计"},{"id":"2081922248756490263","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列财务指标中，最能反映企业即时偿付短期债务能力的是（  ）。","opts":[{"k":"A","t":"资产负债率"},{"k":"B","t":"流动比率"},{"k":"C","t":"权益乘数"},{"k":"D","t":"现金比率"}],"ans":"D","exp":"本题考查偿债能力分析。资产负债率和权益乘数反映企业长期偿债能力，选项AC不当选。流动比率反映企业短期偿债能力，但相较于流动比率，现金比率还剔除了存货和应收账款对偿债能力的影响，最能反映企业直接偿付流动负债的能力，选项D当选、选项B不当选。","wrong":1,"cat":"财务管理"},{"id":"2081922248752295958","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在下列业绩评价指标中，最适合评价利润中心部门业绩的是（    ）。","opts":[{"k":"A","t":"可控边际贡献"},{"k":"B","t":"部门边际贡献"},{"k":"C","t":"投资收益率"},{"k":"D","t":"剩余收益"}],"ans":"B","exp":"本题考查利润中心。可控边际贡献反映了部门经理在其权限和控制范围内有效使用资源的能力，所以可控边际贡献是最适合评价利润中心部门经理的业绩评价指标，选项A不当选。部门边际贡献反映了部门为企业利润和弥补与生产能力有关的成本所作的贡献，用于评价部门业绩而不是利润中心管理者的业绩，选项B当选。投资收益率和剩余收益均为评价投资中心业绩的指标，选项CD不当选。","wrong":1,"cat":"管理会计"},{"id":"2081922248748101644","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司2012年财务报告批准报出日为2013年4月25日。2013年3月2日，甲公司发现2012年度一项财务报表舞弊或差错，该公司应调整（ ）。","opts":[{"k":"A","t":"2012年资产负债表的期末余额"},{"k":"B","t":"2012年资产负债表的年初余额"},{"k":"C","t":"2012年利润表上期金额"},{"k":"D","t":"2013年资产负债表的期末余额和本年累计数及本年实际数"}],"ans":"A","exp":"此调整事项，应调整利润表的本期金额，不是上期金额。","wrong":1,"cat":"财务会计"},{"id":"2081922248743907347","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业发生下列交易或事项，属于会计估计变更的是（    ）。","opts":[{"k":"A","t":"投资性房地产由成本模式进行后续计量变更为公允价值模式进行后续计量"},{"k":"B","t":"金融资产由四分类变更为三分类"},{"k":"C","t":"坏账准备的计提由账龄分析法改为预期信用损失法"},{"k":"D","t":"存货发出计量方法由先进先出法改为月末一次加权平均法"}],"ans":"C","exp":"本题考查会计政策变更、会计估计变更的辨别。会计政策变更，是指企业对相同的交易或事项由原来采用的会计政策改用另一会计政策的行为；会计估计变更，是指由于资产和负债的当前状况及预期经济利益和义务发生了变化，从而对资产或负债的账面价值或者资产的定期消耗金额进行调整。选项 C 属于会计估计变更，原因在于坏账准备计提方法的改变属于对资产的账面价值或者资产的定期消耗金额进行调整，选项 C 当选；选项 ABD 属于会计政策变更，选项 ABD 不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922248739713051","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各情形中，不能表明存货的可变现净值为零的是（ ）。","opts":[{"k":"A","t":"因大雨影响而滞销的葡萄已霉烂变质"},{"k":"B","t":"X机床的生产已不再需要Z配件，并且该配件也无其他利用和转让价值"},{"k":"C","t":"被替换的可以低价销售的汽车发动机"},{"k":"D","t":"已过保质期且不能再出售的面包"}],"ans":"C","exp":"选项C，可以低价销售，说明还有转让价值，存货的可变现净值不为零。\n【提示】存货存在下列情形之一的，通常表明存货的可变现净值为零：（1）已霉烂变质的存货；（2）已过期且无转让价值的存货；（3）生产中已不再需要，并且已无使用价值和转让价值的存货；（4）其他足以证明已无使用价值和转让价值的存货。","wrong":1,"cat":"财务会计"},{"id":"2081922248735518721","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司的投资性房地产采用公允价值计量模式。2×18年6月23日，该公司将一项固定资产转换为投资性房地产。该固定资产的账面余额为400万元，已提折旧80万元，已经计提减值准备30万元。该项房地产在当日的公允价值为330万元。关于转换日的处理，下列各项表述中，正确的是（ ）。","opts":[{"k":"A","t":"计入公允价值变动损益的金额为40万元"},{"k":"B","t":"投资性房地产的入账价值为290万元"},{"k":"C","t":"该项房地产在转换日的处理不影响当期损益"},{"k":"D","t":"该事项属于会计政策变更"}],"ans":"C","exp":"自用房地产转换为采用公允价值模式计量的投资性房地产时，投资性房地产应该按照转换当日的公允价值计量，公允价值小于账面价值的差额计入公允价值变动损益，公允价值大于账面价值的差额计入所有者权益（其他综合收益），本题中公允价值330万元大于账面价值290万元，差额计入所有者权益（其他综合收益），因此转换当日的处理，不影响当期损益。 会计分录如下：借：投资性房地产——成本 330  累计折旧 80  固定资产减值准备 30  贷：固定资产  400    其他综合收益 40","wrong":1,"cat":"财务会计"},{"id":"2081922248731324438","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不属于投资性房地产的是（ ）。","opts":[{"k":"A","t":"房地产企业开发的已出租的房屋"},{"k":"B","t":"持有并准备增值后转让的房屋建筑物"},{"k":"C","t":"以经营租赁方式租出的写字楼"},{"k":"D","t":"持有并准备增值后转让的土地使用权"}],"ans":"B","exp":"选项B，建筑物本身没有增值空间，增值的是土地使用权。炒房的增值空间最主要的因素是其中包含的土地使用权，单就建筑物本身而言，只会随着时间的流逝而老化贬值，所以持有并准备增值后转让的建筑物不属于投资性房地产，作为一般企业的固定资产核算（房地产开发企业，是作为存货核算）。","wrong":1,"cat":"财务会计"},{"id":"2081922248722935818","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2018年12月31日，企业某项固定资产的公允价值为1000万元。预计处置费用为100万元，预计未来现金流量的现值为960万元。当日，该项固定资产的可收回金额为（   ）万元。","opts":[{"k":"A","t":"860"},{"k":"B","t":"900"},{"k":"C","t":"960"},{"k":"D","t":"1000"}],"ans":"C","exp":"可收回金额为公允价值减去处置费用后的净额与预计未来现金流量的现值两者之间较高者确定，其中公允价值减去处置费用后的净额=1 000-100=900（万元），预计未来现金流量现值为960万元，所以该固定资产的可收回金额为960万元，选项C正确。","wrong":1,"cat":"财务会计"},{"id":"2081922248714547214","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于企业具有融资性质的分期收款销售商品会计处理的表述中，不正确的是（    ）。","opts":[{"k":"A","t":"应收的合同价款与其现销价格之间的差额应计入未实现融资收益"},{"k":"B","t":"应收的合同价款与其现销价格之间的差额在合同期内摊销时应冲减财务费用"},{"k":"C","t":"按照合同约定的收款日期分期确认收入"},{"k":"D","t":"按照应收的合同价款的现销价格计量收入"}],"ans":"C","exp":"本题考查交易价格的确定，具体涉及重大融资成分。本题属于否定式提问。合同中存在重大融资成分的，企业应当按照假定客户在取得商品控制权时即以现金支付的应付金额（现销价格）确定交易价格（选项 D 不当选），应收的合同或协议价款与现销价之间的差额确认为未实现融资收益（选项 A 不当选），在合同或协议期间内，按实际利率法进行摊销并冲减财务费用（选项 B 不当选）；具有融资性质的分期收款销售商品，在商品控制权转移时确认收入，选项 C 当选。","wrong":1,"cat":"财务会计"},{"id":"2081922248710352911","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于一般借款资本化的说法中，正确的是（ ）。","opts":[{"k":"A","t":"一般借款利息资本化金额为累计资产支出超过一般借款部分的资产支出加权平均数乘以所占用一般借款的资本化率"},{"k":"B","t":"所占用一般借款为外币的，外币本金和利息汇兑差额应该资本化"},{"k":"C","t":"所占用一般借款的本金加权平均数不用考虑暂停资本化期间"},{"k":"D","t":"每一会计年度期间的一般借款利息资本化金额不应超过当期一般借款实际发生的利息费用"}],"ans":"D","exp":"选项A，一般借款资本化金额为累计资产支出超过专门借款部分的资产支出加权平均数乘以所占用一般借款的资本化率；选项B，外币一般借款的本金及利息的汇兑差额全部费用化；外币专门借款的本金及利息的汇兑差额，符合资本化条件的资本化。选项C，所占用一般借款的本金加权平均数应该考虑暂停资本化期间。累计资产支出超过专门借款部分的资产支出加权平均数需要考虑暂停资本化期间，一般借款的资本化率就不再考虑。","wrong":1,"cat":"财务会计"},{"id":"2081922248710352908","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"A公司于2×19年2月1日经临时股东大会批准，决定建造一栋办公楼，为此于2×19年2月15日向某银行申请贷款8 000万元；2×19年3月1日工程动工兴建，并于当日领用自产建材一批，共计80万元；2×19年4月1日，上述贷款获准发放到位，并于当日开始计息；2×19年4月15日支付在建工程人员职工薪酬95万元。除上述专门借款外，该项工程未占用其他借款；预计工期为2年。不考虑其他因素，则该项工程借款费用开始资本化的时点为（ ）。","opts":[{"k":"A","t":"2×19年2月15日"},{"k":"B","t":"2×19年3月1日"},{"k":"C","t":"2×19年4月1日"},{"k":"D","t":"2×19年4月15日"}],"ans":"C","exp":"开始资本化时点需要同时满足为使资产达到预定可使用或可销售状态所必要的购建或生产活动已经开始（2×19年3月1日）、资产支出已经发生（2×19年3月1日）、借款费用已经发生（2×19年4月1日）三个条件，按照三者的孰晚日确认为开始资本化条件的时点。\n【注意】2×19年2月15日向某银行申请贷款，只是提交申请，并没有实际取得借款而发生借款费用，因此不满足借款费用已经发生的条件；2×19年4月1日，贷款获准发放到位，此时借款费用已经发生；2×19年3月1日领用自产建材一批，此时资产已经支出；2×19年4月15日，支付在建工程人员职工薪酬，此时借款费用资本化已经开始，当有多笔资产支出的时候，按照第一笔资产支出发生的时间为基础确定资本化开始时点的条件。\n【提示】资产支出包括为构建或者生产符合资本化条件的资产而以支付现金、转移非现金资产承担带息债务形式发生的支出：①支付现金指用货币资金支付符合资本化条件的资产的构建或生产支出，如：用银行存款购买工程材料。②转移非现金资产指企业将自己的非现金资产直接用于符合资本化条件的资产的建造安装和生产。③承担带息债务形式发生的支出指的是企业为购买工程物资而承担的带息应付款项。","wrong":1,"cat":"财务会计"},{"id":"2081922248404168731","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于债务重组中债务人以资产清偿债务的表述中，不正确的是（    ）。","opts":[{"k":"A","t":"以存货进行清偿无须确认收入"},{"k":"B","t":"以无形资产进行清偿，应将无形资产的账面价值与清偿债务的账面价值的差额计入资产处置损益"},{"k":"C","t":"以固定资产进行清偿所发生的清理费用影响债务重组损益"},{"k":"D","t":"以其他债权投资进行清偿，原计入其他综合收益的金额应结转至投资收益"}],"ans":"B","exp":"本题考查债务重组中债务人以资产清偿债务的会计处理。本题属于否定式提问。以存货进行清偿债务的，应将清偿债务的账面价值与存货账面价值的差额确认为其他收益，无须确认收入和结转成本，选项 A 不当选；以无形资产进行清偿，应将无形资产的账面价值与清偿债务的账面价值的差额计入其他收益，选项 B 当选；以固定资产清偿债务的，支付的清理费用计入固定资产清理，构成固定资产账面价值，固定资产账面价值与清偿债务账面价值的差额计入其他收益，选项 C 不当选；以其他债权投资清偿债务的，应将原计入其他综合收益的金额转入投资收益，选项 D 不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922248399974422","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于非货币性资产交换的确认和计量原则，下列表述不正确的是（ ）。","opts":[{"k":"A","t":"具有商业实质的非货币性资产交换，换入资产和换出资产公允价值均能够可靠计量的，应当以换出资产公允价值作为确定换入资产成本的基础"},{"k":"B","t":"不具有商业实质或交换涉及资产的公允价值均不能可靠计量的非货币性资产交换，应当按照换入资产的账面价值作为换入资产的成本"},{"k":"C","t":"以账面价值计量的非货币性资产交换，无论是否涉及补价，均不确认损益"},{"k":"D","t":"以换出资产的公允价值为基础计量的，收到或支付的补价是确定换入资产成本的调整因素"}],"ans":"B","exp":"选项B，不具有商业实质或交换涉及资产的公允价值均不能可靠计量的非货币性资产交换，应当按照换出资产的账面价值作为换入资产成本的计量基础。","wrong":1,"cat":"财务会计"},{"id":"2081922248395780119","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据公司法律制度的规定，下列关于股份有限公司股份转让的表述中，正确的是（ ）。","opts":[{"k":"A","t":"公司可以接受本公司的股份作为质权的标的"},{"k":"B","t":"公司在任何情况下都不得收购本公司股份"},{"k":"C","t":"股票的转让，由股东以背书方式或者法律、行政法规规定的其他方式进行"},{"k":"D","t":"上市公司董事会秘书不得买卖本公司股票"}],"ans":"C","exp":"本题考查股份转让的限制。选项A错误，公司不得接受本公司的股份作为质权的标的。选项B错误，符合法定情形的，公司可以收购本公司股份。选项D错误，上市公司董事会秘书属于高级管理人员，高级管理人员可以买卖本公司股票，只是特定期限内不得转让。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248395780111","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"陈某因为身为甲公司股东未及时履行出资义务，被公司诉至法院，下列说法中符合公司法律制度规定的是（ ）。","opts":[{"k":"A","t":"陈某以诉讼时效为由进行抗辩，人民法院不予支持"},{"k":"B","t":"陈某以诉讼时效为由进行抗辩，人民法院就应当驳回公司的诉讼请求"},{"k":"C","t":"法院应当直接判决公司胜诉"},{"k":"D","t":"公司提起的该诉讼不符合法律规定"}],"ans":"A","exp":"根据《公司法》司法解释（三）的规定，公司股东未履行或者未全面履行出资义务或者抽逃出资，公司或者其他股东请求其向公司全面履行出资义务或者返还出资，被告股东以诉讼时效为由进行抗辩的，人民法院不予支持。所以本题中选项A是正确的。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248383197206","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司得知乙公司因业务扩张要购置一批打印机，便于当年6月1日致函乙公司，称可以每台1000元的优惠价格出售A型号打印机。乙公司考虑到甲公司生产的产品质量可靠，便于6月2日回函订购30台打印机，但提出每套价格800元，同时要求3个月内将打印机送至乙公司，验货后7日内电汇付款。甲公司收到函件后，于6月4日又发函至乙公司，同意乙公司提出的订货数量、交货时间及方式、付款时间及方式，但同时提出其每台打印机售价1000元已属优惠价格，考虑乙公司订货数量较多，可以按每台打印机900元出售。乙公司6月6日发函表示同意。6月7日，甲公司电话告知乙公司收到6月6日函件。这一过程中属于合同成立的要约的是（ ）。","opts":[{"k":"A","t":"6月1日甲公司发出的函件"},{"k":"B","t":"6月2日乙公司发出的函件"},{"k":"C","t":"6月4日甲公司发出的函件"},{"k":"D","t":"6月6日乙公司发出的函件"}],"ans":"C","exp":"选项A所述6月1日甲公司发出的函件，因为内容不具体，没有数量条款，为要约邀请。选项B所述6月2日乙公司发出的函件该内容包括了合同的标的、数量、价格、履行时间、方式、付款方式等合同主要内容，符合要约生效的条件，为初始要约。选项C所述6月4日甲公司发出的函件，因为甲公司变更了乙公司所提出的价格标准，应为新要约。选项D所述6月6日乙公司发出的函件，对甲公司的提议表示同意，属于承诺行为。根据规定，承诺生效时合同成立。因此，6月4日甲公司发出的函件是该合同成立的要约。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248383197192","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司于6月5日以传真方式向乙公司求购机床，要求“立即回复”。乙公司当日回复“收到传真”。6月10日，甲公司电话催问，乙公司表示同意按甲公司报价出售，要求于6月15日来人商讨合同其他具体内容，签订合同书。6月15日，甲公司派人前往签约，乙公司要求加价，未获同意，乙公司遂拒绝签约。对此，下列说法正确的是（ ）。","opts":[{"k":"A","t":"买卖合同于6月5日成立"},{"k":"B","t":"买卖合同于6月10日成立"},{"k":"C","t":"买卖合同于6月15日成立"},{"k":"D","t":"甲公司有权要求乙公司承担缔约过失责任"}],"ans":"D","exp":"缔约过失责任是指当事人在订立合同过程中，因故意或过失致使合同未成立、未生效、被撤销或无效，给他人造成损失所应承担的损害赔偿责任。本题中乙出尔反尔，故意导致合同不成立，属于恶意磋商，应承担缔约过失责任。【点评】合同成立的时间：①承诺生效时合同成立；②当事人采用合同书形式订立合同的，自当事人均签名、盖章或者按指印时合同成立。若当事人未同时签名等，则以当事人最后一方签名、盖章或者按指印的时间为合同成立时间。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248383197185","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据公司法律制度规定，股东会召集程序违反公司章程的，参会股东可以请求人民法院撤销股东会决议的期限是（ ）。","opts":[{"k":"A","t":"自公司受到损失之日起三十日内"},{"k":"B","t":"自公司受到损失之日起六十日内"},{"k":"C","t":"自决议作出之日起三十日内"},{"k":"D","t":"自决议作出之日起六十日内"}],"ans":"D","exp":"公司股东会、董事会的会议召集程序、表决方式违反法律、行政法规或者公司章程，或者决议内容违反公司章程的，股东自决议作出之日起六十日内，可以请求人民法院撤销。但是，股东会、董事会的会议召集程序或者表决方式仅有轻微瑕疵，对决议未产生实质影响的除外。未被通知参加股东会会议的股东自知道或者应当知道股东会决议作出之日起六十日内，可以请求人民法院撤销；自决议作出之日起一年内没有行使撤销权的，撤销权消灭。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248379002903","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某股份有限公司董事李某执行公司职务时，违反公司章程的规定，给公司造成了损失。王某是该公司连续一年持有10%股份的股东，欲起诉李某。王某的正确做法是（ ）。","opts":[{"k":"A","t":"王某直接以公司的名义起诉李某"},{"k":"B","t":"若王某请求公司董事会起诉李某的口头提议遭拒绝，可以以自己的名义起诉李某"},{"k":"C","t":"如果情况紧急，不立即起诉，公司的损失将难以弥补，王某可以以自己的名义直接起诉李某"},{"k":"D","t":"若王某请求公司监事会的某一监事张某起诉李某的书面提议遭拒绝，可以以自己的名义起诉李某"}],"ans":"C","exp":"股份有限公司的董事、高级管理人员执行公司职务时违反法律、行政法规或者公司章程的规定的，股东通过监事会提起诉讼。如果情况紧急、不立即提起诉讼将会使公司利益受到难以弥补的损害的，股份有限公司连续180日以上单独或者合计持有公司1%以上股份的股东，有权为了公司的利益，以自己的名义直接向人民法院提起诉讼。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248379002896","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《公司法》规定，股份有限公司中有权决议增加注册资本的机构是（ ）。","opts":[{"k":"A","t":"董事会"},{"k":"B","t":"职工代表大会"},{"k":"C","t":"股东会"},{"k":"D","t":"监事会"}],"ans":"C","exp":"增加注册资本，由股东会决议。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248374808600","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×24年6月，甲公司与乙公司签订股权转让框架协议，协议约定将甲公司持有的丁公司20%的股权转让给乙公司，总价款为7亿元，乙公司分三次支付。2×24年支付了第一笔款项2亿元。为保证乙公司利益，甲公司于2×24年11月将其持有的丁公司5%股权过户给乙公司，但乙公司暂时未拥有与该5%股权对应的表决权和利润分配权。假定甲公司、乙公司不存在关联方关系，不考虑其他因素。下列关于2×24年甲公司对该股权转让会计处理的表述中，正确的是（    ）。","opts":[{"k":"A","t":"将实际收到的价款确认为负债"},{"k":"B","t":"将实际收到价款与所对应的 5% 股权投资账面价值的差额确认为股权转让损益"},{"k":"C","t":"将甲公司与乙公司签订的股权转让协议作为或有事项在财务报表附注中披露"},{"k":"D","t":"将转让总价款与对丁公司 20% 股权投资账面价值的差额确认为股权转让损益，未收到的转让款确认为应收款"}],"ans":"A","exp":"本题考查“一揽子交易”的会计处理。因乙公司暂时未拥有与该5%股权对应的表决权和利润分配权，表明该5%股权的风险和报酬尚未转移，不满足长期股权投资终止确认条件，甲公司不能对该5%股权进行终止确认，应将收到的款项作为负债处理，选项A当选，选项D不当选；因不能终止确认，所以不结转长期股权投资的账面价值，选项B不当选；该事项不属于或有事项，选项C不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922248370614279","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业从事下列项目取得的所得中，减半征收企业所得税的是（  ）。","opts":[{"k":"A","t":"饲养家禽"},{"k":"B","t":"远洋捕捞"},{"k":"C","t":"海水养殖"},{"k":"D","t":"种植中药材"}],"ans":"C","exp":"本题考查企业所得税的税收优惠。选项C当选，花卉、茶以及其他饮料作物和香料作物的种植、海水养殖、内陆养殖，减半征收企业所得税。选项ABD不当选，饲养家禽、远洋捕捞和种植中药材免征企业所得税。","wrong":1,"cat":"税务"},{"id":"2081922248366419982","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于企业所得税收入确认的时间的说法中，符合规定的是（    ）。","opts":[{"k":"A","t":"转让股权收入，应于股权变更手续完成的日期确认收入的实现"},{"k":"B","t":"接受捐赠收入，应按照捐赠合同生效的日期确认收入的实现"},{"k":"C","t":"租金收入，应按照合同约定的承租人应付租金的日期确认收入的实现"},{"k":"D","t":"长期为客户提供重复的劳务收取的劳务费，在收到劳务费时确认收入"}],"ans":"C","exp":"选项 A 不当选，转让股权收入，应于转让协议生效且完成股权变更手续时，确认收入的实现。选项 B 不当选，接受捐赠收入，应按照实际收到捐赠资产的日期确认收入的实现。选项 D 不当选，长期为客户提供重复的劳务收取的劳务费，在相关劳务活动发生时确认收入。","wrong":1,"cat":"财务会计"},{"id":"2081922248362225690","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"纳税人提供的下列服务中，可免征增值税的是（    ）。","opts":[{"k":"A","t":"高新技术企业提供的技术转让服务"},{"k":"B","t":"动物诊疗机构提供的动物清洁服务"},{"k":"C","t":"保险公司提供的半年期人身保险服务"},{"k":"D","t":"职业培训机构提供的非学历教育服务"}],"ans":"A","exp":"选项 A 当选，纳税人提供技术转让、技术开发和与之相关的技术咨询、技术服务，免征增值税。选项 B 不当选，家禽、牲畜、水生动物的配种和疾病防治，免征增值税；动物诊疗机构销售动物食品和用品，提供动物清洁、美容、代理看护等服务，应按规定缴纳增值税。选项 C 不当选，保险公司开办的“一年期以上”人身保险产品取得的保费收入，免征增值税。选项 D 不当选，从事“学历教育”的学校提供的教育服务，免征增值税；培训机构提供“非学历教育”服务不属于免征增值税的范围，正常缴纳增值税。","wrong":1,"cat":"税务"},{"id":"2081922248362225687","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"个体工商户的下列行为中，应当视同应税交易缴纳增值税的是（  ）。","opts":[{"k":"A","t":"将购进的货物用于个人消费"},{"k":"B","t":"销售自己使用过的物品"},{"k":"C","t":"将委托加工的货物用于集体福利"},{"k":"D","t":"将购进的货物用于增值税免税项目"}],"ans":"C","exp":"本题考查增值税视同应税交易的规定。选项C当选、选项AD不当选，单位和个体工商户将自产或者委托加工的货物用于集体福利或者个人消费的，视同应税交易，按照规定缴纳增值税，但将“购进”的货物用于集体福利、个人消费或者免征增值税项目的，不视同应税交易，属于进项税额不得抵扣的情形。选项B不当选，个体工商户销售自己使用过的物品，应照常缴纳增值税。","wrong":1,"cat":"税务"},{"id":"2081922248362225679","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某增值税一般纳税人发生的下列应税行为中，应按交通运输服务缴纳增值税的是（    ）。","opts":[{"k":"A","t":"道路通行服务"},{"k":"B","t":"索道运输服务"},{"k":"C","t":"货运场站服务"},{"k":"D","t":"水路运输的光租业务"}],"ans":"B","exp":"选项 B 当选，索道运输服务属于交通运输服务——陆路运输服务。选项 A 不当选，道路通行服务属于现代服务——不动产租赁服务。选项 C 不当选，货运场站服务属于现代服务——物流辅助服务。选项 D 不当选，水路运输的光租业务属于现代服务——动产租赁服务。","wrong":1,"cat":"税务"},{"id":"2081922248362225676","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"境内单位和个人发生的下列跨境应税交易中，适用增值税零税率的是（  ）。","opts":[{"k":"A","t":"标的物完全在境外使用的有形动产租赁服务"},{"k":"B","t":"向境外单位转让完全在境外消费的技术"},{"k":"C","t":"向境外单位提供完全在境外消费的电信服务"},{"k":"D","t":"无运输工具承运业务的经营者提供的国际运输服务"}],"ans":"B","exp":"本题考查跨境应税交易适用增值税零税率和免税情形的辨析。选项B当选，境内单位或者个人跨境销售下列服务、无形资产，税率为零：（1）向境外单位销售的完全在境外消费的研发服务、合同能源管理服务、设计服务、广播影视制作和发行服务、软件服务、电路设计和测试服务、信息系统服务、业务流程管理服务、离岸服务外包业务；（2）向境外单位转让的完全在境外消费的技术；（3）国际运输服务、航天运输服务、对外修理修配服务。选项AC不当选，标的物在境外使用的有形动产租赁服务和向境外单位提供的完全在境外消费的电信服务，属于增值税免税的范围。选项D不当选，无运输工具承运业务下的国际运输服务，应该由境内实际承运人适用增值税零税率，经营者应适用增值税免税政策。","wrong":1,"cat":"税务"},{"id":"2081922248358031384","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列承包经营的情形中，应以发包人为增值税纳税人的是（  ）。","opts":[{"k":"A","t":"以承包人名义对外经营，由承包人承担法律责任的"},{"k":"B","t":"以发包人名义对外经营，由发包人承担法律责任的"},{"k":"C","t":"以发包人名义对外经营，由承包人承担法律责任的"},{"k":"D","t":"以承包人名义对外经营，由发包人承担法律责任的"}],"ans":"B","exp":"本题考查承包经营增值税纳税义务人的确定。选项B当选，单位以承包、承租、挂靠方式经营的，承包人、承租人、挂靠人（以下统称承包人）以发包人、出租人、被挂靠人（以下统称发包人）名义对外经营并由发包人承担相关法律责任的，以该发包人为纳税人，否则，以承包人为纳税人。也就是说只有同时满足以发包人名义对外经营，且发包人承担法律责任这两个条件，才以发包人作为纳税义务人。","wrong":1,"cat":"税务"},{"id":"2081922248358031378","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于车辆购置税减免规定中，正确的是（    ）。","opts":[{"k":"A","t":"节能汽车，减半征收车辆购置税"},{"k":"B","t":"设有固定装置的非运输专用作业车辆，免征车辆购置税"},{"k":"C","t":"回国服务的在外留学人员用现汇进口一辆自用小汽车，免征车辆购置税"},{"k":"D","t":"地铁、轻轨等轨道交通车辆，免征车辆购置税"}],"ans":"B","exp":"选项 A 不当选，节能汽车照常缴纳车辆购置税。需要注意的是，节能汽车减半征收车船税。选项 C 不当选，回国服务的在外留学人员用现汇购买 1 辆个人自用国产小汽车，免征车辆购置税。选项 D 不当选，地铁、轻轨等轨道交通车辆不属于车辆购置税征税范围。","wrong":1,"cat":"税务"},{"id":"2081922248358031367","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于房产税纳税义务发生时间的表述中，正确的是（    ）。","opts":[{"k":"A","t":"纳税人出租房产，自交付出租房产之次月起缴纳房产税"},{"k":"B","t":"纳税人自行新建房屋用于生产经营，从建成之月起缴纳房产税"},{"k":"C","t":"纳税人购置新建商品房，自房产登记机关签发房产权属证书之次月起缴纳房产税"},{"k":"D","t":"纳税人将原有房产用于生产经营，从生产经营之次月起缴纳房产税"}],"ans":"A","exp":"选项 B 不当选，自行新建房屋用于生产经营，从建成之次月起缴纳房产税。选项 C 不当选，纳税人购置新建商品房，应自房屋交付使用之次月起缴纳房产税。选项 D 不当选，纳税人将原有房产用于生产经营，自生产经营之月起缴纳房产税。","wrong":1,"cat":"税务"},{"id":"2081922248358031365","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列企业、事业单位改制重组的行为中，需要缴纳契税的是（    ）。","opts":[{"k":"A","t":"经国务院批准实施债权转股权的企业，对债权转股权后新设立的公司承受原企业的土地、房屋权属"},{"k":"B","t":"母公司以土地、房屋权属向其全资子公司增资"},{"k":"C","t":"以出让方式承受原改制重组企业、事业单位划拨用地"},{"k":"D","t":"债权人承受破产企业抵偿债务的土地、房屋权属"}],"ans":"C","exp":"本题考查企业、事业单位改制重组的契税相关政策。选项C当选，以出让方式或国家作价出资（入股）方式承受原改制重组企业、事业单位划拨用地的，不属于契税免税范围，对承受方应按规定征收契税。选项A不当选，经国务院批准实施债权转股权的企业，对债权转股权后新设立的公司承受原企业的土地、房屋权属，免征契税。选项B不当选，同一投资主体内部所属企业之间土地、房屋权属的划转，包括母公司与其全资子公司之间，同一公司所属全资子公司之间，同一自然人与其设立的个人独资企业、一人有限公司之间土地、房屋权属的划转，免征契税。母公司以土地、房屋权属向其全资子公司增资，视同划转，免征契税。选项D不当选，债权人（包括破产企业职工）承受破产企业抵偿债务的土地、房屋权属，免征契税。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248358031362","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列房地产交易行为中，应当计算缴纳土地增值税的是（  ）。","opts":[{"k":"A","t":"县城居民个人之间互换自有居住用房屋，且经当地税务机关核实属实"},{"k":"B","t":"非营利的慈善组织将合作建造的房屋转让"},{"k":"C","t":"房地产公司出租高档住宅"},{"k":"D","t":"房地产开发企业代客户进行房地产开发，开发完成后向客户收取代建收入"}],"ans":"B","exp":"本题考查土地增值税的征税范围。选项B当选，合作建房后，将合作建造的房屋转让，发生了房屋、土地权属的转移，需要征收土地增值税。选项A不当选，个人互换自有居住用房，属于土地增值税的征收范围，但是有税收优惠，经当地税务机关核实，免征土地增值税。选项CD不当选，出租和代建房行为，由于都没有发生权属的转让，所以不需要缴纳土地增值税。","wrong":1,"cat":"税务"},{"id":"2081922248353837082","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列用地，由省级税务局确定城镇土地使用税减免优惠的是（    ）。","opts":[{"k":"A","t":"市政街道占用土地"},{"k":"B","t":"省级政府自用土地"},{"k":"C","t":"疾病控制机构用地"},{"k":"D","t":"个人办托儿所用地"}],"ans":"D","exp":"本题考查城镇土地使用税的税收优惠。省、自治区、直辖市税务局确定的城镇土地使用税减免优惠：（1）个人所有的居住房屋及院落用地；（2）房产管理部门在房租调整改革前经租的居民住房用地；（3）免税单位职工家属的宿舍用地；（4）集体和个人办的各类学校、医院、托儿所和幼儿园用地（选项D当选）；（5）安置残疾人就业单位的用地。选项ABC不当选，属于法定免征城镇土地使用税的税收优惠。","wrong":1,"cat":"税务"},{"id":"2081922248353837070","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于个人所得税专项附加扣除时限的表述中，符合税法规定的是（  ）。","opts":[{"k":"A","t":"住房贷款利息，扣除时限最长不得超过180个月"},{"k":"B","t":"子女教育，扣除时间为子女年满3周岁当月至全日制学历教育结束的次月"},{"k":"C","t":"同一学历继续教育，扣除时限最长不得超过48个月"},{"k":"D","t":"专业技术人员职业资格继续教育，扣除时间为取得相关证书的次年"}],"ans":"C","exp":"本题考查个人所得税专项附加扣除时限的规定。选项A不当选，住房贷款利息的扣除，为贷款合同约定开始还款的当月至贷款全部归还或贷款合同终止的当月，扣除期限最长不得超过240个月。选项B不当选，子女教育，扣除时间为子女年满3周岁当月至全日制学历教育结束的当月。选项D不当选，职业资格继续教育扣除时限为取得相关证书的当年。","wrong":1,"cat":"税务"},{"id":"2081922248353837064","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列活动所发生的支出中，可以享受研发费用加计扣除的是（  ）。","opts":[{"k":"A","t":"知识产权的申请和注册"},{"k":"B","t":"产品的常规性升级"},{"k":"C","t":"市场调查研究活动"},{"k":"D","t":"对某项科研成果的直接应用"}],"ans":"A","exp":"本题考查研发费用加计扣除的范围和不得享受加计扣除的活动。下列活动不适用税前加计扣除政策：（1）产品（服务）的常规性升级。（选项B不当选）（2）对某项科研成果的直接应用。（选项D不当选）（3）企业在商品化后为顾客提供的技术支持活动。（4）对现存产品、服务、技术、材料或工艺流程进行的重复或简单改变。（5）市场调查研究、效率调查或管理研究。（选项C不当选）（6）作为工业（服务）流程环节或常规的质量控制、测试分析、维修维护。（7）社会科学、艺术或人文学方面的研究。","wrong":1,"cat":"税务"},{"id":"2081922248345448475","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不属于企业投资性房地产的是（ ）。","opts":[{"k":"A","t":"企业以经营租赁方式出租的土地使用权"},{"k":"B","t":"企业拥有并自行经营的旅馆"},{"k":"C","t":"企业持有并准备增值后转让的土地使用权"},{"k":"D","t":"企业开发完成后用于出租的房地产"}],"ans":"B","exp":"本题考核投资性房地产的范围。选项B，企业拥有并自行经营的旅馆，其持有目的主要是通过提供客房服务赚取服务收入，所以该旅馆不确认为投资性房地产。","wrong":1,"cat":"财务会计"},{"id":"2081922248341254161","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于职工薪酬的确认和计量，下列说法中不正确的是（ ）。","opts":[{"k":"A","t":"与非累积带薪缺勤相关的职工薪酬已经包括在企业每期向职工发放的薪酬中，不必额外做相应的账务处理"},{"k":"B","t":"对于离职后福利中的设定提存计划，如果预期企业不会在职工提供相关服务的年度报告期结束后12个月内缴齐全部款项的，企业应当按照现值计量应付职工薪酬"},{"k":"C","t":"短期利润分享计划是企业对未来事项的支付义务"},{"k":"D","t":"企业实施的内部退休计划，应当比照辞退福利进行处理"}],"ans":"C","exp":"选项C，短期利润分享计划的确认条件之一，是企业因过去事项导致现在具有支付职工薪酬的法定义务或推定义务。","wrong":1,"cat":"财务会计"},{"id":"2081922248337059856","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于合营安排的表述中，正确的是（    ）。","opts":[{"k":"A","t":"当合营安排未通过单独主体达成时，该合营安排为共同经营"},{"k":"B","t":"合营安排中参与方对合营安排提供担保的，该合营安排为共同经营"},{"k":"C","t":"两个参与方组合能够集体控制某项安排的，该安排构成合营安排"},{"k":"D","t":"合营安排为共同经营的，参与方对合营安排有关的净资产享有权利"}],"ans":"A","exp":"本题考查合营安排的表述。当合营安排未通过单独主体达成时，该合营安排为共同经营，选项A当选；参与方为合营安排提供担保（或提供担保的承诺）的行为本身并不直接导致一项安排被分类为共同经营，选项B不当选；如果存在两个或两个以上的参与方组合能够集体控制某项安排的，不构成共同控制，也不构成合营安排（合营安排是指一项由两个或两个以上的参与方共同控制的安排），选项C不当选；共同经营合营方享有合营安排相关资产且承担该项安排相关负债，合营企业合营方仅对合营安排的净资产享有权利，选项D不当选。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922248328671244","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于或有事项表述中，正确的是（  ）。","opts":[{"k":"A","t":"或有事项负有的义务应仅在基本确定将导致经济利益流出企业时确认为预计负债"},{"k":"B","t":"预计负债的计量应考虑预期处置相关资产时产生的利得"},{"k":"C","t":"预计负债应按照履行相关现时义务所需支出的最佳估计数进行初始计量"},{"k":"D","t":"预计负债应与相关的或有资产抵销后以净额列示"}],"ans":"C","exp":"选项A错误，履行相关义务很可能导致经济利益流出企业时应当确认预计负债，而不是基本确定；选项B错误，确定预计负债的金额不应考虑预期处置相关资产形成的利得；选项D错误，根据资产和负债不能随意抵销的原则，预期可获得的补偿在基本确定能够收到时应当单独确认为一项资产，而不能作为预计负债金额的扣减。","wrong":1,"cat":"财务会计"},{"id":"2081922248328671235","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在资产负债表日至财务报告批准报出日之间发生的下列事项中，不属于资产负债表日后调整事项的是（ ）。","opts":[{"k":"A","t":"证实某项资产在资产负债表日已经发生了减损"},{"k":"B","t":"已确认销售的货物被退回"},{"k":"C","t":"债务人在本年度发生重大安全事故，预计无法偿还报告年度所欠货款"},{"k":"D","t":"已确定将要支付的赔偿额大于资产负债表日的估计金额"}],"ans":"C","exp":"选项C，债务人无法偿还所欠货款是由于本年度所发生的安全事故所引起的，在报告年度资产负债表日并不存在这种状况，因此不能作为日后调整事项处理。","wrong":1,"cat":"财务会计"},{"id":"2081922247770828821","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于会计估计及其变更的表述中，正确的是（ ）。","opts":[{"k":"A","t":"会计估计应以最近可利用的信息或资料为基础"},{"k":"B","t":"对结果不确定的交易或事项进行会计估计会削弱会计信息的可靠性"},{"k":"C","t":"会计估计变更应根据不同情况采用追溯重述或追溯调整法进行处理"},{"k":"D","t":"某项变更难以区分为会计政策变更和会计估计变更的，应作为会计政策变更处理"}],"ans":"A","exp":"选项B，会计估计不会削弱会计信息的可靠性；选项C，会计估计变更应采用未来适用法；选项D，应该作为会计估计变更处理。","wrong":1,"cat":"财务会计"},{"id":"2081922247770828809","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×20年10月12日，A公司董事会作出决议，决定从B公司购入一项大型工程设备W，并计划将其转售给另一客户C公司，该项工程设备已使用3年，预计尚可使用10年。2×20年10月20日，A公司实际购入该项W工程设备。同时，A公司与C公司就转售该项W工程设备而开展的相关谈判已取得实质性进展，预计双方很可能在1个月内签订不可撤销的设备转售合同，并将在1年内将该设备转售给C公司。不考虑其他因素，下列说法中正确的是（ ）。","opts":[{"k":"A","t":"A公司应将取得的W工程设备确认为库存商品"},{"k":"B","t":"A公司应从2×20年11月份开始对W工程设备计提折旧"},{"k":"C","t":"A公司应在2×20年10月20日将W工程设备确认为持有待售资产"},{"k":"D","t":"A公司应在购入W工程设备时先将其确认为固定资产，然后在与C公司签订不可撤销合同时将其转入持有待售资产"}],"ans":"C","exp":"企业专为转售而取得的非流动资产或处置组，在取得日满足“预计出售将在一年内完成”的规定条件，且短期（通常为3个月）内很可能满足持有待售类别的其他划分条件的，企业应当在取得日将其划分为持有待售类别，选项C正确。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247762440194","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×23年12月30日，甲公司以发行新股作为对价，购买乙公司所持丙公司60%股份。乙公司在股权转让协议中承诺，在本次交易完成后的3年内（2×24年至2×26年）丙公司每年净利润不低于5 000万元，若丙公司实际利润低于承诺利润，乙公司将按照两者之间的差额及甲公司作为对价发行时的股票价格计算应返还给甲公司的股份数量，并在承诺期满后一次性予以返还。2×24年，丙公司实际利润低于承诺利润，经双方确认，乙公司应返还甲公司相应的股份数量。该项交易前，甲公司与乙公司不存在关联方关系。不考虑其他因素，下列各项关于甲公司应收取乙公司返还的股份在2×24年12月31日合并资产负债表中列示的项目名称是（    ）。","opts":[{"k":"A","t":"债权投资"},{"k":"B","t":"其他债权投资"},{"k":"C","t":"交易性金融资产"},{"k":"D","t":"其他权益工具投资"}],"ans":"C","exp":"本题考查非同一控制下企业合并或有对价符合资产定义在资产负债表中的列报。或有对价符合资产定义并满足资产确认条件的，购买方应当将符合合并协议约定条件的、可收回的部分已支付合并对价的权利确认为一项资产。因该预期利润未实现的情况是在购买日后新发生的，在购买日后超过12个月且不属于对购买日已存在状况提供的进一步证据，应于资产负债表日将该或有对价公允价值的变动计入当期损益。乙公司对有关利润差额的补偿将以甲公司不确定的股份数量支付，该或有对价属于金融工具，应当按照金融工具的原则进行处理，将其作为以公允价值计量且其变动计入当期损益的金融资产核算，在资产负债表中列示为“交易性金融资产”项目，选项C当选，选项ABD不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922247758245914","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于企业合并中或有对价会计处理的表述中，正确的是（   ）。","opts":[{"k":"A","t":"确定同一控制下企业合并形成的长期股权投资成本时，应考虑或有对价的影响"},{"k":"B","t":"非同一控制下企业合并形成的或有对价，若购买方根据标的公司的业绩情况确定收回自身股份的数量，购买方于购买日应确认为权益工具"},{"k":"C","t":"同一控制下企业合并形成的或有对价结算时产生的差额应计入所有者权益"},{"k":"D","t":"企业可将非同一控制下企业合并形成的或有对价指定为以公允价值计量且其变动计入其他综合收益的金融资产"}],"ans":"C","exp":"同一控制下企业合并形成的长期股权投资成本应以被合并方在最终控制方合并报表中所有者权益账面价值的份额为基础确定，不应考虑或有对价的影响，选项A不当选；非同一控制下企业合并形成的或有对价中，若购买方根据标的公司的业绩情况确定收回自身股份的数量，该或有对价在购买日不满足“固定换固定”的条件，不属于一项权益工具，而是属于一项金融资产，选项B不当选；同一控制下企业合并形成的或有对价结算时产生的差额计入所有者权益（资本公积等），选项C当选；非同一控制下企业合并形成的或有对价应作为以公允价值计量且其变动计入当期损益的金融资产（负债），不得指定，选项D不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922247758245909","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列个人，属于我国个人所得税非居民纳税人的是（  ）。","opts":[{"k":"A","t":"在中国境内有住所但居住不满90天，有来自境内所得的个人"},{"k":"B","t":"2023年10月1日入境履职，2024年5月1日离境的外籍个人"},{"k":"C","t":"在中国境内无住所且不居住，但有来自境外所得的外籍个人"},{"k":"D","t":"2024年6月30日入境履职，截至12月31日尚未离境的外籍个人"}],"ans":"B","exp":"本题考查个人所得税纳税人的判定。选项B当选，一个纳税年度内在中国境内居住累计满183天的个人，为居民个人。该个人在2023年和2024年累计居住均不满183天，属于非居民个人。选项A不当选，该个人在中国境内有住所，属于居民纳税人。选项C不当选，该个人在中国境内既无住所又不居住，且没有来源于我国境内的所得，不属于我国个人所得税的纳税义务人。选项D不当选，2024年该纳税人在中国境内的居住天数是184天，属于居民纳税人。提示：在中国境内停留的当天满24小时的，计入中国境内居住天数；在中国境内停留的当天不足24小时的，不计入中国境内居住天数。","wrong":1,"cat":"税务"},{"id":"2081922247758245904","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业盘盈的固定资产，其计税基础是（  ）。","opts":[{"k":"A","t":"同类固定资产的评估价格"},{"k":"B","t":"该固定资产的公允价值"},{"k":"C","t":"同类固定资产的重置完全价值"},{"k":"D","t":"该固定资产的可变现净值"}],"ans":"C","exp":"本题考查盘盈固定资产计税基础的确定。选项C当选，盘盈的固定资产，以同类固定资产的重置完全价值为计税基础。","wrong":1,"cat":"财务会计"},{"id":"2081922247749857303","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列财务决策方法中，能用于资本结构优化决策，且考虑了风险因素的是（  ）。","opts":[{"k":"A","t":"公司价值分析法"},{"k":"B","t":"平均资本成本比较法"},{"k":"C","t":"每股收益分析法"},{"k":"D","t":"内含收益率法"}],"ans":"A","exp":"资本结构优化的方法包括每股收益分析法、平均资本成本比较法和公司价值分析法，前两种方法都是从账面价值的角度进行资本结构优化分析，没有考虑风险因素。公司价值分析法，是在考虑市场风险的基础上，以公司市场价值为标准，进行资本结构优化，选项A正确。","wrong":1,"cat":"财务管理"},{"id":"2081922247745662996","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"经甲省税务局批准，甲省乙市税务局稽查局对某企业依法作出停止出口退税权的决定，企业对该决定不服的，其申请税务行政复议的被申请人是（    ）。","opts":[{"k":"A","t":"甲省税务局"},{"k":"B","t":"甲省税务局稽查局"},{"k":"C","t":"乙市税务局"},{"k":"D","t":"乙市税务局稽查局"}],"ans":"A","exp":"本题考查税务行政复议申请。选项A当选，税务机关依照法律、法规和规章规定，经上级税务机关批准作出具体行政行为的，批准机关为被申请人。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247745662994","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列行为中，由税务机关责令限期改正，可以处2 000元以下罚款的是（    ）。","opts":[{"k":"A","t":"纳税人不办理税务登记的"},{"k":"B","t":"纳税人拒绝税务机关检查的"},{"k":"C","t":"未按规定设置、保管账簿的"},{"k":"D","t":"未按规定使用税务登记证件的"}],"ans":"C","exp":"本题考查违反税务管理基本规定行为的处罚。选项A不当选，纳税人不办理税务登记的，由税务机关责令限期改正；逾期不改正的，由市场监督管理部门吊销其营业执照。选项B不当选，纳税人、扣缴义务人逃避、拒绝或者以其他方式阻挠税务机关检查的，由税务机关责令改正，可以处1万元以下的罚款；情节严重的，处1万元以上5万元以下的罚款。选项D不当选，纳税人未按照规定使用税务登记证件，处2 000元以上1万元以下的罚款；情节严重的，处1万元以上5万元以下的罚款。","wrong":1,"cat":"税务"},{"id":"2081922247745662989","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列凭证及行为，应缴纳印花税的是（    ）。","opts":[{"k":"A","t":"总公司与分公司书立的作为执行计划使用的凭证"},{"k":"B","t":"境外单位向境内单位提供的完全在境外发生的建设工程服务"},{"k":"C","t":"企业之间书立的明确双方权利义务的订单，但未书立买卖合同"},{"k":"D","t":"进行证券交易的受让方所签订的交易合同"}],"ans":"C","exp":"本题考查印花税征税范围的判定。选项C当选，企业之间书立的确定买卖关系，明确买卖双方权利义务的订单、要货单等单据，且未另外书立买卖合同的，应当缴纳印花税。选项A不当选，总公司与分公司、分公司与分公司之间书立的作为执行计划使用的凭证，不属于印花税的征税范围。选项B不当选，在境外书立在境内使用的应税凭证，应缴纳印花税。但境外单位向境内单位提供的完全在境外发生的服务，不符合在境内使用的条件，不属于印花税的征税范围。选项D不当选，证券交易印花税对证券交易的出让方征收，不对受让方征收。","wrong":1,"cat":"税务"},{"id":"2081922247745662985","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于房产税纳税义务人的表述中，符合税法规定的是（  ）。","opts":[{"k":"A","t":"办公楼抵押的纳税义务人为办公楼抵押权人"},{"k":"B","t":"商铺出典的纳税义务人为商铺产权所有人"},{"k":"C","t":"厂房融资租赁的纳税义务人为出租人"},{"k":"D","t":"厂房出租免租期间的纳税义务人为厂房产权所有人"}],"ans":"D","exp":"本题考查房产税的纳税义务人。选项D当选，房产免租期间的纳税义务人为产权所有人。选项A不当选，办公楼抵押期间的纳税义务人为产权所有人。选项B不当选，产权出典的，纳税义务人为承典人。选项C不当选，融资租赁的房产，纳税义务人为承租人。","wrong":1,"cat":"税务"},{"id":"2081922247741468697","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某国有企业职工张某，于2024年2月因健康原因办理了提前退休手续（至法定退休年龄尚有36个月），取得单位按照统一标准支付的一次性补贴216 000元。当月张某仍按原工资标准从单位领取工资6 500元。关于张某2024年2月收到的提前退休一次性补贴，涉及个人所得税的处理方式，下列选项中正确的是（  ）。","opts":[{"k":"A","t":"个人因办理提前退休取得的一次性补贴免征个人所得税"},{"k":"B","t":"个人因办理提前退休取得的一次性补贴收入和当月的工资、薪金收入并入当年综合所得计算个人所得税"},{"k":"C","t":"个人因办理提前退休取得的一次性补贴收入，不并入当年综合所得，单独适用综合所得税税率表计算个人所得税"},{"k":"D","t":"个人因办理提前退休手续而取得的一次性补贴收入，在计算个人所得税时无须考虑费用扣除标准"}],"ans":"C","exp":"本题考查提前退休取得的一次性补贴的具体规定。选项C当选、选项A不当选，个人因办理提前退休手续而取得的一次性补贴收入，应按照办理提前退休手续至法定离退休年龄之间实际年度数平均分摊，确定适用税率和速算扣除数，单独适用综合所得税率表。选项B不当选，当月的工资、薪金所得和提前退休取得的一次性补贴在计算个人所得税时，分开进行核算。选项D不当选，个人提前退休取得的补贴收入应纳税额=｛［（一次性补贴收入÷办理提前退休手续至法定退休年龄的实际年度数）-费用扣除标准］×适用税率-速算扣除数｝×办理提前退休手续至法定退休年龄的实际年度数，故应考虑费用扣除标准6万元。提示：上述张某2024年2月收到的提前退休一次性补贴应缴纳个人所得税=［（216 000÷3）- 60 000］×3%×3=1 080（元）。","wrong":1,"cat":"税务"},{"id":"2081922247741468695","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某个体工商户发生的下列支出中，允许在个人所得税税前扣除的是（  ）。","opts":[{"k":"A","t":"因违反法规被没收财物的损失"},{"k":"B","t":"直接向某灾区小学的捐赠"},{"k":"C","t":"已缴纳的城市维护建设税及教育费附加"},{"k":"D","t":"代公司员工负担的个人所得税税款"}],"ans":"C","exp":"本题考查个体工商户经营所得中允许扣除项目和不得扣除项目的辨析。选项C当选，城市维护建设税及教育费附加记入“税金及附加”科目，允许税前扣除。选项A不当选，个体工商户被没收财物的损失，不得税前扣除。选项B不当选，直接捐赠支出，不得税前扣除。选项D不当选，个体工商户代其从业人员或者他人负担的个人所得税税款，个人所得税税款属于个人应缴纳的，和企业的生产经营无关，故而不得税前扣除。提示：个体工商户的经营所得允许扣除除个人所得税和允许抵扣的增值税以外的各项税金及附加。","wrong":1,"cat":"税务"},{"id":"2081922247741468691","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《总会计师条例》规定，企业的总会计师由本单位主要行政领导人提名，（  ）。","opts":[{"k":"A","t":"本单位职工代表大会选举产生"},{"k":"B","t":"政府主管部门任命或者聘任"},{"k":"C","t":"财政部直接委派"},{"k":"D","t":"董事会聘任并报国资委备案"}],"ans":"B","exp":"根据《总会计师条例》第十五条规定：\"企业的总会计师由本单位主要行政领导人提名，政府主管部门任命或者聘任；免职或者解聘程序与任命或者聘任程序相同。\"A项、C项和D项均非原文规定的任免方式。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247741468683","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《企业财务会计报告条例》规定，企业年度结账日为公历年度每年的（  ）。","opts":[{"k":"A","t":"4月30日"},{"k":"B","t":"5月31日"},{"k":"C","t":"12月31日"},{"k":"D","t":"6月30日"}],"ans":"C","exp":"原文表述为：\"年度结账日为公历年度每年的12月31日；半年度、季度、月度结账日分别为公历年度每半年、每季、每月的最后1天。\"","wrong":1,"cat":"财务会计"},{"id":"2081922247737274389","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《企业财务会计报告条例》规定，企业在编制年度财务会计报告前进行全面清查资产、核实债务时，下列事项中不属于必须清查核实范畴的是（）。","opts":[{"k":"A","t":"应收款项、应付款项及应交税金的存在性与金额一致性"},{"k":"B","t":"库存商品的实存数量与账面数量是否一致及是否存在报废损失"},{"k":"C","t":"短期借款的借款利率是否符合当前市场平均水平"},{"k":"D","t":"固定资产的实存数量与账面数量是否一致及在建工程实际发生额与账面记录一致性"}],"ans":"C","exp":"利率是否符合市场水平属于借款合同条款的合理性分析，并非资产清查与债务核实的法定必查内容，与《企业财务会计报告条例》规定的清查范围无关,选项C错误。","wrong":1,"cat":"财务会计"},{"id":"2081922247737274383","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《中华人民共和国会计法》规定，未按照规定保管会计资料致使毁损的，情节不严重的，对单位可并处（）以下罚款。","opts":[{"k":"A","t":"5万元"},{"k":"B","t":"20万元"},{"k":"C","t":"50万元"},{"k":"D","t":"100万元"}],"ans":"B","exp":"《中华人民共和国会计法》第四十条,未按照规定保管会计资料，致使会计资料毁损、灭失的，由县级以上人民政府财政部门责令限期改正，给予警告、通报批评，对单位可以并处二十万元以下的罚款。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247737274381","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《中华人民共和国会计法》规定，业务收支以美元为主的单位，其编报的财务会计报告应（）。","opts":[{"k":"A","t":"以美元和人民币同时列示"},{"k":"B","t":"仅以美元列示"},{"k":"C","t":"折算为人民币列示"},{"k":"D","t":"由单位自行选择货币种类"}],"ans":"C","exp":"《中华人民共和国会计法》第十二条，业务收支以人民币以外的货币为主的单位，可以选定其中一种货币作为记账本位币，但是编报的财务会计报告应当折算为人民币。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247733080084","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不属于会计估计变更的是（  ）。","opts":[{"k":"A","t":"因技术发展，无形资产的摊销期限由10年缩短为6年"},{"k":"B","t":"坏账准备由余额百分比法计提变更为账龄分析法计提"},{"k":"C","t":"发出存货的计价方法由先进先出法变更为加权平均法"},{"k":"D","t":"对固定资产计提折旧的方法由年数总和法变更为年限平均法"}],"ans":"C","exp":"会计政策变更，是指企业对相同的交易或事项由原来采用的会计政策改用另一会计政策的行为；会计估计变更，是指由于资产和负债的当前状况及预期经济利益和义务发生了变化，从而对资产或负债的账面价值或者资产的定期消耗金额进行调整。\n选项A：无形资产摊销年限缩短，属于对资产定期消耗金额的调整，是会计估计变更。选项B：坏账准备计提方法变更，是基于更可靠信息对坏账损失的估计调整，属于会计估计变更。选项C：发出存货计价方法变更，属于会计核算规则的改变，是会计政策变更，不属于会计估计变更。选项D：固定资产折旧方法变更，是对资产经济利益实现方式的重新估计，属于会计估计变更。\n综上，答案为C。","wrong":1,"cat":"财务会计"},{"id":"2081922247733080076","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某上市公司财务报告批准报出日为次年4月30日，该公司在资产负债表日后期间发生的以下事项中，不属于非调整事项的是（  ）。","opts":[{"k":"A","t":"董事会通过的资本公积转增股本的方案"},{"k":"B","t":"资产负债表日后期间处置了某子公司"},{"k":"C","t":"上年度售出产品发生的销售退回"},{"k":"D","t":"次年第一季度发生巨额亏损"}],"ans":"C","exp":"资产负债表日后事项分为调整事项和非调整事项，调整事项是对资产负债表日已存在的情况提供了新的证据，需调整报表；非调整事项是日后新发生的事项，不调整报表但需披露。选项A，董事会通过的资本公积转增股本的方案，属于非调整事项。选项B，资产负债表日后期间处置了某子公司，属于非调整事项。选项C，上年度售出产品发生的销售退回，属于资产负债表日后调整事项，不属于非调整事项。选项D，次年第一季度发生巨额亏损，属于非调整事项。综上，答案为C。","wrong":1,"cat":"财务会计"},{"id":"2081922247728885764","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，关于企业发生的与金融工具相关交易费用会计处理的表述正确的是（    ）。","opts":[{"k":"A","t":"发行股票发生的相关交易费用计入财务费用"},{"k":"B","t":"购入股票并将其指定为以公允价值计量且其变动计入其他综合收益的金融资产发生的相关交易费用计入当期损益"},{"k":"C","t":"购入债券并以摊余成本进行后续计量的，发生的相关交易费用计入当期损益"},{"k":"D","t":"分类为以公允价值计量且其变动计入当期损益的金融资产发生的交易费用计入当期损益"}],"ans":"D","exp":"本题考查交易费用的会计处理。发行股票发生的相关交易费用计入权益（资本公积——股本溢价），选项A不当选；购入股票并将其指定为以公允价值计量且其变动计入其他综合收益的金融资产发生的相关交易费用计入资产（其他权益工具投资）成本，选项B不当选；购入债券并以摊余成本进行后续计量的，发生的相关交易费用计入资产（债权投资）成本，选项C不当选；分类为以公允价值计量且其变动计入当期损益的金融资产发生的交易费用计入当期损益（投资收益），选项D当选。","wrong":1,"cat":"财务会计"},{"id":"2081922247724691476","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于企业土地增值税会计处理的表述中正确的是（  ）。","opts":[{"k":"A","t":"房地产企业，由当期收入负担的土地增值税应冲减收入"},{"k":"B","t":"房地产企业，在项目竣工决算后收到退回多交的土地增值税计入利润表的其他收益项目"},{"k":"C","t":"房地产企业，在项目竣工前预售商品房，将预交的土地增值税计入利润表的税金及附加项目"},{"k":"D","t":"企业转让作为固定资产核算的土地使用权及地上建筑物时，资产处置收益中应扣除应缴纳的土地增值税"}],"ans":"D","exp":"企业缴纳的土地增值税通过“应交税费——应交土地增值税”科目核算。房地产企业，在项目全部竣工结算前转让房地产取得的收入，按税法规定预交的土地增值税，借记“应交税费——应交土地增值税”科目，选项C不当选；日常活动为销售房地产的企业应由当期收入负担的土地增值税，借记“税金及附加”科目，贷记“应交税费——应交土地增值税”科目，选项A不当选；该项目全部竣工、办理结算后进行清算，收到退回多交的土地增值税，借记“银行存款”等科目，贷记“应交税费——应交土地增值税”科目，选项B不当选。转让固定资产或在建工程的土地使用权及地上建筑物，转让时应缴纳的土地增值税，借记“资产处置损益”科目，贷记“应交税费——应交土地增值税”科目，选项D当选。","wrong":1,"cat":"财务会计"},{"id":"2081922247724691474","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于合营安排会计处理的表述中，正确的是（  ）。","opts":[{"k":"A","t":"合营方应对持有的合营企业投资采用成本法核算"},{"k":"B","t":"共同经营的合营方对共同经营的投资应按摊余成本计量"},{"k":"C","t":"共同经营的合营方应按约定的份额比例享有共同经营产生的净资产"},{"k":"D","t":"合营方自共同经营购买不构成业务的资产的，在将该资产出售给第三方前应仅确认该交易产生损益中归属于共同经营其他参与方的部分"}],"ans":"D","exp":"除合营方对持有合营企业投资应当采用权益法核算以外，其他合营安排中的合营方应当确认自身所承担的以及按比例享有或承担的合营安排中按照合同、协议等的规定归属于本企业的资产、负债、收入及费用，选项AB不当选；共同经营的合营方应当确认单独所持有的资产以及按其份额确认共同持有的资产，确认单独所承担的负债以及按其份额确认共同承担的负债，不按份额享有净资产，选项C不当选；合营方自共同经营购买不构成业务的资产的，在将该资产出售给第三方前应仅确认该交易产生损益中归属于共同经营其他参与方的部分，选项D当选。","wrong":1,"cat":"财务会计"},{"id":"2081922247724691472","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于同一控制下企业合并涉及或有对价的说法中，正确的是（    ）。","opts":[{"k":"A","t":"涉及或有对价满足资产确认条件的，应确认为一项资产，后续结算价格发生变化的应计入当期损益"},{"k":"B","t":"涉及或有对价的会影响合并商誉"},{"k":"C","t":"或有对价满足条件确认预计负债的，应将预计负债的金额计入长期股权投资入账金额"},{"k":"D","t":"或有对价形成资产或负债的，后续结算价格发生变化应调整所有者权益"}],"ans":"D","exp":"本题考查同一控制下企业合并涉及或有对价的会计处理。同一控制下企业合并涉及的或有对价满足条件形成资产的，后续或有对价结算金额的差额不影响当期损益，而应当调整资本公积（资本溢价或股本溢价），资本公积（资本溢价或股本溢价）不足冲减的，调整留存收益，选项A不当选，选项D当选；同一控制下企业合并不产生新的商誉，原集团内部形成的商誉继续保留，最终控制方合并被合并方所形成的商誉不受或有对价金额影响，选项B不当选；或有对价满足条件确认为预计负债的，预计负债的金额不构成长期股权投资的入账金额，长期股权投资应按被合并方在最终控制方合并报表中净资产账面价值的份额与最终控制方合并被合并方所形成的商誉作为长期股权投资的初始投资成本，选项C不当选。","wrong":1,"cat":"财务会计"},{"id":"2081922247720497171","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不属于财务管理部门在预算工作组织中的职责的是（）。","opts":[{"k":"A","t":"具体负责企业预算的跟踪管理"},{"k":"B","t":"审批公司预算管理制度、政策"},{"k":"C","t":"监督预算执行情况"},{"k":"D","t":"分析预算与实际执行的差异及原因，提出改进管理的意见与建议"}],"ans":"B","exp":"企业财务管理部门具体负责企业预算的跟踪管理，监督预算的执行情况，分析预算与实际执行的差异及原因，提出改进管理的意见与建议。审批公司预算管理制度、政策属于预算管理委员会的职责。","wrong":1,"cat":"财务会计"},{"id":"2081922247712108571","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"现金日记账和银行存款日记账采用的帐簿是（ ）。","opts":[{"k":"A","t":"活页式帐簿"},{"k":"B","t":"订本式帐簿"},{"k":"C","t":"卡片式帐簿"},{"k":"D","t":"备查式帐簿"}],"ans":"B","exp":"《会计基础工作规范》第五十七条   现金日记账和银行存款日记账必须采用订本式帐簿。不得用银行对帐单或者其他方法代替日记账。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922247712108570","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于记账凭证的相关说法中，正确的是（  ）。","opts":[{"k":"A","t":"记账凭证必须附有原始凭证"},{"k":"B","t":"填制记账凭证时，可以对记账凭证进行连续编号"},{"k":"C","t":"记账凭证应当根据每一张原始凭证填制"},{"k":"D","t":"在填制记账凭证时发生错误，应当重新填制"}],"ans":"D","exp":"《会计基础工作规范》第五十一条   记账凭证的基本要求是：\n（一） 记账凭证的内容必须具备：填制凭证的日期 ；凭证编号 ；经济业务摘要 ；会计科目 ；金额 ；所附原始凭证张数 ；填制凭证人员 、稽核人员 、记账人员、会计机构负责人 、会计主管人员签名或者盖章。收款和付款记账凭证还应当由出纳人员签名或者盖章。\n以自制的原始凭证或者原始凭证汇总表代替记账凭证的 ，也必须具备记账凭证应有的项目。\n（二） 填制记账凭证时 ，应当对记账凭证进行连续编号。一笔经济业务需要填制两张以上记账凭证的 ，可以采用分数编号法编号。\n（三） 记账凭证可以根据每一张原始凭证填制 ，或者根据若干张同类原始凭证汇总填制 ，也可以根据原始凭证汇总表填制。但不得将不同内容和类别的原始凭证汇总填制在一张记账凭证上。\n（四） 除结账和更正错误的记账凭证可以不附原始凭证外 ，其他记账凭证必须附有原始凭证。如果一张原始凭证涉及几张记账凭证 ，可以把原始凭证附在一张主要的记账凭证后面 ，并在其他记账凭证上注明附有该原始凭证的记账凭证的编号或者附原始凭证复印件。\n一张原始凭证所列支出需要几个单位共同负担的 ，应当将其他单位负担的部分 ，开给对方原始凭证分割单 ，进行结算。原始凭证分割单必须具备原始凭证的基本内容： 凭证名称 、填制凭证日期 、填制凭证单位名称或者填制人姓名 、经办人的签名或者盖章 、接受凭证单位名称 、经济业务内容 、数量 、单价 、金额和费用分摊情况等。\n（五） 如果在填制记账凭证时发生错误 ，应当重新填制。\n已经登记入帐的记账凭证 ，在当年内发现填写错误时 ，可以用红字填写一张与原内容相同的记账凭证 ，在摘要栏注明 “注销某月某日某号凭证 ” 字样 ， 同时再用蓝字重新填制一张正确的记账凭证 ，注明 “订正某月某日某号凭证 ” 字样。如果会计科目没有错误 ，只是金额错误 ，也可以将正确数字与错误数字之间的差额 ，另编一张调整的记账凭证 ，调增金额用蓝字 ，调减金额用红字。发现以前年度记账凭证有错误的 ，应当用蓝字填制一张更正的记账凭证。\n（六） 记账凭证填制完经济业务事项后 ，如有空行 ，应当自金额栏最后一笔金额数字下的空行处至合计数上的空行处划线注销。","wrong":1,"cat":"财务会计"},{"id":"2081922247712108556","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业在资金活动中，若出现投资决策失误的情况，最有可能引发的后果是（   ）。","opts":[{"k":"A","t":"引发资本结构不合理或无效融资，导致企业筹资成本过高或债务危机"},{"k":"B","t":"引发盲目扩张或丧失发展机遇，可能导致资金链断裂或资金使用效益低下"},{"k":"C","t":"导致企业陷入财务困境或资金冗余"},{"k":"D","t":"导致资金被挪用、侵占、抽逃或遭受欺诈"}],"ans":"B","exp":"《企业内部控制应用指引第 6 号—资金活动》第三条   企业资金活动至少应当关注下列风险：\n（一） 筹资决策不当，引发资本结构不合理或无效融资 ，可能导致企业筹资成本过高或债务危机。\n（二） 投资决策失误，引发盲目扩张或丧失发展机遇 ，可能导致资金链断裂或资金使用效益低下。\n（三） 资金调度不合理 、营运不畅 ，可能导致企业陷入财务困境或资金冗余。\n（四） 资金活动管控不严 ，可能导致资金被挪用 、侵占 、抽逃或遭受欺诈。","wrong":1,"cat":"财务管理"},{"id":"2081922247712108547","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"当企业人力资源激励约束制度不合理、关键岗位人员管理不完善时，可能引发的后果不包括（   ）。","opts":[{"k":"A","t":"人才流失"},{"k":"B","t":"经营效率低下"},{"k":"C","t":"人力资源开发机制不健全"},{"k":"D","t":"关键技术、商业秘密和国家机密泄露"}],"ans":"C","exp":"《企业内部控制应用指引第 3 号—人力资源》第三条 企业人力资源管理至少应当关注下列风险：\n（一）人力资源缺乏或过剩、结构不合理、开发机制不健全，可能导致企业发展战略难以实现。\n（二）人力资源激励约束制度不合理、关键岗位人员管理不完善，可能导致人才流失、经营效率低下或关键技术、商业秘密和国家机密泄露。\n（三）人力资源退出机制不当，可能导致法律诉讼或企业声誉受损。","wrong":1,"cat":"企业文化与战略管理"},{"id":"2081922247712108546","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业在制定与实施发展战略过程中，可能导致企业资源浪费，甚至危及企业的生存和持续发展的风险是（   ）。","opts":[{"k":"A","t":"缺乏明确的发展战略"},{"k":"B","t":"发展战略实施不到位"},{"k":"C","t":"发展战略过于激进，脱离企业实际能力或偏离主业"},{"k":"D","t":"发展战略因主观原因频繁变动"}],"ans":"D","exp":"《企业内部控制应用指引第 ２号—发展战略》第三条 企业制定与实施发展战略至少应当关注下列风险：\n（一）缺乏明确的发展战略或发展战略实施不到位，可能导致企业盲目发展，难以形成竞争优势，丧失发展机遇和动力。\n（二）发展战略过于激进，脱离企业实际能力或偏离主业，可能导致企业过度扩张，甚至经营失败。\n（三）发展战略因主观原因频繁变动，可能导致资源浪费，甚至危及企业的生存和持续发展。","wrong":1,"cat":"企业文化与战略管理"},{"id":"2081922247619833863","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"国资委数智化转型有关文件对中央企业全面实现财务数智化转型 中、统筹使用"}],"ans":"B","exp":"依据《境外资金管理办法》第三条，按照“统一决策、分级授权、分类集中、统筹调度”的原则，集团公司对境外资金实施集中管理。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247338815493","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列失业类型中，属于宏观经济调控中重点关注的是？","opts":[{"k":"A","t":"摩擦性失业"},{"k":"B","t":"结构性失业"},{"k":"C","t":"周期性失业"},{"k":"D","t":"自愿性失业"}],"ans":"C","exp":"周期性失业是指由于经济周期中的衰退或萧条阶段，总需求不足而引起的失业，它是宏观经济调控中重点关注的失业类型。摩擦性失业和结构性失业属于自然失业，是经济运行中难以完全避免的；自愿性失业是劳动者不愿意接受现行工资水平而形成的失业，不属于宏观调控的重点。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247334621209","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"如果商品X和商品Y的需求交叉弹性系数为3，则可以判断这两种商品是？","opts":[{"k":"A","t":"互补品"},{"k":"B","t":"替代品"},{"k":"C","t":"正常品"},{"k":"D","t":"低档品"}],"ans":"B","exp":"需求交叉弹性系数为正数，说明两种商品的需求量呈同方向变动，即一种商品价格上涨，另一种商品的需求量增加，符合替代品的特征。互补品的需求交叉弹性系数为负数，正常品和低档品是根据需求收入弹性划分的。","wrong":1,"cat":"综合实务"},{"id":"2081922247334621207","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在其他条件不变的情况下，下列哪种因素会导致商品的需求曲线向右平移？","opts":[{"k":"A","t":"商品自身价格上涨"},{"k":"B","t":"消费者收入增加"},{"k":"C","t":"替代品价格下降"},{"k":"D","t":"互补品价格上涨"}],"ans":"B","exp":"需求曲线向右平移表示需求增加，在商品自身价格不变的情况下，消费者收入增加会导致对正常商品的需求增加，需求曲线右移。商品自身价格上涨只会导致需求量沿需求曲线变动，不会导致曲线平移；替代品价格下降、互补品价格上涨都会导致需求减少，需求曲线左移。","wrong":1,"cat":"财务会计"},{"id":"2081922247326232603","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于金融不良资产评估的说法，错误的是（ ）。","opts":[{"k":"A","t":"现场调查可以采用抽样方法"},{"k":"B","t":"应采用统一的方法对各类资产进行清查核实"},{"k":"C","t":"可以为金融机构防范和化解金融风险提供专业支持"},{"k":"D","t":"包括价值评估和价值分析两大业务类型"}],"ans":"B","exp":"鉴于金融不良资产的特殊性，金融不良资产清查核实方法，应当充分考虑资产类型进行。评估实践中，一般分别按照实物类资产、股权类资产和其他资产，以及债权资产，分别采用不同的核实方法，查清资产的存在情况、形态和状态。","wrong":1,"cat":"综合实务"},{"id":"2081922247326232591","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于相对价值估值模型适用性的说法中，错误的是（  ）。","opts":[{"k":"A","t":"市盈率估值模型不适用于亏损的企业"},{"k":"B","t":"市净率估值模型不适用于资不抵债的企业"},{"k":"C","t":"市净率估值模型不适用于固定资产较少的企业"},{"k":"D","t":"市销率估值模型不适用于销售成本率较低的企业"}],"ans":"D","exp":"① 市净率估价模型适用于需要拥有大量资产，净资产为正值的企业，资不抵债说明所有者权益为负值。\n② 市销率模型适用于销售成本率较低的服务类企业，或者销售成本率趋同的传统行业的企业。\n③ 市盈率模型最适合连续盈利的企业。","wrong":1,"cat":"财务管理"},{"id":"2081922247326232589","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于价值链、管理决策与产品成本的说法中，正确的是（  ）。","opts":[{"k":"A","t":"价值链包括生产、营销、配送三个环节，共同为顾客创造价值"},{"k":"B","t":"对外财务报告目的下，产品成本需包含整个价值链的全部成本"},{"k":"C","t":"产品定价决策中，产品成本通常需要涵盖整个价值链的成本"},{"k":"D","t":"成本管理会计仅为价值链中的生产环节管理决策提供信息支持"}],"ans":"C","exp":"①选项A错误，价值链包括研究与开发、设计、生产、营销、配送、客户服务六个环节；\n\n②选项B错误，对外财务报告目的下，产品成本是指产品制造成本，即价值链中的生产成本；\n\n③选项C正确，产品定价或者产品组合调整决策，产品成本通常需要包括整个价值链的成本；\n\n④选项D错误，成本管理会计为涉及价值链所有环节的管理决策提供信息与帮助。","wrong":1,"cat":"管理会计"},{"id":"2081922247326232586","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在其他条件不变的情况下，引起总资产周转次数指标下降的经济业务为（    ）。","opts":[{"k":"A","t":"发行公司债券"},{"k":"B","t":"用一批原材料抵债"},{"k":"C","t":"提前处置一批固定资产"},{"k":"D","t":"用银行存款采购一批原材料"}],"ans":"A","exp":"选项B使企业资产减少，从而会使总资产周转率上升；选项D没有影响；选项A会使资产增加，因而会使总资产周转率下降。选项C可能增加企业资产，也可能减少企业资产。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922247317843980","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2025年6月1日，甲公司和乙公司签订了一份买卖合同约定，甲公司向乙公司购买一件价格为100万元的设备，乙公司于2025年6月30日送货到甲公司，甲公司收货后，10日内付款。2025年6月30日，乙公司得知甲公司经营状况严重恶化，于是中止履行并要求甲公司提前付款或提供担保，遭到甲公司拒绝。下列关于当事人权利义务的表述中，不正确的是（）。","opts":[{"k":"A","t":"若乙公司有确切证据证明甲公司可能丧失履行债务能力，无须中止履行，可以直接解除合同"},{"k":"B","t":"若乙公司没有确切证据证明甲公司丧失或者可能丧失履行债务能力，应当承担违约责任"},{"k":"C","t":"若甲公司在合理期限内未恢复履行能力并且未提供适当担保，乙公司可以解除合同"},{"k":"D","t":"若甲公司在合理期限内恢复履行能力或提供相应担保，乙公司应当恢复合同履行"}],"ans":"A","exp":"(1)选项ACD：如果乙公司有确切证据证明甲公司丧失或可能丧失履行债务的能力，有权中止履行并及时通知对方(而非直接解除合同)；甲公司提供适当担保或者恢复履行能力的，应当恢复履行；甲公司在合理期限内未恢复履行能力且未提供适当担保的，乙公司可以解除合同并请求甲公司承担违约责任。(2)选项B：应当先履行债务的当事人没有确切证据而行使不安抗辩权，造成对方损失的，应当承担违约责任。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247313649686","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于附有质量保证条款的销售表述不正确的是（）","opts":[{"k":"A","t":"客户能够选择单独购买质量保证的，该质量保证构成单项履约义务"},{"k":"B","t":"客户不能选择单独购买质量保证，但该质量保证在向客户保证所销售的商品符合既定标准之外提供了一项单独服务的，应当作为单项履约义务"},{"k":"C","t":"作为单独履约义务的质量保证，企业应将部分交易价格分摊至该项履约义务"},{"k":"D","t":"不能作为单项履约义务的质量保证，企业应当作为可变对价进行会计处理"}],"ans":"D","exp":"不能作为单项履约义务的质量保证，企业应当按照或有事项准则的规定进行会计处理，不作为可变对价","wrong":1,"cat":"财务会计"},{"id":"2081922247313649668","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×24年7月1日，甲公司以银行存款180万元外购一项法律保护期为15年的专利技术并立即投入使用。甲公司预计该专利技术可以在未来10年为其带来经济利益。当日甲公司另与乙公司签订合同，约定5年后将该专利技术以100万元的价格转让给乙公司。不考虑其他因素，甲公司该项专利技术的使用寿命为（）年。","opts":[{"k":"A","t":"15"},{"k":"B","t":"10"},{"k":"C","t":"5"},{"k":"D","t":"使用寿命不确定"}],"ans":"C","exp":"源自合同性权利或其他法定权利取得的无形资产，其使用寿命通常不应超过合同性权利或其他法定权利的期限（本题为15年)，但如果企业使用资产的预期期限（本题为5年）短于合同性权利或其他法定权利规定的期限的，则应当按照企业预期使用的期限（谨慎性原则）来确定其使用寿命。因此该专利技术的使用寿命为5年。","wrong":1,"cat":"金融与投资理财"},{"id":"2081922247309455385","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下属于\"支柱二\"中基于实质的所得排除条款中包含组成部分的是？","opts":[{"k":"A","t":"有形资产排除"},{"k":"B","t":"知识产权排除"},{"k":"C","t":"租赁资产排除"}],"ans":"A","exp":"一个辖区的基于实质的所得排除额是每个成员实体的工资排除和有形资产排除之和。","wrong":1,"cat":"综合实务"},{"id":"2081922247309455379","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下哪些税收类型通常包括在GloBE规则下的有效税额中？","opts":[{"k":"A","t":"工资税和社会保障缴款"},{"k":"B","t":"数字服务税"},{"k":"C","t":"企业所得税"}],"ans":"C","exp":"有效税额是指：\n(a)在成员实体的财务账目中确认的与其所得或利润或其在成员实体的所得或利润中所占份额有关的税款；\n(b)对分配利润，视同利润分配征收的税款，以及在符合条件的分配税制度下征收的非经营性费用；\n(c)征收的代替普遍适用的企业所得税的税款；\n(d)根据留存收益和公司权益征收的税款，包括基于所得和权益的多个组成部分征收的税款。","wrong":1,"cat":"税务"},{"id":"2081922247309455378","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下哪一项不属于确定GloBE所得或亏损的调整：","opts":[{"k":"A","t":"净税收费用"},{"k":"B","t":"政策不允许扣除的费用"},{"k":"C","t":"计提的研发支出调整"}],"ans":"C","exp":"成员实体财务会计净所得或亏损按照以下项目进行调整，以得到该实体的GloBE所得或亏损：(a)净税收费用；(b)排除的股息；(c)排除的权益损益；(d)所含的重估方法损益；(e)资产负债转移下所排除的资产和负债处分损益；(f)非对称汇兑损益；(g)政策不允许的费用；(h)前期会计差错和会计原则变更；(i)应计养老金费用。","wrong":1,"cat":"财务会计"},{"id":"2081922247305261081","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据个人所得税法的规定，下列属于工资薪金性质的补贴津贴的是（ ）。","opts":[{"k":"A","t":"独生子女补贴"},{"k":"B","t":"加班工资"},{"k":"C","t":"误餐补贴"},{"k":"D","t":"差旅费津贴"}],"ans":"B","exp":"下列不属于工资、薪金性质的补贴、津贴或者不属于纳税人本人工资、薪金所得项目的收入，不征税：1.独生子女补贴；2.执行公务员工资制度未纳入基本工资总额的补贴、津贴差额和家属成员的副食品补贴；3.托儿补助费；4.差旅费津贴、误餐补助；5.外国来华留学生，领取的生活津贴费、奖学金，不属于工资、薪金范畴，不征收个人所得税。","wrong":1,"cat":"税务"},{"id":"2081922247305261078","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据耕地占用税法规定，占用下列土地不需要缴纳耕地占用税的是（ ）。","opts":[{"k":"A","t":"占用养殖的滩涂建设建筑物"},{"k":"B","t":"占用牧场建设构筑物"},{"k":"C","t":"占用养殖的水面从事非农业建设"},{"k":"D","t":"占用果园建设直接为农业生产服务的生产设施"}],"ans":"D","exp":"建设直接为农业生产服务的生产设施占用农用地的，不征收耕地占用税。","wrong":1,"cat":"综合实务"},{"id":"2081922247305261077","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列有关城镇土地使用税的表述中，正确的是（ ）。","opts":[{"k":"A","t":"城镇土地使用税的征税对象只是集体土地"},{"k":"B","t":"城镇土地使用税征税范围中，城市的土地是指市区的土地"},{"k":"C","t":"城镇土地使用税的具体征税范围由省、自治区、直辖市人民政府确定"},{"k":"D","t":"经济落后地区，土地使用税的适用税额标准可适当降低，但降低额不得超过上述规定最低税额的20%"}],"ans":"C","exp":"城镇土地使用税的征税对象是国有土地或集体土地；城镇土地使用税征税范围中，城市的土地包括市区和郊区的土地；经济落后地区，土地使用税的适用税额标准可适当降低，但降低额不得超过规定最低税额的30%。","wrong":1,"cat":"税务"},{"id":"2081922247305261062","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不征收企业所得税的是（ ）。","opts":[{"k":"A","t":"企业将自产的货物用于厂房建设"},{"k":"B","t":"企业将自产的货物用于市场推广"},{"k":"C","t":"企业将自产的货物用于股息分配"},{"k":"D","t":"企业将自产的货物用于捐赠灾区"}],"ans":"A","exp":"选项A，自产产品用于在建工程、管理部门等属于内部处置资产，不视同销售确认收入，不缴纳企业所得税；选项B、C、D，都属于企业所得税的视同销售，应确认收入计入企业的应纳税所得额。","wrong":1,"cat":"税务"},{"id":"2081922247305261061","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列情形中，属于直接向环境排放污染物从而应缴纳环境保护税的是（ ）。","opts":[{"k":"A","t":"企业在符合国家和地方环境保护标准的场所处置应税污染物的"},{"k":"B","t":"事业单位向依法设立的生活垃圾集中处理场所排放应税污染物的"},{"k":"C","t":"企业向依法设立的污水集中处理场所排放应税污染物的"},{"k":"D","t":"依法设立的城乡污水集中处理场所超过国家和地方规定的排放标准排放应税污染物的"}],"ans":"D","exp":"依法设立的城乡污水集中处理、生活垃圾集中处理场所排放相应应税污染物，不超过国家和地方规定的排放标准的，暂免征收环境保护税。超过国家和地方排放标准的，应按照相关规定征收税款。","wrong":1,"cat":"趋势政策与行业动态"},{"id":"2081922247305261059","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据企业所得税法的规定，一般企业研发费用形成无形资产的，按照该无形资产成本的200%在税前摊销。除法律另有规定外，摊销年限不得低于（ ）年。","opts":[{"k":"A","t":"2"},{"k":"B","t":"5"},{"k":"C","t":"10"},{"k":"D","t":"15"}],"ans":"C","exp":"研发费用形成无形资产的，按照该无形资产成本的200%在税前摊销。除法律另有规定外，摊销年限不得低于10年。","wrong":1,"cat":"财务会计"},{"id":"2081922247301066776","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于车船税征收管理表述错误的是（ ）。","opts":[{"k":"A","t":"车船税纳税义务发生时间为取得车船所有权或者管理权的次月"},{"k":"B","t":"车船税的纳税地点为车船的登记地或者车船税扣缴义务人所在地"},{"k":"C","t":"车船税按年申报，分月计算，一次性缴纳"},{"k":"D","t":"对于依法不需要购买机动车交通事故责任强制保险的车辆，纳税人应当向主管税务机关自行申报缴纳车船税"}],"ans":"A","exp":"车船税纳税义务发生时间为取得车船所有权或者管理权的当月。","wrong":1,"cat":"税务"},{"id":"2081922247301066771","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列选项中，属于关税特定减免的是（ ）。","opts":[{"k":"A","t":"边民互市贸易进出口商品"},{"k":"B","t":"国务院规定的免征额度内的一票货物"},{"k":"C","t":"外国政府无偿赠送的物资"},{"k":"D","t":"在海关放行前遭受损坏的货物"}],"ans":"A","exp":"选项A，属于关税的特定减免；选项BC，属于法定免征关税的情形；选项D，属于法定减征关税的情形。","wrong":1,"cat":"税务"},{"id":"2081922247301066767","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列企业中，不属于特别纳税调查重点关注的企业的是（ ）。","opts":[{"k":"A","t":"低于同行业利润水平的甲企业"},{"k":"B","t":"长期盈利的乙企业"},{"k":"C","t":"与避税港关联方发生业务往来的丙企业"},{"k":"D","t":"关联交易数额较大的丁企业"}],"ans":"B","exp":"税务机关实施特别纳税调查，应当重点关注具有以下风险特征的企业：（1）关联交易金额较大或者类型较多。（2）存在长期亏损、微利或者跳跃性盈利。（3）低于同行业利润水平。（4）利润水平与其所承担的功能风险不相匹配，或者分享的收益与分摊的成本不相配比。（5）与低税国家（地区）关联方发生关联交易。（6）未按照规定进行关联申报或者准备同期资料。（7）从其关联方接受的债权性投资与权益性投资的比例超过规定标准。（8）由居民企业，或者由居民企业和中国居民控制的设立在实际税负低于12.5%的国家（地区）的企业，并非由于合理的经营需要而对利润不作分配或者减少分配。（9）实施其他不具有合理商业目的的税收筹划或者安排。","wrong":1,"cat":"税务"},{"id":"2081922247301066761","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于耕地占用税的纳税义务人说法不正确的是（ ）。","opts":[{"k":"A","t":"经批准占用耕地的纳税人为农用地转用审批文件中标明的建设用地人"},{"k":"B","t":"经批准占用耕地的纳税人为实际用地人"},{"k":"C","t":"农用地转用审批文件中未标明建设用地人的纳税人为用地申请人"},{"k":"D","t":"未经批准占用耕地的纳税人为实际用地人"}],"ans":"B","exp":"选项B，经批准占用耕地的纳税人为农用地转用审批文件中标明的建设用地人。未经批准占用耕地的，纳税人为实际用地人。","wrong":1,"cat":"税务"},{"id":"2081922247301066757","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲企业为一般生产企业，下列有关甲企业的行为中，需要缴纳土地增值税的是（ ）。","opts":[{"k":"A","t":"甲企业向某银行借款100万元，以其自有的厂房作为抵押，厂房尚在抵押期间"},{"k":"B","t":"国有土地使用权出让"},{"k":"C","t":"甲企业出地，某商业企业出资金，双方合作建造办公楼，建成后分房用于自己使用"},{"k":"D","t":"甲企业用闲置的办公楼与乙企业交换厂房"}],"ans":"D","exp":"选项A，对房地产的抵押，在抵押期间不征收土地增值税；选项B，国有土地使用权出让，不属于土地增值税的征税范围；选项C，对于一方出地，一方出资金，双方合作建房，建成后按比例分房自用的，暂免征收土地增值税。","wrong":1,"cat":"税务"},{"id":"2081922247296872466","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于售后回购交易的会计处理不符合企业会计准则规定的是（  ）。","opts":[{"k":"A","t":"企业负有应客户要求回购商品义务的，客户不具有行使该要求权重大经济动因的，应当将其作为附有销售退回条款的销售交易"},{"k":"B","t":"企业到期未行使回购权利的，应当在该回购权利到期时终止确认金融负债，同时确认收入"},{"k":"C","t":"企业负有应客户要求回购商品义务的，客户具有行使该要求权重大经济动因的，企业应当将售后回购作为租赁交易或融资交易"},{"k":"D","t":"企业因存在与客户的远期安排而负有回购义务或企业享有回购权利的，应当作为融资交易进行相应的会计处理"}],"ans":"D","exp":"企业因存在与客户的远期安排而负有回购义务或企业享有回购权利的，表明客户在销售时点并未取得相关商品控制权，企业应当作为租赁交易或融资交易进行相应的会计处理。其中，回购价格低于原售价的，应当视为租赁交易，选项D不正确。\n企业负有应客户要求回购商品义务的，应在合同开始日评估客户是否具有行使该要求权的重大经济动因。客户具有行使该要求权重大经济动因的，企业应当将售后回购作为租赁交易或融资交易；否则，企业应当将其作为附有销售退回条款的销售交易。","wrong":1,"cat":"财务会计"},{"id":"2081922247292678155","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据企业国有资产交易相关规定，产权转让项目中，正式披露公告期满未征集到意向受让方，仅变更转让底价的，公告时间不少于（）工作日。","opts":[{"k":"A","t":"5个"},{"k":"B","t":"10个"},{"k":"C","t":"15个"},{"k":"D","t":"20个"}],"ans":"A","exp":"按照企业国有资产交易要求，产权转让首次公告期满无意向受让方，仅调整转让底价重新披露的，信息公告期限不得少于5个工作日。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247292678153","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据企业国有资产交易相关规定，产权转让中管理层拟参与受让的，应当在（ ）中披露管理层的相关情况。","opts":[{"k":"A","t":"预披露信息"},{"k":"B","t":"正式披露信息"},{"k":"C","t":"交易合同"},{"k":"D","t":"审计报告"}],"ans":"B","exp":"根据企业国有资产交易规则，产权转让项目中，标的企业管理层有意参与受让的，转让方必须在产权转让信息公告中如实披露管理层相关身份、受让意向等情况。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247292678147","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《中国长江三峡集团有限公司参股管理办法》中提到的“参股股权退出管理”不包括以下哪一项？","opts":[{"k":"A","t":"股权转让"},{"k":"B","t":"股权置换"},{"k":"C","t":"清算注销"},{"k":"D","t":"引入战略投资者"}],"ans":"D","exp":"集团公司及子企业应当加强研究论证，创新方式方法，合理选择股权转让、股权置换、清算注销等处置方式","wrong":1,"cat":"企业文化与战略管理"},{"id":"2081922247288483861","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《上市公司股东减持股份管理暂行办法》，大股东减持计划实施完毕的，应当在多少个交易日内向证券交易所报告并予公告？","opts":[{"k":"A","t":"1个交易日"},{"k":"B","t":"2个交易日"},{"k":"C","t":"3个交易日"},{"k":"D","t":"5个交易日"}],"ans":"B","exp":"《上市公司股东减持股份管理暂行办法》第九条规定，减持计划实施完毕的，大股东应当在二个交易日内向证券交易所报告，并予公告。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247288483860","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《上市公司股东减持股份管理暂行办法》，大股东计划通过集中竞价交易或者大宗交易方式减持股份的，应当在首次卖出前多少交易日向证券交易所报告并披露减持计划（）","opts":[{"k":"A","t":"5个交易日"},{"k":"B","t":"10个交易日"},{"k":"C","t":"15个交易日"},{"k":"D","t":"20个交易日"}],"ans":"C","exp":"《上市公司股东减持股份管理暂行办法》第九条规定，大股东计划通过证券交易所集中竞价交易或者大宗交易方式减持股份的，应当在首次卖出前十五个交易日向证券交易所报告并披露减持计划。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247288483857","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《企业国有资产评估管理暂行办法》，企业提出资产评估项目核准申请时，应当自评估基准日起多长时间内提出？","opts":[{"k":"A","t":"6个月内"},{"k":"B","t":"8个月内"},{"k":"C","t":"9个月内"},{"k":"D","t":"12个月内"}],"ans":"B","exp":"根据《办法》第十四条第（一）款，企业收到评估报告后逐级上报初审，经初审同意后，自评估基准日起8个月内向国有资产监督管理机构提出核准申请。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247288483853","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《企业国有资产交易监督管理办法》，产权转让项目首次正式信息披露的转让底价不得低于经核准或备案的______。","opts":[{"k":"A","t":"审计后的净资产"},{"k":"B","t":"评估结果"},{"k":"C","t":"账面价值"},{"k":"D","t":"重置成本"}],"ans":"B","exp":"根据《企业国有资产交易监督管理办法》第十七条，产权转让项目首次正式信息披露的转让底价不得低于经核准或备案的评估结果。这是防止国有资产被低价转让、确保国有资产保值增值的重要制度安排。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247288483848","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于企业增资，下列表述错误的是（ ）。","opts":[{"k":"A","t":"因增资致使国家不再拥有所出资企业控股权的，须由国资监管机构报本级人民政府批准"},{"k":"B","t":"企业增资通过产权交易机构对外披露信息的时间不得少于40个工作日"},{"k":"C","t":"增资企业原股东增资的，可以依据最近一期审计报告确定企业资本及股权比例"},{"k":"D","t":"企业债权转为股权的，经国家出资企业审议决策，可以采取非公开协议方式增资"}],"ans":"C","exp":"根据《企业国有资产交易监督管理办法》第三十四条、第三十九条、第三十八条、第四十六条：A正确；B正确；C错误，第三十八条规定可以依据评估报告或最近一期审计报告确定股权比例的仅限于原股东同比例增资等四种情形，原股东非同比例增资须进行资产评估；D正确（第四十六条第（二）款）。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247288483843","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下表述是集团公司绩效评价工作的（）原则：以强化企业市场主体地位为保障，遵循市场经济规律和企业发展规律，构建与企业功能定位、规模大小、行业类型、发展阶段相适应的差异化评价体系和激励约束机制，落实国有资产保值增值责任。","opts":[{"k":"A","t":"坚持质量第一、效益优先"},{"k":"B","t":"坚持对标先进、建设一流"},{"k":"C","t":"坚持分类指导、落实责任"},{"k":"D","t":"坚持统筹发展与安全"}],"ans":"C","exp":"以强化企业市场主体地位为保障，遵循市场经济规律和企业发展规律，构建与企业功能定位、规模大小、行业类型、发展阶段相适应的差异化评价体系和激励约束机制，落实国有资产保值增值责任是集团公司绩效评价工作的“坚持分类评价、落实责任”原则。","wrong":1,"cat":"管理会计"},{"id":"2081922247284289545","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"内控体系能否有效运行，关键在“一把手”。根据《关于加强中央企业内部控制体系建设与监督工作的实施意见》（国资发监督规〔2019〕101号），中央企业内控体系监管工作的第一责任人是（ ）。","opts":[{"k":"A","t":"董事长"},{"k":"B","t":"总经理"},{"k":"C","t":"分管内控的副总经理"},{"k":"D","t":"主要领导人员"}],"ans":"D","exp":"101号文明确：“中央企业主要领导人员是内控体系监管工作第一责任人”。","wrong":1,"cat":"企业文化与战略管理"},{"id":"2081922247284289544","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"经济法的法律渊源包括宪法、法律、行政法规、地方性法规、部门规章、司法解释等。中国证监会发布的《上市公司信息披露管理办法》属于（ ）。","opts":[{"k":"A","t":"法律"},{"k":"B","t":"行政法规"},{"k":"C","t":"部门规章"},{"k":"D","t":"司法解释"}],"ans":"C","exp":"① 法律：由全国人民代表大会及其常委会制定和修改，命名规则为“XX法”。\n② 行政法规：由国务院制定，命名规则为“XX条例”等。\n③ 部门规章：由国务院各部、委员会、中国人民银行、审计署和具有行政管理职能的直属机构以及法律规定的机构，就执行法律、国务院行政法规、决定、命令的事项在其职权范围内制定，命名规则为“XX办法/规定”等。题目中所给出的规范性文件属于此类，因此选项C正确。\n④ 司法解释：最高人民法院、最高人民检察院在总结司法审判经验的基础上发布的指导性文件和法律解释的总称。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247284289543","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据证券法律制度的规定，下列关于强制信息披露的表述中，正确的是（）。","opts":[{"k":"A","t":"季度报告属于强制信息披露的范畴"},{"k":"B","t":"临时报告不属于强制信息披露的范畴"},{"k":"C","t":"强制信息披露贯穿于首次信息公开和持续信息公开两个阶段"},{"k":"D","t":"强制信息披露又称为“硬信息”披露"}],"ans":"C","exp":"选项AB错误：强制信息披露包括首次信息披露和持续信息披露。持续信息披露又包括定期报告和临时报告。其中，定期报告包括年度报告和中期报告，不包括季度报告。\n\n选项D错误：\n\n①“以是否为法律强制规定必须公开的内容为标准”，分为强制信息披露和自愿信息披露；\n\n②“以信息披露的内容为标准”，分为客观信息的披露（“硬信息”、历史性信息）和主观信息的披露（“软信息”、预测性信息）\n\n两者区分标准不一样，不能等同。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247284289542","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于法人权利能力与行为能力的表述中，正确的是（ ）。","opts":[{"k":"A","t":"法人终止时，权利能力和行为能力同时消灭"},{"k":"B","t":"法人先取得权利能力，后取得行为能力"},{"k":"C","t":"所有法人都有权利能力，但并非所有法人都有行为能力"},{"k":"D","t":"法人的行为能力只能通过其法定代表人实现"}],"ans":"A","exp":"选项A正确、选项BC错误，法人的权利能力和行为能力在法人成立时同时产生，终止时同时消灭。\n选项D错误，法人的行为能力通过法定代表人或其他代理人来实现。","wrong":1,"cat":"经济法与财经法规"},{"id":"2081922247280095258","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《公司法》的规定，股份有限公司股东会对公司合并作出决议，必须经()通过。","opts":[{"k":"A","t":"出席会议的股东的半数以上"},{"k":"B","t":"代表2/3以上表决权的股东"},{"k":"C","t":"出席会议的股东所持表决权的2/3以上"},{"k":"D","t":"代表过半数表决权的股东"}],"ans":"C","exp":"公司法第一百一十六条，股东会作出修改公司章程、增加或者减少注册资本的决议，以及公司合并、分立、解散或者变更公司形式的决议，应当经出席会议的股东所持表决权的三分之二以上通过。有限责任公司则须经代表三分之二以上表决权的股东通过。","wrong":2,"cat":"经济法与财经法规"},{"id":"2081922247280095246","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"集团公司实行（）的财务管理体制。","opts":[{"k":"A","t":"分散管理、分级负责"},{"k":"B","t":"集中管理、统一决策"},{"k":"C","t":"集中统一、分级授权"},{"k":"D","t":"独立核算、自主经营"}],"ans":"C","exp":"制度的第五条。","wrong":1,"cat":"财务会计"},{"id":"2081922247280095242","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司为增值税一般纳税人，2×24年3月1日一次性外购3台用途不同的设备A、B和C，取得增值税专用发票注明的价款为1160万元，增值税税额为150.8万元，支付运费取得增值税专用发票注明运费为24万元，增值税税额为2.16万元，设备均已运抵甲公司。A、B和C设备的公允价值分别为500万元、420万元和330万元。其中A设备在安装过程中领用本公司自产产品一批，其成本为40万元，市场售价为60万元。不考虑其他因素，则A设备的入账成本为（）万元。","opts":[{"k":"A","t":"473.6"},{"k":"B","t":"513.6"},{"k":"C","t":"500"},{"k":"D","t":"527.6"}],"ans":"B","exp":"企业以一笔款项购入多项没有单独标价的固定资产，应当按照各项固定资产的公允价值比例对总成本进行分配，分别确定各项固定资产的成本。故A设备的入账成本=(1160+24）×500/(500+420+330)+40=513.6（万元）。","wrong":1,"cat":"税务"},{"id":"2081922247280095241","bank":"决赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项关于集团内涉及不同企业股份支付的会计处理表述中，不正确的是（)。","opts":[{"k":"A","t":"结算企业是接受服务企业的投资者的，应当以授予日权益工具的公允价值或应承担负债的公允价值为基础确认为对接受服务企业的长期股权投资，同时确认资本公积（其他资本公积）或负债"},{"k":"B","t":"结算企业以其本身权益工具结算的，应当将该股份支付交易作为权益结算的股份支付处理"},{"k":"C","t":"接受服务企业不具有结算义务，应当将该股份支付交易作为现金结算的股份支付处
