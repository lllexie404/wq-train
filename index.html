function catStats(c){var qs=qsByCat(c),done=0,wrong=0;qs.forEach(function(q){var r=store[q.id];if(r&&r.s){done++;if(r.s==='w')wrong++}});return{total:qs.length,done:done,wrong:wrong}}
function globalStats(){var done=0,right=0,wrong=0;DATA.forEach(function(q){var r=store[q.id];if(r&&r.s){done++;if(r.s==='r')right++;else wrong++}});return{total:DATA.length,done:done,right:right,wrong:wrong}}
function wrongList(cat){return DATA.filter(function(q){var r=store[q.id];return r&&r.s==='w'&&(!cat||q.cat===cat)})}

var session=null;
var curCat=null;
var curWrong=false;
var app=document.getElementById('app');

function orderQueue(qs){return qs.slice().sort(function(a,b){return rank(a)-rank(b)});
  function rank(q){var r=store[q.id];if(!r||!r.s)return 0;return r.s==='w'?1:2}}
function normAns(a){return String(a||'').replace(/[^A-Z]/g,'').split('').sort().join('')}
function ansSet(q){return q.ans.replace(/[^A-Z]/g,'').split('')}

/* ---------- 首页 ---------- */
function viewHome(){
  var g=globalStats();
  var acc=g.done?Math.round(g.right/g.done*100):0;
  var wrongs=wrongList(null);
  var h='';
  h+='<div class="topbar"><div class="tt">错题训练系统</div><div class="ts">中国三峡集团 · 财经技能竞赛错题 · 共 '+g.total+' 题</div></div>';
  h+='<div class="stats">'
    +'<div class="sbox"><b>'+g.total+'</b><span>总题数</span></div>'
    +'<div class="sbox p"><b>'+g.done+'</b><span>已练</span></div>'
    +'<div class="sbox g"><b>'+g.right+'</b><span>答对</span></div>'
    +'<div class="sbox r"><b>'+g.wrong+'</b><span>错题</span></div></div>';
  h+='<div class="pwrap"><div class="pl"><span>总进度</span><span>'+g.done+' / '+g.total+'　正确率 '+acc+'%</span></div><div class="bar"><i style="width:'+(g.total?g.done/g.total*100:0)+'%"></i></div></div>';
  h+='<div class="act-row"><button class="btn btn-warn" data-act="wrongSet">错题重练 ('+wrongs.length+')</button><button class="btn btn-ghost" data-act="reset">重置进度</button></div>';
  h+='<div class="section-title">按知识点练习（进入后可选题型）</div>';
  CATS.forEach(function(c){
    var s=catStats(c);
    var pct=s.total?s.done/s.total*100:0;
    var badge=s.wrong?'<em>错 '+s.wrong+'</em>':'';
    h+='<div class="cat" data-act="openCat" data-name="'+esc(c)+'">'
      +'<div class="ico">'+esc(c.charAt(0))+'</div>'
      +'<div class="mid"><div class="nm">'+esc(c)+badge+'</div>'
      +'<div class="mini"><div class="bar"><i style="width:'+pct+'%"></i></div><small>'+s.done+'/'+s.total+'</small></div></div>'
      +'<div class="arw">›</div></div>';
  });
  return h;
}

/* ---------- 知识点下的题型选择 ---------- */
function statOf(qs){var done=0,wrong=0;qs.forEach(function(q){var r=store[q.id];if(r&&r.s){done++;if(r.s==='w')wrong++}});return{total:qs.length,done:done,wrong:wrong}}
function qsIn(cat,type){return DATA.filter(function(q){return q.cat===cat&&q.qtype===type})}
function viewTypePick(cat){
  var h='';
  h+='<div class="qhead"><button class="bk" data-act="backTypes">‹</button>'
    +'<div class="qt"><div class="t1">'+esc(cat)+'</div><div class="t2">选择题型开始练习</div></div></div>';
  var any=false;
  TYPES.forEach(function(tp){
    var qs=qsIn(cat,tp);if(!qs.length)return;any=true;
    var key='kp:'+cat+'|'+tp;
    var s=statOf(qs);
    var pct=s.total?s.done/s.total*100:0;
    var badge=s.wrong?'<em>错 '+s.wrong+'</em>':'';
    var cont=isSusp(key)?'<i class="cont">继续</i>':'';
    h+='<div class="cat" data-act="openKp" data-cat="'+esc(cat)+'" data-type="'+esc(tp)+'">'
      +'<div class="ico">'+esc(tp.charAt(0))+'</div>'
      +'<div class="mid"><div class="nm">'+esc(tp)+badge+cont+'</div>'
      +'<div class="mini"><div class="bar"><i style="width:'+pct+'%"></i></div><small>'+s.done+'/'+s.total+'</small></div></div>'
      +'<div class="arw">›</div></div>';
  });
  if(!any)h+='<div class="empty">该知识点暂无题目</div>';
  return h;
}

/* ---------- 错题重练：按题型选择 ---------- */
function viewWrongPick(){
  var h='';
  h+='<div class="qhead"><button class="bk" data-act="backHome">‹</button>'
    +'<div class="qt"><div class="t1">错题重练</div><div class="t2">选择题型开始练习</div></div></div>';
  var all=wrongList(null),any=false;
  TYPES.forEach(function(tp){
    var n=all.filter(function(q){return q.qtype===tp}).length;
    if(!n)return;any=true;
    var cont=isSusp('wrong:'+tp)?'<i class="cont">继续</i>':'';
    h+='<div class="cat" data-act="openWrongKp" data-type="'+esc(tp)+'">'
      +'<div class="ico">'+esc(tp.charAt(0))+'</div>'
      +'<div class="mid"><div class="nm">'+esc(tp)+cont+'</div>'
      +'<div class="mini"><small>共 '+n+' 题待重练</small></div></div>'
      +'<div class="arw">›</div></div>';
  });
  if(!any)h+='<div class="empty">暂无错题，继续保持！</div>';
  return h;
}

/* ---------- 答题页 ---------- */
function viewQuiz(){
  if(session.i>=session.qids.length) return viewResult();
  var q=QMAP[session.qids[session.i]];
  var set=ansSet(q);
  var h='';
  h+='<div class="qhead"><button class="bk" data-act="back">‹</button>'
    +'<div class="qt"><div class="t1">'+esc(session.title)+'</div><div class="t2">'+esc(q.qtype)+'</div></div>'
    +'<div class="pg">'+(session.i+1)+'/'+session.qids.length+'</div></div>';
  h+='<div class="cardq"><span class="badge">'+esc(q.qtype)+'</span><div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.opts.forEach(function(o){
    var cls='opt';
    if(session.answered){
      if(set.indexOf(o.k)>=0)cls+=' correct';
      else if(session.sel.indexOf(o.k)>=0)cls+=' wrong';
    }else if(session.sel.indexOf(o.k)>=0){cls+=' sel'}
    h+='<div class="'+cls+'" data-act="opt" data-k="'+o.k+'"><span class="key">'+o.k+'</span><span class="otext">'+esc(o.t)+'</span></div>';
  });
  h+='</div>';
  if(session.answered){
    var ok=session.lastOk;
    h+='<div class="fb '+(ok?'ok':'bad')+'"><div class="ttl">'+(ok?'✓ 回答正确':'✕ 回答错误')+'</div>'
      +'<div class="ansline">正确答案：<b>'+esc(q.ans.replace(/,/g,''))+'</b>　（你选择：'+esc(session.sel.slice().sort().join('')||'—')+'）</div>'
      +(q.exp?'<div class="exp"><span class="lbl">解析：</span>'+esc(q.exp)+'</div>':'<div class="exp" style="color:#8a93a8">暂无解析</div>')
      +'</div>';
  }
  h+='</div>';
  if(!session.answered){
    if(q.qtype==='多选题'){
      h+='<div class="qfoot"><button class="btn btn-pri btn-block" data-act="submit">提交答案</button></div><div class="hint">多选题：选择全部正确选项后提交</div>';
    }else{
      h+='<div class="hint">选择你认为正确的选项</div>';
    }
  }else{
    var last=session.i>=session.qids.length-1;
    h+='<div class="qfoot"><button class="btn btn-pri btn-block" data-act="next">'+(last?'完成本次练习':'下一题')+'</button></div>';
  }
  return h;
}

function viewResult(){
  var t=session.qids.length,r=session.r,w=session.w;
  var acc=t?Math.round(r/t*100):0;
  var rk=acc>=90?'优秀，继续保持！':acc>=70?'不错，仍有提升空间':acc>=50?'加油，建议重练错题':'基础需巩固，多练几遍';
  var h='';
  h+='<div class="qhead"><button class="bk" data-act="back">‹</button><div class="qt"><div class="t1">练习结果</div><div class="t2">'+esc(session.title)+'</div></div></div>';
  h+='<div class="result"><div class="big">'+acc+'%</div><div class="rk">'+rk+'</div>'
    +'<div class="rgrid"><div class="rb"><b>'+t+'</b><span>本次题量</span></div><div class="rb g"><b>'+r+'</b><span>答对</span></div><div class="rb r"><b>'+w+'</b><span>答错</span></div></div>';
  if(w>0)h+='<button class="btn btn-warn btn-block" data-act="retryWrong">重练本次错题 ('+w+')</button><div style="height:10px"></div>';
  h+='<button class="btn btn-pri btn-block" data-act="back">返回首页</button></div>';
  return h;
}

function render(){try{
  if(session)app.innerHTML=viewQuiz();
  else if(curWrong)app.innerHTML=viewWrongPick();
  else if(curCat)app.innerHTML=viewTypePick(curCat);
  else app.innerHTML=viewHome();
  window.scrollTo(0,0);}catch(e){showSysErr(e&&e.message?e.message:e);}
}

/* ---------- 交互 ---------- */
function startSession(qids,title,key,cat,type){
  if(!qids.length){alert('暂无题目');return}
  session={key:key||null,qids:qids,title:title,cat:(cat===undefined?null:cat),type:type||null,i:0,sel:[],answered:false,lastOk:false,r:0,w:0};
  saveSession();render();
}
function resumeSession(key){var p=prog[key];if(!p)return;session={key:key,qids:p.qids,title:p.title||'练习',cat:p.cat||null,type:p.type||null,i:p.i||0,sel:(p.sel||[]).slice(),answered:!!p.answered,lastOk:!!p.lastOk,r:p.r||0,w:p.w||0};render()}
function openModule(key,title,qids,cat,type){
  if(isSusp(key)){showChoice('继续上次练习？','「'+title+'」上次练到第 '+((prog[key].i||0)+1)+' / '+prog[key].qids.length+' 题。','继续答题','重新开始',function(){resumeSession(key)},function(){clearSession(key);startSession(qids,title,key,cat,type)});return}
  startSession(qids,title,key,cat,type);
}
function openCat(c){curWrong=false;curCat=c;render()}
function openKp(cat,type){var key='kp:'+cat+'|'+type;openModule(key,cat+' · '+type,orderQueue(qsIn(cat,type)).map(function(q){return q.id}),cat,type)}
function openWrong(){curCat=null;curWrong=true;render()}
function openWrongKp(type){var key='wrong:'+type;var qs=wrongList(null).filter(function(q){return q.qtype===type});openModule(key,'错题重练 · '+type,orderQueue(qs).map(function(q){return q.id}),null,type)}
function doAnswer(){
  var q=QMAP[session.qids[session.i]];
  if(!q||session.answered||session.sel.length===0)return;
  var ok=normAns(q.ans)===normAns(session.sel.join(''));
  session.answered=true;session.lastOk=ok;
  if(ok)session.r++;else session.w++;
  mark(q.id,ok);
  saveSession();
  render();
}

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(act==='openCat'){openCat(t.getAttribute('data-name'));return}
  if(act==='openKp'){openKp(t.getAttribute('data-cat'),t.getAttribute('data-type'));return}
  if(act==='backTypes'){curCat=null;render();return}
  if(act==='wrongSet'){openWrong();return}
  if(act==='openWrongKp'){openWrongKp(t.getAttribute('data-type'));return}
  if(act==='backHome'){curWrong=false;curCat=null;render();return}
  if(act==='back'){session=null;render();return}
  if(act==='opt'){
    if(!session||session.answered)return;
    var q=QMAP[session.qids[session.i]],k=t.getAttribute('data-k');
    if(q.qtype==='多选题'){
      var idx=session.sel.indexOf(k);
      if(idx>=0)session.sel.splice(idx,1);else session.sel.push(k);
      render();
    }else{session.sel=[k];doAnswer()}
    return;
  }
  if(act==='submit'){doAnswer();return}
  if(act==='next'){session.i++;session.sel=[];session.answered=false;if(session.key&&session.i>=session.qids.length)clearSession(session.key);else saveSession();render();return}
  if(act==='retryWrong'){
    var w=wrongList(session.cat).filter(function(q){return !session.type||q.qtype===session.type}).map(function(q){return q.id});
    var title=(session.cat?session.cat+' · ':'')+(session.type?session.type+' · ':'')+'错题重练';
    startSession(w,title,null,session.cat,session.type);return;
  }
  if(act==='reset'){
    showConfirm('确认重置进度？','将清空所有答题记录与错题统计，且无法恢复。',function(){store={};saveStore();prog={};saveProg();session=null;curWrong=false;curCat=null;render()});
    return;
  }
});

function showConfirm(title,content,onOk){
  var m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="dlg"><div class="dt">'+esc(title)+'</div><div class="dc">'+esc(content)+'</div>'
    +'<div class="dr"><button class="btn btn-ghost" data-c="0">取消</button><button class="btn btn-pri" data-c="1">确认</button></div></div>';
  m.addEventListener('click',function(e){
    var b=e.target.closest('[data-c]');if(!b)return;
    if(b.getAttribute('data-c')==='1')onOk();
    document.body.removeChild(m);
  });
  document.body.appendChild(m);
}

function showChoice(title,content,resumeText,restartText,onResume,onRestart){
  var m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="dlg"><div class="dt">'+esc(title)+'</div><div class="dc">'+esc(content)+'</div>'
    +'<div class="dr"><button class="btn btn-pri" data-c="r">'+esc(resumeText)+'</button><button class="btn btn-ghost" data-c="s">'+esc(restartText)+'</button></div></div>';
  m.addEventListener('click',function(e){
    var b=e.target.closest('[data-c]');if(!b)return;
    var v=b.getAttribute('data-c');
    document.body.removeChild(m);
    if(v==='r')onResume();else onRestart();
  });
  document.body.appendChild(m);
}

render();
}catch(e){showSysErr('JS异常：'+((e&&e.message)?e.message:e)+' 【'+((e&&e.stack)?String(e.stack).replace(/[\r\n]+/g,' <- '):'无stack')+'】');}
</script>
</body>
