三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《关于推进水库、水闸、蓄滞洪区运行管理数字孪生的指导意见》提出，结合数字孪生流域、数字孪生水网建设，强化水利工程调度运用______功能应用。","opts":[{"k":"A","t":"预报预警预演预案"},{"k":"B","t":"监测监控分析研判"},{"k":"C","t":"调度指挥应急处置"},{"k":"D","t":"风险排查治理整改"}],"ans":"A","exp":"结合数字孪生流域、数字孪生水网建设，强化水利工程调度运用预报预警预演预案“四预”功能应用。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287864569859","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据2021年度报告，三峡集团2021年税后净利润具体为下列哪一值？","opts":[{"k":"A","t":"454.0亿元"},{"k":"B","t":"502.5亿元"},{"k":"C","t":"425.3亿元"},{"k":"D","t":"352.6亿元"}],"ans":"B","exp":"正确答案B：2021年报税后净利润502.5亿元；A项错误，454.0亿元是2020年税后净利润；C项错误，425.3亿元是2022年税后净利润；D项错误，352.6亿元是2018年税后净利润。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287864569858","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据2018年度报告，首批长江大保护试点城市为四省四市。下列各项中，不属于该四市的是？","opts":[{"k":"A","t":"重庆万州"},{"k":"B","t":"湖北宜昌"},{"k":"C","t":"湖南岳阳"},{"k":"D","t":"江西九江"}],"ans":"A","exp":"正确答案A（本题选不属于者）：2018年报首批长江大保护试点城市为湖北宜昌、湖南岳阳、江西九江、安徽芜湖；B、C、D三项均属四市；A项重庆万州不属于首批试点城市，第四市应为安徽芜湖。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287860375568","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据2017年度报告，三峡集团营业收入由2013年增长至2017年。2017年营业收入为下列哪一值？","opts":[{"k":"A","t":"783.1亿元"},{"k":"B","t":"900.0亿元"},{"k":"C","t":"630亿元"},{"k":"D","t":"635.2亿元"}],"ans":"B","exp":"正确答案B：2017年报五年表营业收入为425.9/630/635.2/783.1/900.0，2017年为900.0亿元；A项错误，783.1亿元是2016年值；C项错误，630亿元是2014年值；D项错误，635.2亿元是2015年值。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287860375567","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据年度报告，下列各电站与其总装机容量（万千瓦）的对应，错误的是？","opts":[{"k":"A","t":"向家坝 1020"},{"k":"B","t":"白鹤滩 1600"},{"k":"C","t":"乌东德 1020"},{"k":"D","t":"溪洛渡 1386"}],"ans":"A","exp":"正确答案A（本题选对应错误者）：向家坝水电站总装机容量为640万千瓦，而非1020万千瓦（1020万千瓦是乌东德的装机）；B项正确，白鹤滩1600万千瓦；C项正确，乌东德1020万千瓦；D项正确，溪洛渡1386万千瓦。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287860375562","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据2024年社会责任报告，2023年度国家科学技术进步奖一等奖（三峡集团第一完成单位，继特等奖后再获一等奖）授予的项目是？","opts":[{"k":"A","t":"海上风电安全高效开发成套技术和装备及产业化"},{"k":"B","t":"长江三峡枢纽工程"},{"k":"C","t":"300m级特高拱坝安全控制关键技术"},{"k":"D","t":"水力式升船机关键技术"}],"ans":"A","exp":"正确答案A：2024年社会责任报告“海上风电安全高效开发成套技术和装备及产业化”获2023年度国家科学技术进步奖一等奖（三峡集团第一完成单位）；B项错误，长江三峡枢纽工程获的是2019年度特等奖；C项错误，300m级特高拱坝技术获2018年二等奖；D项错误，水力式升船机关键技术获2018年国家技术发明奖二等奖。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287860375561","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据2016年度报告，2016年三峡集团一项重大工程成功实现试通航，被称为世界规模最大、技术最复杂、建设难度最高，该工程是？","opts":[{"k":"A","t":"三峡升船机"},{"k":"B","t":"三峡船闸"},{"k":"C","t":"向家坝升船机"},{"k":"D","t":"葛洲坝船闸"}],"ans":"A","exp":"正确答案A：2016年报世界规模最大、技术最复杂、建设难度最高的升船机三峡升船机成功实现试通航；B项错误，三峡船闸早已通航；C项错误，向家坝升船机2017年完成首次带船试验；D项错误，葛洲坝船闸为既有设施。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287860375560","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《2015年度报告》披露，集团2015年实现发电量2009.8亿千瓦时，2014年发电量为2012.2亿千瓦时。据此，2015年集团发电量较2014年（ ）。","opts":[{"k":"A","t":"增加2.4亿千瓦时"},{"k":"B","t":"减少2.4亿千瓦时"},{"k":"C","t":"增加约80亿千瓦时"},{"k":"D","t":"基本持平、无变化"}],"ans":"B","exp":"正确答案B：2012.2−2009.8=2.4亿千瓦时，2015年发电量较2014年减少2.4亿千瓦时（受流域来水偏枯影响）；A方向相反，C数值无依据，D忽略了实际下降，均错误。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287860375559","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据2024年社会责任报告，三峡集团“六大作用”战略发展定位中，“在共抓长江大保护中”发挥的作用是下列哪一项？","opts":[{"k":"A","t":"基础保障作用"},{"k":"B","t":"引领作用"},{"k":"C","t":"带动作用"},{"k":"D","t":"骨干主力作用"}],"ans":"D","exp":"正确答案D：六大作用中“在共抓长江大保护中发挥骨干主力作用”；A项错误，基础保障作用对应“促进长江经济带发展”；B项错误，引领作用对应“带领中国水电走出去”；C项错误，带动作用对应“促进清洁能源产业升级”。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287860375556","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"三峡集团早期核心价值观“奉献、担当、创新、和谐”在年度报告《核心理念》页中作为独立条目首次单列是在哪一年？","opts":[{"k":"A","t":"2014年"},{"k":"B","t":"2013年"},{"k":"C","t":"2016年"},{"k":"D","t":"2017年"}],"ans":"A","exp":"正确答案A：2013年报《核心理念》页未单列核心价值观，2014年报首次单列“奉献 担当 创新 和谐”；B项错误，2013年报该价值观未单列；C项错误，2016年是沿用；D项错误，2017年是沿用。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":" "趋势政策与行业动态"},{"id":"2069069287474499593","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于有限责任公司股东查账权，下列说法正确的是（）。","opts":[{"k":"A","t":"股东有权查阅并复制公司会计账簿"},{"k":"B","t":"公司拒绝股东查账的，可以口头方式作出"},{"k":"C","t":"股东起诉请求查账的，一概应当具有股东资格"},{"k":"D","t":"法院支持股东请求的，应当在判决中明确查账的时间"}],"ans":"D","exp":"选项A错误，公司会计账簿只能查阅不能复制。选项B错误，公司拒绝提供查阅的，应当自股东提出书面请求之日起15日内书面答复股东并说明理由。选项C错误，公司有证据证明原告在起诉时不具有公司股东资格的，人民法院应当驳回起诉，但原告有初步证据证明在持股期间其合法权益受到损害，请求依法查阅或者复制其持股期间的公司特定文件材料的除外。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287474499592","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司于2024年7月21日作出了减少注册资本的决议，下列相关说法中，不正确的是（）。","opts":[{"k":"A","t":"甲公司应当编制资产负债表及财产清单"},{"k":"B","t":"甲公司应当于8月20日前通知债权人"},{"k":"C","t":"甲公司应当按照股东的出资比例相应减少出资额"},{"k":"D","t":"甲公司应当依法向公司登记机关办理变更登记"}],"ans":"B","exp":"选项B：应为“7月31日前”通知债权人，8月20日前在报纸或者国家企业信用信息公示系统公告。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287474499591","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲有限责任公司与乙有限责任公司拟合并为丙有限责任公司。根据公司法律制度的规定，下列关于应承担甲、乙有限责任公司债权、债务的表述中，正确的是（）。","opts":[{"k":"A","t":"由甲公司自行承担"},{"k":"B","t":"由乙公司自行承担"},{"k":"C","t":"由丙公司承担"},{"k":"D","t":"由甲、乙公司各自承担，无法承担的部分由丙公司承担"}],"ans":"C","exp":"根据公司法律制度的规定，公司合并时，合并各方的债权、债务，应当由合并后存续的公司或者新设的公司承继。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287474499590","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"有限责任公司股东对外转让股权，受让股东可以主张行使股东权利的时间为（）。","opts":[{"k":"A","t":"签订转让协议时"},{"k":"B","t":"记载于股东名册时"},{"k":"C","t":"办理完变更登记时"},{"k":"D","t":"股权受让款支付完毕时"}],"ans":"B","exp":"有限责任公司应当置备股东名册，记载于股东名册的股东，可以依股东名册主张行使股东权利。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287474499585","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司在618购物节对其生产的吸尘器推出促销政策，每台吸尘器的促销价为2000元，2×25年6月18日，甲公司与乙公司签订一项销售合同，向乙公司销售1600台吸尘器，甲公司于当日发货，控制权当日转移至乙公司。甲公司承诺，若在出售后一个月内降价，甲公司将按照合同价格与最低售价之间的差额向乙公司退还差价。甲公司根据以往经验估计：每台吸尘器不降价的概率为50%，降价100元的概率为30%，降价200元的概率为20%。不考虑其他因素，甲公司在2×25年6月18日应确认的收入金额为（）万元。","opts":[{"k":"A","t":"304"},{"k":"B","t":"308.8"},{"k":"C","t":"320"},{"k":"D","t":"0"}],"ans":"B","exp":"当企业拥有大量具有类似特征的合同，并据此估计可能产生多个结果时，通常按照期望值估计可变对价金额。甲公司每台吸尘器的交易价格=2000×50%+（2000-100）×30%+（2000-200）×20%=1930（元），故甲公司在2×25年6月18日应确认的收入金额=1930×1600÷10000=308.8（万元）。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287470305306","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列各项中，不属于无需退回的初始费的是（）。","opts":[{"k":"A","t":"某快餐店内需持卡消费，顾客在购买储值卡时需要先支付10元押金，该押金可退，但如果储值卡丢失则押金不予退还"},{"k":"B","t":"某餐饮店实行会员制，顾客可以花50元购买会员卡，持有该会员卡在餐饮店消费可以享受会员价格"},{"k":"C","t":"某电信公司与客户签订两年的服务合同，客户预付1 800元初始费用，以后每月只需再支付30元便可享限定的流量和通话时间，如果超过限定则按使用量额外付费"},{"k":"D","t":"某会员制健身俱乐部，向顾客一次性收取200元入会费，用于补偿俱乐部为客户进行登记注册的初始活动，年费还需单独支付"}],"ans":"A","exp":"选项A，正常情况下，如果储值卡不丢失，押金10元是可以退回的，这10元押金只是针对储值卡的工本费收取的款项，因此不属于无需退回的初始费。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287470305298","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司固定制造费用小时分配率为1.8元/小时，人工总工时为6000小时，固定制造费用中现金支出的数额为10000元，固定制造费用中只有折旧是非付现费用，那么折旧是（）元。","opts":[{"k":"A","t":"800"},{"k":"B","t":"1000"},{"k":"C","t":"1200"},{"k":"D","t":"500"}],"ans":"A","exp":"固定制造费用合计数＝1.8×6000＝10800（元），折旧＝10800－10000＝800（元）\n【提示】制造费用中，除折旧外都须支付现金，所以，根据每个季度制造费用数额扣除折旧费后，即可得出\"现金支出的数额\"。无论是正向考查或反向考查都是基于此原理。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287470305297","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某材料日需用量为50千克，经济订货量为4500千克，订货后平均交货时间为6天，基于扩展的经济订货模型，再订货点为（）。","opts":[{"k":"A","t":"750千克"},{"k":"B","t":"150千克"},{"k":"C","t":"540千克"},{"k":"D","t":"300千克"}],"ans":"D","exp":"再订货点=平均交货时间×平均日需求量=6×50=300（千克）。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287470305296","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司根据存货模型确定的最佳现金持有量为100000元，持有现金的机会成本率为10%。在最佳现金持有量下，该公司与现金持有量相关的现金持有总成本为（）元。","opts":[{"k":"A","t":"5000"},{"k":"B","t":"10000"},{"k":"C","t":"15000"},{"k":"D","t":"20000"}],"ans":"B","exp":"现金持有总成本=机会成本+交易成本因为在存货模式下，达到最佳现金持有量时，现金持有总成本=2×机会成本=2×交易成本（因为机会成本=交易成本）；因此，与现金持有量相关的现金持有总成本=2×（100000/2×10%）=10000（元）。","wrong":1.0,"cat":"管理会计"},{"id":"2069069287470305294","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某企业编制第二季度资金预算，期初现金余额为-17840元，资金预算表中“资金筹措与运用”部分列示偿还借款利息500元。若企业需要保留的最低现金余额为3000元，银行借款的金额要求是1000元的整倍数，则企业第二季度的最低借款额为（）元。","opts":[{"k":"A","t":"22 000"},{"k":"B","t":"18 000"},{"k":"C","t":"21 000"},{"k":"D","t":"23 000"}],"ans":"A","exp":"本题考查资金预算的编制。假设借入X万元，则有：-17840+X-500≥3000，求得：X≥21340（元），由于借款金额是1000元的整数倍，因此借款金额为22000元，选项A当选。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2069069287470305292","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某企业在编制资金预算时，每个季度末的理想现金余额为10000元，若余额不足则在当季度初向银行借款，借款金额要求为1000元的整数倍，借款年利率为8%，在每季度末支付归属于该季度的借款利息，假设第二季度末不存在银行借款，第三季度末现金余缺为-58570元，则第三季度初应向银行借款金额为（）。","opts":[{"k":"A","t":"70000元"},{"k":"B","t":"59000元"},{"k":"C","t":"69000元"},{"k":"D","t":"58000元"}],"ans":"A","exp":"设第三季度初向银行借款金额为X元，-58570+X-X×8%/4≥10000，解得：X≥69969.39（元），借款金额要求为1000元的整数倍，因此借款金额为70000元。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2069069287470305291","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某上市公司2023年末股票市价为20元，期末流通在外普通股数量100万股，净资产为400万元。2023年实现净利润100万元，流通在外普通股的加权平均数为80万股，则市净率为（）倍。","opts":[{"k":"A","t":"4"},{"k":"B","t":"5"},{"k":"C","t":"16"},{"k":"D","t":"20"}],"ans":"B","exp":"本题考查市净率。每股净资产=净资产/股数=400/100=4（元），市净率=每股市价/每股净资产=20/4=5（倍），选项B当选。","wrong":1.0,"cat":"财务管理"},{"id":"2069069287470305290","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某投资方案折现率为18%，项目净现值为-3.17万元；折现率为16%，净现值为6.12万元，则该方案的内含收益率为（）。","opts":[{"k":"A","t":"18.32%"},{"k":"B","t":"17.32%"},{"k":"C","t":"16.73%"},{"k":"D","t":"15.56%"}],"ans":"B","exp":"本题考查内含收益率的插值法计算。当投资方案的折现率为内含收益率时，项目净现值为0，则有：（IRR-16%）/（0-6.12）=（18%-16%）/（-3.17-6.12），求得：IRR=17.32%，选项B当选。","wrong":1.0,"cat":"财务管理"},{"id":"2069069287470305288","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"若纯粹利率为4%，通货膨胀补偿率为2%，某投资债券公司要求的风险收益率为6%，则该债券公司的必要收益率为（）。","opts":[{"k":"A","t":"9%"},{"k":"B","t":"12%"},{"k":"C","t":"5%"},{"k":"D","t":"7%"}],"ans":"B","exp":"本题考查必要收益率的计算。必要收益率=无风险收益率+风险收益率=纯粹利率+通货膨胀补偿率+风险收益率=4%+2%+6%=12%，选项B当选。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2069069287470305282","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"乙公司只生产和销售一种产品，单价为10元，单位变动成本为7元，盈亏平衡点作业率30%，则销售利润率为（）。","opts":[{"k":"A","t":"9%"},{"k":"B","t":"14%"},{"k":"C","t":"20%"},{"k":"D","t":"21%"}],"ans":"D","exp":"本题考查销售利润率的计算。变动成本率=变动成本/单价×100%=7/10×100%=70%，边际贡献率=1-变动成本率=1-70%=30%，安全边际率=1-盈亏平衡点作业率=1-30%=70%，则销售利润率=安全边际率×边际贡献率=70%×30%=21%，选项D当选。","wrong":1.0,"cat":"管理会计"},{"id":"2069069287461916674","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以预算为标准，通过预算分解、过程监督、差异分析等促使日常经营不偏离预算标准的管理活动是（）。","opts":[{"k":"A","t":"预算编制"},{"k":"B","t":"预算控制"},{"k":"C","t":"预算调整"},{"k":"D","t":"预算执行"}],"ans":"B","exp":"预算控制是指企业以预算为标准，通过预算分解、过程监督、差异分析等促使日常经营不偏离预算标准的管理活动。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287399002127","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于企业对外经济行为及合同订立，以下说法错误的是（   ）。","opts":[{"k":"A","t":"企业对外发生经济行为，除即时结清方式外，应当订立书面合同"},{"k":"B","t":"合同订立前，企业只需一般了解合同对方的主体资格、信用状况等内容"},{"k":"C","t":"对于影响重大、涉及较高专业技术或法律关系复杂的合同，应当组织相关专业人员参与谈判"},{"k":"D","t":"谈判过程中的重要事项和参与谈判人员的主要意见，应当予以记录并妥善保存"}],"ans":"B","exp":"《企业内部控制应用指引第 16 号—合同管理》第五条   企业对外发生经济行为 ，除即时结清方式外 ，应当订立书面合同。合同订立前 ，应当充分了解合同对方的主体资格 、信用状况等有关内容 ，确保对方当事人具备履约能力。\n对于影响重大 、涉及较高专业技术或法律关系复杂的合同 ，应当组织法律 、技术 、财会等专业人员参与谈判 ，必要时可聘请外部专家参与相关工作。\n谈判过程中的重要事项和参与谈判人员的主要意见 ，应当予以记录并妥善保存。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287399002117","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"以下关于企业采购业务管理的说法，正确的是（   ）。","opts":[{"k":"A","t":"企业采购业务可多头采购或分散采购，以提高采购灵活性"},{"k":"B","t":"企业对办理采购业务的人员无需定期进行岗位轮换"},{"k":"C","t":"重要和技术性较强的采购业务，应当组织相关专家进行论证，实行集体决策和审批"},{"k":"D","t":"企业可安排同一机构办理采购业务全过程，包括小额零星物资或服务"}],"ans":"C","exp":"《企业内部控制应用指引第 7 号—采购业务》第五条   企业的采购业务应当集中 ，避免多头采购或分散采购 ， 以提高采购业务效率 ， 降低采购成本 ，堵塞管理漏洞。企业应当对办理采购业务的人员定期进行岗位轮换。重要和技术性较强的采购业务 ，应当组织相关专家进行论证 ，实行集体决策和审批。\n企业除小额零星物资或服务外 ，不得安排同一机构办理采购业务全过程。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287399002116","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业在资金活动中，若出现投资决策失误的情况，最有可能引发的后果是（   ）。","opts":[{"k":"A","t":"引发资本结构不合理或无效融资，导致企业筹资成本过高或债务危机"},{"k":"B","t":"引发盲目扩张或丧失发展机遇，可能导致资金链断裂或资金使用效益低下"},{"k":"C","t":"导致企业陷入财务困境或资金冗余"},{"k":"D","t":"导致资金被挪用、侵占、抽逃或遭受欺诈"}],"ans":"B","exp":"《企业内部控制应用指引第 6 号—资金活动》第三条   企业资金活动至少应当关注下列风险：\n（一） 筹资决策不当，引发资本结构不合理或无效融资 ，可能导致企业筹资成本过高或债务危机。\n（二） 投资决策失误，引发盲目扩张或丧失发展机遇 ，可能导致资金链断裂或资金使用效益低下。\n（三） 资金调度不合理 、营运不畅 ，可能导致企业陷入财务困境或资金冗余。\n（四） 资金活动管控不严 ，可能导致资金被挪用 、侵占 、抽逃或遭受欺诈。","wrong":1.0,"cat":"财务管理"},{"id":"2069069287394807833","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"（   ）是企业对超出风险承受度的风险，通过放弃或者停止与该风险相关的业务活动以避免和减轻损失的策略。","opts":[{"k":"A","t":"风险规避"},{"k":"B","t":"风险降低"},{"k":"C","t":"风险分担"},{"k":"D","t":"风险承受"}],"ans":"A","exp":"《企业内部控制基本规范》第二十六条   企业应当综合运用风险规避 、风险降低 、风险分担和风险承受等风险应对策略，实现对风险的有效控制。\n风险规避是企业对超出风险承受度的风险 ，通过放弃或者停止与该风险相关的业务活动以避免和减轻损失的策略。\n风险降低是企业在权衡成本效益之后 ，准备采取适当的控制措施降低风险或者减轻损失 ，将风险控制在风险承受度之内的策略。\n风险分担是企业准备借助他人力量 ，采取业务分包 、购买保险等方式和适当的控制措施 ，将风险控制在风险承受度之内的策略。\n风险承受是企业对风险承受度之内的风险 ，在权衡成本效益之后 ，不准备采取控制措施降低风险或者减轻损失的策略。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287394807830","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"当企业人力资源激励约束制度不合理、关键岗位人员管理不完善时，可能引发的后果不包括（   ）。","opts":[{"k":"A","t":"人才流失"},{"k":"B","t":"经营效率低下"},{"k":"C","t":"人力资源开发机制不健全"},{"k":"D","t":"关键技术、商业秘密和国家机密泄露"}],"ans":"C","exp":"《企业内部控制应用指引第 3 号—人力资源》第三条 企业人力资源管理至少应当关注下列风险：\n（一）人力资源缺乏或过剩、结构不合理、开发机制不健全，可能导致企业发展战略难以实现。\n（二）人力资源激励约束制度不合理、关键岗位人员管理不完善，可能导致人才流失、经营效率低下或关键技术、商业秘密和国家机密泄露。\n（三）人力资源退出机制不当，可能导致法律诉讼或企业声誉受损。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287394807829","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业在制定与实施发展战略过程中，可能导致企业资源浪费，甚至危及企业的生存和持续发展的风险是（   ）。","opts":[{"k":"A","t":"缺乏明确的发展战略"},{"k":"B","t":"发展战略实施不到位"},{"k":"C","t":"发展战略过于激进，脱离企业实际能力或偏离主业"},{"k":"D","t":"发展战略因主观原因频繁变动"}],"ans":"D","exp":"《企业内部控制应用指引第 ２号—发展战略》第三条 企业制定与实施发展战略至少应当关注下列风险：\n（一）缺乏明确的发展战略或发展战略实施不到位，可能导致企业盲目发展，难以形成竞争优势，丧失发展机遇和动力。\n（二）发展战略过于激进，脱离企业实际能力或偏离主业，可能导致企业过度扩张，甚至经营失败。\n（三）发展战略因主观原因频繁变动，可能导致资源浪费，甚至危及企业的生存和持续发展。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287394807821","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十大报告指出，广泛践行社会主义核心价值观，弘扬以（）为源头的中国共产党人精神谱系，深入开展社会主义核心价值观宣传教育，深化爱国主义、集体主义、社会主义教育，着力培养担当民族复兴大任的时代新人。","opts":[{"k":"A","t":"长征精神"},{"k":"B","t":"伟大建党精神"},{"k":"C","t":"井冈山精神"},{"k":"D","t":"延安精神"}],"ans":"B","exp":"广泛践行社会主义核心价值观，弘扬以伟大建党精神为源头的中国共产党人精神谱系，深入开展社会主义核心价值观宣传教育，深化爱国主义、集体主义、社会主义教育，着力培养担当民族复兴大任的时代新人。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287394807820","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十大报告指出，必须更好发挥法治（）的保障作用，在法治轨道上全面建设社会主义现代化国家。","opts":[{"k":"A","t":"固根本、稳预期、利长远"},{"k":"B","t":"促和谐、调纠纷、利人民"},{"k":"C","t":"固根本、调纠纷、利人民"},{"k":"D","t":"息纠纷、维稳定、促和谐"}],"ans":"A","exp":"报告指出，必须更好发挥法治固根本、稳预期、利长远的保障作用，在法治轨道上全面建设社会主义现代化国家。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287394807819","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十大报告指出，坚持我国宗教（）方向，积极引导宗教与社会主义社会相适应。","opts":[{"k":"A","t":"社会主义化"},{"k":"B","t":"中国化"},{"k":"C","t":"民族化"},{"k":"D","t":"时代化"}],"ans":"B","exp":"报告指出，坚持我国宗教中国化方向，积极引导宗教与社会主义社会相适应。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287394807818","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十大报告指出，人心是最大的政治，（）是凝聚人心、汇聚力量的强大法宝。","opts":[{"k":"A","t":"党的建设"},{"k":"B","t":"政党协商"},{"k":"C","t":"民主协商"},{"k":"D","t":"统一战线"}],"ans":"D","exp":"人心是最大的政治，统一战线是凝聚人心、汇聚力量的强大法宝。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287394807815","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十大报告指出，未来五年是全面建设社会主义现代化国家（）的关键时期。","opts":[{"k":"A","t":"开局起步"},{"k":"B","t":"创新变革"},{"k":"C","t":"持续建设"},{"k":"D","t":"决战决胜"}],"ans":"A","exp":"报告指出，未来五年是全面建设社会主义现代化国家开局起步的关键时期。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287394807812","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十大报告指出，我们坚持以马克思主义为指导，是要运用其（）解决中国的问题，而不是要背诵和重复其具体结论和词句，更不能把马克思主义当成一成不变的教条。","op "单选题","stem":"某镇党委书记为推进乡村振兴，增加群众收入，要求各村大面积栽种中草药。由于缺乏种植经验，村民普遍存在抵制心理，为督促种植，各村村干部挨家挨户动员。结果，大多数村民种植的中草药品质不高，无人愿意收购，导致村民损失惨重。关于该党员领导干部等人的行为，下列说法正确的是（）。","opts":[{"k":"A","t":"该党员领导干部干涉村民生产经营自主权，致使其遭受较大损失，违反群众纪律"},{"k":"B","t":"该镇各村村干部挨家挨户督促村民种植中草药，违反组织纪律"},{"k":"C","t":"该党员领导干部的出发点是为了带领村民致富，不违反纪律"},{"k":"D","t":"该党员领导干部超标准向群众摊派任务，加重群众负担，违反群众纪律"}],"ans":"A","exp":"《中国共产党纪律处分条例》 对应条款：第一百二十三条 干涉生产经营自主权，致使群众财产遭受较大损失的，对直接责任者和领导责任者，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287382224924","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党员干部违反有关规定取得、持有、实际使用运动健身卡、会所和俱乐部会员卡、高尔夫球卡等各种消费卡（券），或者违反有关规定出入私人会所，情节较重的，给予（）处分。","opts":[{"k":"A","t":"严重警告"},{"k":"B","t":"撤销党内职务"},{"k":"C","t":"留党察看"},{"k":"D","t":"警告或者严重警告"}],"ans":"D","exp":"《中国共产党纪律处分条例》 对应条款：第一百零二条 违反有关规定取得、持有、实际使用运动健身卡、会所和俱乐部会员卡、高尔夫球卡等各种消费卡（券），或者违反有关规定出入私人会所，情节较重的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287382224915","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的十八大以来，以习近平同志为核心的党中央从坚持和发展中国特色社会主义的全局和战略高度定位法治、布局法治、厉行法治，创造性提出了关于全面依法治国的一系列新理念新思想新战略，形成了习近平法治思想。关于习近平法治思想，下列说法不正确的是（）。","opts":[{"k":"A","t":"坚持依宪治国、依宪执政"},{"k":"B","t":"坚持在法治轨道上推进国家治理体系和治理能力现代化"},{"k":"C","t":"坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设"},{"k":"D","t":"坚持建设勤政务实的高素质法治工作队伍"}],"ans":"D","exp":"2020年11月16日至17日，中央全面依法治国工作会议首次提出并用“十一个坚持”系统阐述了习近平法治思想。即：（1）坚持党对全面依法治国的领导；（2）坚持以人民为中心；（3）坚持中国特色社会主义法治道路；（4）坚持依宪治国、依宪执政；（5）坚持在法治轨道上推进国家治理体系和治理能力现代化；（6）坚持建设中国特色社会主义法治体系；（7）坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；（8）坚持全面推进科学立法、严格执法、公正司法、全民守法；（9）坚持统筹推进国内法治和涉外法治；（10）坚持建设德才兼备的高素质法治工作队伍；（11）坚持抓住领导干部这个“关键少数”。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287382224913","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"习近平总书记强调，公共安全连着千家万户，事关人民群众生命财产安全，事关改革定大局。关于公共安全治理，下列说法正确的有几项（）。\n①应急救援是完善公共安全治理体制的首要环节，要把损失减少到最小\n②坚持安全第一、救援为主，不断完善公共安全治理机制，提高公共安全治理水平\n③健全重大突发公共事件处置保障体系，完善大安全大应急框架下应急指挥机制\n④完善安全生产风险排查整治和责任倒查机制，加强制度化常态化安全监管\n⑤加强网络安全体制建设，完善网络空间治理法律法规，筑牢网络安全“防火墙”","opts":[{"k":"A","t":"2项"},{"k":"B","t":"3项"},{"k":"C","t":"4项"},{"k":"D","t":"5项"}],"ans":"B","exp":"①错误，事前预防是完善公共安全治理体制的首要环节，预防的目的就是把灾害事故风险降到最低程度，力争做到尽量不出事。②错误，党的二十大报告明确指出：“坚持安全第一、预防为主，建立大安全大应急框架，完善公共安全体系，推动公共安全治理模式向事前预防转型。”③正确，健全重大突发公共事件处置保障体系，完善大安全大应急框架下应急指挥机制。④正确，完善安全生产风险排查整治和责任倒查机制，加强制度化常态化安全监管，严格落实安全生产责任制，从源头上防范化解重大安全风险，坚决遏制重特大事故发生。⑤正确，加强网络安全体制建设，完善网络空间治理法律法规，筑牢网络安全“防火墙”。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287382224911","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"中央民族工作会议用“十二个必须”提炼概括习近平总书记关于加强和改进民族工作的重要思想，为做好新时代党的民族工作指明了前进方向，提供了根本遵循。下列属于“十二个必须”有几项（）。\n①必须把推动各民族为全面建设社会主义现代化国家共同奋斗作为新时代党的民族工作主线\n②必须以铸牢中华民族共同体意识为新时代党的民族工作的重要任务\n③必须从中华民族伟大复兴战略高度把握新时代党的民族工作的历史方位\n④必须坚持各民族一律平等\n⑤必须高举中华民族大团结旗帜","opts":[{"k":"A","t":"2项"},{"k":"B","t":"3项"},{"k":"C","t":"4项"},{"k":"D","t":"5项"}],"ans":"B","exp":"①②错误，③④⑤正确，“十二个必须”，即：（1）必须从中华民族伟大复兴战略高度把握新时代党的民族工作的历史方位；（2）必须把推动各民族为全面建设社会主义现代化国家共同奋斗作为新时代党的民族工作的重要任务；（3）必须以铸牢中华民族共同体意识为新时代党的民族工作的主线；（4）必须坚持正确的中华民族历史观；（5）必须坚持各民族一律平等；（6）必须高举中华民族大团结旗帜；（7）必须坚持和完善民族区域自治制度；（8）必须构筑中华民族共有精神家园；（9）必须促进各民族广泛交往交流交融；（10）必须坚持依法治理民族事务；（11）必须坚决维护国家主权、安全、发展利益；（12）必须坚持党对民族工作的领导。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287382224909","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的十八大以来，以习近平同志为核心的党中央深刻把握新时代中国和世界发展大势，在对外工作上进行一系列重大理论和实践创新，形成了习近平外交思想。关于习近平外交思想的内涵，下列说法正确的是（）。\n①坚持以合作共赢为理念引领全球治理体系改革\n②坚持以深化外交布局为依托打造全球伙伴关系\n③坚持以共商共建共享为原则推动“一带一路”建设\n④坚持以对外工作优良传统和时代特征相结合为方向塑造中国外交独特风范","opts":[{"k":"A","t":"①②④"},{"k":"B","t":"①③④"},{"k":"C","t":"②③④"},{"k":"D","t":"①②③④"}],"ans":"C","exp":"①错误，②③④正确，2018年6月22日至23日，中央外事工作会议确立习近平外交思想的指导地位，并用“十个坚持”阐释习近平外交思想的丰富内涵。即：（1）坚持以维护党中央权威为统领加强党对对外工作的集中统一领导；（2）坚持以实现中华民族伟大复兴为使命推进中国特色大国外交；（3）坚持以维护世界和平、促进共同发展为宗旨推动构建人类命运共同体；（4）坚持以中国特色社会主义为根本增强战略自信；（5）坚持以共商共建共享为原则推动“一带一路”建设；（6）坚持以相互尊重、合作共赢为基础走和平发展道路；（7）坚持以深化外交布局为依托打造全球伙伴关系；（8）坚持以公平正义为理念引领全球治理体系改革；（9）坚持以国家核心利益为底线维护国家主权、安全、发展利益；（10）坚持以对外工作优良传统和时代特征相结合为方向塑造中国外交独特风范。这“十个坚持”构成了习近平外交思想的总体框架和核心要义，明确了新时代中国外交的战略目标、基本原则、根本途径、实 础编制，所以，现金流量表正表不得调整，选项C不当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350001328129","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2×19年1月20日，2×18年度财务报告尚未批准报出时，甲公司的股东将其60%的普通股溢价出售给丁公司。这一交易对甲公司来说，属于调整事项。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"甲公司的股东将其持有的60%的普通股溢价出售给丁公司，这一交易对甲公司来说，只是换了一个股东，甲公司应将其作为非调整事项处理，并在其编制2×18年度财务报告时，披露与这一非调整事项有关的丁公司购置股份的事实，以及有关购置价格的信息。","wrong":1.0,"cat":"财务会计"},{"id":"2057262349837750274","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"对资产负债表日后事项中的调整事项，涉及损益的事项，直接通过“利润分配——未分配利润”科目核算。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题考核日后调整事项的处理原则。对资产负债表日后事项中的调整事项，涉及损益的事项，先通过“以前年度损益调整”科目核算，然后转入“利润分配——未分配利润”科目，并调整“盈余公积”科目。","wrong":1.0,"cat":"财务会计"},{"id":"2057262349783224321","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司2012年财务报告批准报出日为2013年4月25日。2013年3月2日，甲公司发现2012年度一项财务报表舞弊或差错，该公司应调整（ ）。","opts":[{"k":"A","t":"2012年资产负债表的期末余额"},{"k":"B","t":"2012年资产负债表的年初余额"},{"k":"C","t":"2012年利润表上期金额"},{"k":"D","t":"2013年资产负债表的期末余额和本年累计数及本年实际数"}],"ans":"A","exp":"此调整事项，应调整利润表的本期金额，不是上期金额。","wrong":1.0,"cat":"财务会计"},{"id":"2057262349510594562","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列关于资产负债表日后事项的表述中，正确的有（ ）。","opts":[{"k":"A","t":"影响重大的资产负债表日后非调整事项应在附注中披露"},{"k":"B","t":"对资产负债表日后调整事项应当调整资产负债表日财务报表有关项目"},{"k":"C","t":"资产负债表日后事项包括资产负债表日至财务报告批准报出日之间发生的全部事项"},{"k":"D","t":"判断资产负债表日后调整事项的标准在于该事项对资产负债表日已经存在的情况提供了新的或进一步的证据"}],"ans":"A,B,D","exp":"资产负债表日后事项包括资产负债表日至财务报告批准报出日之间发生的有利或不利事项，即资产负债表日后事项仅仅是指的对报告年度报告有关的事项，并不是在这个期间发生的所有事项，所以选项C不正确。","wrong":1.0,"cat":"财务会计"},{"id":"2057262349451874306","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"对于重要的资产负债表日后非调整事项，应披露其（ ）。","opts":[{"k":"A","t":"非调整事项性质"},{"k":"B","t":"非调整事项内容"},{"k":"C","t":"非调整事项对财务状况和经营成果的影响"},{"k":"D","t":"非调整事项如无法作出估计，应说明原因"}],"ans":"A,B,C,D","exp":"企业应当在附注中披露与资产负债表日后事项有关的信息，其中包括每项重要的资产负债表日后非调整事项的性质、内容，及其对财务状况和经营成果的影响。无法作出估计的，应当说明原因。","wrong":1.0,"cat":"财务会计"},{"id":"2057262349397348354","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"M上市公司2×18年度财务报告批准报出日为2×19年4月15日。该公司在2×19年1月1日至4月15日之间发生的下列事项中，不属于资产负债表日后调整事项的有（ ）。","opts":[{"k":"A","t":"处置其子公司"},{"k":"B","t":"支付2×18年度财务报表审计费"},{"k":"C","t":"董事会提出2×18年度现金股利分配方案"},{"k":"D","t":"2×18年已确认收入的商品销售，因质量问题而被退货，销售当时并未预计退货率"}],"ans":"A,B,C","exp":"选项A、C属于日后非调整事项；选项B，支付财务报表审计费，属于当期正常事项；选项D，属于日后期间进一步确定售出资产的收入，应作为调整事项处理。","wrong":1.0,"cat":"财务会计"},{"id":"2057262349237964801","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司2×18年度财务报表于2×19年4月20日经董事会批准对外报出，按照净利润的10%提取法定盈余公积。2×18年12月31日应收乙公司账款2 000万元，当日对其计提坏账准备200万元。2×19年2月20日，甲公司获悉乙公司已向法院申请破产，应收乙公司账款预计全部无法收回。不考虑其他因素，上述日后事项对2×18年未分配利润的影响金额是（ ）万元。","opts":[{"k":"A","t":"－180"},{"k":"B","t":"－1 620"},{"k":"C","t":"－1 800"},{"k":"D","t":"－2 000"}],"ans":"B","exp":"由于题目说明了不考虑其他因素且没有给出所得税税率，因此不考虑所得税的影响。按照净利润的10%提取法定盈余公积，因此该事项减少2×18年未分配利润的金额＝（2 000－200）×（1－10%）＝1 620（万元）。调整分录为：\n借：以前年度损益调整——信用减值损失1 800\n  贷：坏账准备   1 800\n借：盈余公积  180\n  利润分配——未分配利润  1 620\n  贷：以前年度损益调整  1 800\n【提示】这里应收款项只是预计全部无法收回，不是实际已发生损失，所以不能按实际发生坏账处理，应该对应收账款全部计提坏账准备。所以调整时，补计提了坏账准备。\n【拓展】如果考虑所得税影响，税法认可的是实际发生坏账，不认可补提或者转回的坏账准备，所以本题补计提了1800的坏账准备，应收账款的账面价值会小于计税基础，因此产生可抵扣暂时性差异，需要补确认递延所得税资产；\"以前年度损益调整——信用减值损失\"科目会调减会计利润1800，但因为税法不允许税前扣除，需要调增会计利润1800，也就是加可抵扣暂时性差异1800，因此对应纳税所得额没有影响，不需要调整应交所得税。如果考虑所得税影响的调整分录如下：借：以前年度损益调整——信用减值损失1 800  贷：坏账准备 1 800借：递延所得税资产 450  贷：以前年度损益调整——所得税费用 450借：盈余公积 135  利润分配——未分配利润 1 215  贷：以前年度损益调整 1 350","wrong":1.0,"cat":"财务会计"},{"id":"2057262349183438850","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列关于资产负债表日后事项的表述中，正确的有（  ）。","opts":[{"k":"A","t":"如果资产负债表日及所属会计期间已经存在某种情况，但当时并不知道其存在或者不能知道确切结果，资产负债表日后发生的事项能够证实该情况的存在或者确切结果，则该事项属于资产负债表日后事项中的调整事项"},{"k":"B","t":"资产负债表日后非调整事项是指表明资产负债表日后发生的情况的事项"},{"k":"C","t":"资产负债表日后重要的非调整事项虽然不影响资产负债表日的财务报表数字，但可能影响财务报表使用者做出正确的决策和估计，需要适当披露"},{"k":"D","t":"如果资产负债表日后事项对资产负债表日的情况提供了进一步的证据，证据表明的情况与原来的估计和判断不完全一致，则需要对原来的会计处理进行调整"}],"ans":"A,B,C,D","exp":"选项A：调整事项是指对资产负债表日已经存在的情况提供了新的或进一步证据的事项。选项描述符合调整事项的定义，正确。选项B：非调整事项是指表明资产负债表日后发生的情况的事项。选项描述正确。选项C：重要的非调整事项虽然不影响资产负债表日的财务报表数字，但可能影响财务报表使用者做出正确决策，企业应当在附注中予以披露。选项描述正确。选项D：如果日后事项提供的进一步证据表明原来的估计与实际情况不符，应当对原来的会计处理进行调整，这属于调整事项的处理原则。选项描述正确。","wrong":1.0,"cat":"财务会计"},{"id":"2057262349011472386","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列关于会计政策的表述中，不正确的是（  ）。","opts":[{"k":"A","t":"会计政策，是指企业在会计确认、计量和报告中所采用的原则、基础和会计处理方法"},{"k":"B","t":"企业应当披露所有的会计政策以及与会计政策有关的信息"},{"k":"C","t":"由于企业经济业务的复杂性和多样化，某些经济业务在符合会计原则和计量基础的要求下，可以有多种可供选择的会计政策"},{"k":"D","t":"企业在发生某项经济业务时，必须从允许的会计原则、计量基础和会计处理方法中选择出适合本企业特点的会计政策"}],"ans":"B","exp":"企业应当披露重要的会计政策，不具有重要性的会计政策可以不予披露。判断会计政策是否重要，应当考虑与会计政策相关的项目的性质和金额，选项B不正确。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348956946434","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"A公司2013年1月1日开始计提折旧的一台设备，原值为65000元，预计使用年限为8年，预计净残值为5000元，按年限平均法计提折旧。到2017年年初，由于新技术发展，A公司将该设备的预计使用年限变更为6年，预计净残值变更为3000元，折旧方法不变。A公司2017年应计提的折旧额为（  ）元。","opts":[{"k":"A","t":"16000"},{"k":"B","t":"11000"},{"k":"C","t":"8000"},{"k":"D","t":"15000"}],"ans":"A","exp":"A公司该设备2017年计提的折旧额=[65000-（65000-5000）/8×4-3000]/（6-4）=16000（元）。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348684316674","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列会计事项中，属于会计估计变更的有（  ）。","opts":[{"k":"A","t":"无形资产摊销方法由直线法改为产量法"},{"k":"B","t":"因持股比例下降长期股权投资的核算由成本法改为权益法"},{"k":"C","t":"坏账准备的计提方法由应收款项余额百分比法改为账龄分析法"},{"k":"D","t":"发出存货的计价方法由先进先出法改为移动加权平均法"}],"ans":"A,C","exp":"选项A和C，属于会计估计变更；选项B，与会计变更无关；选项D，属于会计政策变更。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348629790721","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项交易事项中，属于会计政策变更的有（ ）。","opts":[{"k":"A","t":"根据会计准则要求，期末存货由成本法核算改按成本与可变现净值孰低法计价"},{"k":"B","t":"企业新设的零售部商品销售采用零售价法核算，其他库存商品继续采用实际成本法"},{"k":"C","t":"根据会计准则要求对商品流通企业的进货费用由计入当期损益改为计入存货成本"},{"k":"D","t":"由于物价变动，企业将存货发出方法由先进先出法改为加权平均法"}],"ans":"A,C,D","exp":"选项B，对于新设的零售部采用零售价法核算，属于新的事项采用新的会计政策，不属于会计政策变更。选项C，企业是根据准则的要求，对进货费用的计入规则进行的变更，符合会计政策变更的条件。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348403298306","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2×21年1月1日，甲公司将当日购买的一栋办公楼对外出租，由于地处偏僻，没有活跃的房地产交易市场，无法取得同类或类似房地产的市场价格，作为成本模式计量的投资性房地产核算。2×24年1月1日，甲公司投资性房地产满足公允价值模式计量的条件，甲公司决定将其投资性房地产由成本模式计量改为公允价值模式计量。2×24年1月1日，甲公司投资性房地产的成本为4000万元，已计提折旧1500万元，未计提减值准备，公允价值为6000万元。甲公司适用的所得税税率为25%，采用资产负债表债务法核算所得税，税法对于该办公楼的规定与按成本模式计量的会计处理一致。甲公司按照净利润的10%计提盈余公积，不考虑其他因素，下列关于甲公司2×24年1月1日会计处理的表述中正确的有（  ）。","opts":[{"k":"A","t":"甲公司变更投资性房地产后续计量模式属于会计政策变更"},{"k":"B","t":"2×24年1月1日产生应纳税暂时性差异3500万元"},{"k":"C","t":"该变更不确认递延所得税负债"},{"k":"D","t":"该变更影响2×24年年初未分配利润2362.5万元"}],"ans":"A,B,D","exp":"甲公司变更投资性房地产后续计量模式属于会计政策变更，选项A正确；投资性房地产的账面价值为6000万元，计税基础=4000-1500=2500（万元），产生应纳税暂时性差异3500万元，应确认递延所得税负债875万元（3500×25%），选项B正确，选项C错误；该变更影响2×24年年初未分配利润的金额=（6000-2500）×（1-25%）×（1-10%）=2362.5（万元），选项D正确。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348348772354","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"企业变更固定资产的预计使用年限时，应对以前年度已计提折旧金额进行追溯调整。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业变更固定资产预计使用年限属于会计估计变更，企业对会计估计变更应当采用未来适用法处理，不追溯调整以前年度计提的折旧金额。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348239720450","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业发生的如下情形中，一般属于会计差错的有（ ）。","opts":[{"k":"A","t":"会计记录错误"},{"k":"B","t":"应用会计政策错误"},{"k":"C","t":"疏忽或曲解事实以及舞弊产生的影响"},{"k":"D","t":"固定资产盘盈"}],"ans":"A,B,C,D","exp":"四个选项，都属于会计差错。\n前期差错通常包括三个方面：\n1.会计记录错误；\n2.应用会计政策错误；\n3.疏忽或曲解事实以及舞弊产生的影响。\n【提示】固定资产是一种单位价值较高、使用期限较长的有形资产，因此，对于管理规范的企业而言，在清查中发现盘盈的固定资产是比较少见的，也是不正常的，这说明我们之前应该计提的折旧没有计提，这样固定资产盘盈会影响财务报表使用者对企业以前年度的财务状况、经营成果和现金流量进行判断。因此，固定资产盘盈应作为前期差错处理，通过\"以前年度损益调整\"科目核算。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348130668545","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2×19年发现会计人员在2×18年将财务费用200万元误算为2000万元，该事项应作为前期差错更正处理。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"前期差错通常包括会计记录错误、应用会计政策错误、疏忽或曲解事实以及舞弊产生的影响等。本题属于会计记录错误，应作为前期差错更正处理。","wrong":1.0,"cat":"财务会计"},{"id":"2057262348017422337","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，关于会计政策的变更的表述中正确的有（    ）。","opts":[{"k":"A","t":"企业的会计政策一经确定，不得随意变更"},{"k":"B","t":"法律、行政法规或者国家统一的会计制度等要求变更时，企业应当变更会计政策"},{"k":"C","t":"会计政策的变更能够提供更可靠、更相关的会计信息时，企业可以变更会计政策"},{"k":"D","t":"对于初次发生的或不重要的交易或事项采用新的会计政策，属于会计政策变更"}],"ans":"A,B,C","exp":"本题考查会计政策变更的条件和情形。企业的会计政策一经确定，不得随意变更，选项 A 当选。企业不能随意变更会计政策并不意味着企业的会计政策任何情况下都不能变更，满足下列条件之一的，可以变更：（1）法律、行政法规或者国家统一的会计制度等要求变更。（选项 B 当选）（2）会计政策的变更能够提供更可靠、更相关的会计信息。（选项 C 当选）对于本期发生的交易或者事项与以前相比具有本质差别而采用新的会计政策，以及对于初次发生的或不重要的交易或事项采用新的会计政策，不属于会计政策变更，选项 D 不当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347845455874","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，属于企业会计政策变更的有（    ）。","opts":[{"k":"A","t":"将发出存货的计价方法由先进先出法变更为加权平均法"},{"k":"B","t":"将投资性房地产的后续计量方式由成本模式变更为公允价值模式"},{"k":"C","t":"将无形资产的预计使用寿命由 7 年变更为 4 年"},{"k":"D","t":"将固定资产的折旧方法由双倍余额递减法变更为年限平均法"}],"ans":"A,B","exp":"本题考查会计政策变更、会计估计变更的辨别。会计政策变更，是指企业对相同的交易或事项由原来采用的会计政策改用另一会计政策的行为；会计估计变更，是指由于资产和负债的当前状况及预期经济利益和义务发生了变化，从而对资产或负债的账面价值或者资产的定期消耗金额进行调整的行为。存货的计价方法由先进先出法改为移动加权平均法属于会计政策变更，选项 A 当选；投资性房地产的后续计量模由成本法变更为公允价值模式计量属于会计政策变更，选项 B 当选；无形资产的预计使用年限由 7 年变更为 4 年属于对资产的定期消耗金额进行调整，属于会计估计变更，选项 C 不当选；固定资产的折旧方法由双倍余额递减法变更为年限平均法，属于会计估计变更，选项 D 不当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347736403970","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"本期发现的属于以前年度的非重要会计差错，不调整会计报表相关项目的期初数，但应调整发现当期与前期相同的相关项目。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"对于不重要的前期差错，企业无须调整财务报表相关项目的期初数，但应调整发现差错当期与前期相同的相关项目的金额。属于影响损益的，应直接计入本期与上期相同的净损益项目。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347518300162","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"会计政策，是指企业在会计确认、计量、记录和报告中所采用的原则、基础和会计处理方法。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"会计政策，是指企业在会计确认、计量和报告中所采用的原则、基础和会计处理方法，不涉及记录。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347409248258","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"对于其他权益工具投资，企业应该按照公允价值进行后续计量；而对于其他债权投资，企业应该按照摊余成本进行后续计量。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"不论是权益工具还是债务工具，凡属于以公允价值计量且其变动计入其他综合收益的金融资产，都要按照公允价值进行后续计量。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347354722306","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"以公允价值计量且其变动计入其他综合收益的金融资产期末无须计提减值准备。 （    ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题考查的是金融资产减值的会计核算。分类为以公允价值计量且其变动计入其他综合收益的金融资产（其他债权投资）发生信用减值应确认减值损失；指定为以公允价值计量且其变动计入其他综合收益的金融资产（其他权益工具投资）无须计提减值准备，因此，本题表述错误。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347300196353","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项关于金融资产的表述中，正确的有（ ）。","opts":[{"k":"A","t":"以公允价值计量且其变动计入当期损益的金融资产可以重分类为债权投资"},{"k":"B","t":"其他权益工具投资可以重分类为债权投资"},{"k":"C","t":"债权投资可以重分类为以公允价值计量且其变动计入当期损益的金融资产"},{"k":"D","t":"债权投资不可以重分类为以公允价值计量且其变动计入当期损益的金融资产"}],"ans":"A,C","exp":"选项B，其他权益工具投资一般不进行重分类；选项D，债权投资可以重分类为以公允价值计量且其变动计入当期损益的金融资产。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347241476097","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于债权投资的会计处理中，下列表述不正确的有（ ）。","opts":[{"k":"A","t":"初始确认时，按照重置成本计量"},{"k":"B","t":"初始确认时，按照摊余成本计量"},{"k":"C","t":"按公允价值进行后续计量"},{"k":"D","t":"按摊余成本进行后续计量"}],"ans":"A,B,C","exp":"债权投资初始确认时，应当按照公允价值进行计量；后续核算，应按摊余成本计量 。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347128229890","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"2×18年7月1日，甲公司从二级市场以2 100万元（含已到付息日但尚未领取的利息100万元）购入乙公司发行的债券，另发生交易费用10万元，分类为以公允价值计量且其变动计入当期损益的金融资产。当年12月31日，该交易性金融资产的公允价值为2 200万元（不含利息）。假定不考虑其他因素，当日，甲公司应就该资产确认的公允价值变动损益为（ ）万元。","opts":[{"k":"A","t":"90"},{"k":"B","t":"100"},{"k":"C","t":"190"},{"k":"D","t":"200"}],"ans":"D","exp":"甲公司应就该资产确认的公允价值变动损益＝2 200－（2 100－100）＝200（万元）。注意交易性金融资产发生的交易费用直接计入投资收益。相关会计分录为：2×18年7月1日：借：交易性金融资产——成本 2 000  应收利息 100    投资收益 10  贷：银行存款 2 1102×18年12月31日：借：交易性金融资产——公允价值变动 200  贷：公允价值变动损益 200","wrong":1.0,"cat":"财务会计"},{"id":"2057262347069509634","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"企业取得的金融资产，如果能够消除或显著减少会计错配，企业可以在初始确认时，将其直接指定为（ ）。","opts":[{"k":"A","t":"以摊余成本计量的金融资产"},{"k":"B","t":"以公允价值计量且其变动计入其他综合收益的金融资产"},{"k":"C","t":"以公允价值计量且其变动计入当期损益的金融负债"},{"k":"D","t":"以公允价值计量且其变动计入当期损益的金融资产"}],"ans":"D","exp":"如果能够消除或显著减少会计错配，企业可以在初始确认金融资产时，将其直接指定为以公允价值计量且其变动计入当期损益的金融资产。\n会计错配，是指当企业以不同的会计确认方法和计量属性对在经济上相关的资产或负债进行确认或计量由此产生的利得或损失时，可能导致的会计确认和计量上的不一致。","wrong":1.0,"cat":"财务会计"},{"id":"2057262347010789378","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"贷款的利息支付金额与涉及债务人业绩的变量挂钩，该贷款不符合本金加利息的合同现金流量特征。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"根据《企业会计准则第22号——金融工具确认和计量》的规定，金融资产合同现金流量特征测试（SPPI测试）要求：金融资产在特定日期产生的合同现金流量仅为对本金和以未偿付本金金额为基础的利息的支付。如果贷款的利息支付金额与债务人业绩变量（如利润、收入、权益回报率等）挂钩，则该贷款的合同现金流量不再满足“仅为本金加利息”的特征。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2057262346956263426","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，应作为以摊余成本计量的金融资产取得时初始成本入账的有（ ）。","opts":[{"k":"A","t":"投资时支付的税金"},{"k":"B","t":"投资时支付的手续费"},{"k":"C","t":"投资时支付款项中所含的已到付息期但尚未领取的利息"},{"k":"D","t":"投资时支付的不含应收利息的价款"}],"ans":"A,B,D","exp":"根据会计准则的规定，企业取得的以摊余成本计量的金融资产，应按其公允价值（不含支付价款中所包含的已到付息期但尚未领取的利息）与交易费用之和，借记\"债权投资\"科目，按已到付息期但尚未领取的利息，借记\"应收利息\"科目，贷记\"银行存款\"等科目。","wrong":1.0,"cat":"财务会计"},{"id":"2057262346901737474","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，会导致以摊余成本计量的金融资产的账面价值发生增减变动的有（ ）。","opts":[{"k":"A","t":"期末按该金融资产摊余成本和实际利率计算的投资收益"},{"k":"B","t":"期末摊销的利息调整"},{"k":"C","t":"计提的累计信用减值准备"},{"k":"D","t":"到期一次还本付息的情况下，按照债券面值和票面利率计算的应计利息"}],"ans":"B,C,D","exp":"以摊余成本计量的金融资产，其摊余成本等于账面价值，即由下列科目构成：\n债权投资——成本\n债权投资——利息调整\n债权投资——应计利息\n债权投资减值准备\n判断是否导致以摊余成本计量的金融资产的账面价值发生增减变动，只需看是否影响以上科目金额即可。\n选项A，记入\"投资收益\"科目，不影响摊余成本。\n分录：借：债权投资——应计利息             ——利息调整（或在贷方）  贷：投资收益（投资收益科目不影响摊余成本）\n借：信用减值损失  贷：债权投资减值准备","wrong":1.0,"cat":"财务会计"},{"id":"2057262346792685569","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"M公司于2×18年4月1日购入N公司的债券，并将其划分为以公允价值计量且其变动计入当期损益的金融资产。该债券面值为100万元，票面利率为6%，利息于每年6月30日和12月31日计提，1月1日、7月1日各付息一次。N公司本应于2×18年1月1日偿付的利息直至4月6日才 届财经技能竞赛","qtype":"单选题","stem":"某公司2024年年末的营运资金为138万元，流动负债为112万元，存货为82万元，则年末速动比率为（  ）。","opts":[{"k":"A","t":"0.50"},{"k":"B","t":"1.50"},{"k":"C","t":"1.96"},{"k":"D","t":"2.23"}],"ans":"B","exp":"根据营运资金=流动资产-流动负债，可知：流动资产=138+112=250（万元），速动比率=速动资产/流动负债=（250-82）/112=1.50。","wrong":1.0,"cat":"财务管理"},{"id":"2057262346012545026","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某企业2022年利润总额为1 000万元，财务费用中的利息支出金额为100万元，计入固定资产成本的资本化利息金额为50万元，则2022年利息保障倍数为（  ）","opts":[{"k":"A","t":"7.33"},{"k":"B","t":"7.67"},{"k":"C","t":"11.5"},{"k":"D","t":"6.67"}],"ans":"A","exp":"本题考查偿债能力分析。利息保障倍数=息税前利润÷应付利息=（净利润+所得税+利润表中的利息费用）÷应付利息=（1 000+100）÷（100+50）=7.33，选项A当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262345949630466","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，影响企业偿债能力的有（    ）。","opts":[{"k":"A","t":"可动用的授信额度"},{"k":"B","t":"资产质量"},{"k":"C","t":"债务担保"},{"k":"D","t":"未决诉讼"}],"ans":"A,B,C,D","exp":"本题考查偿债能力分析。影响偿债能力的其他因素包括：（1）可动用的银行贷款指标或授信额度；（2）资产质量；（3）或有事项（如债务担保或未决诉讼）和承诺事项。综上，选项ABCD当选。","wrong":1.0,"cat":"财务管理"},{"id":"2057262345731526658","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"丙公司2022年流动资产为5 000万元，其中货币资金为200万元，应收账款为3 000万元，存货1 500万元，预付账款300万元。流动负债为2 000万元，下列财务指标计算正确的有（   ）。","opts":[{"k":"A","t":"流动比率为2.5"},{"k":"B","t":"速动比率为1.6"},{"k":"C","t":"速动比率为1.75"},{"k":"D","t":"现金比率为0.1"}],"ans":"A,B,D","exp":"本题考查的是短期偿债能力相关指标的计算。流动比率=5 000/2 000=2.5，选项A当选。速动比率=（200+3 000）/2 000=1.6，选项B当选、选项C不当选。现金比率=200/2 000=0.1，选项D当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262345672806402","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"不考虑其他因素，当企业权益乘数升高时，下列说法中，正确的有（    ）。","opts":[{"k":"A","t":"资产负债率和产权比率提高"},{"k":"B","t":"长期偿债能力增加"},{"k":"C","t":"财务风险提高"},{"k":"D","t":"企业总杠杆下降"}],"ans":"A,C","exp":"本题考查偿债能力分析。权益乘数=资产总额÷权益总额，权益乘数与资产负债率、产权比率同向变动，所以资产负债率和产权比率也会升高，选项A当选。权益乘数越高，表明负债占总资产的比重增加，财务杠杆提高，财务风险提高，长期偿债能力降低，选项C当选、选项B不当选。总杠杆=经营杠杆×财务杠杆，不考虑其他因素的情况下，财务杠杆提高，总杠杆提高，选项D不当选。","wrong":1.0,"cat":"财务管理"},{"id":"2057262345618280450","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于经济增加值指标，下列表述正确的有（  ）。","opts":[{"k":"A","t":"不同企业之间经济增加值指标的可比性较强"},{"k":"B","t":"考虑了股东投入资本的机会成本"},{"k":"C","t":"有助于实现企业经营决策与股东财富最大化目标一致"},{"k":"D","t":"能够衡量企业长期发展战略的价值创造"}],"ans":"B,C","exp":"经济增加值是绝对数指标，可比性较差，选项A错误；经济增加值仅能衡量企业当期或预判未来1~3年的价值创造情况，无法衡量企业长远发展战略的价值创造，选项D错误。","wrong":1.0,"cat":"管理会计"},{"id":"2057262345563754498","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列财务指标中，最能反映企业即时偿付短期债务能力的是（  ）。","opts":[{"k":"A","t":"资产负债率"},{"k":"B","t":"流动比率"},{"k":"C","t":"权益乘数"},{"k":"D","t":"现金比率"}],"ans":"D","exp":"本题考查偿债能力分析。资产负债率和权益乘数反映企业长期偿债能力，选项AC不当选。流动比率反映企业短期偿债能力，但相较于流动比率，现金比率还剔除了存货和应收账款对偿债能力的影响，最能反映企业直接偿付流动负债的能力，选项D当选、选项B不当选。","wrong":1.0,"cat":"财务管理"},{"id":"2057262345454702593","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司流动资产为2 000万元，其中货币资金300万元，应收账款500万元，衍生金融资产200万元，存货800万元，其他流动资产200万元。流动负债1 600万元。甲公司的速动比率是（   ）。","opts":[{"k":"A","t":"0.5"},{"k":"B","t":"0.625"},{"k":"C","t":"1.125"},{"k":"D","t":"0.4"}],"ans":"B","exp":"本题考查偿债能力指标的计算。速动资产包括货币资金、交易性金融资产、衍生金融资产和各种应收款项，因此速动比率=（300+500+200）÷1 600=0.625，选项B当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262345341456385","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司流动比率为1.8，如果赊购一批原材料，则流动比率的变化方向是（  ）","opts":[{"k":"A","t":"不变"},{"k":"B","t":"都有可能"},{"k":"C","t":"变大"},{"k":"D","t":"变小"}],"ans":"D","exp":"本题考查流动比率。流动比率=流动资产÷流动负债，当流动比率大于1时，流动资产大于流动负债。赊购一批原材料会使流动资产和流动负债等额增长，则流动负债的增长幅度大于流动资产的增长幅度，流动比率变小，选项D当选。提示：大于1的分数，分子和分母同时增加相同的数值，则分数变小；小于1的分数，分子和分母同时增加相同的数值，则分数变大。","wrong":1.0,"cat":"财务管理"},{"id":"2057262345232404481","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，属于财务绩效定量评价的有（  ）。","opts":[{"k":"A","t":"经营增长"},{"k":"B","t":"资产质量"},{"k":"C","t":"盈利能力"},{"k":"D","t":"债务风险"}],"ans":"A,B,C,D","exp":"财务绩效定量评价是指对企业一定期间的盈利能力、资产质量、债务风险和经营增长四个方面进行定量对比分析和评判。","wrong":1.0,"cat":"财务管理"},{"id":"2057262345177878530","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某产品2024年预测销售量为3750吨，实际销售量为4000吨。根据指数平滑法，若平滑指数为0.4，则该产品2025年的预测销售量为（  ）。","opts":[{"k":"A","t":"3850吨"},{"k":"B","t":"3875吨"},{"k":"C","t":"3750吨"},{"k":"D","t":"3900吨"}],"ans":"A","exp":"2025年的预测销售量=a×前一期实际销售量+（1-a）×前一期预测销售量=0.4×4000+（1-0.4）×3750=3850（吨）。","wrong":1.0,"cat":"综合实务"},{"id":"2057262344678756353","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲企业生产销售乙产品，产销平衡。2024 年计划销售量为 10 000 件，单位变动成本 100 元，固定成本为 2 400 000 元，目标利润总额为 400 000 元，适用的消费税税率为 5%。不考虑其他因素，使用目标利润法测算的乙产品的单位售价为（    ）元。","opts":[{"k":"A","t":"357.89"},{"k":"B","t":"380"},{"k":"C","t":"400"},{"k":"D","t":"147.37"}],"ans":"C","exp":"单位成本 =100+2 400 000/10 000=340（元），单位利润 =400 000/10 000=40（元），则根据：P×（1-5%）=340+40，可得 P=400（元），选项 C 当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262344569704449","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某公司在2019年董事会上决定自2020年起将采用剩余股利政策分配股利，下列因素中，需要在计算股利发放金额时考虑的有（    ）。","opts":[{"k":"A","t":"公司的目标资本结构"},{"k":"B","t":"2019年末的货币资金"},{"k":"C","t":"2019年实现的净利润"},{"k":"D","t":"2020年需要的投资资本"}],"ans":"A,C,D","exp":"本题考查股利政策。剩余股利政策是指公司在有良好的投资机会时，根据目标资本结构，测算出投资所需的权益资本额，先从盈余中留用，然后将剩余的盈余作为股利来分配，所以需要考虑的因素包括投资机会、目标资本结构和净利润，选项ACD当选。分配股利的现金问题，是营运资金管理问题，如果现金存量不足，可以通过短期借款解决，与股利政策无直接关系，选项B不当选。","wrong":1.0,"cat":"财务管理"},{"id":"2057262344460652545","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"指数平滑法是一种销售预测分析方法，关于这种方法，下列表述正确的有（  ）。","opts":[{"k":"A","t":"指数平滑法实质上是一种加权平均法，平滑指数是赋给前期实际值的权重"},{"k":"B","t":"进行短期预测时，通常选择较小的平滑指数"},{"k":"C","t":"平滑指数的取值大小决定了前期实际值与预测值对本期预测值的影响"},{"k":"D","t":"销售量波动较大时，通常选择较大的平滑指数"}],"ans":"A,C,D","exp":"指数平滑法实质上是一种加权平均法，是以事先确定的平滑指数a和（1-a）在前一期的实际数与预测数之间进行加权，即本期预测值=a×前一期实际数+（1-a）×前一期预测数。选项A、C正确。如果销售量波动较大或预测短期销售，a取值较大；反之，取值较小。选项B错误、选项D正确。","wrong":1.0,"cat":"综合实务"},{"id":"2057262344406126594","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"有观点认为，投资者一般是风险厌恶型的，偏好确定的股利收益，不愿将收益留在公司而承担未来的投资风险。因此，支付较高股利有助于提高股价和公司价值。这种观点被称为（  ）。","opts":[{"k":"A","t":"“手中鸟”理论"},{"k":"B","t":"信号传递理论"},{"k":"C","t":"所得税差异理论"},{"k":"D","t":"代理理论"}],"ans":"A","exp":"本题描述的是“手中鸟”理论的观点。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2057262344238354434","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"纳税筹划可以利用的税收优惠政策包括（  ）。","opts":[{"k":"A","t":"税收扣除政策"},{"k":"B","t":"减税政策"},{"k":"C","t":"免税政策"},{"k":"D","t":"退税政策"}],"ans":"A,B,C,D","exp":"利用税收优惠进行纳税筹划主要是利用以下几个优惠政策：①利用免税政策；②利用减税政策；③利用退税政策；④利用税收扣除政策；⑤利用税收抵免；⑥利用税率差异；⑦利用分劈技术。","wrong":1.0,"cat":"税务"},{"id":"2057262344129302530","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"如果某公司以所持有的其他公司的有价证券作为股利发放给本公司股东，则该股利支付方式属于（   ）。","opts":[{"k":"A","t":"负债股利"},{"k":"B","t":"现金股利"},{"k":"C","t":"财产股利"},{"k":"D","t":"股票股利"}],"ans":"C","exp":"本题考查的是股利支付形式与程序。财产股利是以现金以外的其他资产支付的股利，主要是以公司所拥有的其他公司的有价证券，如债券、股票等作为股利支付给股东，选项C当选。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262344020250626","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在下列业绩评价指标中，最适合评价利润中心部门业绩的是（    ）。","opts":[{"k":"A","t":"可控边际贡献"},{"k":"B","t":"部门边际贡献"},{"k":"C","t":"投资收益率"},{"k":"D","t":"剩余收益"}],"ans":"B","exp":"本题考查利润中心。可控边际贡献反映了部门经理在其权限和控制范围内有效使用资源的能力，所以可控边际贡献是最适合评价利润中心部门经理的业绩评价指标，选项A不当选。部门边际贡献反映了部门为企业利润和弥补与生产能力有关的成本所作的贡献，用于评价部门业绩而不是利润中心管理者的业绩，选项B当选。投资收益率和剩余收益均为评价投资中心业绩的指标，选项CD不当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343961530369","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在单一产品本量利分析中，下列等式不成立的是（    ）。","opts":[{"k":"A","t":"安全边际率=1-盈亏平衡作业率"},{"k":"B","t":"销售利润率=安全边际率×边际贡献率"},{"k":"C","t":"息税前利润=安全边际额×变动成本率"},{"k":"D","t":"固定成本=盈亏平衡点销售额×边际贡献率"}],"ans":"C","exp":"盈亏平衡点销售量 + 安全边际量 = 正常销售量，等式两边同时除以销售量，得：盈亏平衡作业率 + 安全边际率 =1，选项 A 不当选。利润（息税前利润）= 安全边际额 × 边际贡献率，等式两边同时除以销售收入，得：销售利润率 = 安全边际率 × 边际贡献率，选项 B 不当选、选项 C 当选。盈亏平衡点销售额 = 盈亏平衡点销售量 × 单价 = 固定成本 / 单位边际贡献 × 单价 = 固定成本 /边际贡献率，则固定成本 = 盈亏平衡点销售额 × 边际贡献率，选项 D 不当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343907004417","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司只生产和销售某一种产品，该产品的售价为10元，单位变动成本为6元，2022年销售量为20万件，利润为50万元。假设成本性态保持不变，则销售量的利润敏感系数是（   ）。","opts":[{"k":"A","t":"2.2"},{"k":"B","t":"1.6"},{"k":"C","t":"1.2"},{"k":"D","t":"0.8"}],"ans":"B","exp":"本题考查的是利润敏感性分析。根据本量利基本关系式，销售量×（单价-单位变动成本）-固定成本=利润，可得：固定成本=30（万元）。假设销售量上升10%（假设任何数字都可以，选择10%是为了便于计算简便），变化后的销售量=20×（1+10%）=22（万件），变化后的利润=22×（10-6）-30=58（万元），因此利润的变化率=（58-50）/50=16%，销售量的利润敏感系数=16%/10%=1.6，选项B当选。提示：本题中“假设成本性态不变”说明单位变动成本和固定成本均保持不变。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343852478466","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"如果采用加权平均法计算综合盈亏平衡点，下列各项中，将会影响综合盈亏平衡点大小的有（   ）。","opts":[{"k":"A","t":"固定成本总额"},{"k":"B","t":"销售结构"},{"k":"C","t":"单价"},{"k":"D","t":"单位变动成本"}],"ans":"A,B,C,D","exp":"本题考查盈亏平衡分析。综合盈亏平衡点销售额=固定成本总额÷综合边际贡献率，综合边际贡献率等于各种产品边际贡献率的加权平均，边际贡献率=（单价-单位变动成本）÷单价。所以，固定成本总额、单价、单位变动成本都会影响综合盈亏平衡点大小，选项ACD当选。另外，综合边际贡献率计算中要用的权数受到销售结构的影响，选项B当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343797952513","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于成本中心，下列说法中正确的是（    ）。","opts":[{"k":"A","t":"成本中心需要对边际贡献负责"},{"k":"B","t":"成本中心需要对本中心发生的全部成本负责"},{"k":"C","t":"成本中心不考核收入"},{"k":"D","t":"成本中心只衡量产出，不衡量投入"}],"ans":"C","exp":"成本中心只考核成本，不考核收入，不对边际贡献负责，选项 A 不当选、选项 C 当选。成本中心只对可控成本负责，不对不可控成本负责，选项 B 不当选。成本中心不能形成真正意义上的收入，故只需衡量投入，而不衡量产出，选项 D 不当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343743426561","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"基于本量利分析模式，各相关因素变动对于利润的影响程度的大小可用敏感系数来表达，其数值等于经营杠杆系数的是（  ）。","opts":[{"k":"A","t":"利润对销售量的敏感系数"},{"k":"B","t":"利润对单位变动成本的敏感系数"},{"k":"C","t":"利润对单价的敏感系数"},{"k":"D","t":"利润对固定成本的敏感系数"}],"ans":"A","exp":"经营杠杆系数=EBIT的变动百分比/销售量的变动百分比=利润对销售量的敏感系数。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343688900610","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列成本项目中，与传统成本法相比，运用作业成本法核算更具有优势的是（    ）。","opts":[{"k":"A","t":"直接材料成本"},{"k":"B","t":"直接人工成本"},{"k":"C","t":"间接制造费用"},{"k":"D","t":"特定产品专用生产线折旧费"}],"ans":"C","exp":"本题考查作业成本法。在作业成本法下，对于直接费用的确认和分配与传统的成本计算方法一样，而间接费用的分配对象不再是产品，而是作业活动。采用作业成本法，制造费用按照成本动因直接分配，避免了传统成本计算法下的成本扭曲，选项C当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262343634374657","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在以成本为基础制定内部转移价格时，下列各项中，不适合作为转移定价基础的是（   ）。","opts":[{"k":"A","t":"变动成本"},{"k":"B","t":"变动成本加固定制造费用"},{"k":"C","t":"固定成本完全成本"},{"k":"D","t":"完全成本"}],"ans":"C","exp":"本题考查的是内部转移价格的制定。采用以成本为基础的转移定价是指所有的内部交易均以某种形式的成本价格进行结算，它适用于内部转移的产品或劳务没有市价的情况，包括完全成本、完全成本加成、变动成本以及变动成本加固定制造费用四种形式，选项C当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343579848706","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"长江公司是一家微波炉生产企业，采用作业成本法核算产品成本，现正进行作业库设计，下列说法中错误的是（ ）。","opts":[{"k":"A","t":"加工微波炉属于产量级作业"},{"k":"B","t":"设备调试属于批别级作业"},{"k":"C","t":"现有微波炉型号质量与功能的改进属于品种级作业"},{"k":"D","t":"针对长江公司的广告活动属于品种级作业"}],"ans":"D","exp":"本题考查作业中心设计。产量级作业是为个别产品（或服务）实施的作业，如产品加工，选项A不当选。批别级作业是为一批产品（或服务）实施的作业，如设备调试、成品抽检，选项B不当选。品种级作业是为生产和销售某种产品（或服务）实施的作业，如产品设计、工艺流程改进，选项C不当选。设施级作业是为提供生产产品（或服务）的基本能力而实施的作业，如管理作业、针对企业整体的广告活动等，选项D当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343353356290","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在企业的日常经营管理工作中，成本管理工作的起点是（    ）。","opts":[{"k":"A","t":"成本预测"},{"k":"B","t":"成本核算"},{"k":"C","t":"成本控制"},{"k":"D","t":"成本分析"}],"ans":"A","exp":"本题考查成本管理的内容。成本预测是进行成本管理的第一步，即成本管理工作的起点是成本预测，选项A当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343131058178","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"在标准成本法下，下列各项中，不属于直接材料用量差异形成原因的是（    ）。","opts":[{"k":"A","t":"产品废品率的高低"},{"k":"B","t":"直接材料运输方式的不同"},{"k":"C","t":"产品设计结构的变化"},{"k":"D","t":"工人的技术熟练程度"}],"ans":"B","exp":"本题考查直接材料成本差异分析。直接材料的实际用量偏离标准用量时，会形成直接材料的耗用量差异，产品废品率的高低、产品设计结构的变化以及工人的技术熟练程度，均会影响直接材料的实际用量，选项ACD不当选。直接材料运输方式的不同，不会影响生产中的耗用量，但会影响材料的成本，属于直接材料价格差异形成的原因，选项B当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343076532226","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"对于生产多种产品的企业而言，如果能够将固定成本在各种产品之间进行合理分配，则比较适用的综合保本分析方法是（    ）。","opts":[{"k":"A","t":"联合单位法"},{"k":"B","t":"主要产品法"},{"k":"C","t":"加权平均法"},{"k":"D","t":"分算法"}],"ans":"D","exp":"本题考查多品种盈亏平衡分析。联合单位法是指在事先确定各种产品间产销实物量比例的基础上，将各种产品产销实物量的最小比例作为一个联合单位，确定每一联合单位的单价、单位变动成本，进行本量利分析的一种分析方法，选项A不当选。主要产品法是指在企业产品品种较多的情况下，如果存在一种产品是主要产品，它提供的边际贡献占企业边际贡献总额的比重较大，代表了企业产品的主导方向，则可以按该主要品种的有关资料进行本量利分析，视同于单一品种，选项B不当选。加权平均法是指在掌握每种单一产品的边际贡献率的基础上，按各种产品销售额的比重进行加权平均，据以计算综合边际贡献率，从而确定多产品组合的盈亏平衡点，选项C不当选。分算法是在一定条件下，将全部固定成本按一定标准在各种产品之间进行合理分配，确定每种产品应补偿的固定成本数额，然后再对每一种产品按单一品种条件下的情况分别进行本量利分析的方法，选项D当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262343022006273","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"基于本量利分析模型，若产品单位边际贡献为每件10元，则产销量每增加1件，利润就增加10元。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"单位边际贡献是每多销售一件产品时对利润的贡献，本题说法正确。或者，利润=产销量×单位边际贡献-固定成本，单位边际贡献为10元时，产销量每增加1件，利润增加10元。","wrong":1.0,"cat":"管理会计"},{"id":"2057262342967480321","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"表格题暂不支持导出，请在PC端查看","opts":[{"k":"A","t":"19 000"},{"k":"B","t":"60 000"},{"k":"C","t":"64 000"},{"k":"D","t":"66 000"}],"ans":"A","exp":"本题考查保险储备。当保险储备为200千克时，缺货损失=每年订货次数×缺货数量×缺货概率×单位缺货损失=（36 000÷3 600）×（100×20%+200×5%）×50=15 000（元）。保险储备的储存成本=200×20=4 000（元），总成本=15 000+4 000=19 000（元），选项A当选。需要注意的是，题干中的预计交货期内的总需求量为100千克，再加上保险储备200千克，所以甲公司的实际再订货点为300千克（100+200），所以只有当生产需要量为400千克和500千克时，才会发生缺货，分别缺货数量为100千克（400-300）和200千克（500-300）。","wrong":1.0,"cat":"综合实务"},{"id":"2057262342912954370","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司借入名义年利率为10%的银行借款6 000万元，分12个月等额偿还本息，则按照加息法计算的该借款的实际年利率为（    ）。","opts":[{"k":"A","t":"20%"},{"k":"B","t":"10.25%"},{"k":"C","t":"21%"},{"k":"D","t":"10%"}],"ans":"A","exp":"本题考查短期借款。短期借款按照加息法付息时，借款的实际年利率=2×名义利率=2×10%=20%，选项A当选。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262342694850562","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某企业预计每月现金需要量为300 000元，每次转换有价证券的交易成本为100元，有价证券的月利率为1%，则根据存货模式，每月有价证券的最佳交易次数为（    ）次。","opts":[{"k":"A","t":"3.87"},{"k":"B","t":"3.32"},{"k":"C","t":"4.43"},{"k":"D","t":"4.03"}],"ans":"A","exp":"本题考查目标现金余额确定的存货模型。[图片不支持导出]","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262342581604353","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据存货经济订货批量扩展模型计算材料进货数量时，需要考虑的因素有（   ）。","opts":[{"k":"A","t":"采购单价"},{"k":"B","t":"每日送货量"},{"k":"C","t":"每次订货的变动成本"},{"k":"D","t":"材料总需要量"}],"ans":"B,C,D","exp":"本题考查的是存货经济订货批量的扩展模型。在扩展模型下，需要考虑的因素包括：每日送货量（选项B当选）、每日耗用量、每次订货的变动成本（选项C当选）、单位变动储存成本以及存货年需要量（选项D当选），因此选项A不当选。提示：经济订货批量模型的假设条件之一为单位货物成本为常数，且无批量折扣，因此采购单价不应作为进货时的考虑因素。","wrong":1.0,"cat":"管理会计"},{"id":"2057262342418026497","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项中，属于宽松的流动资产投资策略特点的有（  ）。","opts":[{"k":"A","t":"短缺成本低"},{"k":"B","t":"持有成本高"},{"k":"C","t":"风险较低"},{"k":"D","t":"收益较低"}],"ans":"A,B,C,D","exp":"本题考查流动资产的投资策略。宽松的流动资产投资策略，企业通常会维持高水平的流动资产与销售收入比率，此时企业的财务与经营风险较小、流动性较强。但是，维持高水平的流动资产除了降低短缺成本外，还会承担较大的流动资产持有成本，提高企业的资金成本，降低企业的收益水平。综上，选项ABCD当选。","wrong":1.0,"cat":"综合实务"},{"id":"2057262342363500545","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司向银行借款2 000万元，期限为1年，年利率为6.5%，银行要求的补偿性余额比例为12%，则该借款的实际利率为（   ）。","opts":[{"k":"A","t":"7.28%"},{"k":"B","t":"6.5%"},{"k":"C","t":"7.39%"},{"k":"D","t":"12%"}],"ans":"C","exp":"本题考查的是短期借款实际利率的计算。借款的实际利率=6.5%/（1-12%）=7.39%，选项C当选。提示：计算“实际利率”时，不需要扣除所得税。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262342250254338","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"周转信贷协定的有效期通常超过1年，且银行并不承担必须支付全部信贷数额的义务。 （    ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题考查短期借款筹资。周转信贷协定的有效期通常超过1年，但银行有义务承诺提供不超过某一最高限额的贷款。本题所述错误。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262342141202433","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某公司资产总额为10 000万元，其中永久性流动资产为2 800万元，临时性流动资产为1 600万元，该公司长期资金来源金额为8 100万元，不考虑其他情形，可以判断该公司的融资策略属于（    ）。","opts":[{"k":"A","t":"匹配融资策略"},{"k":"B","t":"保守融资策略"},{"k":"C","t":"激进融资策略"},{"k":"D","t":"宽松融资策略"}],"ans":"C","exp":"本题考查流动资产的融资策略。长期需求=永久性流动资产+非流动资产=2 800+（10 000-2 800-1 600）=8 400（万元），长期供给=长期资金来源=8 100（万元），因为长期供给＜长期需求，故属于激进融资策略，选项C当选。","wrong":1.0,"cat":"财务管理"},{"id":"2057262342086676481","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛" "},{"k":"B","t":"20.62%"},{"k":"C","t":"26.65%"},{"k":"D","t":"25.62%"}],"ans":"D","exp":"资本成本率Ks=D1/［P0×（1-f）］+g=6/［30×（1-3%）］+5%=25.62%。","wrong":1.0,"cat":"财务管理"},{"id":"2057262341046489089","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司权益市场价值为6 000万元，债务市场价值为4 000万元。债务的税后资本成本为8%，股票的β系数为1.5，适用的所得税税率为25%，市场平均收益率为12%，一年期国债利率为5%，则甲公司按市场价值加权的平均资本成本为（    ）。","opts":[{"k":"A","t":"12.5%"},{"k":"B","t":"15.0%"},{"k":"C","t":"11.7%"},{"k":"D","t":"13.2%"}],"ans":"A","exp":"本题考查股票资本成本的计算。根据资本资产定价模型，权益资金的资本成本=5%+1.5×（12%-5%）=15.5%。平均资本成本=8%×［4 000÷（6 000+4 000）］+15.5%×［6 000÷（6 000+4 000）］=12.5%，选项A当选。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262340882911234","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于经营杠杆，下列表述正确的有（    ）。","opts":[{"k":"A","t":"经营杠杆反映了资产收益的波动性，可用于评价企业的经营风险"},{"k":"B","t":"只要企业存在固定性资本成本，就存在经营杠杆效应"},{"k":"C","t":"经营杠杆放大了市场和生产等因素变化对利润波动的影响"},{"k":"D","t":"经营杠杆本身并不是造成企业资产收益不确定的根源"}],"ans":"A,C,D","exp":"本题考查经营杠杆效应。经营杠杆效应是由于固定性经营成本的存在，使得企业的资产收益（息税前利润）变动率大于业务量（产销量或销售额）变动率的现象，选项B不当选。经营杠杆反映了资产收益的波动性，用以评价企业的经营风险，选项A当选。经营风险是指企业由于生产经营上的原因而导致的资产收益波动的风险。引起企业经营风险的主要原因是市场需求和生产成本等因素的不确定性，经营杠杆本身并不是资产收益不确定的根源，选项D当选。经营杠杆只是资产收益波动的表现。但是，经营杠杆放大了市场和生产等因素变化对利润波动的影响，选项C当选。","wrong":1.0,"cat":"财务管理"},{"id":"2057262340828385282","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列资本结构理论中，认为资本结构影响企业价值的有（    ）。","opts":[{"k":"A","t":"最初的MM理论"},{"k":"B","t":"修正的MM理论"},{"k":"C","t":"代理理论"},{"k":"D","t":"权衡理论"}],"ans":"B,C,D","exp":"本题考查资本结构理论。最初的MM理论认为，不考虑企业所得税，有无负债不改变企业的价值，因此该观点认为企业价值不受资本结构的影响，选项A不当选。修正的MM理论认为，企业可利用财务杠杆增加企业价值，因负债利息可带来避税利益，企业价值会随着资产负债率的增加而增加，选项B当选。代理理论认为企业资本结构会影响经理人员的工作水平和其他行为选择，从而影响企业未来现金收入和企业市场价值，选项C当选。权衡理论认为，有负债企业的价值等于无负债企业价值加上税赋节约现值，再减去财务困境成本的现值，选项D当选。代理理论和权衡理论都是在修正的MM理论中作了进一步完善，本质是以修正的MM理论为核心。","wrong":1.0,"cat":"财务管理"},{"id":"2057262340719333377","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"关于直接筹资和间接筹资，下列表述错误的是（  ）。","opts":[{"k":"A","t":"直接筹资仅可以筹集股权资金"},{"k":"B","t":"发行股票属于直接筹资"},{"k":"C","t":"直接筹资的筹资费用较高"},{"k":"D","t":"租赁属于间接筹资"}],"ans":"A","exp":"直接筹资方式主要有发行股票、发行债券、吸收直接投资等（不借助金融机构）。直接筹资不仅可以筹集股权资金，还可以筹集债务资金，选项A错误。","wrong":1.0,"cat":"财务会计"},{"id":"2057262340492840962","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"能效信贷是指银行业金融机构为支持环保产业、倡导绿色文明、发展绿色经济而提供的信贷融资。 （   ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题考查的是创新筹资方式的特点。绿色信贷是指银行业金融机构为支持环保产业、倡导绿色文明、发展绿色经济而提供的信贷融资。本题所述错误。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262340383789057","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某企业向租赁公司租入一套设备，价值60万元，租期6年，租赁期满时预计残值5万元，归租赁公司所有。年利率8%，租赁手续费率每年2%。假设租金在每年年初支付一次，则平均每年的租金为（  ）万元。［（P/F，8%，6）=0.6302，（P/F，10%，6）=0.5645，（P/A，8%，6）=4.6229，（P/A，10%，6）=4.3553］","opts":[{"k":"A","t":"13.13"},{"k":"B","t":"11.93"},{"k":"C","t":"11.18"},{"k":"D","t":"13.53"}],"ans":"B","exp":"本题考查租赁筹资。折现率=利率+租赁手续费率=8%+2%=10%。假设每年租金为X，则：60=X×（P/A，10%，6）×（1+10%）+5×（P/F，10%，6），求得X=11.93（万元），选项B当选。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262340270542850","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于债券和优先股的共同特点，下列表述正确的有（  ）。","opts":[{"k":"A","t":"优先股股息和债券利息都属于公司的法定债务"},{"k":"B","t":"在分配剩余财产时，优先股股东和债权人的清偿顺序都先于普通股股东"},{"k":"C","t":"优先股股息和债券利息都会产生所得税抵减效应"},{"k":"D","t":"都不会影响普通股股东对公司的控制权"}],"ans":"B,D","exp":"优先股股息不是公司必须偿付的一项法定债务，选项A错误；优先股股息不能抵减企业所得税，选项C错误。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2057262340216016897","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"随着预算执行不断补充预算，但始终保持一个固定预算期长度的预算编制方法是（    ）。","opts":[{"k":"A","t":"滚动预算法"},{"k":"B","t":"弱性预算法"},{"k":"C","t":"零基预算法"},{"k":"D","t":"定期预算法"}],"ans":"A","exp":"本题考查滚动预算法。滚动预算法是指企业根据上一期预算执行情况和新的预测结果，按既定的预算编制周期和滚动频率，对原有的预算方案进行调整和补充、逐期滚动、持续推进的预算编制方法。短期滚动预算通常以1年为预算编制周期，以月度、季度作为预算滚动频率。短期滚动预算通常使预算期始终保持12个月，选项A当选。","wrong":1.0,"cat":"管理会计"},{"id":"2057262339721089026","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列各项预算中，与编制预计利润表直接相关的有（    ）。","opts":[{"k":"A","t":"销售预算"},{"k":"B","t":"生产预算"},{"k":"C","t":"产品成本预算"},{"k":"D","t":"销售及管理费用预算"}],"ans":"A,C,D","exp":"本题考查预计利润表的编制。利润表中，“销售收入”项目的数据来自销售预算，选项A当选。生产预算只涉及实物量指标，不涉及价值量指标，所以生产预算与预计利润表的编制不直接相关，选项B不当选。“销售成本”项目的数据来自产品成本预算，选项C当选。“销售及管理费用”项目的数据来自销售及管理费用预算，选项D当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262339666563074","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"在编制生产预算时，计算某种产品预计生产量应考虑的因素包括（    ）。","opts":[{"k":"A","t":"预计材料采购量"},{"k":"B","t":"预计产品销售量"},{"k":"C","t":"预计期初产品存货量"},{"k":"D","t":"预计期末产品存货量"}],"ans":"B,C,D","exp":"本题考查生产预算的编制。预计生产量=预计销售量+预计期末产成品存货量-预计期初产成品存货量，选项BCD当选、选项A不当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262339612037122","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"编制资金预算时，如果现金余缺大于最佳现金持有量，则企业可采取的措施有（    ）。","opts":[{"k":"A","t":"销售短期有价证券"},{"k":"B","t":"偿还部分借款利息"},{"k":"C","t":"购入短期有价证券"},{"k":"D","t":"偿还部分借款本金"}],"ans":"B,C,D","exp":"本题考查资金预算的编制，具体考查了对于现金余额的理解。财务管理部门应根据现金余缺与理想期末现金余额的比较，并结合固定的利息支出数额以及其他因素，来确定预算期现金运用或筹措的数额。当现金余缺大于最佳现金持有量时，企业可以偿还部分借款的本金和利息，购入短期有价证券，选项A不当选、选项BCD当选。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262339557511169","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列选项中，不能直接为预计利润表项目提供数据来源的是（）。","opts":[{"k":"A","t":"销售预算"},{"k":"B","t":"制造费用预算"},{"k":"C","t":"销售费用预算"},{"k":"D","t":"管理费用预算"}],"ans":"B","exp":"本题考查预计利润表的编制。销售预算可以为预计利润表中的“销售收入”提供数据来源，选项A不当选。销售费用预算和管理费用预算可以为预计利润表中的“销售及管理费用”提供数据来源，选项CD不当选。制造费用预算不能直接为预计利润表提供数据支撑，选项B当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262339448459265","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"定期预算法以固定会计期间作为预算期编制预算，因此可以强化预算的决策与控制职能。 （    ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"定期预算法能够使预算期间与会计期间相对应，便于将实际数与预算数进行对比，也有利于对预算执行情况进行分析和评价。滚动预算法通过持续滚动预算编制，逐期滚动管理，实现动态反映市场、建立跨期综合平衡，从而有效指导企业运营，强化预算的决策与控制职能，本题所述错误。","wrong":1.0,"cat":"财务会计"},{"id":"2057262339389739010","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列选项中，不能直接为预计利润表项目提供资金来源的是（    ）。","opts":[{"k":"A","t":"资金预算"},{"k":"B","t":"产品成本预算"},{"k":"C","t":"销售和管理费用预算"},{"k":"D","t":"直接人工预算"}],"ans":"D","exp":"资金预算可以为预计利润表中的利息费用直接提供数据，选项 A 不当选。产品成本预算可以为预计利润表中的销售成本直接提供数据，选项 B 不当选。销售和管理费用预算可以为预计利润表中的销售和管理费用直接提供数据，选项 C 不当选。直接人工预算不能直接为预计利润表项目提供数据，选项 D 当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262339280687106","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"制造业企业在编制预计利润表时，“销售成本”项目数据来源是（）。","opts":[{"k":"A","t":"销售预算"},{"k":"B","t":"生产预算"},{"k":"C","t":"直接材料预算"},{"k":"D","t":"产品成本预算"}],"ans":"D","exp":"本题考查预计利润表的编制。预计利润表中的“销售成本”项目，数据来自于产品成本预算，因为产品成本预算的内容包括单位成本、生产成本、期末存货成本和销货成本，选项D当选。","wrong":1.0,"cat":"财务会计"},{"id":"2057262339226161154","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"相对于增量预算，下列关于零基预算的表述正确的有（  ）。","opts":[{"k":"A","t":"预算编制成本较高"},{"k":"B","t":"预算编制工作量较小"},{"k":"C","t":"预算编制能灵活应对环境变化"},{"k":"D","t":"不以历史期经济活动及其预算为基础"}],"ans":"A,C,D","exp":"零基预算法以零为基础，不受历史期经济活动中的不合理因素影响，能够灵活应对内外环境的变化，预算编制更贴近预算期企业经济活动需要，选项C、D正确。但零基预算法的编制工作量较大、成本较高，选项A正确、选项B错误。","wrong":1.0,"cat":"管理会计"},{"id":"2057262339117109250","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"已知某笔递延年金的递延期为m，年金支付期为n，下列递延年金现值的计算式中，正确的有（  ）。","opts":[{"k":"A","t":"P=A×（P/A，i，n）×（P/F，i，m）"},{"k":"B","t":"P=A×（F/A，i，n）×（P/F，i，m）"},{"k":"C","t":"P=A×［（P/A，i，m+n）-（P/A，i，m）］"},{"k":"D","t":"P=A×（F/A，i，n）×（P/F，i，n+m）"}],"ans":"A,C,D","exp":"本题考查货币时间价值。递延年金现值有三种计算方法：第一种方法（两次折现法）：P=A×（P/A，i，n）×（P/F，i，m）。第二种方法（年金作差法）：P=A×［（P/A，i，m+n）-（P/A，i，m）］。第三种方法（回头是岸法，较少见）：P=A×（F/A，i，n）×（P/F，i，n+m）。故选项ACD当选。","wrong":1.0,"cat":"综合实务"},{"id":"2057262339062583298","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"已知（P/A，8%，5）=3.9927，（P/A，8%，6）=4.6229，（P/A，8%，7）=5.2064，则折现率为8%，期数为6的预付年金现值系数为（  ）。","opts":[{"k":"A","t":"4.9927"},{"k":"B","t":"6.2064"},{"k":"C","t":"2.9927"},{"k":"D","t":"4.2064"}],"ans":"A","exp":"根据“先付款、更值钱”可知，折现率为8%，期数为6的预付年金现值系数=（P/A，8%，6）×（1+8%）=4.6229×1.08=4.9927。","wrong":1.0,"cat":"综合实务"},{"id":"2057262339008057346","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于证券资产组合的风险，下列表述正确的有（  ）。","opts":[{"k":"A","t":"证券资产组合的非系统性风险一定小于组合中任一资产的非系统性风险"},{"k":"B","t":"证券资产组合的系统性风险小于组合中各项资产系统性风险的加权平均数"},{"k":"C","t":"系统性风险不会随着证券资产组合中资产种类的增加而消除"},{"k":"D","t":"通过证券资产组合能够分散的风险是非系统性风险"}],"ans":"C,D","exp":"组合可以分散的风险是非系统性风险，因此组合的非系统性风险小于等于组合中资产非系统性风险的加权平均数，不一定小于组合中任一资产的非系统性风险，选项A错误、选项D正确；资产组合不能分散系统性风险，因此证券资产组合的系统性风险等于组合中各项资产系统性风险的加权平均数，选项B错误、选项C正确。或者，衡量系统性风险的指标是β系数，组合的β系数是组合中各单项资产β系数的加权平均数，选项B错误。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2057262338617987073","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司是一家餐饮公司。2020年，一场疫情的流行使餐饮业进入“寒冬”，该公司在进行风险评估后认为，这场传染病的流行将使消费者的健康饮食意识大大增强，于是组织员工迅速开发并推出系列健康菜品，使公司营业额逆势上升。甲公司上述做法所体现的风险管理原则是（   ）。","opts":[{"k":"A","t":"专业性原则"},{"k":"B","t":"战略性原则"},{"k":"C","t":"系统性原则"},{"k":"D","t":"二重性原则"}],"ans":"D","exp":"本题考查的是风险管理的原则。疫情的流行是风险，而甲公司将风险转化为增进企业价值的机会，体现了风险管理二重性原则，因此选项D当选。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2057262338563461122","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"股东财富最大化体现了合作共赢的价值理念，有利于实现企业经济效益和社会效应的统一。 （    ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题考查相关者利益最大化目标的优点。相关者利益最大化体现了合作共赢的价值理念，有利于实现企业经济效益和社会效应的统一。本题所述错误。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2057262338102087682","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"财务管理的原则有（  ）。","opts":[{"k":"A","t":"风险权衡原则"},{"k":"B","t":"分散性原则"},{"k":"C","t":"现金收支平衡原则"},{"k":"D","t":"利益关系协调原则"}],"ans":"A,C,D","exp":"财务管理的原则有系统性原则、风险权衡原则、现金收支平衡原则、成本收益权衡原则、利益关系协调原则，选项A、C、D正确。","wrong":1.0,"cat":"综合实务"},{"id":"2057262337984647169","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于企业价值最大化财务管理目标，下列说法正确的有（    ）。","opts":[{"k":"A","t":"以股东财富最大化为基础"},{"k":"B","t":"有助于克服企业追求利润的短期行为"},{"k":"C","t":"考虑了收益的时间价值"},{"k":"D","t":"考虑了风险与收益的关系"}],"ans":"A,B,C,D","exp":"本题考查财务管理目标。各种财务管理目标，都以股东财富最大化为基础，选项A当选。以企业价值最大化作为财务管理目标，考虑了取得收益的时间，并用时间价值的原理进行计量，并且考虑了风险与收益的关系，选项CD当选。不仅目前的利润会影响企业价值，预期未来的利润对企业价值增加也会产生重大影响，因此企业价值最大化财务管理目标，有助于克服企业追求利润的短期行为，选项B当选。","wrong":1.0,"cat":"经济法与财经法规"}];

function recOf(id){return store[id]||{n:0,s:''}}

function qsByCat(c){return DATA.filter(function(q){return q.cat===c})}
function catStats(c){var qs=qsByCat(c),done=0,wrong=0;qs.forEach(function(q){var r=store[q.id];if(r&&r.s){done++;if(r.s==='w')wrong++}});return{total:qs.length,done:done,wrong:wrong}}
function globalStats(){var done=0,right=0,wrong=0;DATA.forEach(function(q){var r=store[q.id];if(r&&r.s){done++;if(r.s==='r')right++;else wrong++}});return{total:DATA.length,done:done,right:right,wrong:wrong}}
function wrongList(cat){return DATA.filter(function(q){var r=store[q.id];return r&&r.s==='w'&&(!cat||q.cat===cat)})}

/* ---------- 答题页 ---------- */
function viewQuiz(){
  if(session.i>=session.qids.length) return viewResult();
  var q=QMAP[session.qids[session.i]];
  var set=ansSet(q);
  var h='';
  h+='<div class="qhead"><button class="bk" data-act="back">‹</button>'
    +'<div class="qt"><div class="t1">'+esc(session.title)+'</div><div class="t2">'+esc(q.qtype)+'</div></div>'
    +'<div class="pg">'+(session.i+1)+'/'+session.qids.length+'</div></div>';
  h+='<div class="cardq"><span class="badge">'+esc(q.qtype)+'</span><div class="stem">'+esc(q.stem)+'</div><div class="opts">';
  q.opts.forEach(function(o){
    var cls='opt';
    if(session.answered){
      if(set.indexOf(o.k)>=0)cls+=' correct';
      else if(session.sel.indexOf(o.k)>=0)cls+=' wrong';
    }else if(session.sel.indexOf(o.k)>=0){cls+=' sel'}
    h+='<div class="'+cls+'" data-act="opt" data-k="'+o.k+'"><span class="key">'+o.k+'</span><span class="otext">'+esc(o.t)+'</span></div>';
  });
  h+='</div>';
  if(session.answered){
    var ok=session.lastOk;
    h+='<div class="fb '+(ok?'ok':'bad')+'"><div class="ttl">'+(ok?'✓ 回答正确':'✕ 回答错误')+'</div>'
      +'<div class="ansline">正确答案：<b>'+esc(q.ans.replace(/,/g,''))+'</b>　（你选择：'+esc(session.sel.slice().sort().join('')||'—')+'）</div>'
      +(q.exp?'<div class="exp"><span class="lbl">解析：</span>'+esc(q.exp)+'</div>':'<div class="exp" style="color:#8a93a8">暂无解析</div>')
      +'</div>';
  }
  h+='</div>';
  if(!session.answered){
    if(q.qtype==='多选题'){
      h+='<div class="qfoot"><button class="btn btn-pri btn-block" data-act="submit">提交答案</button></div><div class="hint">多选题：选择全部正确选项后提交</div>';
    }else{
      h+='<div class="hint">选择你认为正确的选项</div>';
    }
  }else{
    var last=session.i>=session.qids.length-1;
    h+='<div class="qfoot"><button class="btn btn-pri btn-block" data-act="next">'+(last?'完成本次练习':'下一题')+'</button></div>';
  }
  return h;
}

function viewResult(){
  var t=session.qids.length,r=session.r,w=session.w;
  var acc=t?Math.round(r/t*100):0;
  var rk=acc>=90?'优秀，继续保持！':acc>=70?'不错，仍有提升空间':acc>=50?'加油，建议重练错题':'基础需巩固，多练几遍';
  var h='';
  h+='<div class="qhead"><button class="bk" data-act="back">‹</button><div class="qt"><div class="t1">练习结果</div><div class="t2">'+esc(session.title)+'</div></div></div>';
  h+='<div class="result"><div class="big">'+acc+'%</div><div class="rk">'+rk+'</div>'
    +'<div class="rgrid"><div class="rb"><b>'+t+'</b><span>本次题量</span></div><div class="rb g"><b>'+r+'</b><span>答对</span></div><div class="rb r"><b>'+w+'</b><span>答错</span></div></div>';
  if(w>0)h+='<button class="btn btn-warn btn-block" data-act="retryWrong">重练本次错题 ('+w+')</button><div style="height:10px"></div>';
  h+='<button class="btn btn-pri btn-block" data-act="back">返回首页</button></div>';
  return h;
}

function render(){try{
  if(session)app.innerHTML=viewQuiz();
  else if(curCat)app.innerHTML=viewTypePick(curCat);
  else app.innerHTML=viewHome();
  window.scrollTo(0,0);}catch(e){showSysErr(e&&e.message?e.message:e);}
}

/* ---------- 交互 ---------- */
function startSession(qids,title,key,cat){
  if(!qids.length){alert('暂无题目');return}
  session={key:key||null,qids:qids,title:title,cat:(cat===undefined?null:cat),i:0,sel:[],answered:false,lastOk:false,r:0,w:0};
  saveSession();render();
}
function resumeSession(key){var p=prog[key];if(!p)return;session={key:key,qids:p.qids,title:p.title||'练习',cat:p.cat||null,i:p.i||0,sel:(p.sel||[]).slice(),answered:!!p.answered,lastOk:!!p.lastOk,r:p.r||0,w:p.w||0};render()}
function openModule(key,title,qids,cat){
  if(isSusp(key)){showChoice('继续上次练习？','「'+title+'」上次练到第 '+((prog[key].i||0)+1)+' / '+prog[key].qids.length+' 题。','继续答题','重新开始',function(){resumeSession(key)},function(){clearSession(key);startSession(qids,title,key,cat)});return}
  startSession(qids,title,key,cat);
}
function openCat(c){curCat=c;render()}
function openKp(cat,type){var key='kp:'+cat+'|'+type;openModule(key,cat+' · '+type,orderQueue(qsIn(cat,type)).map(function(q){return q.id}),cat)}
function openWrong(){var w=wrongList(null).map(function(q){return q.id});startSession(w,'错题重练',null,null)}
function doAnswer(){
  var q=QMAP[session.qids[session.i]];
  if(!q||session.answered||session.sel.length===0)return;
  var ok=normAns(q.ans)===normAns(session.sel.join(''));
  session.answered=true;session.lastOk=ok;
  if(ok)session.r++;else session.w++;
  mark(q.id,ok);
  saveSession();
  render();
}

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(act==='openCat'){openCat(t.getAttribute('data-name'));return}
  if(act==='openKp'){openKp(t.getAttribute('data-cat'),t.getAttribute('data-type'));return}
  if(act==='backTypes'){curCat=null;render();return}
  if(act==='wrongSet'){openWrong();return}
  if(act==='back'){session=null;render();return}
  if(act==='opt'){
    if(!session||session.answered)return;
    var q=QMAP[session.qids[session.i]],k=t.getAttribute('data-k');
    if(q.qtype==='多选题'){
      var idx=session.sel.indexOf(k);
      if(idx>=0)session.sel.splice(idx,1);else session.sel.push(k);
      render();
    }else{session.sel=[k];doAnswer()}
    return;
  }
  if(act==='submit'){doAnswer();return}
  if(act==='next'){session.i++;session.sel=[];session.answered=false;if(session.key&&session.i>=session.qids.length)clearSession(session.key);else saveSession();render();return}
  if(act==='retryWrong'){
    var w=wrongList(session.cat).map(function(q){return q.id});
    var title=session.cat?session.cat+' · 错题重练':'错题重练';
    startSession(w,title,null,session.cat);return;
  }
  if(act==='reset'){
    showConfirm('确认重置进度？','将清空所有答题记录与错题统计，且无法恢复。',function(){store={};saveStore();prog={};saveProg();session=null;render()});
    return;
  }
});

function showConfirm(title,content,onOk){
  var m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="dlg"><div class="dt">'+esc(title)+'</div><div class="dc">'+esc(content)+'</div>'
    +'<div class="dr"><button class="btn btn-ghost" data-c="0">取消</button><button class="btn btn-pri" data-c="1">确认</button></div></div>';
  m.addEventListener('click',function(e){
    var b=e.target.closest('[data-c]');if(!b)return;
    if(b.getAttribute('data-c')==='1')onOk();
    document.body.removeChild(m);
  });
  document.body.appendChild(m);
}

function showChoice(title,content,resumeText,restartText,onResume,onRestart){
  var m=document.createElement('div');m.className='mask';
  m.innerHTML='<div class="dlg"><div class="dt">'+esc(title)+'</div><div class="dc">'+esc(content)+'</div>'
    +'<div class="dr"><button class="btn btn-pri" data-c="r">'+esc(resumeText)+'</button><button class="btn btn-ghost" data-c="s">'+esc(restartText)+'</button></div></div>';
  m.addEventListener('click',function(e){
    var b=e.target.closest('[data-c]');if(!b)return;
    var v=b.getAttribute('data-c');
    document.body.removeChild(m);
    if(v==='r')onResume();else onRestart();
  });
  document.body.appendChild(m);
}

render();
}catch(e){showSysErr('JS异常：'+((e&&e.message)?e.message:e)+' 【'+((e&&e.stack)?String(e.stack).replace(/[\r\n]+/g,' <- '):'无stack')+'】');}
</script>
