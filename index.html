[{"k":"A","t":"立即报告国家能源局"},{"k":"B","t":"立即组织专项设计审查"},{"k":"C","t":"立即降低水库运行水位，直至放空水库"},{"k":"D","t":"立即申请换发注册登记证"}],"ans":"C","exp":"《水电站大坝运行安全监督管理规定》规定：“大坝评定为险坝后，电力企业应当立即降低水库运行水位，直至放空水库。”","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463777775627","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《招标人主体责任履行指引》，对于同类型、重复性招标项目，招标人可以结合项目实际，采用哪些方式实施？","opts":[{"k":"A","t":"框架协议招标"},{"k":"B","t":"集中招标"},{"k":"C","t":"公开招标"},{"k":"D","t":"邀请招标"}],"ans":"A,B","exp":"对于同类型、重复性招标项目，招标人可以结合项目实际，采用框架协议招标、集中招标等方式实施，提高组织效率，降低招标成本。——《招标人主体责任履行指引》","wrong":1.0,"cat":"综合实务"},{"id":"2064317463777775622","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《招标人主体责任履行指引》，招标人作为国有资金或者国家融资资金的使用者，对招标投标活动的哪些方面负主体责任？","opts":[{"k":"A","t":"科学性"},{"k":"B","t":"合法性"},{"k":"C","t":"廉洁性"},{"k":"D","t":"时效性"}],"ans":"A,B,C","exp":"招标人作为国有资金或者国家融资资金的使用者，对招标投标活动的科学性、合法性、廉洁性负主体责任。——《招标人主体责任履行指引》","wrong":2.0,"cat":"经济法与财经法规"},{"id":"2064317463777775621","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《能源电力系统安全生产治本攻坚三年行动方案（2024—2026年）》提出，大力推进“机械化换人、（）”，提升电力建设施工等领域安全生产自动化、智能化水平。","opts":[{"k":"A","t":"科技强安"},{"k":"B","t":"智能化替人"},{"k":"C","t":"自动化减人"},{"k":"D","t":"数字化管人"}],"ans":"C","exp":"《能源电力系统安全生产治本攻坚三年行动方案（2024—2026年）》推动安全生产先进适用技术应用。大力推进“机械化换人、自动化减人”，提升电力建设施工、高风险电力生产运行、煤矿等领域安全生产自动化、智能化水平。聚焦重大风险隐患，加大安全生产科技项目攻关力度。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463777775620","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《关于改进和加强中央企业控股上市公司市值管理工作的若干意见》，中央企业要指导控股上市公司积极贯彻落实党中央、国务院关于深化国资国企改革的重大部署，围绕国有经济布局优化和结构调整主动作为，增强核心功能、提升核心竞争力，切实发挥在建设现代化产业体系、构建新发展格局中的______。","opts":[{"k":"A","t":"科技创新、产业控制、安全支撑作用"},{"k":"B","t":"科技创新、产业引领、安全保障作用"},{"k":"C","t":"技术突破、产业升级、风险防范作用"},{"k":"D","t":"自主创新、链主带动、抗风险作用"}],"ans":"A","exp":"文件原文：“切实发挥在建设现代化产业体系、构建新发展格局中的科技创新、产业控制、安全支撑作用。”","wrong":2.0,"cat":"企业文化与战略管理"},{"id":"2064317463777775619","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"华兴集团（中央企业）拟在东南亚投资一个特别监管类境外固定资产项目，已履行完内部董事会决策程序，准备向国家有关部门首次报送文件。根据相关规定，华兴集团在向国家有关部门报送文件前，应向国资委报送的材料包括下列哪些？","opts":[{"k":"A","t":"开展项目投资的报告"},{"k":"B","t":"项目可研报告（尽职调查）"},{"k":"C","t":"项目融资方案"},{"k":"D","t":"项目所在国政府的批准文件"}],"ans":"A,B,C","exp":"列入中央企业境外投资项目负面清单特别监管类的境外投资项目，中央企业应当在履行企业内部决策程序后、在向国家有关部门首次报送文件前报国资委履行出资人审核把关程序。中央企业应当报送以下材料：（一）开展项目投资的报告；（二）企业有关决策文件；（三）项目可研报告（尽职调查）等相关文件；（四）项目融资方案；（五）项目风险防控报告；（六）其他必要的材料。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463773581337","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《温室气体自愿减排交易管理办法（试行）》，审定与核查机构应当具备的条件包括以下哪些？","opts":[{"k":"A","t":"具备十名以上相应领域具有审定与核查能力的专职人员"},{"k":"B","t":"其中至少有五名人员具有二年及以上温室气体排放审定与核查工作经历"},{"k":"C","t":"近三年无严重失信记录"},{"k":"D","t":"建立完善的审定与核查活动管理制度"}],"ans":"A,B,D","exp":"《温室气体自愿减排交易管理办法（试行）》 审定与核查机构纳入认证机构管理，应当按照《中华人民共和国认证认可条例》《认证机构管理办法》等关于认证机构的规定，公正、独立和有效地从事审定与核查活动。审定与核查机构应当具备与从事审定与核查活动相适应的技术和管理能力，并且符合以下条件：（一）具备开展审定与核查活动相配套的固定办公场所和必要的设施；（二）具备十名以上相应领域具有审定与核查能力的专职人员，其中至少有五名人员具有二年及以上温室气体排放审定与核查工作经历；（三）建立完善的审定与核查活动管理制度；（四）具备开展审定与核查活动所需的稳定的财务支持，建立与业务风险相适应的风险基金或者保险，有应对风险的能力；（五）符合审定与核查机构相关标准要求；（六）近五年无严重失信记录。”","wrong":1.0,"cat":"综合实务"},{"id":"2064317463773581336","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"中能集团是一家中央企业，主业为能源开发。该集团拟制定境外投资管理制度，提交董事会审议后报送国资委。根据相关规定，制度中应包括下列哪些主要内容？","opts":[{"k":"A","t":"境外投资管理流程、管理部门及相关职责"},{"k":"B","t":"境外投资项目后评价制度"},{"k":"C","t":"境外投资项目负面清单制度"},{"k":"D","t":"境外投资绩效考核制度"}],"ans":"A,B,C","exp":"中央企业应当根据本办法规定，结合本企业实际，建立健全境外投资管理制度。企业境外投资管理制度应包括以下主要内容：（一）境外投资应遵循的基本原则；（二）境外投资管理流程、管理部门及相关职责；（三）境外投资决策程序、决策机构及其职责；（四）境外投资项目负面清单制度；（五）境外投资信息化管理制度；（六）境外投资风险管控制度；（七）境外投资项目的完成、中止、终止或退出制度；（八）境外投资项目后评价制度；（九）违规投资责任追究制度；（十）对所属企业境外投资活动的授权、监督与管理制度。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463773581335","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《国有企业管理人员处分条例》规定，已经退休的国有企业管理人员退休前或者退休后有违法行为应当受到处分的，不再作出处分决定，但是可以对其立案调查；依法应当给予（ ）、（ ）、开除处分的，应当按照规定相应调整其享受的待遇。","opts":[{"k":"A","t":"警告"},{"k":"B","t":"记过"},{"k":"C","t":"降级"},{"k":"D","t":"撤职"}],"ans":"C,D","exp":"解析：《国有企业管理人员处分条例》规定：“已经退休的国有企业管理人员退休前或者退休后有违法行为应当受到处分的，不再作出处分决定，但是可以对其立案调查；依法应当给予降级、撤职、开除处分的，应当按照规定相应调整其享受的待遇，对其违法取得的财物和用于违法行为的本人财物依照本条例第十五条的规定处理。”","wrong":1.0,"cat":"综合实务"},{"id":"2064317463773581333","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据中央企业发展规划管理办法规定，中央企业发展规划的相关重大事项，需履行的内部决策程序要求有（）","opts":[{"k":"A","t":"经党委（党组）会前置研究"},{"k":"B","t":"提请董事会决策"},{"k":"C","t":"直接由经理层审议决定"},{"k":"D","t":"由监事会审核通过"}],"ans":"A,B","exp":"中央企业发展规划编制、调整、年度工作计划及执行情况报告等重大事项应当经党委（党组）会前置研究后提请董事会决策。","wrong":2.0,"cat":"经济法与财经法规"},{"id":"2064317463773581329","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"国有资产转让应当有利于国有经济布局和结构的战略性调整，防止国有资产损失，不得损害（）的合法权益。","opts":[{"k":"A","t":"交易各方"},{"k":"B","t":"转让方"},{"k":"C","t":"受让方"},{"k":"D","t":"国家"}],"ans":"A","exp":"国有资产转让应当有利于国有经济布局和结构的战略性调整，防止国有资产损失，不得损害交易各方的合法权益。《中华人民共和国企业国有资产法》","wrong":2.0,"cat":"财务会计"},{"id":"2064317463773581326","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2008年5月，某省国资委制定推进国有资本调整方案。方案中拟采取以下措施：①将省内一家提供城市供水服务的国有企业F公司（属于重要公共产品和服务行业）的国有股权全部转让给一家民营企业；②推动一家上市国有控股公司G公司通过增资扩股，将未上市的主营业务资产全部注入G公司；③要求G公司控股股东在6个月内清偿全部占用的上市公司资金，并建立长效机制防止新占；④将一家长期亏损但属于高新技术产业的骨干企业H公司（重要行业），向各类投资主体公开转让国有股权。根据《国务院办公厅转发国资委关于推进国有资本调整和国有企业重组指导意见的通知》及其附件，上述措施中符合文件规定的有（ ）。","opts":[{"k":"A","t":"将F公司全部国有股权转让给民营企业"},{"k":"B","t":"推动G公司将主营业务资产全部注入上市公司"},{"k":"C","t":"要求G公司控股股东6个月内清偿占用资金，并建立长效机制"},{"k":"D","t":"将H公司向各类投资主体公开转让国有股权"}],"ans":"B,C","exp":"关于B项：原文“积极支持资产或主营业务资产优良的企业实现整体上市，鼓励已经上市的国有控股公司通过增资扩股、收购资产等方式，把主营业务资产全部注入上市公司”，第（五）条。关于C项：原文“有关国有资产监管机构应当加大督促、协调力度，促使其按期全部偿还上市公司资金；对不能按期偿还的，应按照法律和相关规定，追究有关责任人的行政和法律责任。同时，要建立长效机制，严禁侵占上市公司资金”，第（五）条。关于A项：原文“重要行业和关键领域主要包括：涉及国家安全的行业，重大基础设施和重要矿产资源，提供重要公共产品和服务的行业”，第（三）条。城市供水属于此类，应推进国有资本集中，不宜全部转让给民营企业。关于D项：原文“对不属于重要行业和关键领域的亏损企业，短期内难以扭亏的，可以向各类投资主体转让”，第（十）条。H公司属于高新技术产业中的重要骨干企业，即重要行业，应确保国有资本控股，不得向各类投资主体公开转让。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463773581323","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《建设工程质量管理条例》，关于涉及建筑主体和承重结构变动的装修工程，下列说法正确的有？","opts":[{"k":"A","t":"建设单位应当在施工前委托原设计单位提出设计方案"},{"k":"B","t":"建设单位可以在施工前委托具有相应资质等级的设计单位提出设计方案"},{"k":"C","t":"没有设计方案的，不得施工"},{"k":"D","t":"房屋建筑使用者可以根据需要，自行变动房屋的承重结构"}],"ans":"A,B,C","exp":"涉及建筑主体和承重结构变动的装修工程，建设单位应当在施工前委托原设计单位或者具有相应资质等级的设计单位提出设计方案；没有设计方案的，不得施工。房屋建筑使用者在装修过程中，不得擅自变动房屋建筑主体和承重结构。——《建设工程质量管理条例》","wrong":1.0,"cat":"综合实务"},{"id":"2064317463773581321","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"电力市场风险防控的合规要求包括（）","opts":[{"k":"A","t":"建立健全风险防控机制"},{"k":"B","t":"运营机构按照“谁运营、谁防范，谁运营、谁监控”的原则，履行市场监控和风险防控责任"},{"k":"C","t":"禁止非法干预市场正常运行"},{"k":"D","t":"允许设置区域壁垒保障本地市场"}],"ans":"A,B,C","exp":"《电力市场运行基本规则》第三十四条：电力市场应建立健全电力市场风险防控机制，防范市场风险，保障电力系统安全和市场平稳运行。第三十六条：电力市场运营机构按照“谁运营、谁防范，谁运营、谁监控”的原则，履行市场监控和风险防控责任。第三十七条：任何单位和个人不得非法干预电力市场正常运行，不得实施地方保护、市场分割、指定交易、区域壁垒等妨碍统一市场和公平竞争的政策。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2064317463773581320","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"未经履行出资人职责的机构同意，国有独资企业、国有独资公司的董事、高级管理人员不得在其他企业（ ）。未经股东会、股东大会同意，国有资本控股公司、国有资本参股公司的董事、高级管理人员不得在经营（ ）的其他企业兼职。","opts":[{"k":"A","t":"兼职"},{"k":"B","t":"同类业务"},{"k":"C","t":"任职"},{"k":"D","t":"相关业务"}],"ans":"A,B","exp":"《中华人民共和国企业国有资产法》规定：“未经履行出资人职责的机构同意，国有独资企业、国有独资公司的董事、高级管理人员不得在其他企业兼职。未经股东会、股东大会同意，国有资本控股公司、国有资本参股公司的董事、高级管理人员不得在经营同类业务的其他企业兼职。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463773581317","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号），实施机构对特许经营项目的监管职责有（）","opts":[{"k":"A","t":"监测评估"},{"k":"B","t":"验收"},{"k":"C","t":"监督履约"},{"k":"D","t":"直接参与运营"}],"ans":"A,B,C","exp":"依据《基础设施和公用事业特许经营管理办法》（国家发改委等6部门令第17号）：实施机构负责监测评估、验收、监督履约，不得直接参与运营。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463773581316","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《中央企业负责人经营业绩考核办法》，下列关于经营业绩考核工作应遵循原则的表述中，完整且正确的是（ ）。","opts":[{"k":"A","t":"坚持质量第一效益优先、坚持市场化方向、坚持依法依规、坚持短期目标与长远发展有机统一、坚持国际对标行业对标"},{"k":"B","t":"坚持质量第一效益优先、坚持市场化方向、坚持依法依规、坚持短期目标与长远发展有机统一、坚持国际对标行业对标、坚持业绩考核与激励约束紧密结合"},{"k":"C","t":"坚持效益优先、坚持市场化方向、坚持 预案。商务部于2024年11月15日告知戊公司材料不齐全。根据《对外承包工程项目备案和立项管理办法》，下列表述正确的有（ ）。","opts":[{"k":"A","t":"该项目属于特定项目，因项目所在国与我国无外交关系"},{"k":"B","t":"合同额超过10亿美元，在办理立项时应当先由商务部会同相关部门和单位开展会商"},{"k":"C","t":"戊公司未提交安保方案和应急预案，商务部应当告知补正，11月15日告知符合规定"},{"k":"D","t":"若戊公司补正后获得立项回执，回执有效期为3年"}],"ans":"A,B,C","exp":"根据《对外承包工程项目备案和立项管理办法》第二条规定：“本办法所称特定项目，是指在与我无外交关系或者外交关系降级的国家承包的工程项目、涉及多国利益的工程项目、存在高风险的工程项目，以及按照《条例》规定确定的其他特定项目。特定项目以外的工程项目，为一般项目。 ”A正确。第四十三条规定：“企业承包合同额在10亿美元以上的工程项目，在办理备案立项手续时，由商务部会同相关部门和单位先开展会商”，B正确。第十七条规定：项目不属于立项管理范围、《项目立项表》填写不完整或者不准确、申请材料不齐全或者不符合法定形式，或者按规定需会同相关部门和单位会商的，商务部应当在收到企业立项申请材料之日起5个工作日以内告知企业。 11月10日提交，15日为第5个工作日，C正确。第十九条规定：“企业获得《立项回执》之日起2年以内，未对外投标或者签订工程项目合同的，《立项回执》自动失效”，D中“3年”错误。故答案ABC。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463765192718","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《温室气体自愿减排交易管理办法（试行）》，项目减排量登记需满足的条件包括（）","opts":[{"k":"A","t":"符合保守性原则"},{"k":"B","t":"符合生态环境部发布的项目方法学"},{"k":"C","t":"可测量可追溯可核查"},{"k":"D","t":"无时间限制"}],"ans":"A,B,C","exp":"《温室气体自愿减排交易管理办法（试行）》，经注册登记机构登记的温室气体自愿减排项目可以申请项目减排量登记。申请登记的项目减排量应当可测量、可追溯、可核查，并具备下列条件：（一）符合保守性原则；（二）符合生态环境部发布的项目方法学；（三）产生于2020年9月22日之后；（四）在可申请项目减排量登记的时间期限内；（五）符合生态环境部规定的其他条件。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463765192716","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于电力辅助服务分类，符合规则规定的有（）","opts":[{"k":"A","t":"分为基本电力辅助服务和有偿电力辅助服务"},{"k":"B","t":"基本辅助服务由经营主体无偿提供"},{"k":"C","t":"有偿辅助服务均采用市场化竞争确定提供者"},{"k":"D","t":"调频、备用、调峰属于辅助服务范畴"}],"ans":"A,B,D","exp":"《电力市场运行基本规则》第十九条：电力辅助服务分为基本电力辅助服务和有偿电力辅助服务。其中，基本电力辅助服务是经营主体应当无偿提供的电力辅助服务。有偿电力辅助服务是经营主体在基本电力辅助服务之外提供的其他电力辅助服务。具备条件的辅助服务采用市场竞争方式确定提供者。第十二条：电力辅助服务交易是指由经营主体通过市场化方式提供调频、备用和调峰等有偿电力辅助服务。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463765192710","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"《国务院办公厅转发国资委关于推进国有资本调整和国有企业重组指导意见的通知》规定，除特殊企业外，国有大型企业都要逐步改制成为（）的公司","opts":[{"k":"A","t":"多元股东"},{"k":"B","t":"单一股东"},{"k":"C","t":"国有独资"},{"k":"D","t":"集体所有"}],"ans":"A","exp":"《国务院办公厅转发国资委关于推进国有资本调整和国有企业重组指导意见的通知》正文明确规定，除了涉及国家安全的企业、必须由国家垄断经营的企业和专门从事国有资产经营管理的公司外，国有大型企业都要逐步改制成为多元股东的公司。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463765192708","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中央企业合规管理办法》，关于违规举报平台及举报人保护，中央企业应当：______","opts":[{"k":"A","t":"对举报人的身份和举报事项严格保密"},{"k":"B","t":"对举报属实的举报人可以给予适当奖励"},{"k":"C","t":"任何单位和个人不得以任何形式对举报人进行打击报复"},{"k":"D","t":"对恶意举报者一律开除"}],"ans":"A,B,C","exp":"原文《中央企业合规管理办法》：“中央企业应当对举报人的身份和举报事项严格保密，对举报属实的举报人可以给予适当奖励。任何单位和个人不得以任何形式对举报人进行打击报复。”","wrong":2.0,"cat":"企业文化与战略管理"},{"id":"2064317463765192706","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"电力市场管理委员会的定位与职责包括（）","opts":[{"k":"A","t":"独立于电力交易机构的自治性议事协调机制"},{"k":"B","t":"对市场成员实施自律管理"},{"k":"C","t":"由国家能源局直接运营管理"},{"k":"D","t":"负责市场交易结算具体操作"}],"ans":"A,B","exp":"《电力市场运行基本规则》：电力市场应当按照国家有关规定组建电力市场管理委员会，作为独立于电力交易机构的自治性议事协调机制，对电力市场成员实施自律管理。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463760998420","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《关于做好新能源消纳工作保障新能源高质量发展的通知》，关于新能源配套送出工程的建设，下列说法正确的有？","opts":[{"k":"A","t":"电网企业承担电网工程建设主体责任"},{"k":"B","t":"对电网企业建设有困难的配套送出工程，允许发电企业投资建设"},{"k":"C","t":"发电企业投资建设的配套送出工程，电网企业不得回购"},{"k":"D","t":"经双方协商同意后，电网企业可在适当时机依法依规回购发电企业建设的配套送出工程"}],"ans":"A,B,D","exp":"电网企业承担电网工程建设主体责任，对电网企业建设有困难或规划建设时序不匹配的新能源配套送出工程，允许发电企业投资建设，经电网企业与发电企业双方协商同意后可在适当时机由电网企业依法依规进行回购。——《关于做好新能源消纳工作保障新能源高质量发展的通知》","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463760998419","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列主体中，配合绿证核发工作并提供数据支撑的有（）","opts":[{"k":"A","t":"电网企业"},{"k":"B","t":"电力交易机构"},{"k":"C","t":"国家可再生能源信息管理中心"},{"k":"D","t":"市场监督管理部门"}],"ans":"A,B,C","exp":"《可再生能源绿色电力证书核发和交易规则》：电网企业、电力交易机构、国家可再生能源信息管理中心配合做好绿证核发工作，为绿证核发、交易、应用、核销等提供数据和技术支撑。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463760998417","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"电力市场交易类型的法定分类包括（）","opts":[{"k":"A","t":"电能量交易"},{"k":"B","t":"电力辅助服务交易"},{"k":"C","t":"容量交易"},{"k":"D","t":"电力金融衍生品交易"}],"ans":"A,B,C","exp":"《电力市场运行基本规则》：电力市场交易类型包括电能量交易、电力辅助服务交易、容量交易等。","wrong":2.0,"cat":"金融与投资理财"},{"id":"2064317463760998416","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某经营主体申请校核电能计量装置，经校核，装置误差达到规定精度，根据《电力市场运行基本规则》，由此发生的费用由（）承担。","opts":[{"k":"A","t":"电能计量装置产权方"},{"k":"B","t":"申请方"},{"k":"C","t":"电网企业"},{"k":"D","t":"电能计量检测机构"}],"ans":"B","exp":"依据《电力市场运行基本规则》正文：经营主体可以申请校核电能计量装置，经校核，电能计量装置误差达不到规定精度的，由此发生的费用由该电能计量装置的产权方承担；电能计量装置误差达到规定精度的，由此发生的费用由申请方承担。","wrong":1.0,"cat":"财务会计"},{"id":"2064317463760998413","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《长江流域控制性水工程联合调度管理办法（试行）》，下列关于控制性水工程联合调度应当坚持的原则，说法正确的有？","opts":[{"k":"A","t":"电调服从水调"},{"k":"B","t":"流域服从区域"},{"k":"C","t":"航调服从水调"},{"k":"D","t":"局部服从全局"}],"ans":"A,C,D","exp":"控制性水工程联合调度应当坚持安全第一、统筹兼顾，兴利与除害相结合，遵循电调（航调）服从水调、区域服从流域、局部服从全局的原则，处理好上下游、左右岸、干支流、单个工程调度与多工程联合调度的关系，实现多目标协同。——《长江流域控制性水工程联合调度管理办法（试行）》","wrong":1.0,"cat":"综合实务"},{"id":"2064317463760998412","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《建设工程质量管理条例》，在正常使用条件下，某住宅楼建设工程的最低保修期限，说法正确的有？","opts":[{"k":"A","t":"地基基础工程，为设计文件规定的该工程的合理使用年限"},{"k":"B","t":"屋面防水工程，为5年"},{"k":"C","t":"电气管线工程，为2年"},{"k":"D","t":"供热系统，为2年"}],"ans":"A,B,C","exp":"在正常使用条件下，建设工程的最低保修期限为：（一）基础设施工程、房屋建筑的地基基础工程和主体结构工程，为设计文件规定的该工程的合理使用年限；（二）屋面防水工程、有防水要求的卫生间、房间和外墙面的防渗漏，为5年；（三）供热与供冷系统，为2个采暖期、供冷期；（四）电气管线、给排水管道、设备安装和装修工程，为2年。——《建设工程质量管理条例》","wrong":2.0,"cat":"综合实务"},{"id":"2064317463760998411","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某风电项目2025年3月产生上网电量850千瓦时，关于绿证核发计算与结转，正确的有（）","opts":[{"k":"A","t":"当月电量不足1个绿证，不予核发"},{"k":"B","t":"当月电量结转至次月合并核算"},{"k":"C","t":"1个绿证单位对应1000千瓦时电量"},{"k":"D","t":"当月直接核发0.85个绿证"}],"ans":"A,B,C","exp":"《可再生能源绿色电力证书核发和交易规则》：1个绿证单位对应1000千瓦时可再生能源电量。不足核发1个绿证的当月电量结转至次月。","wrong":1.0,"cat":"财务会计"},{"id":"2064317463760998410","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"经营主体在电能量交易中禁止实施的行为有（）","opts":[{"k":"A","t":"串通报价、哄抬价格"},{"k":"B","t":"滥用市场支配地位操纵价格"},{"k":"C","t":"多个发电厂组成的发电企业集中报价"},{"k":"D","t":"自主报价参与市场竞争"}],"ans":"A,B,C","exp":"《电力市场运行基本规则》：经营主体之间不得实行串通报价、哄抬价格以及扰乱市场秩序等行为。经营主体进行电能量交易，不得滥用市场支配地位操纵市场价格；由多个发电厂组成的发电企业进行电能量交易，不得集中报价。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463760998408","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某地方政府拟打造出海综合服务的特色载体，依托本地开放优势开展首创性、集成式探索，根据《进一步完善海外综合服务体系的指导意见》，鼓励有条件的地方依托自由贸易试验区、自由贸易港等平台打造的特色服务载体是（）","opts":[{"k":"A","t":"出海服务示范基地"},{"k":"B","t":"出海综合服务港"},{"k":"C","t":"出海服务枢纽中心"},{"k":"D","t":"出海服务创新园区"}],"ans":"B","exp":"探索创新服务模式。鼓励有条件的地方依托自由贸易试验区、自由贸易港、国家服务业扩大开放综合示范区等，发挥开放枢纽、总部经济、服务资源等优势，主动对接国际高标准经贸规则，开展首创性、集成式探索，打造出海综合服务港。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2064317463760998407","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"丑公司（地方企业）于2025年4月1日获得某一般项目的备案回执，回执载明合同金额2亿美元。2025年5月1日，双方协商将合同金额变更为2.5亿美元。丑公司于2025年6月1日通过业务系统填写了《对外承包工程项目备案变更表》并上传。商务主管部门为丑公司办理了信息变更。根据《对外承包工程项目备案和立项管理办法》，下列表述正确的有（ ）。","opts":[{"k":"A","t":"丑公司应当在信息变动之日起30个工作日内办理变更，6月1日办理已超期"},{"k":"B","t":"商务主管部门应为符合备案管理要求的丑公司办理信息变更"},{"k":"C","t":"丑公司可自行打印信息变更后的备案回执，原回执自动失效"},{"k":"D","t":"若丑公司未按规定办理信息变更，情节严重或者造成不良影响的，商务主管部门可以对其主要负责人处5000元以上1万元以下罚款。"}],"ans":"B,C,D","exp":"根据《对外承包工程项目备案和立项管理办法》第十四条规定：“《备案回执》载明的信息发生变动的，企业应当自变动之日起30个工作日以内，通过业务系统填写《对外承包工程项目备案变更表》（以下简称《备案变更表》），打印并加盖单位公章后扫描上传至业务系统。收到企业《备案变更表》后，商务主管部门应当根据本办法相关规定为符合备案管理要求的企业办理信息变更。”变动日为5月1日，30个工作日约至6月12日，6月1日未超期，A错误。收到变更表后应为符合要求的办理信息变更，B正确。企业可自行打印信息变更后的备案回执，原回执自动失效，C正确。根据第三十三条规定，企业未按规定办理信息变更，情节严重或者造成不良影响的，商务主管部门可以对企业及其主要负责人依法予以罚款，故D正确。故答案BCD。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463760998406","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"长江流域实施水资源调度，根据《长江流域控制性水工程联合调度管理办法（试行）》，应当优先满足/保障的用水需求包括（）","opts":[{"k":"A","t":"城乡居民生活用水"},{"k":"B","t":"基本生态用水"},{"k":"C","t":"工业生产用水"},{"k":"D","t":"农业灌溉用水"}],"ans":"A,B","exp":"《长江流域控制性水工程联合调度管理办法（试行）》，长江流域控制性水工程实施水资源调度，应当依据经批准的联合调度运用计划、河流年度水量调度计划以及水工程调度规程等，优先满足城乡居民生活用水，保障基本生态用水，统筹农业、工业用水以及航运等需要，发挥水资源综合效益。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463760998404","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某水库经批准降等为塘坝。水库管理单位按照批复意见组织实施。根据《水库降等与报废管理办法》，下列措施中，属于降等组织实施应当包括的内容有（ ）。","opts":[{"k":"A","t":"拆除大坝"},{"k":"B","t":"重新划定水库管理与保护范围"},{"k":"C","t":"修订水库调度规程"},{"k":"D","t":"开展生态修复"}],"ans":"B,C","exp":"根据《水库降等与报废管理办法》：水库降等的组织实施包括以下措施：（一）必要的工程处置措施；（二）修订并完成水库调度规程（方案、运用计划）、大坝安全管理（防汛）应急预案的审批或者备案，落实各项运行管理制度；（三）重新划定水库管理与保护范围；（四）重新确定生态流量目标；（五）按照机构编制有关规定开展水库管理机构变更或者撤销；（六）水库管理人员安置；（七）相关资料整编和归档；（八）批复意见确定的其他措施。B对应第（三）项，C对应第（二）项。A属于报废措施，D为报废措施中的生态修复，降等措施中无生态修复，故不选。","wrong":1.0,"cat":"综合实务"},{"id":"2064317463760998403","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"申请募集基础设施基金，拟任基金托管人应符合的条件有（）","opts":[{"k":"A","t":"财务状况良好，风险控制指标符合监管规定"},{"k":"B","t":"具有基础设施领域资产管理产品托管经验"},{"k":"C","t":"与基础设施资产支持证券托管人可为不同主体"},{"k":"D","t":"无重大不良记录"}],"ans":"A,B,D","exp":"申请募集基础设施基金，拟任基金托管人应当符合下列条件：（一）财务状况良好，风险控制指标符合中国证监会及银行保险监督管理机构的有关规定；（二）具有基础设施领域资产管理产品托管经验；（三）最近3年没有重大违法违规行为，没有被中国证监会采取行政监管措施或者行政处罚的情形。基础设施基金托管人与基础设施资产支持证券托管人应当为同一主体。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2064317463760998402","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"国务院和地方人民政府审计机关依照《中华人民共和国审计法》的规定，对国有资本经营预算的执行情况和属于审计监督对象的国家出资企业进行（）。","opts":[{"k":"A","t":"财务监督"},{"k":"B","t":"审计监督"},{"k":"C","t":"经营监督"},{"k":"D","t":"管理监督"}],"ans":"B","exp":"国务院和地方人民政府审计机关依照《中华人民共和国审计法》的规定，对国有资本经营预算的执行情况和属于审计监督对象的国家出资企业进行审计监督。《中华人民共和国企业国有资产法》","wrong":2.0,"cat":"经济法与财经法规"},{"id":"2064317463756804121","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"三峡集团始终把保障防洪安全作为首要战略使命和核心功能，建成了国内水电行业规模最大、功能全面、技术先进的水情遥测系统，充分发挥以三峡工程为核心的长江干流梯级水库群在水旱灾害防御中________、________的关键作用。","opts":[{"k":"A","t":"不可或缺"},{"k":"B","t":"不可替代"},{"k":"C","t":"不可忽视"},{"k":"D","t":"不可超越"}],"ans":"A,B","exp":"解析：“充分发挥以三峡工程为核心的长江干流梯级水库群在水旱灾害防御中不可或缺、不可替代的关键作用。”《共抓大保护、不搞大开发——习近平总书记在重庆召开推动长江经济带发展座谈会并发表重要讲话》","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2064317463756804120","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"主业处于国家安全、国民经济命脉重要行业且承担重大专项任务的子企业，下列符合文件规定的有（）","opts":[{"k":"A","t":"不得因产权转让失去国有资本控股地位"},{"k":"B","t":"集团及其控股子企业间转让产权由集团批准"},{"k":"C","t":"原股东同比例增资由集团批准"},{"k":"D","t":"外部投资者增资由集团直接批准"}],"ans":"A,B,C","exp":"《国务院国有资产监督管理委员会关于企业国有资产交易流转有关事项的通知》：主业处于关系国家安全、国民经济命脉的重要行业和关键领域，主要承担重大专项任务的子企业，不得因产权转让、企业增资失去国有资本控股地位。国家出资企业内部重组整合中涉及该类企业时，以下情形可由国家出资企业审核批准：（一）企业产权在国家出资企业及其控股子企业之间转让的；（二）国家出资企业直接或指定其控股子企业参与增资的；（三）企业原股东同比例增资的。其他情形由国家出资企业报同级国有资产监督管理机构批准。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463756804119","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《招标人主体责任履行指引》，中标人要求变更合同金额超过中标合同金额多少，或者拟分包金额超过招标文件约定分包金额多少的，招标人要组织力量对履约情况进行全面审核？","opts":[{"k":"A","t":"变更合同金额超过中标合同金额5%"},{"k":"B","t":"变更合同金额超过中标合同金额10%"},{"k":"C","t":"拟分包金额超过招标文件约定分包金额5%"},{"k":"D","t":"拟分包金额超过招标文件约定分包金额10%"}],"ans":"B,D","exp":"中标人要求变更合同金额超过中标合同金额10%，或者拟分包金额超过招标文件约定分包金额10%的，招标人要组织力量对履约情况进行全面审核，充分研究论证合同变更的必要性和合规性。——《招标人主体责任履行指引》","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2064317463756804115","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"电网侧独立新型储能电站实行______管理，管理要求由国家能源局根据电力供需形势分析及保供举措等另行明确，项目具体清单由省级能源主管部门会同价格主管部门制定。","opts":[{"k":"A","t":"备案制"},{"k":"B","t":"核准制"},{"k":"C","t":"清单制"},{"k":"D","t":"审批制"}],"ans":"C","exp":"解析：《国家发展改革委、国家能源局关于完善发电侧容量电价机制的通知》二、分类完善容量电价机制（三）建立电网侧独立新型储能容量电价机制：电网侧独立新型储能电站实行清单制管理，管理要求由国家能源局根据电力供需形势分析及保供举措等另行明确，项目具体清单由省级能源主管部门会同价格主管部门制定。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2064317463756804111","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"小型水库大坝安全监测工作符合规定的有（）","opts":[{"k":"A","t":"按SL/T 828规范执行"},{"k":"B","t":"可集中打捆组织招投标"},{"k":"C","t":"可委托专业机构承担运行维护"},{"k":"D","t":"监测设施可不设标识与防护"}],"ans":"A,B,C","exp":"《水库大坝安全监测管理办法》第十条：小型水库按照SL/T 828执行。第十二条：小型水库可采取集中打捆方式组织招投标。第十八条：可委托专业机构承担运行维护。第二十二条：监测设施应设置标识并采取防护措施。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2064317463756804106","bank":"竞赛题库（三）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"某设计单位未根据勘察成果文件进行设计，且指定建材供应商，根据《建设工程质量管理条例》，该单位应处的罚款是（）","opts":[{"k":"A","t":"5万-10万"},{"k":"B","t":"10万-30万"},{"k":"C","t":"20万-50万"},{"k":"D","t":"50万-100万"}], 京召开。全会指出，坚持党对人民军队绝对领导，贯彻军委主席负责制，按照国防和军队现代化（  ），推进政治建军、改革强军、科技强军、人才强军、依法治军，边斗争、边备战、边建设。","opts":[{"k":"A","t":"“两步走”战略"},{"k":"B","t":"新“两步走”战略"},{"k":"C","t":"“三步走”战略"},{"k":"D","t":"新“三步走”战略"}],"ans":"D","exp":"全会指出，坚持党对人民军队绝对领导，贯彻军委主席负责制，按照国防和军队现代化新“三步走”战略，推进政治建军、改革强军、科技强军、人才强军、依法治军，边斗争、边备战、边建设。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2059078693406838786","bank":"竞赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十届四中全会指出，优化政府投资结构，提高（  ）政府投资比重，高质量推进国家重大战略实施和重点领域安全能力项目建设。","opts":[{"k":"A","t":"国防类"},{"k":"B","t":"生态类"},{"k":"C","t":"民生类"},{"k":"D","t":"科技类"}],"ans":"C","exp":"会议指出，优化政府投资结构，提高民生类政府投资比重，高质量推进国家重大战略实施和重点领域安全能力项目建设。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2057262351049904130","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲乙公司在交易前没有关联方关系，均按照净利润的10%提取盈余公积。2×19年1月1日，甲公司投资500万元购入乙公司100%股权，购买日乙公司可辨认净资产的公允价值为500万元，账面价值为400万元，其差额为一项无形资产所引起，该无形资产尚可使用5年，预计净残值为零，采用直线法摊销。乙公司2×19年实现净利润100万元，所有者权益其他项目未发生变化，期初未分配利润为0。2×19年末甲公司编制投资收益和利润分配的抵销分录时应抵销的乙公司期末未分配利润是（ ）万元。","opts":[{"k":"A","t":"100"},{"k":"B","t":"0"},{"k":"C","t":"80"},{"k":"D","t":"70"}],"ans":"D","exp":"应抵销的期末未分配利润＝期初＋调整后本期净利润－提取的盈余公积－对所有者的分配＝0＋（100－20）－10－0＝70（万元）。其中，20是合并日乙公司无形资产由于其公允价值500万元大于其账面价值400万元的差额100万元，按照5年采用直线法摊销所得的年摊销额。抵销分录如下： 借：投资收益 80{[100－（500－400）/5]×100%}   贷：提取盈余公积 10（100×10%）     未分配利润——年末 70（80－10）【提示】提取盈余公积是按照子公司在个别报表中根据自己的账面净利润计提的，因此不需要按调整后的净利润调整。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350995378178","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"合并集团编制合并财务报表时，需遵循的原则有（ ）。","opts":[{"k":"A","t":"以母公司财务报表为基础编制"},{"k":"B","t":"便捷性原则"},{"k":"C","t":"一体性原则"},{"k":"D","t":"重要性原则"}],"ans":"C,D","exp":"合并财务报表的编制除应遵循财务报表编制的一般原则和要求，如真实可靠、内容完整之外，还应遵循以下原则和要求：①以个别财务报表为基础编制；②一体性原则；③重要性原则。选项B，不是编制合并财务报表时应遵循的原则。【点评】本题考查合并财务报表编制的原则，属于对教材原文的考查，比较简单。对于此类题目，考生多熟悉教材即可。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350882131969","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"甲公司对乙公司进行投资，占有表决权股份的80％，能够控制乙公司。2×23年甲公司向乙公司销售商品形成应收账款350万元，至年末乙公司尚未支付上述货款，甲公司采用预期信用损失法，当年对应收账款计提了10％的坏账准备。甲公司采用资产负债表债务法核算所得税，适用的所得税税率为25％。不考虑其他因素，下列各项有关甲公司年末编制抵销分录的会计处理中，正确的有（  ）。","opts":[{"k":"A","t":"应抵销的应收账款金额为350万元"},{"k":"B","t":"应抵销的资产减值损失金额为35万元"},{"k":"C","t":"应抵销的递延所得税资产金额为8.75万元"},{"k":"D","t":"应抵销的所得税费用金额为8.75万元"}],"ans":"C,D","exp":"本题考查内部债权债务的抵销。母子公司作为一个报告主体，其内部形成的债权和债务在对外提供合并财务报表时要相互抵销，涉及坏账准备和递延所得税时也需要抵销。本题应编制的会计分录如下：（1）应收账款和应付账款抵销：借：应付账款  350\n   贷：应收账款  350（2）当年内部应收账款所计提或转回坏账准备的抵销：\n借：应收账款——坏账准备  35\n   贷：信用减值损失  35\n应抵销应收账款的金额=350-35=315（万元），选项A不当选。应抵销的信用减值损失为35万元，而非资产减值损失，选项B不当选。需要注意的是，抵销分录中抵销的是报表项目，而非会计科目，故“坏账准备”科目应直接使用“应收账款”项目替代。（3）本期因存货减值确认的递延所得税资产的抵销：\n借：所得税费用 （35×25％）8.75\n   贷：递延所得税资产  8.75\n应抵销递延所得税资产8.75万元；应抵销所得税费用8.75万元。选项CD当选。\n提示：本题因内部交易产生的350万元债权债务关系在合并报表层面不予认可，所以因此计提的减值准备、因计提减值准备而确认的递延所得税资产在合并报表层面也不予认可，需要予以抵销。对于母公司个别报表，因计提35万元减值准备，产生可抵扣暂时性差异35万元，在个别报表中已相应编制如下与所得税相关的会计分录。\n借：递延所得税资产  8.75\n   贷：所得税费用  8.75\n上述分录在合并报表层面不予认可，应予以转回（即在合并报表层面予以抵销），即本题解析（3）中的相关。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350827606018","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"母公司在编制合并资产负债表时，子公司持有母公司的长期股权投资应当视为企业集团的库存股。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"子公司持有母公司的长期股权投资，应当视为企业集团的库存股，作为所有者权益的减项，在合并资产负债表中所有者权益项目下以“减：库存股”项目列示。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350773080065","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"甲公司拥有乙公司80%的有表决权资本，能够对乙公司实施控制，甲公司和乙公司适用的所得税税率均为25%。2×18年，甲公司向乙公司销售A产品100台，每台售价5万元，价款已收存银行。A产品每台成本3万元，未计提存货跌价准备。至2×18年末，乙公司从甲公司购入的A产品对外售出40台，其余部分形成期末存货。2×18年末，乙公司进行存货检查时发现，因市价下跌，库存A产品的可变现净值下降至280万元。则甲公司编制合并报表抵销分录时应确认的递延所得税资产为（ ）万元。","opts":[{"k":"A","t":"20"},{"k":"B","t":"35"},{"k":"C","t":"25"},{"k":"D","t":"30"}],"ans":"C","exp":"会计处理如下： 借：营业收入 500   贷：营业成本 380 （倒挤）    存货 [未出售60台×（5－3）]120 借：存货——存货跌价准备 20   贷：资产减值损失 20 借：递延所得税资产 [（120－20）×25%]25  贷：所得税费用 25思路分析：乙公司个别报表：A产品期末成本＝60×5＝300（万元），可变现净值为280万元，个别报表中计提了20万元的存货跌价准备，期末账面价值即为280万元，税法不认可计提的跌价准备，计税基础＝60×5＝300（万元），产生可抵扣暂时性差异20万元，确认递延所得税资产5万元；集团角度：A产品期末成本＝60×3＝180（万元），可变现净值为280万元，未发生减值，因此需要抵销个别报表中确认的资产减值损失20万元，期末账面价值即为180万元，计税基础＝60×5＝300（万元），产生可抵扣暂时性差异120万元，确认递延所得税资产30万元，因此调整抵销分录中需补提25万元（30－5）的递延所得税资产。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350659833857","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于资产负债表日后调整事项的具体会计处理方法，下列说法中不正确的有（ ）。","opts":[{"k":"A","t":"企业在资产负债表日后期间取得确凿证据，表明某项资产已发生减值的，应将其作为调整事项处理"},{"k":"B","t":"企业在资产负债表日后期间取得确凿证据，表明某项资产在报告年度资产负债表日已发生减值的，应当调整报告年度相关报表项目"},{"k":"C","t":"企业在资产负债表日后期间取得确凿证据，表明企业在报告年度资产负债表日对某项资产的资产减值损失所做的最佳估计金额不够准确的，应当作为调整事项处理，在日后期间对该估计进行修正"},{"k":"D","t":"企业在资产负债表日后期间取得确凿证据，表明某项资产在报告年度资产负债表日已发生减值的，企业应当调整报告年度的相关资产减值准备金额和应交所得税金额"}],"ans":"A,D","exp":"如果该资产是因为当期发生的事项而导致出现减值，则不应该作为资产负债表日后调整事项处理，所以选项A不正确；报告年度资产负债表日减值已经存在，因此作为资产负债表日后调整事项处理，所以选项B正确；最佳估计金额不够准确需要修改资产负债表日的数据，作为日后调整事项处理，调整报告年度资产负债表日的年末数，所以选项C正确；企业在日后期间补提报告年度资产减值准备时，由于相关损失尚未实际发生，不允许税前扣除，不需要调整报告年度应交所得税，所以选项D不正确。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350605307905","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"下列有关资产负债表日后事项的表述中，不正确的是（  ）。","opts":[{"k":"A","t":"非调整事项是报告年度资产负债表日及之前其状况不存在的事项"},{"k":"B","t":"调整事项是对报告年度资产负债表日已经存在的情况提供了新的或进一步证据的事项"},{"k":"C","t":"重要的非调整事项只需在报告年度财务报表附注中披露"},{"k":"D","t":"调整事项均应通过“以前年度损益调整”科目进行账务处理"}],"ans":"D","exp":"资产负债表日后调整事项只有涉及损益的事项，应通过“以前年度损益调整”科目进行账务处理，而不是所有的事项。","wrong":1.0,"cat":"财务会计"},{"id":"2057262350437535746","bank":"竞赛题库（一）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"资产负债表日至财务报告批准报出日之间，股东大会批准了董事会拟定的股利分配方案，企业应将该事项作为资产负债表日后调整事项处理。 （ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题考查资产负债表日后调整事项的判断。资产负债表日后期间通过利润分配方案属于资产负债表日后非调整事项，本题表述错误。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2059078693293592578","bank":"竞赛题库（二）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"党的二十届四中全会指出，促进中小企业专精特新发展，培育独角兽企业。独角兽企业是投资行业尤其是风险投资业的术语，一般指成立时间不超过（  ）、估值超过（  ）美元的未上市创业公司。","opts":[{"k":"A","t":"5年  5亿"},{"k":"B","t":"8年  8亿"},{"k":"C","t":"10年  10亿"},{"k":"D","t":"12年  12亿"}],"ans":"C","exp":"独角兽企业是投资行业尤其是风险投资业的术语，一般指成立时间不超过10年、估值超过10亿美元的未上市创业公司。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287927484428","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据《对外承包工程项目备案和立项管理办法》，项目不属于立项管理范围、《对外承包工程项目立项表》填写不完整或者不准确、申请材料不齐全或者不符合法定形式，或者按规定需会同相关部门和单位会商的，商务部应当在收到企业立项申请材料之日起3个工作日以内告知企业。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：\"项目不属于立项管理范围、《项目立项表》填写不完整或者不准确、申请材料不齐全或者不符合法定形式，或者按规定需会同相关部门和单位会商的，商务部应当在收到企业立项申请材料之日起5个工作日以内告知企业。\"特定项目立项材料存在上述情形时，商务部告知期限为5个工作日；3个工作日系一般项目备案的告知期限，两类程序时限不同，不得混淆。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287910707230","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"金融机构中的国有资产的监督管理，适用《企业国有资产监督管理暂行条例》。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：《企业国有资产监督管理暂行条例》金融机构中的国有资产的监督管理，不适用本条例。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287910707216","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"国有独资企业、国有独资公司合并、分立，增加或者减少注册资本，发行债券，分配利润，以及解散、申请破产，由履行出资人职责的机构决定。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"《中华人民共和国企业国有资产法》“国有独资企业、国有独资公司合并、分立，增加或者减少注册资本，发行债券，分配利润，以及解散、申请破产，由履行出资人职责的机构决定。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287910707211","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"国务院国有资产监督管理机构是代表国务院履行出资人职责、负责监督管理企业国有资产的直属事业单位。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：《企业国有资产监督管理暂行条例》国务院国有资产监督管理机构是代表国务院履行出资人职责、负责监督管理企业国有资产的直属特设机构。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287906512918","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《中央企业合规管理办法》，中央企业应当结合实际设立首席合规官，可以新增领导岗位和职数，由总法律顾问兼任。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文《中央企业合规管理办法》“中央企业应当结合实际设立首席合规官，不新增领导岗位和职数，由总法律顾问兼任，对企业主要负责人负责，领导合规管理部门组织开展相关工作，指导所属单位加强合规管理。”","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287906512916","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《中央企业合规管理办法》，中央企业应当定期梳理业务流程，查找合规风险点，运用信息化手段将合规要求和防控措施嵌入流程，仅针对关键节点加强合规审查。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文《中央企业合规管理办法》“中央企业应当定期梳理业务流程，查找合规风险点，运用信息化手段将合规要求和防控措施嵌入流程，针对关键节点加强合规审查，强化过程管控。”原文要求“针对关键节点加强合规审查”并“强化过程管控”，并非“仅针对关键节点”，题干删除了“强化过程管控”且添加了“仅”字，改变了原意。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287906512897","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《中央企业发展规划管理办法》，国务院国资委对所有中央企业的发展规划均实施审批管理，无论该企业是否在授权放权清单中明确了董事会可决定发展规划相关事项。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"国务院国资委对授权放权清单明确授权董事会决定发展规划的中央企业发展规划实施备案管理。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287893930001","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《国务院办公厅转发国资委关于推进国有资本调整和国有企业重组指导意见的通知》，国有独资企业引入非国有投资者的改制方案须经企业职工代表大会或职工大会审议通过后方可实施改制。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文表述为：\"国有独资企业引入非国有投资者的改制方案和国有控股企业改制为国有资本不控股或不参股企业的方案，必须提交企业职工代表大会或职工大会审议，充分听取职工意见；职工安置方案须经企业职工代表大会或职工大会审议通过后方可实施改制。\"改制方案须\"提交审议、充分听取意见\"，须经\"审议通过后方可实施\"的是职工安置方案，而非改制方案本身，二者程序要求不同，题干混淆了两类方案的审议标准。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287893930000","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《国务院办公厅转发国资委关于推进国有资本调整和国有企业重组指导意见的通知》，对不属于重要行业和关键领域的中央企业，下放地方管理有利于发挥地方优势、有利于与地方企业重组提高竞争力的，在征得地方人民政府同意后，可以将其交由地方国有资产监管机构或地方企业管理。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文表述为：\"对不属于重要行业和关键领域的中央企业，下放地方管理有利于发挥地方优势、有利于与地方企业重组提高竞争力的，在征得地方人民政府同意并报经国务院批准后，可以将其交由地方国有资产监管机构或地方企业管理。\"题干漏掉了\"并报经国务院批准\"这一不可或缺的程序要件，与原文不符。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287885541401","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《2025年能源工作指导意见》，在统筹推进新型电力系统建设方面，要分阶段、按步骤实施新一代火电升级专项行动。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"根据《2025年能源工作指导意见》\"统筹推进新型电力系统建设\"部分原文：\"分阶段、按步骤实施新一代煤电升级专项行动。\"","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287885541400","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《2025年能源工作指导意见》，在持续增强海外资源供应保障能力方面，要巩固拓展与油气资源大国的合作。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"根据《2025年能源工作指导意见》\"巩固深化能源国际合作\"中\"持续增强海外资源供应保障能力\"部分原文：\"巩固拓展与煤炭资源大国合作。\"","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287885541390","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据《抽水蓄能电站开发建设管理暂行办法》，电网企业及其电力调度机构和抽水蓄能电站应在并网后根据平等互利、协商一致原则签订并网调度协议并严格执行。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"电网企业及其电力调度机构和抽水蓄能电站应在并网前根据平等互利、协商一致原则签订并网调度协议并严格执行。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287881347099","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《温室气体自愿减排交易管理办法（试行）》规定，生态环境部负责组织制定并发布温室气体自愿减排项目方法学等技术规范，作为相关领域自愿减排项目审定、实施与减排量核算、核查的参考建议。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《温室气体自愿减排交易管理办法（试行）》生态环境部负责组织制定并发布温室气体自愿减排项目方法学（以下简称项目方法学）等技术规范，作为相关领域自愿减排项目审定、实施与减排量核算、核查的依据。”","wrong":1.0,"cat":"财务会计"},{"id":"2069069287881347098","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《温室气体自愿减排交易管理办法（试行）》规定，生态环境部按照国家有关规定建设全国温室气体自愿减排交易市场，负责制定全国温室气体自愿减排交易及相关活动的管理要求和技术规范，并对全国温室气体自愿减排交易及相关活动进行统一管理和直接运营。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《温室气体自愿减排交易管理办法（试行）》生态环境部按照国家有关规定建设全国温室气体自愿减排交易市场，负责制定全国温室气体自愿减排交易及相关活动的管理要求和技术规范，并对全国温室气体自愿减排交易及相关活动进行监督管理和指导。”","wrong":1.0,"cat":"综合实务"},{"id":"2069069287881347095","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《企业国有资产交易监督管理办法》规定，企业增资通过产权交易机构网站对外披露信息公开征集投资方，时间不得少于20个工作日。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《企业国有资产交易监督管理办法》\"企业增资通过产权交易机构网站对外披露信息公开征集投资方，时间不得少于40个工作日。\"","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287881347092","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《企业国有资产交易监督管理办法》第四条规定，本办法所称国有及国有控股企业、国有实际控制企业包括：（一）政府部门、机构、事业单位出资设立的国有独资企业（公司），以及上述单位、企业直接或间接合计持股为100%的国有全资企业；（二）本条第（一）款所列单位、企业单独或共同出资，合计拥有产（股）权比例超过50%，且其中之一为最大股东的企业；（三）本条第（一）、（二）款所列企业对外出资，拥有股权比例超过50%的各级子企业；（四）政府部门、机构、事业单位、单一国有及国有控股企业直接或间接持股比例未超过50%，但为第一大股东，并且通过股东协议、公司章程、董事会决议或者其他协议安排能够对其实际支配的企业。某企业股权结构为：国有独资企业A持股45%，国有独资企业B持股40%，民营企业C持股15%。A和B之间无任何协议安排，且A无法单独实际支配该企业。根据该规定，该企业属于该办法所称的国有及国有控股企业、国有实际控制企业。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：《企业国有资产交易监督管理办法》第四条规定了四种情形。该企业国有股东合计持股85%超过50%，但第（二）项要求“本条第（一）款所列单位、企业单独或共同出资”，即出资主体必须全部是第（一）款所列单位且不能有非国有股东，该企业存在民营股东C，不符合该条件。第（四）项要求“持股比例未超过50%”，A持股45%未超过50%且为第一大股东，但还要求“能够对其实际支配”，题干明确A无法单独实际支配。因此该企业不属于该办法所称的国有及国有控股企业、国有实际控制企业。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287881347084","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《能源电力系统安全生产治本攻坚三年行动方案（2024—2026年）》要求严格落实《电力监控系统安全防护规定》等文件要求，坚持\"安全分区、网络专用、纵向隔离、横向认证\"原则，强化结构安全、本体安全，加强态势监测，提升技术防护手段，全面提升电力监控系统安全防护水平。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文规定：\"坚持'安全分区、网络专用、横向隔离、纵向认证'原则，强化结构安全、本体安全，加强态势监测，提升技术防护手段，加强实验室建设，全面提升电力监控系统安全防护水平。\"题干将\"横向隔离、纵向认证\"对调为\"纵向隔离、横向认证\"，颠倒了两组技术手段与方向的对应关系。此为电力监控系统安全防护领域的专业基础原则，常见误区正是混淆\"横向\"与\"纵向\"所对应的具体防护措施。出处：《能源电力系统安全生产治本攻坚三年行动方案（2024—2026年）》","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287881347081","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《进一步完善海外综合服务体系的指导意见》提出，引导企业注重属地化经营，积极履行社会责任，塑造良好国际品牌形象，将企业发展与当地社会发展融合，实现股东、员工、供应商、顾客、东道国政府、当地社区共赢和可持续发展。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《进一步完善海外综合服务体系的指导意见》原文规定：\"引导企业注重属地化经营，积极履行社会责任，塑造良好国际品牌形象，将企业发展与当地社会发展融合，实现股东、员工、供应商、顾客、东道国政府、当地社区、生态环境共赢和可持续发展。\"原文列举的共赢主体共七项：股东、员工、供应商、顾客、东道国政府、当地社区、生态环境，题干遗漏了\"生态环境\"这一主体，表述不完整，故错误。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287877152790","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《国家发展改革委关于进一步完善抽水蓄能价格形成机制的意见》指出，抽水蓄能电站具有调峰、调频、调压、系统备用和黑启动等多种功能，是电力系统的主要调节电源。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"解析：《国家发展改革委关于进一步完善抽水蓄能价格形成机制的意见》正文首段：抽水蓄能电站具有调峰、调频、调压、系统备用和黑启动等多种功能，是电力系统的主要调节电源。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287877152787","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《国家发展改革委、国家能源局关于完善发电侧容量电价机制的通知》规定，省级价格主管部门可在市场体系较为健全的基础上，对本通知出台后开工建设的抽水蓄能电站，统一执行可靠容量补偿机制并参与电能量和辅助服务等市场，电站参与市场获得的收益按照省级价格主管部门确定的比例由电站分享。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"解析：\"省级价格主管部门可在市场体系较为健全的基础上，对本通知出台后开工建设的抽水蓄能电站，统一执行可靠容量补偿机制并参与电能量和辅助服务等市场、市场收益全部由电站获得。\"本通知出台后开工建设的抽水蓄能电站执行可靠容量补偿机制时，市场收益\"全部\"由电站获得。\"按比例由电站分享\"适用的是《关于进一步完善抽水蓄能价格形成机制的意见》出台后、本通知出台前开工建设的电站在容量电价机制下的收益安排，题干混淆了两类机制下的市场收益归属规则。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287877152774","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《关于深化新能源上网电价市场化改革，促进新能源高质量发展的通知》规定，2025年6月1日以前投产的新能源存量项目，机制电价按现行价格政策执行，不高于当地燃气发电基准价。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文规定，存量项目\"机制电价，按现行价格政策执行，不高于当地煤电基准价\"。题干将\"煤电基准价\"错误表述为\"燃气发电基准价\"，表述有误。出处：《关于深化新能源上网电价市场化改革，促进新能源高质量发展的通知》","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287877152771","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《关于进一步加强财会监督工作的意见》提出，聚焦贯彻落实减税降费、党政机关过紧日子、加强基层保基本民生保工资保运转工作、规范国库管理、加强资产管理、防范债务风险等重点任务，严肃查处财政收入不真实不合规、违规兴建楼堂馆所、财务数据造假、乱设财政专户、违规处置资产、违规新增地方政府隐性债务等突出问题。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文：“聚焦贯彻落实减税降费、党政机关过紧日子、加强基层保基本民生保工资保运转工作、规范国库管理、加强资产管理、防范债务风险等重点任务，严肃查处财政收入不真实不合规、违规兴建楼堂馆所、乱设财政专户、违规处置资产、违规新增地方政府隐性债务等突出问题”出自《关于进一步加强财会监督工作的意见》。“财务数据造假”属于“严厉打击财务会计违法违规行为”范畴，不属于本条列举的查处内容。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287872958493","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《关于进一步加强财会监督工作的意见》规定，构建财政部门、有关部门、各单位、中介机构、行业协会等监督主体纵向协同工作机制；各级财政部门牵头负责本级政府财会监督协调工作机制日常工作。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"原文：“构建财政部门、有关部门、各单位、中介机构、行业协会等监督主体横向协同工作机制。”出自《关于进一步加强财会监督工作的意见》“加强财会监督主体横向协同”。原文：“各级财政部门牵头负责本级政府财会监督协调工作机制日常工作”出自同一条款。题干将“横向协同”错误表述为“纵向协同”。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287872958492","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《对外承包工程项目备案和立项管理办法》规定，企业承包合同额在10亿美元以上的工程项目，在办理备案立项手续时，由商务部会同相关部门和单位先开展会商，对项目风险进行评估；企业在完成会商前对外投标、议标或者签约项目的，情节严重或者造成不良影响的，处5万元以上10万元以下的罚款，并可以对其主要负责人处5000元以上1万元以下的罚款。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"解析：\"企业承包合同额在10亿美元以上的工程项目，在办理备案立项手续时，由商务部会同相关部门和单位先开展会商，对项目风险进行评估。\"第三十四条第（三）项解析：\"未按照本办法第四十三条规定，在完成会商前对外投标、议标或者签约项目的\"，\"情节严重或者造成不良影响的，处5万元以上10万元以下的罚款，并可以对其主要负责人处5000元以上1万元以下的罚款\"。题干综合两条款，各项数值与原文均一致，表述正确。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287872958487","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《2024-2025年节能降碳行动方案》提出，除石化企业现有自备机组外，可以采用高硫石油焦作为燃料。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《2024-2025年节能降碳行动方案》“二、重点任务” “（一）化石能源消费减量替代行动”：“2.优化油气消费结构。合理调控石油消费，推广先进生物液体燃料、可持续航空燃料。加快页岩油（气）、煤层气、致密油（气）等非常规油气资源规模化开发。有序引导天然气消费，优先保障居民生活和北方地区清洁取暖。除石化企业现有自备机组外，不得采用高硫石油焦作为燃料。”","wrong":1.0,"cat":"综合实务"},{"id":"2069069287872958477","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2021年集团税后净利润突破500亿元（为502.5亿元），利润总额突破500亿元。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于利润总额量级：2021年报载明：利润总额突破600亿元，而非500亿元；税后净利润502.5亿元无误。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287872958471","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《中国三峡集团2023年可持续发展报告》，在全球12大水电站中，有4座由中国三峡集团建设、运营和管理。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"报告\"走进中国三峡集团\"水电站图示明确标注：全球12大水电站中，有5座（三峡、白鹤滩、溪洛渡、乌东德、向家坝）由中国三峡集团建设、运营和管理，本题称\"4座\"与报告披露的\"5座\"矛盾，故为错。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287872958470","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《2015年度报告》，集团滚动开发的金沙江下游四座巨型梯级水电站为三峡、葛洲坝、溪洛渡、向家坝。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于电站构成：金沙江下游四座巨型梯级电站为溪洛渡、向家坝、乌东德、白鹤滩；三峡、葛洲坝位于长江干流（湖北宜昌），不属于金沙江下游四座巨型电站，属列表成员错配。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287872958469","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《中国三峡集团2023年可持续发展报告》，三峡精神以\"在保护中发展、在发展中保护\"为核心。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"报告\"走进中国三峡集团\"披露，三峡精神以\"为我中华、志建三峡\"为核心；\"在保护中发展、在发展中保护\"属于核心理念的内容，本题张冠李戴，与报告矛盾，故为错。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287872958468","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"城镇污水治理“三峡模式”的四个聚焦之一为聚焦“厂网河湖一体”治理模式。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于治理模式表述：“三峡模式”四聚焦中为聚焦“厂网一体”治理模式，而非“厂网河湖一体”（来源：《2020年度报告》）。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287872958467","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据谢松同志2026年度财务工作会议讲话，集团“十五五”面临的阶段性特征为“四期叠加”，即功能拓展机遇期、业务发展攻坚期、业绩提升承压期、改革创新窗口期。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于第四期表述：“四期叠加”第四期为“风险防控关键期”，而非“改革创新窗口期”（来源：《关于谢松同志在集团公司2026年度财务工作会议上的讲话的内部通报》）。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764189","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2017年度报告将“三大转变”升级为“五大转变”，新增的两项为“由建设伟大工程向建设伟大企业转变”和“由引领中国水电向引领全球水电转变”。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于新增项之一：五大转变新增的是“建设伟大工程→建设伟大企业”和“建设三峡、开发长江→管理三峡、保护长江”，不含“引领中国水电向引领全球水电转变”（来源：《2017年度报告》）。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764188","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2017年末集团可控装机规模超过7000万千瓦，已建、在建和权益总装机规模达1.18亿千瓦。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于总装机数值：2017年末已建、在建和权益总装机为1.24亿千瓦，1.18亿千瓦是2016年末的口径（来源：《2017年度报告》《2016年度报告》）。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287868764187","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2021年度报告确定集团愿景为“奋进两翼齐飞 创建世界一流”，并提出到2030年全面建成世界一流清洁能源集团和生态环保企业。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于目标年份：2021年报愿景对应的是到2035年全面建成世界一流清洁能源集团和生态环保企业，而非2030年（来源：《2021年度报告》）。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764185","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《2015年度报告》核心理念，集团核心价值观为“奉献、担当、创新、卓越”。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于末位要素：核心价值观为“奉献、担当、创新、和谐”，第四项应为“和谐”而非“卓越”；“追求卓越”属“三峡精神”内容，此处属列表成员混淆。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287868764184","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"巴基斯坦卡洛特水电站于2022年6月29日全面投入商业运营，装机容量为94.4万千瓦。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于装机容量：卡洛特水电站装机72.0万千瓦；94.4万千瓦（944兆瓦）是马来西亚沐若水电站的装机；2022年6月29日商运无误（来源：《2022年度报告》《2013年社会责任报告》）。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764181","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据2022年可持续发展报告，集团于2022年专设社会责任办公室作为总部职能部门，是首家在总部机构专设社会责任职能部门的地方国有企业。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于企业属性：为首家在总部机构专设社会责任职能部门的中央企业，而非地方国有企业（来源：《2022年可持续发展报告》）。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764180","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据2026年度财务工作会相关材料，截至2025年11月集团可控装机容量超1.6亿千瓦，其中清洁能源装机容量占比超98%。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于清洁能源装机占比：截至2025年11月清洁能源装机占比超96%，而非超98%；可控装机超1.6亿千瓦无误（来源：《集团公司2026年度财务工作会重点推文汇总》）。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764174","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2013年与2014年度报告表述的“三峡精神”为“科学民主、求实创新、为国担当、廉洁奉献、团结协作、追求卓越”六句。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于精神内容混入了后期表述：2013、2014年报“三峡精神”为“科学民主、求实创新、团结协作、勇于担当、追求卓越”五句，“为国担当”“廉洁奉献”是2016年报才新增的（来源：《2013年度报告》《2016年度报告》）。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287868764172","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《2015年度报告》核心理念，集团2015年的愿景表述为“建设世界一流清洁能源集团”。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于措辞：2015年报核心理念栏“愿景”为“建设国际一流的清洁能源集团”，而非“世界一流”；“世界一流”系后续年度的升级表述，此处属语义强度/范围改变。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287487082507","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2020可持续发展报告中，三峡精神为：为我中华、志建三峡","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"2020可持续发展报告载明，三峡精神为：为我中华、志建三峡，表述正确。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287487082506","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"根据《中国三峡集团2023年可持续发展报告》，2023年中国三峡集团境外海上风电装机容量为86万千瓦，境外陆上风电装机容量为29万千瓦。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"报告\"深化国际交流合作\"披露，境外陆上风电装机容量为86万千瓦、境外海上风电装机容量为29万千瓦，本题将二者数据对调，构成与报告的直接矛盾，故为错。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287487082504","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2020年度报告，2016至2020年集团累计投入36亿元帮扶川滇两省少数民族脱贫，成功助力4个少数民族整族脱贫，惠及人口超37万人。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于惠及人口：2020年报载惠及人口超27万人，而非37万人；累计投入36亿元、4个少数民族整族脱贫无误。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287487082503","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2014年度报告，2014年新能源业务累计装机容量达400万千瓦，当年新增投产装机93.5万千瓦，利润总额20亿元。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于利润总额：2014年新能源业务利润总额为10亿元，而非20亿元；累计400万千瓦、新增93.5万千瓦无误。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287487082502","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2018年度报告，2018年集团国内新能源投产装机容量突破1000万千瓦，全年发电量243.4亿千瓦时。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于发电量：2018年国内新能源发电171.2亿千瓦时；243.4亿千瓦时是2020年的发电量；2018年投产装机突破1000万千瓦无误（来源：《2018年度报告》《2020年度报告》）。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287487082501","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据2023年度报告，向家坝水电站总装机640万千瓦，是世界第四大水电站。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于排名：向家坝在2023年报中称“世界第十一大水电站”；装机640万千瓦无误。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287487082499","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据2023年度报告，2023年集团境外业务全年利润总额92.7亿元，境外累计发电量428.7亿千瓦时，其中90%为清洁能源。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于清洁能源占比：2023年境外累计发电量100%为清洁能源，而非90%；利润总额92.7亿元、发电量428.7亿千瓦时无误。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287482888223","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"2022年度报告中集团使命表述为“在保护中发展、在发展中保护，更好造福人民”，价值观为“奋进两翼齐飞、创建世界一流”。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于价值观与愿景错位：2022年报中“奋进两翼齐飞、创建世界一流”是愿景而非价值观，价值观应为“创新引领发展、零碳共赢未来”；使命表述无误。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287482888222","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据2020年责任三峡秘鲁国别社会责任报告，秘鲁查格亚水电站是秘鲁第三大水电站，距利马415公里，电站总装机容量45.6万千瓦。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"本题正确。秘鲁国别报告载明，查格亚为秘鲁第三大水电站、距利马415公里、装机45.6万千瓦；与原文一致。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287482888218","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2022年度报告，库布其沙漠鄂尔多斯中北部新能源基地是我国首个开工建设的千万千瓦级新能源大基地项目，总装机规模1600万千瓦，规划总投资超1000亿元。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于投资额：规划总投资超800亿元，而非超1000亿元；首个千万千瓦级、总装机1600万千瓦均无误。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287482888217","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据2023年度报告，集团累计获取抽水蓄能资源71个、总装机9416万千瓦，已建、在建、核准装机容量达1930万千瓦。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于装机口径混淆：已建、在建、核准装机容量达3000万千瓦，1930万千瓦是累计开工在建13个项目的装机；获取资源71个、9416万千瓦无误（来源：《2023年度报告》）。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287482888213","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2014社会责任报告显示，2014年三峡大坝旅游景点自9月25日起对包括港澳台同胞、海外侨胞在内的全部游客一律免费开放。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"报告公益篇明确：自2014年9月25日起三峡大坝旅游景点仅对中国游客（含港、澳、台同胞、海外侨胞）施行门票免费，并非对“全部游客一律免费”；报告还专门解释“为何只有中国游客免费”，故该表述错误","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287482888211","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"据2017年度报告五年财务数据，2016年税后净利润为288.2亿元，较2015年有所上升。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于数值与趋势：2016年税后净利润为239.2亿元，较2015年的288.2亿元是下降而非上升。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287482888209","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2018年度报告，中国长江三峡工程开发总公司成立于1993年9月27日，2009年9月27日更名为中国长江三峡集团公司，2017年12月28日完成公司改制并更名为中国长江三峡集团有限公司。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"本题正确。2018年报载明，1993年9月27日成立、2009年9月27日更名、2017年12月28日完成公司制改制；各时点与原文一致。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287482888207","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2022年可持续发展报告，习近平总书记亲自擘画的“六大作用”战略发展定位，于2018年4月以财政部、国务院国资委联合文件形式正式印发。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于印发机关：联合印发机关为国家发展改革委、国务院国资委，而非财政部。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287482888204","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"依据2022年度报告，2022年末集团资产总额达1.27万亿元，资产负债率为51.9%。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"本题错误。错误点在于资产负债率：2022年末资产负债率为53.5%。","wrong":1.0,"cat":"财务管理"},{"id":"2069069287474499588","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在识别履约义务时，如果企业向客户转让该商品的承诺与合同中其他承诺可单独区分，即应作为可明确区分履约义务进行处理。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"企业向客户承诺的商品同时满足下列条件的，应当作为可明确区分商品：（1）客户能够从该商品本身或者从该商品与其他易于获得的资源一起使用中受益。（2）企业向客户转让该商品的承诺与合同中其他承诺可单独区分。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287470305303","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"在各类预算中，综合性最强的是预计利润表。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"在各类预算中，综合性最强的是预计资产负债表。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287411585027","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"会计工作岗位，可以一人一岗、一人多岗或者一岗多人。（  ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"《会计基础工作规范》第十二条 会计工作岗位 ，可以一人一岗 、一人多岗或者一岗多人。但出纳人员不得兼管稽核 、会计档案保管和收入 、费用 、债权债务帐目的登记工作。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287407390748","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"单位接受外部监督检查机构依法依规查询和调阅会计资料时，不得仅以电子形式提供。（   ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《会计信息化工作规范》第三十六条   单位接受外部监督检查机构依法依规查询和调阅会计资料时 ，对符合国家有关电子会计档案管理规定要求的电子会计资料 ，可仅以电子形式提供。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287407390747","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"省、自治区、直辖市人民政府财政部门负责指导和监督本行政区域内会计软件服务商提供会计软件和相关服务。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"A","exp":"《会计信息化工作规范》第五条 县级以上地方各级人民政府财政部门负责管理本行政区域内会计信息化工作 ，指导和监督本行政区域内单位开展会计信息化工作。省 、 自治区 、直辖市人民政府财政部门负责指导和监督本行政区域内会计软件服务商提供会计软件和相关服务。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287407390743","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"一般会计人员交接，由单位会计机构负责人、单位领导人负责监交。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《会计基础工作规范》第二十八条 会计人员办理交接手续 ，必须有监交人负责监交。一般会计人员交接 ， 由单位会计机构负责人 、会计主管人员负责监交 ；会计机构负责人 、会计主管人员交接 ， 由单位领导人负责监交 ，必要时可由上级主管部门派人会同监交。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287407390742","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"会计机构负责人（会计主管人员）应当具备会计师以上专业技术职务资格且从事会计工作3年以上经历。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《会计基础工作规范》第七条 会计机构负责人 、会计主管人员应当具备下列基本条件：（一） 坚持原则 ，廉洁奉公；（二） 具备会计师以上专业技术职务资格或者从事会计工作不少于三年；（三） 熟悉国家财经法律 、法规 、规章和方针 、政策 ，掌握本行业业务管理的有关知识；（四） 有较强的组织能力；（五） 身体状况能够适应本职工作的要求。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287407390741","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"会计人员应当保守本单位的商业秘密，任何情况下无权向外界提供或者泄露单位的会计信息。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《会计基础工作规范》第二十三条 会计人员应当保守本单位的商业秘密。除法律规定和单位领导人同意外 ，不能私自向外界提供或者泄露单位的会计信息。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287407390739","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"内部监督分为日常监督和专项监督。专项监督是指企业对建立与实施内部控制的情况进行常规、持续的监督检查。（ ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《企业内部控制基本规范》第四十四条专项监督是指在企业发展战略、组织结构、经营活动、业务流程、关键岗位员工等发生较大调整或变化的情况下，对内部控制的某一或者某些方面进行有针对性的监督检查。","wrong":1.0,"cat":"审计"},{"id":"2069069287403196442","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"《民法典》是会计人员职业道德规范的制定依据。（   ）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"现行《会计人员职业道德规范》，主要制定依据为《中华人民共和国会计法》，同时结合会计行业从业要求、监管规则制定，并非以《民法典》为核心制定依据。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287386419225","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"某镇党员领导干部擅自向下辖的三个村集体收取赞助款1.7万元，用于镇政府日常开支。该党员领导干部的行为违反工作纪律。（）","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《中国共产党纪律处分条例》 对应条款：第九章 对违反群众纪律行为的处分 第一百二十二条 有下列行为之一，对直接责任者和领导责任者，情节较轻的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分： （一）超标准、超范围向群众筹资筹劳、摊派费用，加重群众负担； （二）违反有关规定扣留、收缴群众款物或者处罚群众； （三）克扣群众财物，或者违反有关规定拖欠群众钱款； （四）在管理、服务活动中违反有关规定收取费用； （五）在办理涉及群众事务时刁难群众、吃拿卡要； （六）其他侵害群众利益行为。 在乡村振兴领域有上述行为的，从重或者加重处分。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287386419223","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"判断题","stem":"某党员领导干部多次以亲属名义购买、代持多份股票、基金，在填写干部个人有关事项报告表时故意隐瞒不报。该行为违反生活纪律。","opts":[{"k":"A","t":"正确"},{"k":"B","t":"错误"}],"ans":"B","exp":"《中国共产党纪律处分条例》 对应条款：第十一章 对违反生活纪律行为的处分  第一百五十条 生活奢靡、铺张浪费、贪图享乐、追求低级趣味，造成不良影响的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务处分。  第一百五十一条 与他人发生不正当性关系，造成不良影响的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。  利用职权、教养关系、从属关系或者其他相类似关系与他人发生性关系的，从重处分。  第一百五十二条 党员领导干部不重视家风建设，对配偶、子女及其配偶失管失教，造成不良影响或者严重后果的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务处分。  第一百五十三条 违背社会公序良俗，在公共场所、网络空间有不当言行，造成不良影响的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。  第一百五十四条 有其他严重违反社会公德、家庭美德行为的，应当视具体情节给予警告直至开除党籍处分。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2069069287927484439","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中央企业违规经营投资责任追究实施办法》，责任追究工作中，发现企业经营管理有关人员涉嫌职务违法犯罪的，可移送处理的机构包括（）","opts":[{"k":"A","t":"纪检监察机构"},{"k":"B","t":"司法机关"},{"k":"C","t":"行业主管部门"},{"k":"D","t":"财政部门"}],"ans":"A,B","exp":"根据《中央企业违规经营投资责任追究实施办法》，责任追究工作中，发现企业经营管理有关人员涉嫌职务违法犯罪的，应当移送纪检监察机构、司法机关依法处理。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287927484434","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《长江流域控制性水工程联合调度管理办法（试行）》，关于控制性水工程防洪调度的分级管理权限，下列表述正确的有？","opts":[{"k":"A","t":"三峡水库的防洪调度由水利部、长江水利委员会按照相关调度规程实施"},{"k":"B","t":"水库防洪影响范围和承担的防洪任务不跨省级行政区域的，由所在省级人民政府水行政主管部门按照调度管理权限负责组织调度"},{"k":"C","t":"所有水库的防洪调度都必须由长江水利委员会负责"},{"k":"D","t":"汛期水库水位不高于防洪限制水位、不需要实施防洪调度的，由水库运行管理单位负责调度"}],"ans":"A,B,D","exp":"水库的防洪调度按照以下分级管理权限实施：（一）三峡水库、丹江口水库由水利部、长江水利委员会按照相关调度规程实施调度（四）水库防洪影响范围和承担的防洪任务不跨省级行政区域的，由所在省级人民政府水行政主管部门按照调度管理权限负责组织调度并报长江水利委员会备案汛期水库水位不高于防洪限制水位、不需要实施防洪调度的，由水库运行管理单位负责调度。——《长江流域控制性水工程联合调度管理办法（试行）》","wrong":1.0,"cat":"综合实务"},{"id":"2069069287927484422","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列属于中央企业发展规划可进行调整的情形有（）","opts":[{"k":"A","t":"落实党中央、国务院重大决策部署"},{"k":"B","t":"企业主责主业调整"},{"k":"C","t":"企业发生重组、整合等重大事项"},{"k":"D","t":"企业发展内外部环境发生重大变化"}],"ans":"A,B,C,D","exp":"《中央企业发展规划管理办法》，发展规划调整的情形包括：（一）落实党中央、国务院重大决策部署；（二）企业主责主业调整；（三）企业发生重组、整合等重大事项；（四）企业培育和发展新质生产力需要；（五）企业发展内外部环境形势发生重大变化，影响发展规划执行；（六）其他应当调整的情形。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287923290120","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某中央企业选聘重大资产评估项目评估机构，根据《国务院国有资产监督管理委员会关于优化中央企业资产评估管理有关事项的通知》，属于选聘评价要素的有（）。","opts":[{"k":"A","t":"项目团队行业执业经验"},{"k":"B","t":"评估工作方案合理性"},{"k":"C","t":"费用报价水平"},{"k":"D","t":"企业成立年限"}],"ans":"A,B,C","exp":"《国务院国有资产监督管理委员会关于优化中央企业资产评估管理有关事项的通知》：选聘评估机构应当制定选聘文件，明确项目信息、评价要素、评分标准等内容。评价要素至少包括项目团队人员组成及其评估标的相关行业的执业经验、评估工作方案、资源配备、质量控制、费用报价等。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287919095833","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某新建中型水库开展大坝安全监测设计，符合《水库大坝安全监测管理办法》规定的有（）","opts":[{"k":"A","t":"监测设施与主体工程同时设计、同时施工、同时投入使用"},{"k":"B","t":"按SL 725、SL/T 551规范确定监测项目"},{"k":"C","t":"工程关键部位测点宜冗余设置"},{"k":"D","t":"优先选用自主可控、高稳定性监测设备"}],"ans":"A,B,C,D","exp":"《水库大坝安全监测管理办法》第三条：新建、改扩建或除险加固水库，其大坝安全监测设施应与主体工程同时设计、同时施工、同时投入生产和使用。第十条：新建大中型水库按SL 725、SL/T 551等规范确定监测项目及测点布置，工程关键项目或部位测点宜冗余设置。第十一条：监测仪器设备优先采用耐久性好、性能稳定、精度高、自动化程度高、低功耗、易维护、易更换升级、自主可控的设备。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287919095828","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某水电站大坝新建工程，发电机组拟转入商业运营。根据《水电站大坝运行安全监督管理规定》，电力企业应当在大坝蓄水验收和枢纽工程专项验收前完成哪些工作？","opts":[{"k":"A","t":"蓄水安全鉴定"},{"k":"B","t":"竣工安全鉴定"},{"k":"C","t":"大坝安全在线监控系统建设"},{"k":"D","t":"大坝安全注册登记"}],"ans":"A,B","exp":"“大坝蓄水验收和枢纽工程专项验收前应当分别经过蓄水安全鉴定和竣工安全鉴定。”","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287919095826","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某水电站大坝经检查发现以下情况：①正常运用情况下防洪能力略有不足，但风险较低；②坝基缺陷持续恶化已危及大坝安全；③近坝库岸有失稳征兆，失稳后影响工程正常运用；④大坝存在事故征兆。根据《水电站大坝运行安全监督管理规定》，上述情形中应评定为病坝的有？","opts":[{"k":"A","t":"①"},{"k":"B","t":"②"},{"k":"C","t":"③"},{"k":"D","t":"④"}],"ans":"A,C","exp":"《水电站大坝运行安全监督管理规定》 “具有下列情形之一的大坝，评定为病坝：（一）正常运用情况下的防洪能力略有不足，但风险较低；或者非常运用情况下的防洪能力不足，风险较高（五）近坝库岸和工程边坡有失稳征兆，失稳后影响工程正常运用。” “具有下列情形之一的大坝，评定为险坝：（二）坝基存在的缺陷持续恶化，已危及大坝安全；（四）大坝存在事故征兆。”","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287919095823","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某水电站大坝安全设施未与主体工程同时设计、同时施工、同时投入运行，派出机构责令停止建设并限期改正，但逾期未改正。根据《水电站大坝运行安全监督管理规定》，派出机构可对该电力企业采取哪些处罚？","opts":[{"k":"A","t":"列入安全生产不良信用记录和安全生产诚信“黑名单”"},{"k":"B","t":"处以50万元以上100万元以下的罚款"},{"k":"C","t":"对其直接负责的主管人员处以2万元以上5万元以下的罚款"},{"k":"D","t":"对其直接负责的主管人员给予行政处分"}],"ans":"A,B,C","exp":"“电力企业有下列情形之一的，依据《安全生产法》，由派出机构责令停止建设或者停产停业整顿，限期改正；逾期未改正的，将其列入安全生产不良信用记录和安全生产诚信“黑名单”，处以50万元以上100万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处以2万元以上5万元以下的罚款：（一）大坝安全设施未与主体工程同时设计、同时施工、同时投入运行的；（二）未按照规定组织蓄水安全鉴定和竣工安全鉴定的；（三）未按照规定开展大坝安全定期检查的；（四）擅自改变、调整水电站原批准功能的，擅自进行工程改造或者扩建的，擅自降低工程等别或者实施大坝退役的。”","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287919095818","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某省级能源主管部门为健全完善安全管理体系，按照《能源电力系统安全生产治本攻坚三年行动方案（2024-2026年）》落实相关要求。下列措施中正确的有（ ）","opts":[{"k":"A","t":"因地制宜建立能源电力安全生产风险评估会商机制，衔接国土空间规划"},{"k":"B","t":"在炼油项目核准中严把安全关，对安全生产提出相关要求"},{"k":"C","t":"2024年推进《电力建设工程安全生产标准化实施规范》等行业标准实施"},{"k":"D","t":"2025年底前出台《以可靠性为中心的电力设备检修导则》等规范"}],"ans":"A,B,C","exp":"解析：原文“地方能源主管部门因地制宜建立完善各类发展规划的能源电力安全生产风险评估会商机制，有效衔接国土空间规划和全国自然灾害综合风险普查成果等”——《方案》“二、主要任务”第（七）条第21款。原文“针对炼油、煤制燃料和燃料乙醇等产业，按照《企业投资项目核准和备案管理条例》等法律法规和政策规定在有关项目核准中严把安全关，对安全生产提出相关要求。”——《方案》“二、主要任务”第（七）条第21款。原文“2024 年推进新颁布的《电力建设工程安全生产标准化实施规范》《电力建设施工企业安全生产标准化实施规范》《电力勘测设计企业安全生产标准化实施规范》等行业标准实施。”——《方案》“二、主要任务”第（七）条第23款。原文“2026年底前出台《以可靠性为中心的电力设备检修导则 第1部分：通用》等设备安全管理和可靠性管理标准规范”——《方案》“二、主要任务”第（七）条第23款。选项D“2025年底前”与“2026年底前”不符。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287919095816","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某省风电项目A于2025年5月20日首次并网投产，风电项目B于2025年7月10日首次并网投产。2025年8月，两项目均申报参与新能源可持续发展价格结算机制。根据《关于深化新能源上网电价市场化改革，促进新能源高质量发展的通知》，下列判断正确的有（ ）","opts":[{"k":"A","t":"项目A属于存量项目，其机制电价按现行价格政策执行，不高于当地煤电基准价"},{"k":"B","t":"项目B属于增量项目，其机制电价须通过省级组织的竞价形成，按入选项目最高报价确定"},{"k":"C","t":"项目A执行期限内每年可自主确定执行机制的电量比例，但不得高于上一年"},{"k":"D","t":"项目B申请纳入机制的电量，可适当低于其全部发电量"}],"ans":"A,B,C,D","exp":"《关于深化新能源上网电价市场化改革，促进新能源高质量发展的通知》：\"2025年6月1日以前投产的新能源存量项目：（1）电量规模，由各地妥善衔接现行具有保障性质的相关电量规模政策。新能源项目在规模范围内每年自主确定执行机制的电量比例、但不得高于上一年。（2）机制电价，按现行价格政策执行，不高于当地煤电基准价。\"\n\"2025年6月1日起投产的新能源增量项目：（1）每年新增纳入机制的电量规模，由各地根据国家下达的年度非水电可再生能源电力消纳责任权重完成情况，以及用户承受能力等因素确定。超出消纳责任权重的，次年纳入机制的电量规模可适当减少；未完成的，次年纳入机制的电量规模可适当增加。通知实施后第一年新增纳入机制的电量占当地增量项目新能源上网电量的比例，要与现有新能源价格非市场化比例适当衔接、避免过度波动。单个项目申请纳入机制的电量，可适当低于其全部发电量。（2）机制电价，由各地每年组织已投产和未来12个月内投产、且未纳入过机制执行范围的项目自愿参与竞价形成，初期对成本差异大的可按技术类型分类组织。竞价时按报价从低到高确定入选项目，机制电价原则上按入选项目最高报价确定、但不得高于竞价上限。竞价上限由省级价格主管部门考虑合理成本收益、绿色价值、电力市场供需形势、用户承受能力等因素确定，初期可考虑成本因素、避免无序竞争等设定竞价下限。”","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287914901524","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某风电企业拥有多台不同投产时间和塔筒类型的风电机组。按照《能源电力系统安全生产治本攻坚三年行动方案（2024-2026年）》，下列哪些设备应当被重点加强安全风险评估和隐患排查治理？（ ）","opts":[{"k":"A","t":"超期服役的风电机组"},{"k":"B","t":"服役年限为14年的风电机组"},{"k":"C","t":"高度为120米的钢管塔筒设备"},{"k":"D","t":"2018年投产且享受中央财政补贴的设备"}],"ans":"A,C","exp":"解析：原文“重点针对超期服役或服役年限超过15年设备、100米以上的钢管塔筒设备、2019年以后至中央财政补贴取消前投产设备，加强安全风险评估和隐患排查治理”——《方案》“二、主要任务”。选项A“超期服役”符合；选项B“14年”未超过15年，不符合；选项C“120米钢管塔筒”符合“100米以上”；选项D“2018年投产”不在“2019年以后”范围内，不符合。","wrong":2.0,"cat":"趋势政策与行业动态"},{"id":"2069069287914901520","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某电力集团为提升安全生产科技支撑能力，依据《能源电力系统安全生产治本攻坚三年行动方案（2024-2026年）》制定计划。下列计划内容中符合方案要求的有（ ）。","opts":[{"k":"A","t":"大力推进“机械化换人、自动化减人”，提升电力建设施工自动化、智能化水平"},{"k":"B","t":"2025年底前完成流域水电安全和应急平台各项功能建设"},{"k":"C","t":"2026年底前实现安全生产风险智能化管控能力显著增强"},{"k":"D","t":"2024年底前全面替代所有危险化学品，停止使用液氨"}],"ans":"A,B,C","exp":"解析：原文“大力推进‘机械化换人、自动化减人’，提升电力建设施工、高风险电力生产运行、煤矿等领域安全生产自动化、智能化水平”——《方案》“二、主要任务”第（五）条第16款。原文“有序推进流域水电安全和应急平台建设，2025年底前各项功能进一步完善”——《方案》“二、主要任务”第（五）条第16款。原文“2026年底安全生产风险智能化管控能力显著增强”——《方案》“二、主要任务”第（五）条第16款。原文“加快推进尿素替代液氨改造工程”仅针对脱硝用液氨重大危险源，并非所有危险化学品，选项D以偏概全。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287914901519","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"某电力集团党委在学习贯彻《2025年电力安全监管重点任务》时，对照“牢固树立安全发展理念”板块查找工作差距。下列做法中，符合该板块具体任务要求的有（ ）。","opts":[{"k":"A","t":"将习近平总书记关于安全生产重要指示批示精神纳入干部员工教育培训计划"},{"k":"B","t":"推动本地区成立能源（电力）安全生产专委会，压实省级责任"},{"k":"C","t":"编制本集团“十五五”电力安全生产行动计划，并与上级规划衔接"},{"k":"D","t":"开展直达现场的电力建设施工安全培训，提升一线员工安全意识"}],"ans":"A,C,D","exp":"《2025年电力安全监管重点任务》“三、重点任务（一）牢固树立安全发展理念”第1点：“纳入各级党委（党组）学习计划和干部员工教育培训计划”；“推动更多地区成立能源（电力）安全生产专委会，压紧压实市、县责任”——压实的是市、县责任，非省级责任，故B项不符合；第2点：“编制《电力安全生产“十五五”行动计划》，做好与‘十五五’能源电力规划的衔接”；第4点：“开展直达现场的电力建设施工安全培训，提升一线员工安全意识和能力”。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287910707224","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"国资委在对某中央企业实施中的境外重大投资项目进行随机监督检查时，根据《中央企业境外投资监督管理办法》规定，检查的重点应当包括下列哪些方面？","opts":[{"k":"A","t":"项目决策情况"},{"k":"B","t":"项目执行情况"},{"k":"C","t":"项目效果情况"},{"k":"D","t":"项目后评价报告的编制情况"}],"ans":"A,B,C","exp":"《中央企业境外投资监督管理办法》：国资委对中央企业实施中的境外重大投资项目进行随机监督检查，重点检查企业境外重大投资项目决策、执行和效果等情况，对发现的问题向企业进行提示。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287910707208","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中华人民共和国企业国有资产法》， 国家出资企业从事经营活动，应当遵守法律、行政法规，加强经营管理，提高经济效益，接受人民政府及其有关部门、机构依法实施的管理和监督，接受社会公众的监督，承担（ ），对（ ）负责。","opts":[{"k":"A","t":"社会责任"},{"k":"B","t":"出资人"},{"k":"C","t":"环保责任"},{"k":"D","t":"政府"}],"ans":"A,B","exp":"《中华人民共和国企业国有资产法》规定：“国家出资企业从事经营活动，应当遵守法律、行政法规，加强经营管理，提高经济效益，接受人民政府及其有关部门、机构依法实施的管理和监督，接受社会公众的监督，承担社会责任，对出资人负责。”","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287910707207","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《企业可持续披露准则第1号——气候（试行）》， 管理层在气候相关治理中应当披露的作用与程序包括（）","opts":[{"k":"A","t":"特定岗位或部门的气候管理职责"},{"k":"B","t":"支持气候监督的控制措施与程序"},{"k":"C","t":"气候管控职能与内部其他职能的整合方式"},{"k":"D","t":"企业具体业务运营流程"}],"ans":"A,B,C","exp":"《企业可持续披露准则第1号——气候（试行）》：企业应当披露管理层在管理和监督气候相关风险和机遇时所采用的治理架构、控制措施和程序中的作用，包括 环保绩效A级水平的行业包括以下哪些？","opts":[{"k":"A","t":"钢铁冶炼项目"},{"k":"B","t":"石化化工项目"},{"k":"C","t":"电解铝项目"},{"k":"D","t":"平板玻璃项目"}],"ans":"A,B,C,D","exp":"《2024-2025年节能降碳行动方案》：“（三）钢铁行业节能降碳行动”：“1.新建和改扩建钢铁冶炼项目须达到能效标杆水平和环保绩效A级水平。”；“（四）石化化工行业节能降碳行动”：“1.新建和改扩建石化化工项目须达到能效标杆水平和环保绩效A级水平，”；“（五）有色金属行业节能降碳行动”：“2.严格新增有色金属项目准入。新建和改扩建电解铝项目须达到能效标杆水平和环保绩效A级水平，”；“（六）建材行业节能降碳行动”：“2.严格新增建材项目准入。新建和改扩建水泥、陶瓷、平板玻璃项目须达到能效标杆水平和环保绩效A级水平。”","wrong":1.0,"cat":"综合实务"},{"id":"2069069287868764168","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《2015年度报告》科技创新模块，关于2015年集团科技创新成果，下列表述正确的有（ ）。","opts":[{"k":"A","t":"世界工程组织联合会（WFEO）授予陆佑楣院士工程成就奖"},{"k":"B","t":"江苏响水近海风电项目成为我国首个建成投运的近海风电项目"},{"k":"C","t":"集团博士后科研工作站在全国综合评估中位居第一"},{"k":"D","t":"2015年度授权专利近350项"}],"ans":"A,B,D","exp":"A项正确：2015年12月WFEO授予陆佑楣院士工程成就奖，其为该奖设立27年来中国大陆首位获奖工程师；B项正确：江苏响水20万千瓦近海风电首批8台机组建成投运，为我国首个建成投运的近海风电项目；D项正确：2015年度授权专利近350项；C项错误：博士后工作站在全国2079个工作站综合评估中位居第22位，而非第一，属数值篡改。","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764167","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"金沙江下游布局有四座巨型梯级水电站。下列属于该“金沙江下游四座巨型梯级电站”的有（）","opts":[{"k":"A","t":"葛洲坝"},{"k":"B","t":"二滩"},{"k":"C","t":"向家坝"},{"k":"D","t":"白鹤滩"}],"ans":"C,D","exp":"A项错误：葛洲坝位于长江干流，非金沙江下游梯级，错配；B项错误：二滩水电站不属金沙江下游四座巨型梯级电站（应为向家坝、溪洛渡、白鹤滩、乌东德），电站错配；C项正确：金沙江下游四座梯级电站含向家坝（《2013年度报告》）；D项正确：含白鹤滩","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287868764165","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"关于长江电力2020年发行全球存托凭证（GDR），下列说法正确的有（）","opts":[{"k":"A","t":"2020年9月成功发行“沪伦通”全球存托凭证"},{"k":"B","t":"首次在伦敦证券交易所境外上市"},{"k":"C","t":"在纽约证券交易所境外上市"},{"k":"D","t":"募集资金约19.63亿美元，是国内首家实业企业GDR发行"}],"ans":"A,B,D","exp":"A项正确：2020年9月发行“沪伦通”GDR（《2020年度报告》）；B项正确：首次在伦敦证券交易所境外上市；C项错误：上市地为伦敦证券交易所，非纽约证券交易所，地点错配；D项正确：募集约19.63亿美元，国内首家实业企业GDR发行","wrong":1.0,"cat":"金融与投资理财"},{"id":"2069069287868764164","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《2014社会责任报告》，下列关于2014年中国三峡集团科技创新的表述，正确的有哪些？（）","opts":[{"k":"A","t":"科研投入金额15.5亿元"},{"k":"B","t":"获得专利230项，其中发明专利34项"},{"k":"C","t":"研发人员数量占总员工的25%"},{"k":"D","t":"全年共申报（申请）专利125项"}],"ans":"A,B","exp":"A项正确：报告建设篇及绩效表显示2014年科研投入金额15.5亿元；B项正确：获得专利230项，其中发明专利34项；C项错误：报告明确研发人员数量占总员工的2.5%，并非25%；D项错误：2014年共申报（申请）专利289项，125项是2012年的申请专利数","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287868764163","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2016年年度报告将“三峡精神”由五句扩展为六句，新增了两组四字内容。下列属于2016年新增进“三峡精神”的有（）","opts":[{"k":"A","t":"求实创新"},{"k":"B","t":"勇于担当"},{"k":"C","t":"为国担当"},{"k":"D","t":"廉洁奉献"}],"ans":"C,D","exp":"A项错误：“求实创新”在2013/2014版即已存在，非新增；B项错误：2016版已将原“勇于担当”改为“为国担当”，“勇于担当”不再属于2016版三峡精神；C项正确：2016年报三峡精神扩展为“科学民主 求实创新 为国担当 廉洁奉献 团结协作 追求卓越”，相对2013/2014版新增“为国担当”；D项正确：同时新增“廉洁奉献”","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287864569885","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据2017年年度报告五年财务数据表，下列关于税后净利润（亿元）的表述正确的有（）","opts":[{"k":"A","t":"2015年税后净利润239.2亿元"},{"k":"B","t":"2013年税后净利润176.3亿元"},{"k":"C","t":"2017年税后净利润343.0亿元"},{"k":"D","t":"2016年税后净利润较2015年下降"}],"ans":"B,C,D","exp":"A项错误：239.2是2016年数据，2015年应为288.2亿元，年份错配；B项正确：2013年税后净利润176.3亿元（《2017年度报告》五年表）；C项正确：2017年为343.0亿元；D项正确：2016年239.2亿元低于2015年288.2亿元，确为下降","wrong":1.0,"cat":"综合实务"},{"id":"2069069287864569884","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2016年年度报告提出完成“三大转变”。下列属于2016年“三大转变”内容的有（）","opts":[{"k":"A","t":"由建设重大工程向真正的市场主体转变"},{"k":"B","t":"由建设伟大工程向建设伟大企业转变"},{"k":"C","t":"由国内一流向世界一流企业转变"},{"k":"D","t":"由单一的水电企业向世界领先的清洁能源集团转变"}],"ans":"A,D","exp":"A项正确：2016年“三大转变”含“由建设重大工程向真正的市场主体转变”；B项错误：“由建设伟大工程向建设伟大企业转变”是2017年“五大转变”新增项，不属2016年三大转变；C项错误：2016年“三大转变”无此项（三项转变为：由建设重大工程向真正的市场主体转变、由单一的水电企业向世界领先的清洁能源集团转变、由主要面向国内向面向国内国际的跨国公司转变），系生造；D项正确：含“由单一的水电企业向世界领先的清洁能源集团转变”","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287864569883","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2013年社会责任报告载有“环保宣言”，由四句构成。下列属于该环保宣言内容的有（）","opts":[{"k":"A","t":"共建美好家园"},{"k":"B","t":"奉献清洁能源"},{"k":"C","t":"引领低碳经济"},{"k":"D","t":"履行绿色责任"}],"ans":"B,C","exp": "}],"ans":"A,B","exp":"A项正确：长龙山抽蓄装机210万千瓦、6台35万千瓦机组（《2021年度报告》）；故C项错误； B项正确：额定水头710米，世界第二、中国第一；D项错误：“额定水头724米为世界最高”是浙江天台抽水蓄能电站的指标，非长龙山，电站错配","wrong":1.0,"cat":"综合实务"},{"id":"2069069287478693900","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"2017年年度报告提出“新时代三峡集团精神”，由五组四字短语构成。下列属于该“新时代三峡集团精神”内容的有（ ）。","opts":[{"k":"A","t":"科学民主、求实创新"},{"k":"B","t":"为国担当、为民造福"},{"k":"C","t":"尊重生命、敬畏自然"},{"k":"D","t":"民主决策、科学管理的求实精神"}],"ans":"B,C","exp":"A项错误：“科学民主、求实创新”属旧版（2013/2014/2016）“三峡精神”，不在2017年“新时代三峡集团精神”五组之列；B项正确：“新时代三峡集团精神”含“为国担当、为民造福”（《2017年度报告》）；C项正确：含“尊重生命、敬畏自然”；D项错误：该表述属2020年“新时代三峡精神”五种精神之一，非2017年“新时代三峡集团精神”五组短语，跨清单错配","wrong":1.0,"cat":"综合实务"},{"id":"2069069287474499586","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列有关售后回购处理，不正确的有（）。","opts":[{"k":"A","t":"企业因存在与客户的远期安排而负有回购义务或企业享有回购权利的，回购价格低于原售价的，应当视为融资交易"},{"k":"B","t":"采用售后回购方式销售商品的，如果不属于融资交易，则企业应在发出商品时确认销售收入"},{"k":"C","t":"企业因存在与客户的远期安排而负有回购义务或企业享有回购权利的，回购价格不低于原售价的，应当视为租赁交易"},{"k":"D","t":"企业负有应客户要求回购商品义务的，应当在合同开始日评估客户是否具有行使该要求权的重大经济动因"}],"ans":"A,B,C","exp":"《企业会计准则第１4号—收入》第五章第38条，选项AC，企业因存在与客户的远期安排而负有回购义务或企业享有回购权利的，回购价格低于原售价的，应当视为租赁交易；回购价格不低于原售价的，应当视为融资交易，在收到客户款项时确认金融负债；选项B，如果不属于融资交易，也可能是租赁交易，应分期确认相应的租赁收入，不能在发出商品时确认销售收入。","wrong":1.0,"cat":"金融与投资理财"},{"id":"2069069287470305300","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《管理会计指引及应用指南》 ，与零基预算法相比，增量预算法的缺点有（）。","opts":[{"k":"A","t":"编制工作量大"},{"k":"B","t":"无法有效控制无效费用的开支"},{"k":"C","t":"不必要开支合理化"},{"k":"D","t":"预算浪费"}],"ans":"B,C,D","exp":"《管理会计指引及应用指南》：增量预算编制方法的缺陷是可能导致无效费用开支无法得到有效控制，使得不必要开支合理化，造成预算上的浪费。","wrong":1.0,"cat":"管理会计"},{"id":"2069069287403196441","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"依据《 管理会计指引及应用指南》，关于编制预算的方法，下列对应关系正确的有（）。","opts":[{"k":"A","t":"固定预算法与弹性预算法"},{"k":"B","t":"定期预算法与滚动预算法"},{"k":"C","t":"静态预算法与滚动预算法"},{"k":"D","t":"增量预算法与零基预算法"}],"ans":"A,B,D","exp":"《管理会计指引及应用指南》：固定预算法和弹性预算法是对应的关系，增量预算法和零基预算法是对应的关系，定期预算法与滚动预算法是对应的关系。固定预算法又称静态预算法，所以选项C不具有对应关系。","wrong":1.0,"cat":"管理会计"},{"id":"2069069287403196439","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"原始凭证必须具备的内容有（  ）。","opts":[{"k":"A","t":"填制凭证的日期"},{"k":"B","t":"凭证编号"},{"k":"C","t":"会计科目"},{"k":"D","t":"经济业务内容"}],"ans":"A,D","exp":"《会计基础工作规范》第四十八条   原始凭证的基本要求是：\n（一） 原始凭证的内容必须具备：凭证的名称 ；填制凭证的日期 ；填制凭证单位名称或者填制人姓名 ；经办人员的签名或者盖章 ；接受凭证单位名称 ；经济业务内容 ；数量 、单价和金额。\n（二） 从外单位取得的原始凭证 ，必须盖有填制单位的公章 ；从个人取得的原始凭证 ，必须有填制人员的签名或者盖章。 自制原始凭证必须有经办单位领导人或者其指定的人员签名或者盖章。对外开出的原始凭证 ，必须加盖本单位公章。\n（三） 凡填有大写和小写金额的原始凭证 ，大写与小写金额必须相符。购买实物的原始凭证，必须有验收证明。支付款项的原始凭证 ，必须有收款单位和收款人的收款证明。\n（四） 一式几联的原始凭证 ，应当注明各联的用途 ，只能以一联作为报销凭证。\n一式几联的发票和收据 ，必须用双面复写纸（ 发票和收据本身具备复写纸功能的除外） 套写，并连续编号。作废时应当加盖 “作废 ” 戳记 ，连同存根一起保存 ，不得撕毁。\n（五） 发生销货退回的 ，除填制退货发票外 ，还必须有退货验收证明 ；退款时 ，必须取得对方的收款收据或者汇款银行的凭证 ，不得以退货发票代替收据。\n（六） 职工公出借款凭据 ，必须附在记账凭证之后。收回借款时 ，应当另开收据或者退还借据副本 ，不得退还原借款收据。\n（七） 经上级有关部门批准的经济业务 ，应当将批准文件作为原始凭证附件。如果批准文件需要单独归档的 ，应当在凭证上注明批准机关名称 、 日期和文件字号。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287403196437","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《会计人员基础工作规范》，会计人员因工作调动办理工作交接手续前，必须及时做好的工作有（  ）。","opts":[{"k":"A","t":"编制移交清册"},{"k":"B","t":"已经受理的经济业务尚未填制会计凭证的，应当备注说明"},{"k":"C","t":"整理应该移交的各项资料，对未了事项进行口头说明"},{"k":"D","t":"尚未登记的帐目，应当登记完毕，并在最后一笔余额后加盖经办人员印章"}],"ans":"A,D","exp":"《会计基础工作规范》第二十七条   会计人员办理移交手续前 ，必须及时做好以下工作：\n（一） 已经受理的经济业务尚未填制会计凭证的 ，应当填制完毕。\n（二） 尚未登记的帐目 ，应当登记完毕 ，并在最后一笔余额后加盖经办人员印章。\n（三） 整理应该移交的各项资料 ，对未了事项写出书面材料。\n（四） 编制移交清册 ，列明应当移交的会计凭证 、会计帐簿 、会计报表 、印章 、现金 、有价证券 、支票簿 、发票 、文件 、其他会计资料和物品等内容 ；实行会计电算化的单位 ，从事该项工作的移交人员还应当在移交清册中列明会计软件及密码 、会计软件数据磁盘（磁带等） 及有关资料 、实物等内容。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287403196436","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列选项中有关会计机构设置和会计人员配备的说法正确的有（  ）。","opts":[{"k":"A","t":"总会计师由具有会计师以上专业技术资格的人员担任"},{"k":"B","t":"会计人员的工作岗位应当有计划地进行轮换"},{"k":"C","t":"对忠于职守，坚持原则，做出显著成绩的会计机构、会计人员，应当给予精神的和物质的奖励"},{"k":"D","t":"出纳人员不得兼管稽核、会计档案保管和收入、费用、债权债务帐目的登记工作"}],"ans":"A,B,C,D","exp":"《会计基础工作规范》第九条   大 、中型企业 、事业单位 、业务主管部门应当根据法律和国家有关规定设置总会计师。总会计师由具有会计师以上专业技术资格的人员担任。\n总会计师行使 《总会计师条例》 规定的职责 、权限。\n总会计师的任命（聘任）、免职（解聘） 依照 《总会计师条例》 和有关法律的规定办理。\n第十二条  会计工作岗位 ，可以一人一岗 、一人多岗或者一岗多人。但出纳人员不得兼管稽核 、会计档案保管和收入 、费用 、债权债务帐目的登记工作。\n第十三条  会计人员的工作岗位应当有计划地进行轮换。\n第十五条  各单位领导人应当支持会计机构 、会计人员依法行使职权 ；对忠于职守 ，坚持原则 ，做出显著成绩的会计机构 、会计人员 ，应当给予精神的和物质的奖励。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287403196435","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"会计机构负责人、会计主管人员应当具备的基本条件有（   ）。","opts":[{"k":"A","t":"坚持原则，廉洁奉公"},{"k":"B","t":"熟悉国家财经法律、法规、规章和方针、政策，掌握本行业业务管理的有关知识"},{"k":"C","t":"有较强的组织能力"},{"k":"D","t":"身体状况能够适应本职工作的要求"}],"ans":"A,B,C,D","exp":"《会计基础工作规范》第七条   会计机构负责人 、会计主管人员应当具备下列基本条件：\n（一） 坚持原则 ，廉洁奉公；\n（二） 具备会计师以上专业技术职务资格或者从事会计工作不少于三年；\n（三） 熟悉国家财经法律 、法规 、规章和方针 、政策 ，掌握本行业业务管理的有关知识；\n（四） 有较强的组织能力；\n（五） 身体状况能够适应本职工作的要求。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287403196434","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"会计软件的自动审核规则应当（   ）。","opts":[{"k":"A","t":"可修改"},{"k":"B","t":"可查询"},{"k":"C","t":"可校验"},{"k":"D","t":"可追溯"}],"ans":"B,C,D","exp":"《会计软件基本功能和服务规范》第二十一条   会计软件应当提供填制和生成记账凭证的功能。\n（一） 会计软件应当支持审签程序自动化 ，能够根据预置的审核规则实现电子会计凭证数据、业务数据和资金支付数据等相关数据的自动关联和相互校验。校验无误的电子原始凭证可自动填制电子记账凭证 ，并进行会计入账。\n会计软件的自动审核规则应当可查询 、可校验 、可追溯。会计软件应当支持用户针对特定审签程序的系统自动化处理进行授权操作。\n（二） 会计软件应当按照国家统一的会计制度进行会计核算 ，具备经办 、审核 、审批等必要的审签程序并防止电子会计凭证重复入账。\n（三） 会计软件应当提供不可逆的记账功能 ，不得提供对已记账凭证的删除和插入功能 ，确保对同类已记账凭证的连续编号 ，不得提供对已记账凭证日期 、币种 、汇率 、金额 、科目 、操作人等的修改功能。\n（四） 会计软件应当具有按照电子凭证会计数据标准要求处理电子会计凭证 ，并生成入账信息结构化数据文件的功能。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287403196431","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业内部控制评价程序一般包括（   ）、汇总评价结果、编报评价报告等环节。","opts":[{"k":"A","t":"制定评价工作方案"},{"k":"B","t":"组成评价工作组"},{"k":"C","t":"实施现场测试"},{"k":"D","t":"认定控制缺陷"}],"ans":"A,B,C,D","exp":"《企业内部控制评价指引》第十二条   企业应当按照内部控制评价办法规定的程序 ，有序开展内部控制评价工作。\n内部控制评价程序一般包括：制定评价工作方案 、组成评价工作组 、实施现场测试 、认定控制缺陷 、汇总评价结果 、编报评价报告等环节。\n企业可以授权内部审计部门或专门机构（以下简称内部控制评价部门） 负责内部控制评价的具体组织实施工作。","wrong":1.0,"cat":"企业文化与战略管理"},{"id":"2069069287403196430","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"单位之间交接会计档案时，会计档案移交清册应列明的内容有（ ）。","opts":[{"k":"A","t":"会计档案名称"},{"k":"B","t":"档案编号"},{"k":"C","t":"应保管期限"},{"k":"D","t":"档案管理人"}],"ans":"A,B,C","exp":"《会计档案管理办法》第二十四条 单位之间交接会计档案时 ，交接双方应当办理会计档案交接手续。 移交会计档案的单位 ，应当编制会计档案移交清册 ，列明应当移交的会计档案名称 、卷号 、册数 、起止年度 、档案编号 、应保管期限和已保管期限等内容。 交接会计档案时 ，交接双方应当按照会计档案移交清册所列内容逐项交接 ，并由交接双方的单位有关负责人负责监督。交接完毕后 ，交接双方经办人和监督人应当在会计档案移交清册上签名或盖章。 电子会计档案应当与其元数据一并移交 ，特殊格式的电子会计档案应当与其读取平台一并移交。档案接受单位应当对保存电子会计档案的载体及其技术环境进行检验 ，确保所接收电子会计档案的准确 、完整 、可用和安全。","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287403196424","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"会计软件在会计数据输出方面应具备的功能包括（ ）。","opts":[{"k":"A","t":"显示/打印会计资料"},{"k":"B","t":"生成符合国家统一会计制度的会计凭证 、会计账簿 、财务会计报告"},{"k":"C","t":"提供电子会计档案导出接口"},{"k":"D","t":"确保会计数据可验证且可溯源"}],"ans":"A,B,C","exp":"《会计软件基本功能和服务规范》第二十七条 会计软件应当提供符合国家统一的会计制度的会计凭证 、会计账簿 、财务会计报告和其他会计资料的显示 、打印、生成版式文件并导出的功能。 第二十八条 会计软件应当具有会计资料归档功能 ，提供导出电子会计档案的接口 ，输出归档的电子会计资料应当符合国家有关电子文件归档与电子会计档案管理的要求。 第二十九条 会计软件应当具有符合国家统一标准的数据接口 ，满足系统功能拓展 、与外部系统对接和监督需要 ，支持相关监管机构的信息披露要求。 第三十条 鼓励会计软件提供按照标准格式输出各类会计数据的功能 ，促进会计数据的应用，发挥会计数据的价值。D选项属于会计软件的安全功能范畴，而非直接的“数据输出”功能。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287403196422","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业识别内部风险时，应关注的因素有（ ）。","opts":[{"k":"A","t":"董事、监事、经理的职业操守"},{"k":"B","t":"财务状况和经营成果"},{"k":"C","t":"市场稳定和文化传统"},{"k":"D","t":"业务流程和资产管理"}],"ans":"A,B,D","exp":"《企业内部控制基本规范》第二十二条 企业识别内部风险 ，应当关注下列因素： （一） 董事 、监事 、经理及其他高级管理人员的职业操守 、员工专业胜任能力等人力资源因素。 （二） 组织机构 、经营方式 、资产管理 、业务流程等管理因素。 （三） 研究开发 、技术投入 、信息技术运用等自主创新因素。 （四） 财务状况 、经营成果 、现金流量等财务因素。 （五） 营运安全 、员工健康 、环境保护等安全环保因素。 （六） 其他有关内部风险因素。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287399002141","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业建立与实施有效的内部控制，应当具备的要素有（   ）。","opts":[{"k":"A","t":"内部环境"},{"k":"B","t":"风险评估"},{"k":"C","t":"控制活动"},{"k":"D","t":"信息与沟通"}],"ans":"A,B,C,D","exp":"《企业内部控制基本规范》第五条   企业建立与实施有效的内部控制 ，应当包括下列要素：\n（一） 内部环境。 内部环境是企业实施内部控制的基础 ，一般包括治理结构 、机构设置及权责分配 、内部审计 、人力资源政策 、企业文化等。\n（二） 风险评估。风险评估是企业及时识别 、系统分析经营活动中与实现内部控制目标相关的企业内部控制基本规范及配套指引风险 ，合理确定风险应对策略。\n（三） 控制活动。控制活动是企业根据风险评估结果 ，采用相应的控制措施 ，将风险控制在可承受度之内。\n（四） 信息与沟通。信息与沟通是企业及时 、准确地收集 、传递与内部控制相关的信息 ，确保信息在企业内部 、企业与外部之间进行有效沟通。\n（五） 内部监督。 内部监督是企业对内部控制建立与实施情况进行监督检查 ，评价内部控制的有效性 ，发现内部控制缺陷 ，应当及时加以改进。","wrong":1.0,"cat":"审计"},{"id":"2069069287399002140","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"企业建立与实施内部控制，应当遵循的原则有（   ）。","opts":[{"k":"A","t":"全面性原则"},{"k":"B","t":"针对性原则"},{"k":"C","t":"成本效益原则"},{"k":"D","t":"制衡性原则"}],"ans":"A,C,D","exp":"《企业内部控制基本规范》第四条   企业建立与实施内部控制 ，应当遵循下列原则：\n（一） 全面性原则。 内部控制应当贯穿决策 、执行和监督全过程 ，覆盖企业及其所属单位的各种业务和事项。\n（二） 重要性原则。 内部控制应当在全面控制的基础上 ，关注重要业务事项和高风险领域。\n（三） 制衡性原则。 内部控制应当在治理结构 、机构设置及权责分配 、业务流程等方面形成相互制约 、相互监督 ， 同时兼顾运营效率。\n（四） 适应性原则。 内部控制应当与企业经营规模 、业务范围 、竞争状况和风险水平等相适应，并随着情况的变化及时加以调整。\n（五） 成本效益原则。 内部控制应当权衡实施成本与预期效益 ， 以适当的成本实现有效控制。","wrong":1.0,"cat":"审计"},{"id":"2069069287399002139","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"下列选项中，属于企业可持续信息的基本使用者的有（   ）。","opts":[{"k":"A","t":"供应商"},{"k":"B","t":"投资者"},{"k":"C","t":"债权人"},{"k":"D","t":"消费者"}],"ans":"B,C","exp":"《企业可持续披露准则——基本准则（试行）》第八条   企业可持续信息披露的目标 ，是向信息使用者提供重要的可持续风险 、机遇和影响的信息 ， 以便其作出经济决策 、资源配置或者其他决策。可持续信息披露有助于企业贯彻新发展理念 ，推动经济 、社会和环境可持续发展 ，促进人与自然和谐共生 ，构建和谐社会关系。\n可持续信息使用者包括投资者 、债权人 、政府及其有关部门和其他利益相关方。其中 ，投资者 、债权人为可持续信息的基本使用者。其他利益相关方 ，是指其利益受到或者可能受到企业活动影响的群体或者人员 ，如员工 、消费者 、客户 、供应商 、社区以及企业的业务伙伴和社会伙伴等。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287399002138","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"《会计信息化工作规范》所称会计软件，应当具备的基本功能包括（   ）。","opts":[{"k":"A","t":"为会计核算、财务管理直接采集数据"},{"k":"B","t":"生成会计凭证、账簿、报表等会计资料"},{"k":"C","t":"满足外部监管部门查阅、审核的需求"},{"k":"D","t":"对会计资料进行存储、转换、输出、分析、利用"}],"ans":"A,B,D","exp":"《会计信息化工作规范》第三条   本规范所称会计信息化 ，是指单位利用现代信息技术手段和数字基础设施开展会计核算 ， 以及利用现代信息技术手段和数字基础设施将会计核算与其他经营管理活动有机结合的过程。\n本规范所称会计软件 ，是指单位使用的专门用于会计核算 、财务管理的应用软件或者其功能模块。会计软件具有以下基本功能：\n（一） 为会计核算 、财务管理直接采集数据；\n（二） 生成会计凭证 、账簿 、报表等会计资料；\n（三） 对会计资料进行存储 、转换 、输出 、分析 、利用。本规范所称会计软件服务 ，是指会计软件服务商提供的通用会计软件开发 、个性化需求开发 、软件系统部署与维护 、云服务功能使用订阅 、用户使用培训及相关的数据分析等服务。\n本规范所称会计信息系统 ，是指会计软件及其软硬件运行环境。\n本规范所称电子会计凭证 ，是指以电子形式生成 、传输并存储的各类会计凭证 ，包括电子原始凭证 、电子记账凭证。电子原始凭证可由单位内部生成 ，也可从外部接收。","wrong":1.0,"cat":"财务会计"},{"id":"2069069287394807810","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"党的二十大报告指出，中国秉持（）加强同发展中国家团结合作，维护发展中国家共同利益。","opts":[{"k":"A","t":"和睦相亲理念"},{"k":"B","t":"真实亲诚理念"},{"k":"C","t":"正确交往观"},{"k":"D","t":"正确义利观"}],"ans":"B,D","exp":"报告指出，中国秉持真实亲诚理念和正确义利观加强同发展中国家团结合作，维护发展中国家共同利益。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287390613533","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"党的二十大报告指出，健全社会保障体系，健全（）、可持续的多层次社会保障体系，扩大社会保险覆盖面。","opts":[{"k":"A","t":"覆盖城乡"},{"k":"B","t":"统筹全民"},{"k":"C","t":"公平统一"},{"k":"D","t":"安全规范"}],"ans":"C,D","exp":"报告指出，健全社会保障体系，健全覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次社会保障体系，扩大社会保险覆盖面。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287390613532","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"党的二十大报告指出，全面依法治国是国家治理的一场深刻革命，关系（）。","opts":[{"k":"A","t":"党执政兴国"},{"k":"B","t":"社会安定平稳"},{"k":"C","t":"人民幸福安康"},{"k":"D","t":"党和国家长治久安"}],"ans":"A,C,D","exp":"报告指出，全面依法治国是国家治理的一场深刻革命，关系党执政兴国，关系人民幸福安康，关系党和国家长治久安。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287390613530","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"党的二十大报告指出，我们要健全人民当家作主制度体系，扩大人民有序政治参与，保证人民依法实行民主选举、民主协商、民主决策、民主管理、民主监督，发挥人民群众积极性、主动性、创造性，巩固和发展（）的政治局面。","opts":[{"k":"A","t":"积极向上"},{"k":"B","t":"和谐统一"},{"k":"C","t":"生动活泼"},{"k":"D","t":"安定团结"}],"ans":"C,D","exp":"报告指出，我们要健全人民当家作主制度体系，扩大人民有序政治参与，保证人民依法实行民主选举、民主协商、民主决策、民主管理、民主监督，发挥人民群众积极性、主动性、创造性，巩固和发展生动活泼、安定团结的政治局面。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287390613528","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"党的二十大报告指出，推进新型工业化，加快建设（）。","opts":[{"k":"A","t":"网络强国"},{"k":"B","t":"数字强国"},{"k":"C","t":"交通强国"},{"k":"D","t":"能源强国"}],"ans":"A,C","exp":"报告指出，推进新型工业化，加快建设制造强国、质量强国、航天强国、交通强国、网络强国、数字中国。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287390613526","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"习近平总书记在党的二十大报告中回顾了党的十八大以来，党和国家事业取得的历史性成就，充分体现为“三个历史性胜利”，包括（）。","opts":[{"k":"A","t":"中国共产党和中国人民团结奋斗赢得的历史性胜利"},{"k":"B","t":"彪炳中华民族发展史册的历史性胜利"},{"k":"C","t":"是民族解放和人民独立的历史性胜利"},{"k":"D","t":"对世界具有深远影响的历史性胜利"}],"ans":"A,B,D","exp":"这10年的伟大成就、伟大变革将铭刻在党的历史上。这10年的伟大里程碑意义就在于，“这是中国共产党和中国人民团结奋斗赢得的历史性胜利，是彪炳中华民族发展史册的历史性胜利，也是对世界具有深远影响的历史性胜利。”","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287390613510","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"“三重一大”制度要求，（）必须经集体讨论做出决定。","opts":[{"k":"A","t":"重心工作组织"},{"k":"B","t":"重大事项决策"},{"k":"C","t":"重要项目安排"},{"k":"D","t":"大额资金的使用"}],"ans":"B,C,D","exp":"“三重一大”制度，最早源于1996年第十四届中央纪委第六次全会公报，即“重大事项决策、重要干部任免、重要项目安排、大额资金的使用，必须经集体讨论做出决定”的制度。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287386419217","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"党员干部被依法追究刑事责任后，党组织不按照规定给予党纪处分，对直接责任者和领导责任者，情节较重的，可以给予（）处分。","opts":[{"k":"A","t":"警告"},{"k":"B","t":"严重警告"},{"k":"C","t":"撤销党内职务"},{"k":"D","t":"留党察看"}],"ans":"A,B","exp":"《中国共产党纪律处分条例》对应条款：第一百三十六条 党组织有下列行为之一，对直接责任者和领导责任者，情节较重的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分： （一）党员被立案审查期间，擅自批准其出差、出国（境）、辞职，或者对其交流、提拔职务、晋升职级、进一步使用、奖励，或者办理退休手续； （二）党员被依法追究刑事责任后，不按照规定给予党纪处分，或者对党员违反国家法律法规的行为，应当给予党纪处分而不处分； （三）党纪处分决定或者申诉复查决定作出后，不按照规定落实决定中关于被处分人党籍、职务、职级、待遇等事项； （四）党员受到党纪处分后，不按照干部管理权限和组织关系对受处分党员开展日常教育、管理和监督工作。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287386419208","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"多选题","stem":"根据《中国共产党纪律处分条例》，党员干部对抗组织审查，有下列行为之一的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分。（）","opts":[{"k":"A","t":"串供或者伪造、销毁、转移、隐匿证据"},{"k":"B","t":"阻止他人揭发检举、提供证据材料"},{"k":"C","t":"包庇同案人员"},{"k":"D","t":"向组织提供虚假情况，掩盖事实"}],"ans":"A,B,C,D","exp":"《中国共产党纪律处分条例》 对应条款：第六十三条 对抗组织审查，有下列行为之一的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分： （一）串供或者伪造、销毁、转移、隐匿证据； （二）阻止他人揭发检举、提供证据材料； （三）包庇同案人员； （四）向组织提供虚假情况，掩盖事实； （五）其他对抗组织审查行为。","wrong":1.0,"cat":"党建修养与合规基础"},{"id":"2069069287 择结果、特许经营协议主要内容及其变更或终止、政府投资支持、公共产品或服务标准、监测分析和运营评价结果等信息，依托全国投资项目在线审批监管平台，及时向社会公开。”","wrong":1.0,"cat":"综合实务"},{"id":"2069069287898124290","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《基础设施和公用事业特许经营管理办法》，特许经营项目涉及新建或改扩建有关基础设施和公用事业的，应当符合国土空间规划、有关专项规划、土地管理、环境保护、质量管理、安全生产等有关法律、行政法规、法定规划规定的（ ）。","opts":[{"k":"A","t":"规划条件和建设标准"},{"k":"B","t":"投资标准和回报要求"},{"k":"C","t":"准入条件和退出机制"},{"k":"D","t":"监管要求和考核指标"}],"ans":"A","exp":"《基础设施和公用事业特许经营管理办法》“特许经营项目涉及新建或改扩建有关基础设施和公用事业的，应当符合国土空间规划、有关专项规划、土地管理、环境保护、质量管理、安全生产等有关法律、行政法规、法定规划规定的规划条件和建设标准。”","wrong":1.0,"cat":"趋势政策与行业动态"},{"id":"2069069287898124289","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《基础设施和公用事业特许经营管理办法》，特许经营期限届满后确有必要延长的，按照有关规定经充分评估论证，协商一致并报批准后，可以延长。关于“协商一致”，是指（ ）协商一致。","opts":[{"k":"A","t":"行业主管部门和特许经营者"},{"k":"B","t":"政府和特许经营者"},{"k":"C","t":"协议当事人"},{"k":"D","t":"实施机构和特许经营者"}],"ans":"C","exp":"《基础设施和公用事业特许经营管理办法》“特许经营期限届满后确有必要延长的，按照有关规定经充分评估论证，协商一致并报批准后，可以延长。”“协议当事人”是法律上的规范用语，指在特许经营协议上签字盖章、享有权利并承担义务的签约双方。签约方可能是“实施机构与项目公司”（详见第二十条）。选项D“实施机构和特许经营者”无法涵盖“项目公司”作为签约方的情形，表述不完整。","wrong":1.0,"cat":"综合实务"},{"id":"2069069287893930015","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《基础设施和公用事业特许经营管理办法》，实施机构和特许经营者就特许经营协议中的（ ）发生争议的，可以共同聘请专家或第三方机构进行调解。","opts":[{"k":"A","t":"专业技术问题"},{"k":"B","t":"财务结算问题"},{"k":"C","t":"法律适用问题"},{"k":"D","t":"合同履行问题"}],"ans":"A","exp":"《基础设施和公用事业特许经营管理办法》“实施机构和特许经营者就特许经营协议中的专业技术问题发生争议的，可以共同聘请专家或第三方机构进行调解。调解达成一致的，应当签订补充协议并遵照执行。”","wrong":1.0,"cat":"经济法与财经法规"},{"id":"2069069287893930012","bank":"竞赛题库（四）-中国三峡集团第十五届职工技能竞赛暨第一届财经技能竞赛","qtype":"单选题","stem":"根据《国有企业管理人员处分条例》，国有企业管理人员故意规避、干涉、破坏集体决策，个人或者少数人决定国有企业重大决策事项、重要人事任免事项、重大项目安排事项、大额度资金运作事项，依据公职人员政务处分法第三十条的规定，予以警告、记过或者记大过；情节严重的，予以（ ）。","opts":[{"k":"A","t":"记大过"},{"k":"B","t":"降级或者撤职"},{"k":"C","t":"开除"},{"k":"D","t":"降级"}],"ans":"B","exp":"解析：《国有企业管理人员处分条例》国有企业管理人员有下列行为之一的，依据公职人员政务处分法第三十条的规定，予以警告、记过或者记大过；情节严重的，予以降级或者撤职：\n  （一）违反规定的决策程序、职责权限决定国有企业重大决策事项、重要人事任免事项、重大项目安排事项、大额度资金运作事项；\n  （二）
